name: Release

on:
  push:
    tags:
      # Stable and fork-interim stable: v0.0.21, v0.0.22-fork.1
      - "v*.*.*"
      # Exclude pure upstream nightly tags (should never land on this repo,
      # but belt-and-braces: the fork only publishes -fork.N suffixed nightlies)
      - "!v*-nightly.*"
      # Re-include fork nightly tags: v0.0.21-nightly.20260421.88-fork.1
      # (pushed by sync-upstream.yml after rebasing onto an upstream nightly)
      - "v*-nightly.*-fork.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
      version:
        description: "Release version (for example 1.2.3, v1.2.3-fork.1, or v1.2.3-nightly.YYYYMMDD.RUN-fork.N)"
        required: false
        type: string
      target_ref:
        description: "Commit SHA, tag, or ref to build and publish. Defaults to the workflow ref."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  actions: read

# Concurrency policy:
#   * Nightly tag pushes (e.g. v0.0.22-nightly.20260430.161-fork.1) all share
#     one group "release-nightly" with cancel-in-progress=true. If sync-upstream
#     catches up on several upstream nightlies in one run, only the newest one
#     ends up shipping — older queued/in-progress nightly builds get cancelled.
#     Older nightly artifacts have no shelf life, so cancelling is correct.
#   * Stable releases (e.g. v0.0.21) and fork-interim stable (v0.0.22-fork.N)
#     keep per-tag groups so every stable build completes; semver still lets
#     a later upstream stable supersede a fork-interim.
#   * Manual workflow_dispatch runs always get unique per-run groups so an
#     explicit reroll/recovery is never silently cancelled.
concurrency:
  group: ${{ (github.event_name == 'push' && contains(github.ref_name, '-nightly.')) && 'release-nightly' || format('release-{0}-{1}', github.workflow, github.ref_name || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.ref_name, '-nightly.') }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ steps.release_meta.outputs.ref }}
      mac_runner: ${{ steps.mac_runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_TARGET_REF: ${{ github.event.inputs.target_ref }}
          NIGHTLY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          resolve_target_ref() {
            local requested="${1:-$NIGHTLY_SHA}"
            local target_sha

            if ! target_sha="$(git rev-parse --verify "${requested}^{commit}" 2>/dev/null)"; then
              echo "Unable to resolve target ref to a commit: $requested" >&2
              exit 1
            fi

            echo "$target_sha"
          }

          emit_from_tag_version() {
            # Args: raw_version (without leading v)
            local version="$1"
            local target_sha="$2"
            local short_sha="${target_sha:0:12}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: v$version" >&2
              exit 1
            fi

            echo "ref=$target_sha" >> "$GITHUB_OUTPUT"

            # Channel detection: presence of "-nightly." anywhere in the
            # pre-release identifies a nightly build (upstream-synced fork
            # nightly). Anything else (pure semver or "-fork.N") is stable.
            if [[ "$version" == *-nightly.* ]]; then
              echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "tag=v$version" >> "$GITHUB_OUTPUT"
              echo "name=T3 Code Nightly $version ($short_sha)" >> "$GITHUB_OUTPUT"
              echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
              echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            else
              echo "release_channel=stable" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "tag=v$version" >> "$GITHUB_OUTPUT"
              echo "name=T3 Code v$version" >> "$GITHUB_OUTPUT"
              echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
              echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
              if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
                echo "make_latest=true" >> "$GITHUB_OUTPUT"
              else
                # -fork.N interim stable build. Publish as a normal latest
                # release so stable desktop clients can see it as an update.
                # Semver still lets the later upstream final release win:
                # X.Y.Z > X.Y.Z-fork.N.
                echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
                echo "make_latest=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # Tag push (from sync-upstream.yml or manual `git push origin vX.Y.Z`).
            # Tag name is authoritative for both version and channel.
            raw="${GITHUB_REF_NAME}"
            target_sha="$(resolve_target_ref "$NIGHTLY_SHA")"
            emit_from_tag_version "${raw#v}" "$target_sha"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Manual dispatch: version input required. Nightlies must be explicit
            # fork-nightly versions, e.g. vX.Y.Z-nightly.YYYYMMDD.RUN-fork.N.
            # Do not generate bare upstream-style nightly tags here.
            raw="${DISPATCH_VERSION}"
            if [[ -z "$raw" ]]; then
              echo "workflow_dispatch releases require the version input." >&2
              exit 1
            fi
            target_sha="$(resolve_target_ref "${DISPATCH_TARGET_REF:-$NIGHTLY_SHA}")"
            emit_from_tag_version "${raw#v}" "$target_sha"
          else
            echo "Unsupported event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      - id: mac_runner
        name: Resolve macOS runner
        env:
          RUNNER_STATE_TOKEN: ${{ secrets.T3CODE_RUNNER_STATE_TOKEN || secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          hosted_runner='"macos-15"'
          self_hosted_runner='["self-hosted","macOS","ARM64","t3code-mac-arm64"]'

          if [[ -z "${RUNNER_STATE_TOKEN:-}" ]]; then
            echo "Runner state token is not configured; using GitHub-hosted macOS."
            echo "runner=$hosted_runner" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if runner_names="$(GH_TOKEN="$RUNNER_STATE_TOKEN" gh api \
            "repos/${{ github.repository }}/actions/runners" \
            --jq '.runners[] | select(.status == "online" and .busy == false and ([.labels[].name] | index("t3code-mac-arm64"))) | .name' \
            2>/dev/null)"; then
            runner_name="$(printf '%s\n' "$runner_names" | head -n 1)"
            if [[ -n "$runner_name" ]]; then
              echo "Using local self-hosted macOS runner: $runner_name."
              echo "runner=$self_hosted_runner" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Local self-hosted macOS runner is offline or busy; using GitHub-hosted macOS."
          else
            echo "Could not query self-hosted runner state; using GitHub-hosted macOS."
          fi

          echo "runner=$hosted_runner" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ fromJSON(needs.preflight.outputs.mac_runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: '"macos-15"'
            platform: mac
            target: dmg
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
              magick -version
          else
              convert -version
          fi

      - name: Build desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            # Full signed+notarized macOS build (with Associated Domains passkey
            # entitlement) requires the Developer ID cert, notarization API key,
            # team id, AND an Associated Domains provisioning profile. When the
            # profile/team id are absent we fall back to an UNSIGNED build instead
            # of failing the release — this fork's macOS app is personal-use and
            # does not need broad distribution signing.
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              profile_path="$RUNNER_TEMP/t3code.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
              security cms -D -i "$profile_path" >/dev/null
              export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"

              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (no provisioning profile / signing secrets); building unsigned."
            fi
          fi

          # Retry on transient flakes (hdiutil "Device not configured" on macos-14,
          # network hiccups during native-deps download). Two tries is enough.
          attempt=1
          until vp run dist:desktop:artifact "${args[@]}"; do
            if [[ $attempt -ge 2 ]]; then
              echo "dist:desktop:artifact failed after $attempt attempts." >&2
              exit 1
            fi
            echo "dist:desktop:artifact attempt $attempt failed, retrying..." >&2
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  build_headless:
    name: Build headless Linux x64
    needs: preflight
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ needs.preflight.outputs.release_channel }}" == "nightly" ]]; then
            vp install --frozen-lockfile --ignore-scripts
          else
            vp install --frozen-lockfile
          fi

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build headless artifact
        run: |
          vp run dist:headless:artifact \
            --platform linux \
            --arch x64 \
            --build-version "${{ needs.preflight.outputs.version }}"

      - name: Smoke test headless artifact
        run: |
          vp run smoke:headless:artifact \
            --artifact "release/t3-headless-${{ needs.preflight.outputs.version }}-linux-x64.tar.gz" \
            --version "${{ needs.preflight.outputs.version }}"

      - name: Collect headless release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          cp "release/t3-headless-${{ needs.preflight.outputs.version }}-linux-x64.tar.gz" release-publish/

      - name: Upload headless artifact
        uses: actions/upload-artifact@v7
        with:
          name: headless-linux-x64
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build, build_headless]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.build_headless.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download headless artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: headless-*
          merge-multiple: true
          path: release-assets

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if [[ "${{ needs.preflight.outputs.release_channel }}" == "nightly" && ! -f release-assets/nightly-mac.yml ]]; then
            echo "Nightly macOS updater manifest release-assets/nightly-mac.yml is required." >&2
            exit 1
          fi

          headless_asset="release-assets/t3-headless-${{ needs.preflight.outputs.version }}-linux-x64.tar.gz"
          if [[ ! -f "$headless_asset" ]]; then
            echo "Headless Linux x64 release asset $headless_asset is required." >&2
            exit 1
          fi

          forbidden_linux_desktop_assets=(release-assets/*.AppImage release-assets/*-linux.yml)
          if (( ${#forbidden_linux_desktop_assets[@]} > 0 )); then
            printf 'Linux desktop release assets are no longer published:\n' >&2
            printf '  %s\n' "${forbidden_linux_desktop_assets[@]}" >&2
            exit 1
          fi

      - name: Merge macOS updater manifests
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: Publish release
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_TARGET: ${{ needs.preflight.outputs.ref }}
          RELEASE_NAME: ${{ needs.preflight.outputs.release_name }}
          RELEASE_PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          RELEASE_MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_files=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.blockmap
            release-assets/*.yml
          )
          if (( ${#release_files[@]} == 0 )); then
            echo "No release files were found after validation." >&2
            exit 1
          fi

          create_args=(
            --repo "$RELEASE_REPO"
            --verify-tag
            --target "$RELEASE_TARGET"
            --title "$RELEASE_NAME"
            --generate-notes
            "--latest=$RELEASE_MAKE_LATEST"
          )
          if [[ -n "$RELEASE_PREVIOUS_TAG" ]]; then
            create_args+=(--notes-start-tag "$RELEASE_PREVIOUS_TAG")
          fi
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          token_names=()
          tokens=()
          if [[ -n "${GH_PAT:-}" ]]; then
            token_names+=("GH_PAT")
            tokens+=("$GH_PAT")
          fi
          token_names+=("GITHUB_TOKEN")
          tokens+=("$GITHUB_TOKEN")

          last_error="$RUNNER_TEMP/release-publish-error.log"
          for index in "${!tokens[@]}"; do
            token_name="${token_names[$index]}"
            token="${tokens[$index]}"

            if ! GH_TOKEN="$token" gh api "repos/$RELEASE_REPO" >/dev/null 2>"$last_error"; then
              echo "::warning::$token_name cannot access $RELEASE_REPO; trying next token."
              continue
            fi

            if GH_TOKEN="$token" gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
              edit_args=(--repo "$RELEASE_REPO" --target "$RELEASE_TARGET" --title "$RELEASE_NAME")
              if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
                edit_args+=(--prerelease)
              fi
              if [[ "$RELEASE_MAKE_LATEST" == "true" ]]; then
                edit_args+=(--latest)
              fi

              if GH_TOKEN="$token" gh release edit "$RELEASE_TAG" "${edit_args[@]}" >"$last_error" 2>&1 &&
                GH_TOKEN="$token" gh release upload "$RELEASE_TAG" "${release_files[@]}" --repo "$RELEASE_REPO" --clobber >"$last_error" 2>&1; then
                echo "Updated GitHub release $RELEASE_TAG with $token_name."
                exit 0
              fi
            elif GH_TOKEN="$token" gh release create "$RELEASE_TAG" "${release_files[@]}" "${create_args[@]}" >"$last_error" 2>&1; then
              echo "Created GitHub release $RELEASE_TAG with $token_name."
              exit 0
            fi

            echo "::warning::$token_name failed to publish release $RELEASE_TAG; trying next token."
          done

          echo "Failed to publish release $RELEASE_TAG with all available tokens." >&2
          cat "$last_error" >&2
          exit 1

  finalize:
    name: Finalize release
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' }}
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

