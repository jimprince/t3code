name: Mobile Track Sync

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish an EAS update after a clean rebase"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: mobile-track-sync
  cancel-in-progress: false

jobs:
  sync-mobile-track:
    name: Rebase mobile track when clean
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PUBLISH_EAS_UPDATE: ${{ github.event_name == 'schedule' || inputs.publish }}
      UPSTREAM_REPOSITORY: https://github.com/pingdotgg/t3code.git
      UPSTREAM_BRANCH: t3code/mobile-remote-connect
      MOBILE_BRANCH: feature/mobile-track
    steps:
      - name: Checkout mobile track
        uses: actions/checkout@v6
        with:
          ref: ${{ env.MOBILE_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and fork branch
        run: |
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          git fetch --no-tags origin "+refs/heads/$MOBILE_BRANCH:refs/remotes/origin/$MOBILE_BRANCH"

      - id: drift
        name: Check upstream drift
        run: |
          upstream_ref="upstream/$UPSTREAM_BRANCH"
          ahead_count="$(git rev-list --count "$upstream_ref"..HEAD)"
          behind_count="$(git rev-list --count HEAD.."$upstream_ref")"

          echo "ahead_count=$ahead_count" >> "$GITHUB_OUTPUT"
          echo "behind_count=$behind_count" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse "$upstream_ref")" >> "$GITHUB_OUTPUT"
          echo "mobile_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [[ "$behind_count" == "0" ]]; then
            echo "feature/mobile-track is current with $upstream_ref."
          else
            echo "feature/mobile-track is $behind_count commit(s) behind $upstream_ref."
          fi

      - name: Stop when current
        if: steps.drift.outputs.behind_count == '0'
        run: |
          echo "No upstream mobile commits to rebase."

      - id: rebase
        name: Rebase onto upstream mobile branch
        if: steps.drift.outputs.behind_count != '0'
        run: |
          set +e
          git rebase "upstream/$UPSTREAM_BRANCH"
          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Automatic mobile-track rebase conflicted. Manual review is required before preserving or dropping fork overlay changes."
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U || true
            echo
            git status --short
            conflicted_files_json="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            {
              echo "conflict=true"
              echo "conflicted_files_json=$conflicted_files_json"
            } >> "$GITHUB_OUTPUT"
            git rebase --abort || true
            exit 0
          fi

          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "rebased_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch sandboxed conflict resolver
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.MOBILE_CONFLICT_DISPATCH_TOKEN || secrets.GH_PAT || github.token }}
          UPSTREAM_SHA: ${{ steps.drift.outputs.upstream_sha }}
          MOBILE_SHA: ${{ steps.drift.outputs.mobile_sha }}
          CONFLICTED_FILES_JSON: ${{ steps.rebase.outputs.conflicted_files_json }}
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg mobile_sha "$MOBILE_SHA" \
            --arg sync_run_id "$GITHUB_RUN_ID" \
            --arg sync_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg upstream_branch "$UPSTREAM_BRANCH" \
            --arg mobile_branch "$MOBILE_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson conflicted_files "$CONFLICTED_FILES_JSON" \
            '{
              event_type: "mobile-track-conflict",
              client_payload: {
                repository: $repository,
                upstream_sha: $upstream_sha,
                mobile_sha: $mobile_sha,
                sync_run_id: $sync_run_id,
                sync_run_attempt: $sync_run_attempt,
                upstream_branch: $upstream_branch,
                mobile_branch: $mobile_branch,
                conflicted_files: $conflicted_files,
                workflow: $workflow,
                run_url: $run_url
              }
            }')"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input - <<< "$payload"

      - name: Stop after conflict dispatch
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict == 'true'
        run: |
          echo "::error::Conflicted mobile-track rebase was dispatched for sandboxed PR resolution. No mobile branch push or EAS publish was attempted."
          exit 1

      - name: Setup Bun
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache Bun and Turbo
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-mobile-track-sync-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-mobile-track-sync-bun-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        run: bun install --frozen-lockfile

      - name: Format
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        run: bun run fmt:check

      - name: Lint
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        run: bun run lint

      - name: Mobile native static check
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        run: bun run lint:mobile

      - name: Typecheck
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        run: bun run typecheck

      - name: Focused mobile scroll regression
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        run: bun run --filter @t3tools/mobile test src/features/threads/ThreadDetailScreen.test.ts

      - name: Focused mobile runtime regression
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        run: bun run --filter @t3tools/client-runtime test src/threadDetailState.test.ts

      - name: Push rebased mobile track
        if: steps.drift.outputs.behind_count != '0' && steps.rebase.outputs.conflict != 'true'
        run: |
          expected="$(git rev-parse origin/$MOBILE_BRANCH)"
          git push --force-with-lease=refs/heads/$MOBILE_BRANCH:$expected origin HEAD:$MOBILE_BRANCH

      - name: Require Expo token
        if: steps.drift.outputs.behind_count != '0' && env.PUBLISH_EAS_UPDATE == 'true'
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "EXPO_TOKEN repository secret is required to publish EAS updates." >&2
            exit 1
          fi

      - name: Publish EAS update
        if: steps.drift.outputs.behind_count != '0' && env.PUBLISH_EAS_UPDATE == 'true'
        working-directory: apps/mobile
        run: |
          APP_VARIANT=development \
          CI=1 \
          EXPO_NO_GIT_STATUS=1 \
          npx eas-cli update \
            --channel development \
            --environment development \
            --platform ios \
            --message "mobile-track sync $(git rev-parse --short HEAD)"
