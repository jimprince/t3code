name: Fork Push Nightly

# Creates updater-visible nightly fork releases for Brad-authored changes.
# Normal pushes to main should ship through the nightly feed only. The next
# upstream stable sync still rebases these fork commits onto the upstream stable
# tag and publishes the integrated stable release.

on:
  push:
    branches:
      - main
    # Keep this allowlist narrow. Helper-script/docs/workflow maintenance should
    # not publish an updater-visible desktop release.
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "assets/**"
      - "packages/**"
      - "scripts/build-desktop-artifact.ts"
      - "scripts/build-headless-artifact.ts"
      - "scripts/lib/brand-assets.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: fork-push-nightly
  cancel-in-progress: false

jobs:
  tag:
    name: Tag fork push nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve and push next fork tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" && "$HEAD_MESSAGE" == chore\(release\):\ prepare* ]]; then
            echo "Release finalize version-bump commit; no fork push nightly tag needed."
            exit 0
          fi

          # sync-upstream pushes main and then a release tag. Give the tag push
          # a moment to appear so sync-created commits do not get double-tagged
          # as push nightlies.
          sleep 30
          git fetch --tags origin

          existing_head_tags=$(git tag --points-at HEAD --list 'v*')
          if [[ -n "$existing_head_tags" ]]; then
            echo "HEAD already has release tag(s); no fork push nightly tag needed:"
            echo "$existing_head_tags" | sed 's/^/  /'
            exit 0
          fi

          upstream_tag=$(gh release list --repo pingdotgg/t3code --limit 50 \
            --json tagName,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("(^|-)v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.")))] | sort_by(.publishedAt) | reverse | .[0].tagName')
          if [[ -z "$upstream_tag" || "$upstream_tag" == "null" ]]; then
            echo "::error::No nightly release found on upstream."
            exit 1
          fi
          echo "Latest upstream nightly release: $upstream_tag"

          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main
          git fetch upstream "+refs/tags/${upstream_tag}:refs/tags/upstream/${upstream_tag}"

          upstream_ref="refs/tags/upstream/${upstream_tag}"
          echo "Rebasing fork commits onto $upstream_ref before tagging push nightly..."
          echo "Fork commits being replayed (relative to upstream/main):"
          git log --oneline upstream/main..HEAD

          # Keep agent tracker-only conflicts from blocking updater-visible
          # package builds. During rebase, "ours" is the current rebased tree,
          # so this preserves prior tracker state instead of letting one
          # replayed commit overwrite it.
          # The checkpointing/project layer test paths were deleted by
          # upstream module moves. Fork commits only carried old-path test
          # edits; the live tests now reside at upstream paths, so preserving
          # the upstream deletion avoids recurring modify/delete stops.
          UPSTREAM_RESOLVE_FILES=$'apps/desktop/package.json\napps/server/package.json\napps/web/package.json\npackages/contracts/package.json\npnpm-lock.yaml\ndocs/AGENT_REQUIREMENTS.md\napps/server/src/checkpointing/Layers/CheckpointDiffQuery.test.ts\napps/server/src/project/Layers/ProjectSetupScriptRunner.test.ts'
          FORK_RESOLVE_FILES=$'.github/workflows/release.yml\ndocs/operations/release.md\ninfra/relay/scripts/deploy.test.ts'
          mapfile -t UPSTREAM_ALLOW < <(printf '%s\n' "$UPSTREAM_RESOLVE_FILES" | sed '/^$/d' | sort -u)
          mapfile -t FORK_ALLOW < <(printf '%s\n' "$FORK_RESOLVE_FILES" | sed '/^$/d' | sort -u)

          is_upstream_allowed() {
            local f="$1"
            for a in "${UPSTREAM_ALLOW[@]}"; do
              [[ "$f" == "$a" ]] && return 0
            done
            return 1
          }

          is_fork_allowed() {
            local f="$1"
            for a in "${FORK_ALLOW[@]}"; do
              [[ "$f" == "$a" ]] && return 0
            done
            return 1
          }

          if ! git rebase --onto "$upstream_ref" upstream/main; then
            while [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; do
              mapfile -t conflicted < <(git diff --name-only --diff-filter=U | sort -u)

              if [[ ${#conflicted[@]} -eq 0 ]]; then
                git rebase --skip || break
                continue
              fi

              unknown=()
              for f in "${conflicted[@]}"; do
                if ! is_upstream_allowed "$f" && ! is_fork_allowed "$f"; then
                  unknown+=("$f")
                fi
              done

              if [[ ${#unknown[@]} -gt 0 ]]; then
                echo "::error::Rebase conflict syncing push nightly to $upstream_tag."
                echo "::error::Conflicts outside auto-resolve allowlist:"
                printf '::error::  %s\n' "${unknown[@]}"
                git rebase --abort || true
                exit 1
              fi

              echo "Auto-resolving allowed conflicts for: ${conflicted[*]}"
              for f in "${conflicted[@]}"; do
                if is_upstream_allowed "$f"; then
                  # During rebase, "ours" = upstream (the new base).
                  git checkout --ours -- "$f"
                else
                  # During rebase, "theirs" = the fork commit being replayed.
                  git checkout --theirs -- "$f"
                fi
                git add -- "$f"
              done

              # If continuing hits a later conflict, keep the rebase state and
              # let the next loop iteration inspect that conflict. Only the
              # no-conflict branch above is allowed to skip an empty commit.
              GIT_EDITOR=true git rebase --continue || true
            done

            mapfile -t unresolved < <(git diff --name-only --diff-filter=U | sort -u)
            if [[ -d .git/rebase-merge || -d .git/rebase-apply || ${#unresolved[@]} -gt 0 ]]; then
              echo "::error::Rebase stopped before completion while syncing push nightly to $upstream_tag."
              if [[ ${#unresolved[@]} -gt 0 ]]; then
                printf '::error::  %s\n' "${unresolved[@]}"
              fi
              git rebase --abort || true
              exit 1
            fi
          fi

          echo "Rebase completed."

          mapfile -t existing_numbers < <(git tag --list "${upstream_tag}-fork.*" \
            | awk -F '-fork\\.' 'NF==2 && $2 ~ /^[0-9]+$/ { print $2 }' \
            | sort -n)

          if [[ ${#existing_numbers[@]} -eq 0 ]]; then
            next_n=1
          else
            last="${existing_numbers[-1]}"
            next_n=$((last + 1))
          fi

          new_tag="${upstream_tag}-fork.${next_n}"
          version="${new_tag#v}"
          vp install --frozen-lockfile --ignore-scripts
          node scripts/update-release-package-versions.ts "$version"
          vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json
          vp install --lockfile-only --ignore-scripts

          if ! git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml; then
            git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
            git commit -m "chore(release): prepare $new_tag"
          else
            echo "Package versions already match $version."
          fi

          git tag "$new_tag" HEAD
          git push origin HEAD:main --force-with-lease
          git push origin "$new_tag"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f channel=stable \
            -f version="$new_tag" \
            -f target_ref="$new_tag"
          echo "Pushed $new_tag for fork push nightly update. release.yml will publish it to the nightly feed."
