name: Fork Push Nightly

# Creates updater-visible nightly fork releases for Brad-authored changes.
# Normal pushes to main should ship through the nightly feed only. The next
# upstream stable sync still replays this fork patch onto the upstream stable
# tag and publishes the integrated stable release.

on:
  push:
    branches:
      - main
    # Keep this allowlist narrow. Helper-script/docs/workflow maintenance should
    # not publish an updater-visible desktop release.
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "assets/**"
      - "packages/**"
      - "scripts/build-desktop-artifact.ts"
      - "scripts/build-headless-artifact.ts"
      - "scripts/lib/brand-assets.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  # One lock for every Actions writer of main (C2 race fix, 2026-07-29:
  # sync and nightly raced; the loser was saved only by its lease).
  group: t3code-writes-main
  cancel-in-progress: false

jobs:
  changes:
    name: Check packaged-source changes
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: scripts/ci/check-nightly-push

  tag:
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    name: Tag fork push nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Fork nightly replays can include upstream workflow changes.
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install StGit
        run: scripts/ci/install-stgit

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record main lease
        id: pre
        run: |
          scripts/ci/record-main-lease
          git fetch origin \
            '+refs/stacks/stgit/adopt:refs/stacks/stgit/adopt' \
            '+refs/patches/stgit/adopt/*:refs/patches/stgit/adopt/*'
          scripts/ci/prepare-stgit-publication

      - name: Resolve next fork tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          # Main and its prepared release tag are published atomically.
          # Fetch once; no visibility delay is needed.
          git fetch --tags origin

          head_sha="$(git rev-parse HEAD)"
          existing_release_tags="$(
            while IFS= read -r tag; do
              tag_sha="$(git rev-parse "${tag}^{commit}")"
              tag_parent="$(git rev-parse "${tag}^{commit}^" 2>/dev/null || true)"
              if [[ "$tag_sha" == "$head_sha" || "$tag_parent" == "$head_sha" ]]; then
                echo "$tag"
              fi
            done < <(git tag --list 'v*')
          )"
          if [[ -n "$existing_release_tags" ]]; then
            echo "Main already has release tag(s) at HEAD or its prepared child:"
            echo "$existing_release_tags" | sed 's/^/  /'
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_tag=$(gh release list --repo pingdotgg/t3code --limit 50 \
            --json tagName,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("(^|-)v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.")))] | sort_by(.publishedAt) | reverse | .[0].tagName')
          if [[ -z "$upstream_tag" || "$upstream_tag" == "null" ]]; then
            echo "::error::No nightly release found on upstream."
            exit 1
          fi
          echo "Latest upstream nightly release: $upstream_tag"

          mapfile -t existing_numbers < <(git tag --list "${upstream_tag}-fork.*" \
            | awk -F '-fork\\.' 'NF==2 && $2 ~ /^[0-9]+$/ { print $2 }' \
            | sort -n)

          if [[ ${#existing_numbers[@]} -eq 0 ]]; then
            next_n=1
          else
            last="${existing_numbers[-1]}"
            next_n=$((last + 1))
          fi

          new_tag="${upstream_tag}-fork.${next_n}"
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

      - name: Replay fork onto latest upstream nightly
        if: steps.resolve.outputs.needed == 'true'
        id: replay
        env:
          CI_REPAIR_BOT_UPSTREAM_TARGET: refs/tags/upstream/${{ steps.resolve.outputs.upstream_tag }}
          CI_REPAIR_BOT_UPSTREAM_SOURCE_REF: refs/tags/${{ steps.resolve.outputs.upstream_tag }}
          CI_REPAIR_BOT_CONFLICT_MODE: output
        run: scripts/ci/reproduce-sync-upstream

      - name: Route replay conflict to autonomous repair
        if: steps.resolve.outputs.needed == 'true' && steps.replay.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          FAILING_PATCH: ${{ steps.replay.outputs.patch }}
          CONFLICT_FILES: ${{ steps.replay.outputs.files }}
        run: |
          set -euo pipefail
          gh workflow run sync-upstream.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f channel=nightly
          echo "::error::Fork push replay conflicted in $FAILING_PATCH; dispatched eligible Sync Upstream repair."
          echo "$CONFLICT_FILES" | sed 's/^/::error::  /'
          exit 1

      - name: Verify replay before publication
        if: steps.resolve.outputs.needed == 'true' && steps.replay.outputs.status == 'clean'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          scripts/ci/verify-stgit-replay

      - name: Prepare release tag
        if: steps.resolve.outputs.needed == 'true'
        id: prepare
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: scripts/ci/prepare-release-tag

      - name: Publish verified stack and release tag
        if: steps.resolve.outputs.needed == 'true' && steps.replay.outputs.status == 'clean'
        env:
          STGIT_EXPECTED_REMOTE_MAIN: ${{ steps.pre.outputs.main_sha }}
          MAIN_SHA: ${{ steps.prepare.outputs.main_sha }}
          PREP_SHA: ${{ steps.prepare.outputs.prep_sha }}
          NEW_TAG: ${{ steps.prepare.outputs.tag }}
          STGIT_BACKUP_NAMESPACE: bot
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse "${NEW_TAG}^{commit}")"
          if [[ "$tag_sha" != "$PREP_SHA" ]]; then
            echo "::error::Prepared tag changed before publication."
            exit 1
          fi
          if [[ "$PREP_SHA" != "$MAIN_SHA" ]] && [[ "$(git rev-parse "${PREP_SHA}^")" != "$MAIN_SHA" ]]; then
            echo "::error::Release preparation must be a direct child of the verified stack."
            exit 1
          fi
          # Restore the verified unstamped tip; the prepared child remains tagged.
          git reset --hard "$MAIN_SHA"
          STGIT_RELEASE_TAG="$NEW_TAG" STGIT_RELEASE_TAG_SHA="$PREP_SHA" \
            scripts/ci/publish-stgit-stack --push
