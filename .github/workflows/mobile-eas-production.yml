name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build (+ auto-submit), submit an existing build, or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - submit
          - update
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      bootstrap_credentials:
        description: "One-time interactive iOS signing credential setup"
        required: false
        type: boolean
        default: false
      build_id:
        description: "EAS build ID (mode=submit only)"
        required: false
        type: string
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string

jobs:
  production:
    name: EAS Production ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - name: Prepare App Store Connect API key
        if: >-
          steps.expo-token.outputs.present == 'true' &&
          (inputs.mode == 'build' || inputs.mode == 'submit')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::Production iOS builds require APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER." >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "EXPO_ASC_API_KEY_PATH=$key_path"
            echo "EXPO_ASC_KEY_ID=$APPLE_API_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$APPLE_API_ISSUER"
            echo "EXPO_APPLE_TEAM_ID=CBCQ6MJF4B"
            echo "EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION"
          } >> "$GITHUB_ENV"

      - name: Build and submit
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ inputs.bootstrap_credentials }}" = "true" ]; then
            # EAS refuses to associate an existing distribution certificate
            # with a new bundle ID in non-interactive mode. Give the one-time
            # setup a pseudo-terminal and accept EAS's recommended reuse
            # choices; Apple authentication still uses the ASC API key above.
            for _ in {1..20}; do printf '\n'; done | \
              env -u CI script -q -e -c \
                "eas build --platform ${{ inputs.platform }} --profile production --no-wait" \
                /dev/null
          else
            eas build \
              --platform ${{ inputs.platform }} \
              --profile production \
              --auto-submit \
              --non-interactive \
              --no-wait
          fi

      - name: Submit existing build
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'submit'
        working-directory: apps/mobile
        env:
          EAS_BUILD_ID: ${{ inputs.build_id }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EAS_BUILD_ID" ]; then
            echo "::error::build_id is required when mode=submit." >&2
            exit 1
          fi

          # EAS Submit accepts a new API key non-interactively only when the
          # submit profile references it. Inject the runner-local key path;
          # the secret value is never written to the repository or logs.
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "eas.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          Object.assign(config.submit.production.ios, {
            ascApiKeyPath: process.env.EXPO_ASC_API_KEY_PATH,
            ascApiKeyId: process.env.EXPO_ASC_KEY_ID,
            ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID,
          });
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          eas submit \
            --platform ios \
            --profile production \
            --id "$EAS_BUILD_ID" \
            --non-interactive \
            --no-wait

      - name: Publish OTA update
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform ${{ inputs.platform }} \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive
