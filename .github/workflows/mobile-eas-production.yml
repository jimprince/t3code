name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Completed iOS builds are uploaded from a hosted macOS runner with Xcode's
# bundled App Store uploader, avoiding the extra EAS Submit service hop.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build, submit an existing build, or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - submit
          - update
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      build_id:
        description: "EAS build ID (mode=submit only)"
        required: false
        type: string
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string

jobs:
  production:
    if: inputs.mode != 'submit'
    name: EAS Production ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - name: Build production binary
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # Distribution certificates and profiles are bootstrapped from a
        # trusted Mac; CI only consumes the credentials already stored on EAS.
        # See docs/operations/release.md, "Production build lane".
        run: >-
          eas build
          --platform ${{ inputs.platform }}
          --profile production
          --non-interactive
          --no-wait

      - name: Publish OTA update
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform ${{ inputs.platform }} \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive

  submit-ios:
    if: inputs.mode == 'submit'
    name: Upload production iOS build
    runs-on: macos-15
    permissions:
      contents: read
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      EAS_BUILD_ID: ${{ inputs.build_id }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Download and upload production IPA
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$EAS_BUILD_ID" ]; then
            echo "::error::build_id is required when mode=submit." >&2
            exit 1
          fi
          if [ -z "$EXPO_TOKEN" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::EXPO_TOKEN and App Store Connect API key secrets are required." >&2
            exit 1
          fi

          request="$(jq -nc --arg id "$EAS_BUILD_ID" '{
            query: "query Build($buildId: ID!) { builds { byId(buildId: $buildId) { id status platform artifacts { buildUrl } } } }",
            variables: {buildId: $id}
          }')"
          response_file="$RUNNER_TEMP/eas-build.json"
          curl --fail --silent --show-error \
            https://api.expo.dev/graphql \
            --header "Authorization: Bearer $EXPO_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "$request" \
            --output "$response_file"

          if jq -e '.errors | length > 0' "$response_file" >/dev/null 2>&1; then
            jq -r '.errors[].message' "$response_file" >&2
            exit 1
          fi

          status="$(jq -r '.data.builds.byId.status // empty' "$response_file")"
          platform="$(jq -r '.data.builds.byId.platform // empty' "$response_file")"
          artifact_url="$(jq -r '.data.builds.byId.artifacts.buildUrl // empty' "$response_file")"
          if [ "$status" != "FINISHED" ] || [ "$platform" != "IOS" ] || [ -z "$artifact_url" ]; then
            echo "::error::Build must be a finished iOS build with a downloadable IPA (status=$status, platform=$platform)." >&2
            exit 1
          fi

          ipa_path="$RUNNER_TEMP/t3code-production.ipa"
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$ipa_path" "$key_path" "$response_file"' EXIT

          curl --fail --location --retry 3 --silent --show-error \
            "$artifact_url" \
            --output "$ipa_path"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"

          asc_token="$(
            ASC_ISSUER="$APPLE_API_ISSUER" \
              ASC_KEY_ID="$APPLE_API_KEY_ID" \
              ASC_KEY_PATH="$key_path" \
              node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const encode = (value) => Buffer.from(JSON.stringify(value)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${encode({ alg: "ES256", kid: process.env.ASC_KEY_ID, typ: "JWT" })}.${encode({
            iss: process.env.ASC_ISSUER,
            iat: now,
            exp: now + 600,
            aud: "appstoreconnect-v1",
          })}`;
          const signature = crypto.sign("sha256", Buffer.from(unsigned), {
            key: fs.readFileSync(process.env.ASC_KEY_PATH),
            dsaEncoding: "ieee-p1363",
          });
          process.stdout.write(`${unsigned}.${signature.toString("base64url")}`);
          NODE
          )"

          app_response="$RUNNER_TEMP/asc-app.json"
          http_status="$(curl --silent --show-error \
            --header "Authorization: Bearer $asc_token" \
            --header "Content-Type: application/json" \
            --output "$app_response" \
            --write-out '%{http_code}' \
            'https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.brad.t3code')"
          if [[ ! "$http_status" =~ ^2 ]]; then
            jq -r '.errors[]? | [.code, .title, .detail] | map(select(. != null)) | join(": ")' "$app_response" >&2
            exit 1
          fi

          asc_app_id="$(jq -r '.data[0].id // empty' "$app_response")"
          if [ -z "$asc_app_id" ]; then
            echo "::error::Create the T3 Code - Fork app record for com.brad.t3code at https://appstoreconnect.apple.com/apps before submitting." >&2
            exit 1
          fi
          echo "Found App Store Connect app $asc_app_id for com.brad.t3code."

          xcrun altool \
            --upload-app \
            -f "$ipa_path" \
            -t ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"
