name: Sync Upstream

# Detects new releases on pingdotgg/t3code, rebases the fork's curated topic
# stack (scripts/ci/fork-topics.json) onto the upstream tag, and pushes a
# release tag — which triggers release.yml to build.
#
# Scheduled runs check both channels independently. Manual runs can target one
# channel or explicitly select both.
#
# Tag scheme pushed to the fork:
#   - stable channel: ${upstream_tag} verbatim (e.g. v0.0.21)
#   - nightly channel: ${upstream_tag}-fork.<N> (e.g.
#     v0.0.21-nightly.20260421.88-fork.1), where N auto-increments per
#     upstream nightly tag. The -fork suffix keeps fork artifacts
#     distinguishable. sync-upstream skips once an existing fork tag contains
#     the same upstream nightly commit; malformed historical fork tags do not
#     block a corrected sync. Reroll the same upstream commit by manually
#     dispatching release.yml with the next explicit -fork.N version.
#
# On rebase conflict: fails loudly with instructions to reproduce locally.

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      channel:
        description: "Upstream channel."
        required: false
        type: choice
        options:
          - both
          - stable
          - nightly
        default: both

concurrency:
  # One lock for every Actions writer of main (C2 race fix, 2026-07-29:
  # sync and nightly raced; the loser was saved only by its lease).
  group: t3code-writes-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  runner:
    name: Select sync runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      # A relative path suffix, NOT an absolute path. This job runs on
      # ubuntu-24.04 (GitHub-hosted, ephemeral) regardless of which runner is
      # picked for `sync` — it has to, since it decides the label before the
      # `sync` job exists. So this job's own $HOME is never the right machine
      # to resolve the cache location against. Resolving `$HOME/<suffix>`
      # happens in the `sync` job instead, which genuinely executes on
      # whichever machine was picked (see "Resolve rerere cache path" below).
      rerere_cache: ${{ steps.pick.outputs.rerere_cache }}
    steps:
      # Mirrors the mac-runner probe in release.yml. GitHub Actions cannot
      # migrate a job already queued on a self-hosted label, so the choice
      # must happen before the sync job is created. The self-hosted runner
      # labelled t3code-linux-sync does not exist yet, so every sync today
      # takes the ubuntu-24.04 fallback below.
      - name: Pick runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          hosted='["ubuntu-24.04"]'
          self_hosted='["self-hosted","Linux","X64","t3code-linux-sync"]'
          self_hosted_rerere_cache_suffix=".t3code-fork-meta/rr-cache"

          if runner_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
            --jq '.runners[] | select(.status == "online" and .busy == false and ([.labels[].name] | index("t3code-linux-sync"))) | .name' \
            2>/dev/null | head -n1) && [[ -n "$runner_name" ]]; then
            echo "Using self-hosted sync runner: $runner_name (rerere enabled)."
            echo "labels=$self_hosted" >> "$GITHUB_OUTPUT"
            echo "rerere_cache=$self_hosted_rerere_cache_suffix" >> "$GITHUB_OUTPUT"
          else
            echo "Self-hosted sync runner offline or busy; using GitHub-hosted (rerere disabled)."
            echo "labels=$hosted" >> "$GITHUB_OUTPUT"
            echo "rerere_cache=" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Sync ${{ matrix.channel }} with upstream
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Keep channels sequential inside the workflow because both may force-push main.
      max-parallel: 1
      matrix:
        channel:
          - stable
          - nightly

    steps:
      - name: Select channel
        id: channel
        run: |
          channel="${{ matrix.channel }}"
          requested="${{ inputs.channel }}"
          selected=true
          if [[ -n "$requested" && "$requested" != "both" && "$requested" != "$channel" ]]; then
            selected=false
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "Resolved channel: $channel (selected=$selected)"

      - name: Get latest upstream release tag
        if: steps.channel.outputs.selected == 'true'
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.channel.outputs.channel }}" == "nightly" ]]; then
            # First upstream release whose tag matches a nightly pattern.
            # Upstream has used two tag schemes: v<ver>-nightly.* and nightly-v<ver>-nightly.*
            tag=$(gh release list --repo pingdotgg/t3code --limit 50 \
              --json tagName,isPrerelease,publishedAt \
              --jq '[.[] | select(.isPrerelease and (.tagName | test("(^|-)v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.")))] | sort_by(.publishedAt) | reverse | .[0].tagName')
            if [[ -z "$tag" || "$tag" == "null" ]]; then
              echo "::error::No nightly release found on upstream."
              exit 1
            fi
            echo "Latest upstream nightly release: $tag"
          else
            tag=$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name)
            echo "Latest upstream stable release: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout fork
        if: steps.channel.outputs.selected == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Upstream may change workflow files; a PAT with workflow scope is
          # required to push those changes back to the fork.
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Vite+
        if: steps.channel.outputs.selected == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Configure git
        if: steps.channel.outputs.selected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record main lease
        if: steps.channel.outputs.selected == 'true'
        id: pre
        run: scripts/ci/record-main-lease

      - name: Check if sync needed
        if: steps.channel.outputs.selected == 'true'
        id: check
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          upstream_tag="${{ steps.upstream.outputs.tag }}"
          upstream_ref="refs/tags/upstream/${upstream_tag}"

          ensure_upstream_remote() {
            if ! git remote get-url upstream >/dev/null 2>&1; then
              git remote add upstream https://github.com/pingdotgg/t3code.git
            fi
          }

          contains_upstream_tag() {
            local candidate="$1"
            git merge-base --is-ancestor "${upstream_ref}^{commit}" "${candidate}^{commit}" >/dev/null 2>&1
          }

          ensure_upstream_remote
          # Keep upstream tags out of the fork tag namespace. Without --no-tags,
          # Git auto-follows reachable upstream tags into refs/tags/*, which can
          # make a missing fork stable tag look already synced.
          git fetch --no-tags upstream "+refs/tags/${upstream_tag}:${upstream_ref}"

          if [[ "$CHANNEL" == "nightly" ]]; then
            # Nightly: the fork publishes tags of the form
            # "${upstream_tag}-fork.<N>". A tag only proves sync if its commit
            # contains the upstream nightly tag; malformed push-nightly tags from
            # before this ancestry check must not block a corrected reroll.
            mapfile -t existing < <(git tag --list "${upstream_tag}-fork.*")
            synced=()
            stale=()
            for tag in "${existing[@]}"; do
              if contains_upstream_tag "$tag"; then
                synced+=("$tag")
              else
                stale+=("$tag")
              fi
            done

            if [[ ${#synced[@]} -gt 0 ]]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "Fork already has upstream-containing build(s) for $upstream_tag:"
              printf '  %s\n' "${synced[@]}"
              echo "Nothing to do."
            else
              mapfile -t fork_tags < <(git tag --list 'v*' --sort=-creatordate)
              fork_latest="${fork_tags[0]:-}"
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "fork_latest=$fork_latest" >> "$GITHUB_OUTPUT"
              if [[ ${#stale[@]} -gt 0 ]]; then
                echo "Existing fork tag(s) do not contain $upstream_tag and will not block sync:"
                printf '  %s\n' "${stale[@]}"
              fi
              echo "Upstream nightly at $upstream_tag, fork has no build yet (latest fork tag: $fork_latest). Syncing..."
            fi
          else
            # Stable: fork tag == upstream tag exactly.
            if git rev-parse --verify "${upstream_tag}^{commit}" >/dev/null 2>&1 && contains_upstream_tag "$upstream_tag"; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "Fork already has upstream-containing $upstream_tag. Nothing to do."
            else
              mapfile -t fork_tags < <(git tag --list 'v*' | sort -V)
              if [[ ${#fork_tags[@]} -eq 0 ]]; then
                fork_latest=""
              else
                fork_latest="${fork_tags[-1]}"
              fi
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "fork_latest=$fork_latest" >> "$GITHUB_OUTPUT"
              if git rev-parse --verify "${upstream_tag}^{commit}" >/dev/null 2>&1; then
                echo "Existing fork tag $upstream_tag does not contain upstream $upstream_tag; syncing corrected tag."
              fi
              echo "Upstream at $upstream_tag, fork at $fork_latest. Syncing..."
            fi
          fi

      - name: Resolve rerere cache path
        if: steps.check.outputs.needed == 'true'
        id: rerere
        env:
          RERERE_CACHE_SUFFIX: ${{ needs.runner.outputs.rerere_cache }}
        run: |
          set -euo pipefail
          # This step genuinely executes on whichever machine `sync` landed
          # on (self-hosted runner or the ubuntu-24.04 fallback), so its
          # $HOME is correct — unlike the `runner` job's probe, which never
          # runs on the target machine. On the hosted fallback,
          # RERERE_CACHE_SUFFIX is empty, so SYNC_RERERE_CACHE resolves to an
          # empty string and the driver keeps rerere disabled.
          if [[ -n "$RERERE_CACHE_SUFFIX" ]]; then
            echo "SYNC_RERERE_CACHE=$HOME/$RERERE_CACHE_SUFFIX" >> "$GITHUB_ENV"
          else
            echo "SYNC_RERERE_CACHE=" >> "$GITHUB_ENV"
          fi

      - name: Rebase fork commits onto upstream tag
        if: steps.check.outputs.needed == 'true'
        id: rebase
        env:
          CI_REPAIR_BOT_UPSTREAM_TARGET: refs/tags/upstream/${{ steps.upstream.outputs.tag }}
          CI_REPAIR_BOT_UPSTREAM_SOURCE_REF: refs/tags/${{ steps.upstream.outputs.tag }}
          CI_REPAIR_BOT_CONFLICT_MODE: output
        run: scripts/ci/reproduce-sync-upstream

      - name: Prepare release tag
        if: steps.check.outputs.needed == 'true' && steps.rebase.outputs.status == 'clean'
        id: prepare
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$CHANNEL" == "nightly" ]]; then
            # Fork nightly tag: ${upstream_tag}-fork.<N>. N is the next integer
            # after the largest existing -fork.<N> for this upstream tag.
            # Semver note: "88-fork" is a single pre-release identifier (hyphens
            # are valid inside identifiers); because it's alphanumeric (not pure
            # digits), it sorts strictly higher than the numeric "88" — so the
            # fork version is always > the upstream nightly it's based on.
            mapfile -t existing < <(git tag --list "${UPSTREAM_TAG}-fork.*" \
              | awk -F '-fork\\.' 'NF==2 && $2 ~ /^[0-9]+$/ { print $2 }' \
              | sort -n)
            if [[ ${#existing[@]} -eq 0 ]]; then
              next_n=1
            else
              last="${existing[-1]}"
              next_n=$((last + 1))
            fi
            new_tag="${UPSTREAM_TAG}-fork.${next_n}"
          else
            new_tag="$UPSTREAM_TAG"
          fi

          RELEASE_TAG="$new_tag" scripts/ci/prepare-release-tag

      - name: Refresh StGit stack metadata
        if: steps.check.outputs.needed == 'true' && steps.rebase.outputs.status == 'clean'
        id: stgit
        env:
          STGIT_BRANCH: adopt
          STGIT_EXPECTED_HEAD: ${{ steps.pre.outputs.main_sha }}
          STGIT_MAIN_SHA: ${{ steps.prepare.outputs.main_sha }}
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/stacks/stgit/adopt:refs/stacks/stgit/adopt' \
            '+refs/patches/stgit/adopt/*:refs/patches/stgit/adopt/*'
          scripts/ci/refresh-stgit-metadata

      - name: Atomically push main, StGit metadata, and release tag
        if: steps.check.outputs.needed == 'true' && steps.rebase.outputs.status == 'clean'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          LEASE_SHA: ${{ steps.pre.outputs.main_sha }}
          MAIN_SHA: ${{ steps.prepare.outputs.main_sha }}
          PREP_SHA: ${{ steps.prepare.outputs.prep_sha }}
          NEW_TAG: ${{ steps.prepare.outputs.tag }}
          STGIT_STACK_REF: ${{ steps.stgit.outputs.stack_ref }}
          STGIT_STACK_LEASE: ${{ steps.stgit.outputs.stack_lease }}
          STGIT_STACK_SHA: ${{ steps.stgit.outputs.stack_sha }}
          STGIT_PUSH_PLAN: ${{ steps.stgit.outputs.push_plan }}
        run: |
          set -euo pipefail

          tag_sha="$(git rev-parse "${NEW_TAG}^{commit}")"
          if [[ "$tag_sha" != "$PREP_SHA" ]]; then
            echo "::error::Tag/source mismatch: $NEW_TAG resolves to $tag_sha, expected $PREP_SHA."
            exit 1
          fi
          if [[ "$PREP_SHA" != "$MAIN_SHA" ]] && [[ "$(git rev-parse "${PREP_SHA}^")" != "$MAIN_SHA" ]]; then
            echo "::error::Release-prep commit $PREP_SHA is not a direct child of main $MAIN_SHA."
            exit 1
          fi

          # main is pushed at the pre-prep sha. The release-prep commit is
          # reachable only from the tag, so main never accumulates generated
          # release metadata and the rebase stack stays flat.
          # Backup current main before the force-push (bounded: one ref/day).
          git push origin "+${LEASE_SHA}:refs/heads/backup/auto/sync-$(date -u +%Y%m%d)" || true
          leases=(
            "--force-with-lease=refs/heads/main:${LEASE_SHA}"
            "--force-with-lease=${STGIT_STACK_REF}:${STGIT_STACK_LEASE}"
          )
          refspecs=(
            "${MAIN_SHA}:refs/heads/main"
            "${STGIT_STACK_SHA}:${STGIT_STACK_REF}"
          )
          if [[ "$CHANNEL" == "nightly" ]]; then
            refspecs+=("refs/tags/${NEW_TAG}:refs/tags/${NEW_TAG}")
          else
            refspecs+=("+refs/tags/${NEW_TAG}:refs/tags/${NEW_TAG}")
          fi
          while IFS=$'\t' read -r ref old new; do
            [[ -z "$ref" ]] && continue
            leases+=("--force-with-lease=${ref}:${old}")
            refspecs+=("${new}:${ref}")
          done <<< "$STGIT_PUSH_PLAN"
          git push --atomic origin "${leases[@]}" "${refspecs[@]}"
          echo "Pushed $NEW_TAG (main at $MAIN_SHA) — release.yml will build and publish."

          # The persisted GH_PAT credential makes this tag push trigger
          # release.yml. Do not dispatch it again or the same tag builds twice.

      - name: Fail with conflict resolution instructions
        if: steps.check.outputs.needed == 'true' && steps.rebase.outputs.status == 'conflict'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          upstream_tag="${{ steps.upstream.outputs.tag }}"
          echo "::error::Rebase conflict syncing to $upstream_tag (channel: $CHANNEL)."
          echo "::error::Conflicting files:"
          echo "${{ steps.rebase.outputs.files }}" | sed 's/^/::error::  /'
          echo "::error::"
          echo "::error::Resolve locally:"
          echo "::error::  git fetch --no-tags upstream"
          echo "::error::  git fetch --no-tags upstream 'refs/tags/${upstream_tag}:refs/tags/upstream/${upstream_tag}'"
          echo "::error::  CI_REPAIR_BOT_UPSTREAM_TARGET='refs/tags/upstream/${upstream_tag}' \\"
          echo "::error::    CI_REPAIR_BOT_UPSTREAM_SOURCE_REF='refs/tags/${upstream_tag}' \\"
          echo "::error::    scripts/ci/reproduce-sync-upstream"
          echo "::error::"
          echo "::error::On EVERY conflict, ask in this order:"
          echo "::error::  1. Is the fork's side still needed at all?  -> retire"
          echo "::error::  2. Does upstream now cover part of it?      -> narrow"
          echo "::error::  3. Only then: how do I reconcile them?      -> adapt"
          echo "::error::Answering 3 first silently preserves patches that no longer need to"
          echo "::error::exist, and they conflict again on every future sync. Conflicts"
          echo "::error::cluster exactly where upstream is changing the code your patch"
          echo "::error::touches -- which is where supersession happens."
          echo "::error::Fix the PATCH, never add a repair commit beside it."
          echo "::error::"
          echo "::error::  # after conflicts are resolved and focused tests pass:"
          echo "::error::  git push origin main --force-with-lease"
          if [[ "$CHANNEL" == "nightly" ]]; then
            echo "::error::  # pick the next fork.N for this upstream tag:"
            echo "::error::  n=\$(( \$(git tag --list '${upstream_tag}-fork.*' | awk -F '-fork\\\\.' 'NF==2{print \$2}' | sort -n | tail -1) + 1 ))"
            echo "::error::  git tag \"${upstream_tag}-fork.\$n\" HEAD"
            echo "::error::  git push origin \"${upstream_tag}-fork.\$n\""
          else
            echo "::error::  git push origin ${upstream_tag}"
          fi
          exit 1
