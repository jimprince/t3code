name: Sync Upstream

# Detects new releases on pingdotgg/t3code, rebases our fork commits onto the
# upstream tag, and pushes a release tag — which triggers release.yml to build.
#
# Scheduled runs check both channels independently. Manual runs can target one
# channel or explicitly select both.
#
# Tag scheme pushed to the fork:
#   - stable channel: ${upstream_tag} verbatim (e.g. v0.0.21)
#   - nightly channel: ${upstream_tag}-fork.<N> (e.g.
#     v0.0.21-nightly.20260421.88-fork.1), where N auto-increments per
#     upstream nightly tag. The -fork suffix keeps fork artifacts
#     distinguishable. sync-upstream skips once an existing fork tag contains
#     the same upstream nightly commit; malformed historical fork tags do not
#     block a corrected sync. Reroll the same upstream commit by manually
#     dispatching release.yml with the next explicit -fork.N version.
#
# On rebase conflict: fails loudly with instructions to resolve locally.

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      channel:
        description: "Upstream channel."
        required: false
        type: choice
        options:
          - both
          - stable
          - nightly
        default: both

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  sync:
    name: Sync ${{ matrix.channel }} with upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Keep channels sequential inside the workflow because both may force-push main.
      max-parallel: 1
      matrix:
        channel:
          - stable
          - nightly

    steps:
      - name: Select channel
        id: channel
        run: |
          channel="${{ matrix.channel }}"
          requested="${{ inputs.channel }}"
          selected=true
          if [[ -n "$requested" && "$requested" != "both" && "$requested" != "$channel" ]]; then
            selected=false
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "Resolved channel: $channel (selected=$selected)"

      - name: Get latest upstream release tag
        if: steps.channel.outputs.selected == 'true'
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.channel.outputs.channel }}" == "nightly" ]]; then
            # First upstream release whose tag matches a nightly pattern.
            # Upstream has used two tag schemes: v<ver>-nightly.* and nightly-v<ver>-nightly.*
            tag=$(gh release list --repo pingdotgg/t3code --limit 50 \
              --json tagName,isPrerelease,publishedAt \
              --jq '[.[] | select(.isPrerelease and (.tagName | test("(^|-)v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.")))] | sort_by(.publishedAt) | reverse | .[0].tagName')
            if [[ -z "$tag" || "$tag" == "null" ]]; then
              echo "::error::No nightly release found on upstream."
              exit 1
            fi
            echo "Latest upstream nightly release: $tag"
          else
            tag=$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name)
            echo "Latest upstream stable release: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout fork
        if: steps.channel.outputs.selected == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Vite+
        if: steps.channel.outputs.selected == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Configure git
        if: steps.channel.outputs.selected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if sync needed
        if: steps.channel.outputs.selected == 'true'
        id: check
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          upstream_tag="${{ steps.upstream.outputs.tag }}"
          upstream_ref="refs/tags/upstream/${upstream_tag}"

          ensure_upstream_remote() {
            if ! git remote get-url upstream >/dev/null 2>&1; then
              git remote add upstream https://github.com/pingdotgg/t3code.git
            fi
          }

          contains_upstream_tag() {
            local candidate="$1"
            git merge-base --is-ancestor "${upstream_ref}^{commit}" "${candidate}^{commit}" >/dev/null 2>&1
          }

          ensure_upstream_remote
          git fetch upstream "+refs/tags/${upstream_tag}:${upstream_ref}"

          if [[ "$CHANNEL" == "nightly" ]]; then
            # Nightly: the fork publishes tags of the form
            # "${upstream_tag}-fork.<N>". A tag only proves sync if its commit
            # contains the upstream nightly tag; malformed push-nightly tags from
            # before this ancestry check must not block a corrected reroll.
            mapfile -t existing < <(git tag --list "${upstream_tag}-fork.*")
            synced=()
            stale=()
            for tag in "${existing[@]}"; do
              if contains_upstream_tag "$tag"; then
                synced+=("$tag")
              else
                stale+=("$tag")
              fi
            done

            if [[ ${#synced[@]} -gt 0 ]]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "Fork already has upstream-containing build(s) for $upstream_tag:"
              printf '  %s\n' "${synced[@]}"
              echo "Nothing to do."
            else
              mapfile -t fork_tags < <(git tag --list 'v*' --sort=-creatordate)
              fork_latest="${fork_tags[0]:-}"
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "fork_latest=$fork_latest" >> "$GITHUB_OUTPUT"
              if [[ ${#stale[@]} -gt 0 ]]; then
                echo "Existing fork tag(s) do not contain $upstream_tag and will not block sync:"
                printf '  %s\n' "${stale[@]}"
              fi
              echo "Upstream nightly at $upstream_tag, fork has no build yet (latest fork tag: $fork_latest). Syncing..."
            fi
          else
            # Stable: fork tag == upstream tag exactly.
            if git rev-parse --verify "${upstream_tag}^{commit}" >/dev/null 2>&1 && contains_upstream_tag "$upstream_tag"; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "Fork already has upstream-containing $upstream_tag. Nothing to do."
            else
              mapfile -t fork_tags < <(git tag --list 'v*' | sort -V)
              if [[ ${#fork_tags[@]} -eq 0 ]]; then
                fork_latest=""
              else
                fork_latest="${fork_tags[-1]}"
              fi
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "fork_latest=$fork_latest" >> "$GITHUB_OUTPUT"
              if git rev-parse --verify "${upstream_tag}^{commit}" >/dev/null 2>&1; then
                echo "Existing fork tag $upstream_tag does not contain upstream $upstream_tag; syncing corrected tag."
              fi
              echo "Upstream at $upstream_tag, fork at $fork_latest. Syncing..."
            fi
          fi

      - name: Fetch upstream tag (namespaced to avoid clobbering fork tags)
        if: steps.check.outputs.needed == 'true'
        run: |
          upstream_tag="${{ steps.upstream.outputs.tag }}"
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/pingdotgg/t3code.git
          fi
          git fetch upstream main
          git fetch upstream "+refs/tags/${upstream_tag}:refs/tags/upstream/${upstream_tag}"

      - name: Rebase fork commits onto upstream tag
        if: steps.check.outputs.needed == 'true'
        id: rebase
        env:
          # Files we always want to take upstream's version of during rebase.
          # release.yml's finalize job rewrites these on every release, which
          # creates perpetual conflicts with upstream's own version bumps.
          # Auto-resolving to upstream is safe because finalize will rewrite
          # them again after the next fork release builds.
          # Resolve tracker-only files from upstream to avoid blocked
          # release syncs caused by stale local status metadata.
          UPSTREAM_RESOLVE_FILES: |
            apps/desktop/package.json
            apps/server/package.json
            apps/web/package.json
            packages/contracts/package.json
            pnpm-lock.yaml
          # Resolve tracker-only conflicts to the current rebased tree so
          # release syncs are not blocked by status-log edits from individual
          # task commits.
          # release.yml is fork-owned: the fork intentionally keeps a minimal
          # macOS/headless matrix and local-runner fallback that upstream does
          # not have. During rebase, "theirs" is the fork commit being replayed.
          # app.config.ts is fork-owned because it binds the mobile app to this
          # fork's EAS project, bundle IDs, Apple team, and runtime policy.
          # docs/operations/release.md is likewise fork-owned: it documents the
          # fork's reduced release lanes and mobile EAS model, fully replacing
          # upstream's release doc.
          # The orchestration projection files carry fork-only commands,
          # thread lifecycle behavior, and snapshot handoff guarantees.
          FORK_RESOLVE_FILES: |
            .github/workflows/release.yml
            apps/mobile/app.config.ts
            apps/server/src/orchestration/Layers/OrchestrationEngine.test.ts
            apps/server/src/orchestration/Layers/ProjectionSnapshotQuery.ts
            apps/server/src/orchestration/Services/ProjectionSnapshotQuery.ts
            docs/operations/release.md
            infra/relay/scripts/deploy.test.ts
        run: |
          set -euo pipefail
          upstream_tag="${{ steps.upstream.outputs.tag }}"
          upstream_ref="refs/tags/upstream/${upstream_tag}"

          echo "Rebasing onto $upstream_ref..."
          echo "Fork commits being replayed (relative to upstream/main):"
          git log --oneline upstream/main..HEAD

          # Build allowlists as sorted unique sets.
          mapfile -t UPSTREAM_ALLOW < <(echo "$UPSTREAM_RESOLVE_FILES" | sed '/^$/d' | sort -u)
          mapfile -t FORK_ALLOW < <(echo "$FORK_RESOLVE_FILES" | sed '/^$/d' | sort -u)

          is_upstream_allowed() {
            local f="$1"
            for a in "${UPSTREAM_ALLOW[@]}"; do
              [[ "$f" == "$a" ]] && return 0
            done
            return 1
          }

          is_fork_allowed() {
            local f="$1"
            for a in "${FORK_ALLOW[@]}"; do
              [[ "$f" == "$a" ]] && return 0
            done
            return 1
          }

          fail_with_conflicts() {
            local files="$1"
            git rebase --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Initial rebase attempt. If it fails, fall through to the
          # conflict-resolution loop below.
          if git rebase --onto "$upstream_ref" upstream/main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Loop: at each stop, either auto-resolve allowlisted file
          # conflicts (taking upstream's version) or bail out loudly.
          while [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; do
            mapfile -t conflicted < <(git diff --name-only --diff-filter=U | sort -u)

            if [[ ${#conflicted[@]} -eq 0 ]]; then
              # No conflicts but rebase is stopped — likely an empty commit
              # after auto-resolve. Skip it and continue.
              git rebase --skip || break
              continue
            fi

            unknown=()
            for f in "${conflicted[@]}"; do
              if ! is_upstream_allowed "$f" && ! is_fork_allowed "$f"; then
                unknown+=("$f")
              fi
            done

            if [[ ${#unknown[@]} -gt 0 ]]; then
              echo "Conflicts outside auto-resolve allowlist:"
              printf '  %s\n' "${unknown[@]}"
              fail_with_conflicts "$(printf '%s\n' "${conflicted[@]}")"
            fi

            echo "Auto-resolving allowed conflicts for: ${conflicted[*]}"
            for f in "${conflicted[@]}"; do
              if is_upstream_allowed "$f"; then
                # During rebase, "ours" = upstream (the new base).
                git checkout --ours -- "$f"
              else
                # During rebase, "theirs" = the fork commit being replayed.
                git checkout --theirs -- "$f"
              fi
              git add -- "$f"
            done

            # If continuing hits a later conflict, keep the rebase state and
            # let the next loop iteration inspect that conflict. Only the
            # no-conflict branch above is allowed to skip an empty commit.
            GIT_EDITOR=true git rebase --continue || true
          done

          mapfile -t unresolved < <(git diff --name-only --diff-filter=U | sort -u)
          if [[ -d .git/rebase-merge || -d .git/rebase-apply || ${#unresolved[@]} -gt 0 ]]; then
            echo "Rebase stopped before completion."
            fail_with_conflicts "$(printf '%s\n' "${unresolved[@]}")"
          fi

          echo "status=clean" >> "$GITHUB_OUTPUT"
          echo "Rebase completed (some version-bump conflicts auto-resolved to upstream)."

      - name: Push rebased main and release tag
        if: steps.check.outputs.needed == 'true' && steps.rebase.outputs.status == 'clean'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_tag="${{ steps.upstream.outputs.tag }}"

          if [[ "$CHANNEL" == "nightly" ]]; then
            # Fork nightly tag: ${upstream_tag}-fork.<N>. N is the next integer
            # after the largest existing -fork.<N> for this upstream tag.
            # Semver note: "88-fork" is a single pre-release identifier (hyphens
            # are valid inside identifiers); because it's alphanumeric (not pure
            # digits), it sorts strictly higher than the numeric "88" — so the
            # fork version is always > the upstream nightly it's based on.
            mapfile -t existing < <(git tag --list "${upstream_tag}-fork.*" \
              | awk -F '-fork\\.' 'NF==2 && $2 ~ /^[0-9]+$/ { print $2 }' \
              | sort -n)
            if [[ ${#existing[@]} -eq 0 ]]; then
              next_n=1
            else
              last="${existing[-1]}"
              next_n=$((last + 1))
            fi
            new_tag="${upstream_tag}-fork.${next_n}"
          else
            new_tag="$upstream_tag"
          fi

          version="${new_tag#v}"
          # A freshly rebased upstream may change package manifests before the
          # fork release-version stamp. Refresh the lockfile first so the
          # install used to run the stamping script is not blocked by stale
          # pre-rebase lock metadata.
          vp install --lockfile-only --ignore-scripts
          vp install --frozen-lockfile --ignore-scripts
          node scripts/update-release-package-versions.ts "$version"
          vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json
          vp install --lockfile-only --ignore-scripts

          if ! git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml; then
            git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
            git commit -m "chore(release): prepare $new_tag"
          else
            echo "Package versions already match $version."
          fi

          if [[ "$CHANNEL" == "nightly" ]]; then
            git tag "$new_tag" HEAD
            git push origin HEAD:main --force-with-lease
            git push origin "$new_tag"
            echo "Pushed $new_tag (rebased onto $upstream_tag) — release.yml will build and publish."
          else
            # Force-update tag in case git auto-followed it from the upstream fetch.
            git tag -f "$new_tag" HEAD
            git push origin HEAD:main --force-with-lease
            git push origin "$new_tag" --force
            echo "Pushed $new_tag — release.yml will build and publish."
          fi

          # Pushes made with GITHUB_TOKEN do not trigger tag-push workflows.
          # Dispatch the release workflow explicitly so scheduled syncs still
          # publish artifacts without requiring a long-lived PAT secret.
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version="$new_tag" \
            -f target_ref="$new_tag"

      - name: Fail with conflict resolution instructions
        if: steps.check.outputs.needed == 'true' && steps.rebase.outputs.status == 'conflict'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          upstream_tag="${{ steps.upstream.outputs.tag }}"
          echo "::error::Rebase conflict syncing to $upstream_tag (channel: $CHANNEL)."
          echo "::error::Conflicting files:"
          echo "${{ steps.rebase.outputs.files }}" | sed 's/^/::error::  /'
          echo "::error::"
          echo "::error::Resolve locally:"
          echo "::error::  git fetch upstream"
          echo "::error::  git fetch upstream 'refs/tags/${upstream_tag}:refs/tags/upstream/${upstream_tag}'"
          echo "::error::  git rebase refs/tags/upstream/${upstream_tag}"
          echo "::error::  # fix conflicts, then:"
          echo "::error::  git push origin main --force-with-lease"
          if [[ "$CHANNEL" == "nightly" ]]; then
            echo "::error::  # pick the next fork.N for this upstream tag:"
            echo "::error::  n=\$(( \$(git tag --list '${upstream_tag}-fork.*' | awk -F '-fork\\\\.' 'NF==2{print \$2}' | sort -n | tail -1) + 1 ))"
            echo "::error::  git tag \"${upstream_tag}-fork.\$n\" HEAD"
            echo "::error::  git push origin \"${upstream_tag}-fork.\$n\""
          else
            echo "::error::  git push origin ${upstream_tag}"
          fi
          exit 1
