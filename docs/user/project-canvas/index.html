<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project canvas</title>
    <link rel="stylesheet" href="canvas.css" />
  </head>
  <body>
    <!-- Template: replace the numbers and rows. Regenerate the whole file from a script or an
     automation; the project page shows "updated X ago" from the file time. Keep it static:
     no network requests, no continuously repainting animation. -->
    <h1>Printcell</h1>
    <p class="stamp">Generated 2026-10-05 14:20 by the orchestrator</p>
    <h2>Now</h2>
    <div class="stats">
      <div class="stat">
        <div class="label">Sims running</div>
        <div class="value">14</div>
      </div>
      <div class="stat">
        <div class="label">Physical picks, 7 days</div>
        <div class="value good">17 / 23</div>
      </div>
      <div class="stat">
        <div class="label">Arm</div>
        <div class="value">disarmed</div>
      </div>
      <div class="stat">
        <div class="label">Printer</div>
        <div class="value warn">idle</div>
      </div>
    </div>
    <h2>Sims by host</h2>
    <table>
      <tr>
        <th>host</th>
        <th class="num">running</th>
        <th style="width: 50%"></th>
      </tr>
      <tr>
        <td>RTX 3060 a</td>
        <td class="num">8</td>
        <td><div class="bar" style="width: 100%"></div></td>
      </tr>
      <tr>
        <td>RTX 3060 b</td>
        <td class="num">6</td>
        <td><div class="bar" style="width: 75%"></div></td>
      </tr>
    </table>
  </body>
</html>
