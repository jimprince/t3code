[[patch]]
name = "fork-remote-relay-access"
subject = "feat(remote): support authenticated relay access"
class = "divergence"
purpose = "Support authenticated remote and relay operation with fork-specific scope and transport behavior."
retire_when = "Upstream ships equivalent authenticated relay access."
