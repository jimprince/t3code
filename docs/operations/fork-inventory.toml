[[patch]]
name = "fork-nested-threads"
subject = "feat(threads): nest threads under an orchestrating thread"
class = "product"
purpose = "Let a thread nest under an orchestrating thread so it leaves the sidebar and appears in the parent's Agents panel, move threads in and out of nesting, default t3-thread workers to nest under their caller, and let parents answer their workers' questions and approvals from the CLI."
retire_when = "Upstream provides persistent parent/child thread placement with an equivalent Agents-panel view and CLI escalation, or the fork stops wanting orchestrator nesting."
depends_on = ["fork-worker-operations"]
roles = []
note = "parentThreadId is an optional thread field (fork migration 6, projection_threads.parent_thread_id) set at creation or by thread.parent.set, which emits thread.meta-updated so older clients ignore it; existing flat rows stay valid as NULL and need no new migration. Servers advertise threadNesting on the environment descriptor, which is where t3-thread reads it (serverGetConfig does not carry it). The original one-level cap was lifted because delegated callers can themselves orchestrate workers; ancestor-chain validation preserves the actual invariant, an acyclic tree, without flattening ownership or routing notifications past the direct caller. Nesting supports arbitrary acyclic depth within one project; the decider rejects self, descendants, cross-project, cyclic, missing, and archived parents. Children of an archived or missing parent show in the sidebar. Parent lifecycle changes never cascade to children. The parent's sidebar row rolls up all descendants' approvals, questions, and working or monitoring state. Nested attention remains visually surfaced but never plays completion or attention sounds; only top-level work makes notification sounds. Desktop and web only; mobile lists every thread until a follow-up. t3-thread nests workers directly under the caller at every depth, and pending/answer/approve/deny let the parent escalate instead of the user."

