# Fork Patch Inventory — schema version 2
#
# This ordered registry is part of the stack interface. Every applied StGit
# patch has exactly one entry, in stack.json.applied order. A patch owns its
# implementation, tests, applicable documentation, and this stanza. Paths may
# overlap; coherent purpose, not exclusive files, determines ownership.
#
# class: product | divergence | upstream-bound

schema = 2
fork = "jimprince/t3code"
upstream = "pingdotgg/t3code"

[[patch]]
name = "fork-stgit-stack-policy"
subject = "docs(fork): define StGit stack policy"
class = "product"
purpose = "Route maintainers and agents through the executable StGit maintenance, validation, and publication policy."
retire_when = "never"
depends_on = []
roles = ["agent-docs-owner"]

[[patch]]
name = "fork-build-workspace-tooling"
subject = "build(fork): configure workspace tooling"
class = "product"
purpose = "Configure the fork workspace, dependency graph, and reusable build tooling required by its additive applications."
retire_when = "never"
depends_on = ["fork-stgit-stack-policy"]
roles = ["lockfile-owner"]
note = "pnpm-lock.yaml is generated: take upstream's lockfile during a conflict, regenerate it, and refresh only this patch."

[[patch]]
name = "fork-t3-thread-operator-cli"
subject = "feat(fork): add t3-thread operator CLI"
class = "product"
purpose = "Provide the additive t3-thread operator CLI, which has no upstream equivalent."
retire_when = "never"
depends_on = ["fork-build-workspace-tooling"]
roles = []

[[patch]]
name = "fork-provider-turn-reservation"
subject = "fix(server): reserve active provider turns"
class = "divergence"
purpose = "Prevent the provider reaper from clearing a live turn marker and reporting a false stopping session."
retire_when = "Upstream adds equivalent pending-turn reservation semantics."
depends_on = ["fork-stgit-stack-policy"]
roles = []
[[patch.decision]]
id = "providerservice-mcp-touch"
date = "2026-07-28"
decided = "adapt"
rationale = "Upstream added McpSessionRegistry.touchActiveMcpThread before sendTurn; the fork wraps sendTurn in a reservation gate. Independent concerns. The touch belongs inside the gate immediately before the real sendTurn, because touching earlier would change upstream semantics when reservation fails and no turn is sent."

[[patch]]
name = "fork-provider-runtime-recovery"
subject = "fix(server): recover provider runtimes"
class = "divergence"
purpose = "Recover provider sessions and lifecycle state predictably after crashes, restarts, and partial startup."
retire_when = "Upstream provides equivalent provider runtime recovery and lifecycle guarantees."
depends_on = ["fork-provider-turn-reservation"]
roles = []

[[patch]]
name = "fork-provider-observability"
subject = "fix(server): bound provider observability"
class = "divergence"
purpose = "Retain bounded fork diagnostics, provider-log eviction, trace throttling, and Spotlight markers."
retire_when = "Upstream covers the retained logging, eviction, and diagnostic capabilities."
depends_on = ["fork-provider-runtime-recovery"]
roles = []
[[patch.decision]]
id = "logger-supersession-951"
date = "2026-07-29"
decided = "retire+narrow+adapt (per capability)"
analysis = "docs/analysis/logger-supersession.md"
rationale = "Upstream v0.0.31 rework (49c0d96ed) superseded per-thread writer splitting, shutdown flush, and native/canonical file separation, so those pieces retired. Keep releaseThread eviction adapted to upstream's store, trace-span rate limiting, and the Spotlight marker. Layer the fork's 2GiB/30d logsDir sweep over upstream's 512MiB/14d provider policy."

[[patch]]
name = "fork-thread-lifecycle-recovery"
subject = "fix(server): recover thread lifecycle"
class = "divergence"
purpose = "Preserve thread state and snapshot handoff correctness across server reconnects and lifecycle recovery."
retire_when = "Upstream supplies equivalent lifecycle recovery and atomic snapshot handoff."
depends_on = ["fork-provider-runtime-recovery"]
roles = []
[[patch.decision]]
id = "ws-snapshot-projection"
date = "2026-07-28"
decided = "retire"
rationale = "Upstream's projectThreadDetailSnapshot spreads the complete snapshot and prunes activity payloads, a strict superset of the old hand-rolled projection. Retain upstream's call while binding it to the fork's threadDetailSnapshot name; do not restore the retired projection."

[[patch]]
name = "fork-thread-goals"
subject = "feat(goals): persist thread goals"
class = "product"
purpose = "Persist, expose, and render durable goals for long-running agent threads."
retire_when = "never"
depends_on = ["fork-thread-lifecycle-recovery"]
roles = []

[[patch]]
name = "fork-thread-transfer"
subject = "feat(threads): transfer threads between environments"
class = "product"
purpose = "Move threads safely between local and remote environments with coordinated server, desktop, and web behavior."
retire_when = "never"
depends_on = ["fork-thread-lifecycle-recovery"]
roles = []

[[patch]]
name = "fork-thread-fork"
subject = "feat(threads): fork conversations from messages"
class = "product"
purpose = "Create a new conversation from an earlier message while preserving the selected thread context."
retire_when = "never"
depends_on = ["fork-thread-lifecycle-recovery"]
roles = []

[[patch]]
name = "fork-general-chat-projects"
subject = "feat(projects): add General Chat projects"
class = "product"
purpose = "Provide flat General Chat projects and their server projection and sidebar behavior."
retire_when = "never"
depends_on = ["fork-thread-lifecycle-recovery"]
roles = []
[[patch.decision]]
id = "chat-enrichment-guard-951"
date = "2026-07-29"
decided = "retire"
rationale = "Upstream adopted isChatProjectRow filtering in ProjectionSnapshotQuery enrichment, covering the fork guard. Retire the duplicate ws.ts enrichment and the related obsolete IPC, local API, and server stubs."
[[patch.decision]]
id = "sidebar-project-header-styling"
date = "2026-07-28"
decided = "adapt"
rationale = "The fork owns the General Chat structure (hideProjectHeader wrapper and chat affordance); upstream owns the design system. Preserve the structural additions while taking upstream styling."

[[patch]]
name = "fork-remote-relay-access"
subject = "feat(remote): support authenticated relay access"
class = "divergence"
purpose = "Support authenticated remote and relay operation with fork-specific scope and transport behavior."
retire_when = "Upstream ships equivalent authenticated relay access."
depends_on = ["fork-thread-lifecycle-recovery"]
roles = []
[[patch.decision]]
id = "rpc-scope-map-relocation-951"
date = "2026-07-29"
decided = "relocate"
rationale = "Upstream moved the RPC scope map into auth/RpcAuthorization.ts and type-coupled it to WsRpcGroup. Keep the fork's transfer, recovery, and headless scopes at that new location so missing scope coverage remains a compile-time error."

[[patch]]
name = "fork-performance-recovery"
subject = "feat(recovery): add performance recovery controls"
class = "product"
purpose = "Expose resource pressure diagnosis and bounded system recovery controls."
retire_when = "never"
depends_on = ["fork-provider-observability"]
roles = []
[[patch.decision]]
id = "forkprocessrows-extraction-951"
date = "2026-07-29"
decided = "extract-to-additive"
rationale = "When upstream deleted process-row parsing from ProcessDiagnostics, move ProcessRow and readProcessRows into the additive forkProcessRows module. This keeps all fork behavior out of the upstream diagnostics file."

[[patch]]
name = "fork-headless-updates"
subject = "feat(server): add safe headless updates"
class = "product"
purpose = "Provide guarded headless server update discovery, installation, and restart behavior."
retire_when = "never"
depends_on = ["fork-remote-relay-access"]
roles = []

[[patch]]
name = "fork-text-generation"
subject = "feat(server): add fork text generation"
class = "product"
purpose = "Provide fork-owned text-generation services and integrations used by runtime features."
retire_when = "never"
depends_on = ["fork-provider-runtime-recovery"]
roles = []
[[patch.decision]]
id = "gitmanager-faketextgeneration"
date = "2026-07-28"
decided = "retire"
rationale = "Upstream replaced the duplicate hand-written interface with TextGeneration['Service']; keep the upstream type alias and do not restore the redundant interface."

[[patch]]
name = "fork-web-client-resilience"
subject = "fix(web): preserve client state across disruptions"
class = "divergence"
purpose = "Keep web session, stream, and navigation state predictable across disconnects and partial recovery."
retire_when = "Upstream provides equivalent client recovery semantics."
depends_on = ["fork-thread-lifecycle-recovery"]
roles = []

[[patch]]
name = "fork-web-project-scope"
subject = "feat(web): add multi-project scope controls"
class = "product"
purpose = "Provide multi-select, partial-state, and isolation controls for project scope."
retire_when = "never"
depends_on = ["fork-general-chat-projects"]
roles = []
[[patch.decision]]
id = "sidebarv2-project-scope"
date = "2026-07-28"
decided = "keep-multiselect"
decided_by = "brad"
issue = "http://git.home/brad/fork-decisions/issues/1"
rationale = "Upstream ships single-select projectScope while the fork provides checkbox partial states and isolation. Preserve the fork's multi-select behavior and port it onto upstream's current menu structure."
standing_policy = "Do not retire multi-select to upstream's single-select model. Re-escalate only if upstream removes projectScope entirely."
resolution_kind = "relocate"
status = "ported-and-uat-verified-2026-07-29"

[[patch]]
name = "fork-web-copy-thread-id"
subject = "feat(web): add Sidebar V2 copy thread ID"
class = "divergence"
purpose = "Expose a copy-thread-ID action in Sidebar V2 for operator workflows."
retire_when = "Upstream adds an equivalent discoverable copy action."
depends_on = ["fork-web-project-scope"]
roles = []

[[patch]]
name = "fork-web-image-timeout"
subject = "test(web): allow image compression boundary runtime"
class = "upstream-bound"
purpose = "Give the deterministic image compression boundary test enough time under parallel CI load."
retire_when = "Upstream speeds up the encoding walk or adopts a sufficient timeout."
depends_on = ["fork-build-workspace-tooling"]
roles = []
[[patch.decision]]
id = "stashimagecompression-timeout"
date = "2026-07-29"
decided = "adapt"
rationale = "The too-large boundary test repeatedly exceeded the default timeout under parallel hosted CI while passing in isolation. Accept the one-line upstream-file edit until the test becomes reliably faster."

[[patch]]
name = "fork-desktop-distribution"
subject = "feat(desktop): ship fork distribution channels"
class = "product"
purpose = "Ship fork branding, packaging, update channels, and desktop lifecycle integrations."
retire_when = "never"
depends_on = ["fork-build-workspace-tooling", "fork-thread-transfer"]
roles = []

[[patch]]
name = "fork-mobile-delivery"
subject = "feat(mobile): add EAS delivery lanes"
class = "product"
purpose = "Maintain fork mobile identity, EAS routing, widget identifiers, runtime policy, and delivery documentation."
retire_when = "never"
depends_on = ["fork-build-workspace-tooling"]
roles = []
note = "Keep mobile configuration as an overlay; replacing upstream's config can silently drop new native plugins."

[[patch]]
name = "fork-ci-runner-compat"
subject = "ci: support fork runner constraints"
class = "divergence"
purpose = "Adapt repository CI to the fork's available runners, mobile checks, and release smoke requirements."
retire_when = "Upstream CI supports the same runner and validation constraints."
depends_on = ["fork-build-workspace-tooling"]
roles = []

[[patch]]
name = "fork-ci-release-pipeline"
subject = "ci: publish fork release pipeline"
class = "product"
purpose = "Build and publish the fork's desktop, headless, updater, and mobile release lanes."
retire_when = "never"
depends_on = ["fork-desktop-distribution", "fork-mobile-delivery", "fork-ci-runner-compat"]
roles = ["release-workflow-owner"]
[[patch.decision]]
id = "release-version-stamps"
date = "2026-07-28"
decided = "narrow"
rationale = "Committed package versions are redundant because release automation derives them from the tag. Always take upstream versions during replay and keep generated stamps out of main."
[[patch.decision]]
id = "stamp-free-release-tags"
date = "2026-07-30"
decided = "tag-stamped-child-main-unstamped-parent"
rationale = "Both automatic release writers call prepare-release-tag, tag its prepared child, and keep main at the exact unstamped stack tip. Release consumes that bound tag and never finalizes versions onto main."
standing_policy = "Generated version stamps and release lockfile changes are tag-only."

[[patch]]
name = "fork-ci-upstream-sync"
subject = "ci: replay StGit stack onto upstream"
class = "product"
purpose = "Replay the ordered StGit series onto upstream releases and hand conflicts to the owning patch."
retire_when = "never"
depends_on = ["fork-ci-release-pipeline"]
roles = []
[[patch.decision]]
id = "queued-main-writer-start-binding"
date = "2026-07-30"
decided = "fail-stale-queued-checkouts"
issue = "brad/t3code-fork#2 comment 2757"
rationale = "A queued workflow may check out an older event SHA after another writer advances remote main. Bind every automatic writer's lease to its checked-out starting HEAD and fail before replay rather than adopting a newer remote lease."
standing_policy = "Never renew an automatic main writer's starting lease from the remote."

[[patch]]
name = "fork-ci-stgit-metadata"
subject = "fix(ci): publish StGit metadata with nightly replays"
class = "product"
purpose = "Publish the rendered stack and canonical StGit metadata together, including leased deletion of obsolete patch refs."
retire_when = "never"
depends_on = ["fork-ci-upstream-sync"]
roles = []
