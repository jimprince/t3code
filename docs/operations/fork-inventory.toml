[[patch]]
name = "fork-gitea-connections"
subject = "feat(source-control): configure Gitea instances and branch PR badges"
class = "upstream-bound"
purpose = "Configure environment-local Gitea hosts and protected tokens, resolve SSH aliases and ports to explicit web/API origins, and show repository-safe branch pull-request badges."
retire_when = "Upstream supports configured Gitea instances, secret-store tokens, and equivalent branch and repository identity filtering for PR badges."
depends_on = ["fork-unsupported-pr-hosts"]
roles = []
note = "Complete no-PR scans are cached for five minutes per instance, credentials, repository, branch, state and tip SHA; incomplete/error scans never become absence. Reorganized 2026-09-06 from fork-gitea-instance-pr-badges. [fork-gitea-instance-pr-badges] The unified PR cache key includes non-secret Gitea routing configuration, so adding or removing a configured host takes effect without waiting out the negative cache. Tokens never enter these keys. PR head identity is compared with the hosting provider’s selected target remote, including repositories whose sole remote is named gitea; a remote alias alone does not imply a cross-repository PR. Terminal Gitea PRs whose deleted head becomes refs/pull/N/head retain branch identity through head.label, with repository checks preserved."

[[patch.decision]]
id = "upstream-transactional-settings-secrets"
date = "2026-09-20"
decided = "adapt"
rationale = "Plan Gitea token writes and removals inside upstream's transactional settings-secret batch so response materialization or settings-file failures roll them back with provider and usage-limit secrets. Retire the eager Gitea-only persistence helper."

[[patch.decision]]
id = "upstream1895-source-control-selector-tests"
date = "2026-09-18"
decided = "relocate"
rationale = "Keep upstream's repository-selector compatibility cases and place the independent configured-Gitea remote cases after them; the shared source-control behavior does not overlap."

[[patch.decision]]
