# Fork Patch Inventory
#
# Every patch owes an answer to "why does this exist, and what would retire it?"
# A patch without a stated reason and an exit criterion is a defect, not merely
# undocumented.
#
# This file is the DURABLE RECORD. Decision issues (git.home/brad/fork-decisions)
# are the channel by which questions reach a human; the answers land HERE, keyed
# to the patch. A decision recorded only on an issue gets re-asked on the next
# sync — decision amnesia, the same disease as conflict amnesia.
#
# class:
#   product        Fork feature. Upstream will never want it. Never retires.
#   divergence     Compatibility/behaviour gap. Retires when upstream closes it.
#   upstream-bound A fix upstream should take. Retires when they adopt it.
#
# Read by agents during sync. Before resolving any conflict, check the owning
# patch here: a recorded decision is standing policy and must be followed, not
# re-litigated.

schema = 1
fork = "jimprince/t3code"
upstream = "pingdotgg/t3code"

# ---------------------------------------------------------------------------
# Patches, in stack order.
# ---------------------------------------------------------------------------

[[patch]]
name = "fork-t3-thread-operator-cli"
class = "product"
purpose = "The t3-thread operator CLI. Does not exist upstream at all."
retire_when = "never"
surface = "67 additive files, 0 modified"
note = "The model patch: zero conflict cost, forever. Replayed clean through every sync measured."

[[patch]]
name = "fork-build-and-release-tooling"
class = "product"
purpose = "Fork build, packaging and release scripts; sync/patch-set tooling."
retire_when = "never"
note = "pnpm-lock.yaml is NEVER textually merged — take upstream's and regenerate (invariant I3)."
status = "lockfile-regenerated-2026-07-28"
lockfile_done = "Resolved 2026-07-28: pnpm install added the apps/t3-thread importer (+522/-77; deletions are peer-suffix re-keying only, no version changes) and the delta was folded into this patch with stg refresh -p. Original finding: pnpm-lock.yaml is currently byte-identical to upstream, but pnpm-workspace.yaml's apps/* glob makes apps/t3-thread a workspace member with ZERO lockfile entries. Any --frozen-lockfile install (CI) fails at install, before typecheck. Required: run pnpm install, verify the only lockfile delta is fork workspace entries, fold it into THIS patch with stg refresh."

