[[patch.decision]]
id = "gitea-get-request-construction"
date = "2026-09-16"
decided = "relocate"
rationale = "Move baseline authenticated GET request construction from the later PR-actions patch into this provider-owning patch. The connection and branch-badge path must execute independently; the later patch owns only POST bodies and pull-request actions."
[[patch.decision]]
