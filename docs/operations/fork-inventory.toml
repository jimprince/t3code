name = "fork-gitea-connections"
subject = "feat(source-control): configure Gitea instances and branch PR badges"
class = "upstream-bound"
purpose = "Configure environment-local Gitea hosts and protected tokens, resolve SSH aliases and ports to explicit web/API origins, and show repository-safe branch pull-request badges."
retire_when = "Upstream supports configured Gitea instances, secret-store tokens, and equivalent branch and repository identity filtering for PR badges."
depends_on = ["fork-unsupported-pr-hosts"]
roles = []
note = "Complete no-PR scans are cached for five minutes per instance, credentials, repository, branch, state and tip SHA; incomplete/error scans never become absence. Reorganized 2026-09-06 from fork-gitea-instance-pr-badges. [fork-gitea-instance-pr-badges] PR lookup and unsupported-host cache keys include non-secret Gitea routing configuration, so adding or removing a configured host takes effect without waiting out the negative cache. Tokens never enter these keys. PR head identity is compared with the hosting provider’s selected target remote, including repositories whose sole remote is named gitea; a remote alias alone does not imply a cross-repository PR. Terminal Gitea PRs whose deleted head becomes refs/pull/N/head retain branch identity through head.label, with repository checks preserved."
[[patch.decision]]
id = "upstream-forgejo-provider"
date = "2026-09-16"
decided = "adapt"
rationale = "Keep upstream's native Forgejo provider, discovery, icons and terminology alongside the fork's explicitly configured Gitea provider. Configured Gitea routes take precedence; unconfigured Forgejo and Gitea hosts retain upstream CLI discovery."
[[patch.decision]]
id = "gitea-provider-test-harness"
date = "2026-09-16"
decided = "relocate"
rationale = "Move the Gitea provider test harness setup and two truncated assertions from the later PR-actions patch into this provider-owning patch, so branch lookup and credential isolation are independently executable."
[[patch.decision]]
id = "gitea-get-request-construction"
date = "2026-09-16"
decided = "relocate"
rationale = "Move baseline authenticated GET request construction from the later PR-actions patch into this provider-owning patch. The connection and branch-badge path must execute independently; the later patch owns only POST bodies and pull-request actions."
[[patch.decision]]
id = "upstream-source-control-provider-contract"
date = "2026-09-16"
decided = "adapt"
rationale = "Implement explicit unavailable stubs for Gitea operations this patch does not yet own, and provide environment settings to the title-evaluation registry layer, satisfying upstream's complete provider service contract without stealing later PR-action behavior."

[[patch]]
name = "fork-gitea-pr-actions"
subject = "feat(source-control): create and check out Gitea pull requests"
class = "upstream-bound"
purpose = "Create and resolve Gitea pull requests, check out retained PR heads, retrieve fork clone URLs and default branches, and recognize Gitea templates and pasted URLs."
retire_when = "Upstream supports equivalent configured-instance Gitea create and checkout flows."
depends_on = ["fork-gitea-connections"]
roles = []
note = "Reorganized 2026-09-06 from fork-gitea-pr-actions."
[[patch.decision]]
id = "upstream-forgejo-reference-parser"
date = "2026-09-16"
decided = "retire"
rationale = "Retire the duplicate Gitea URL regex because upstream's generalized Forgejo pulls URL parser already accepts configured Gitea hosts and nested repository paths. Retain Gitea action tests against the shared parser."

[[patch]]
name = "fork-pr-project-exclusions"
subject = "feat(web): hide projects from the pull request list"
class = "product"
purpose = "Let operators keep whole projects out of the aggregated Pull Requests view, persistently and per environment, without giving up the single-project scope or any other filter."
retire_when = "Upstream ships equivalent multi-project exclusion in the Pull Requests view, with per-environment project identity and query-level narrowing."
depends_on = ["fork-pr-dismissal"]
roles = []
note = "Reorganized 2026-09-06 from fork-pr-project-exclusions. [fork-pr-project-exclusions] Hidden projects are keyed by pullRequestProjectKey (environment plus project id) and stored under t3.pullRequests.excludedProjects:<environmentId>, so one server's id can never hide another server's project. The exclusion is applied AFTER assignProjectsToEnvironments has settled which server lists each repository: dropping a hidden project before that decision would hand the repository to another server holding a copy and the rows would come straight back. Rows are also filtered locally, because an answer already in flight, or a hiding made before the workspace reported its projects, still arrives. A single-project scope wins over hiding, so a project asked for by name is answered whole."
[[patch.decision]]
id = "upstream-pr-dismissal-toolbar"
date = "2026-09-16"
decided = "adapt"
rationale = "Share upstream-adapted local-storage decoding with project exclusions, apply both row filters in one memo, and extend the existing dismissal toolbar with hidden-project restoration without changing its selection behavior."

[[patch]]
name = "fork-headless-delivery"
subject = "feat(server): deliver and update the headless Linux server"
class = "product"
purpose = "Build the Linux headless artifact and provide service-managed update discovery, installation, health checks, restart, and rollback with an authenticated immediate update check."
retire_when = "Upstream or maintained shared tooling provides an equivalent headless artifact and update workflow."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "Automatic upgrades check active and queued work before download and before promotion, defer with a retry marker, and require explicit manual --force to bypass activity checks or escalate SIGKILL. Reorganized 2026-09-06 from fork-headless-updates. The unattended updater preserves an explicit PATH runtime and falls back to ~/.local/node/bin under cron; fail before downloading when Node is unavailable (Gitea29). Release smoke now starts the unpacked server against frozen historical databases and verifies migrated state plus restart, in addition to empty-data startup."
[[patch.decision]]
id = "upstream-headless-delivery"
date = "2026-09-16"
decided = "retain"
rationale = "Upstream does not provide the fork's service-managed headless Linux artifact, authenticated update check, idle-aware promotion and rollback workflow, or historical-database release smoke coverage."

[[patch]]
name = "fork-desktop-delivery"
subject = "feat(desktop): deliver the fork desktop app with its own identity and updates"
class = "product"
purpose = "Ship fork desktop identity, flavors, code signing, isolated app data, updater channels, packaging, and desktop lifecycle integrations such as deep links."
retire_when = "Upstream or maintained shared tooling provides equivalent fork identity, signing, and update-channel handling."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "Reorganized 2026-09-06 from fork-desktop-distribution. The packaged Linux portal identity fixture retains the fork desktop-entry name when upstream changes its own identity."
[[patch.decision]]
id = "upstream-desktop-delivery"
date = "2026-09-16"
decided = "adapt"
rationale = "Preserve upstream preview-channel isolation, remote-only startup, OTLP defaults, macOS passkey signing, and WSL runtime packaging while retaining fork identity, fork-nightly channel recognition, updater publication, deep links, and release packaging."

[[patch]]
name = "fork-mobile-delivery"
subject = "feat(mobile): add EAS delivery lanes"
class = "product"
purpose = "Maintain fork mobile identity, EAS routing, widget identifiers, runtime policy, and delivery documentation."
retire_when = "Upstream or maintained shared tooling provides equivalent capabilities, or the fork intentionally stops requiring this concern."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "Removed the retired mobile-track controller, resolver and service template after caller checks (including no installed controller or container on the dev VM). Mobile project grouping/sorting is owned by project selection."
[[patch.decision]]
id = "upstream-mobile-production-delivery"
date = "2026-09-16"
decided = "retire"
rationale = "Retire this patch's older production EAS workflow because upstream now preserves version overrides and preview profiles, auto-submits store builds, reconciles per-platform builds on push, and fingerprint-gates OTA publication. Retain the fork-specific identity, development lanes, runtime policy, tests, and deployment documentation."

[[patch]]
name = "fork-release-publication"
subject = "ci: publish fork releases with version stamping and notes"
class = "product"
purpose = "Build and publish the fork's desktop, headless, updater, and mobile release lanes with tag-only version stamping, bounded CI evidence reuse, and rendered release notes."
retire_when = "Upstream or maintained shared tooling provides equivalent release publication for the fork."
depends_on = [
  "fork-desktop-delivery",
  "fork-mobile-delivery",
  "fork-headless-delivery",
  "fork-build-ci-compat",
]
roles = ["release-workflow-owner"]
note = "Release notes compare stable authored change IDs between actual released tags, list fork features/fixes/removals before upstream changes, and preserve popup order. Published entries remain history; later fixes get new IDs. Bun and strict entry validation are configured in publication; Knip recognizes the shell-launched renderer entry point. Both macOS and Linux release jobs require packaged historical-data startup before publication. macOS uses the built zip backend in Electron Node mode; source-only or empty-data checks cannot substitute."
[[patch.decision]]
id = "release-version-stamps"
date = "2026-07-28"
decided = "narrow"
rationale = "Committed package versions are redundant because release automation derives them from the tag. Always take upstream versions during replay and keep generated stamps out of main."
[[patch.decision]]
id = "stamp-free-release-tags"
date = "2026-07-30"
decided = "tag-stamped-child-main-unstamped-parent"
rationale = "Both automatic release writers call prepare-release-tag, tag its prepared child, and keep main at the exact unstamped stack tip. Release consumes that bound tag and never finalizes versions onto main."
standing_policy = "Generated version stamps and release lockfile changes are tag-only."
[[patch.decision]]
id = "reuse-exact-source-ci-tests"
date = "2026-09-05"
decided = "narrow"
rationale = "Reuse successful main-push CI tests only for the exact release commit or its verified version-only direct parent. Require all test shards, check and release smoke jobs from that attempt; bound waiting and fall back to full release tests without trustworthy evidence. Reuse formatting, lint, Knip, types and tests only under that same exact-source evidence. Always verify packaged artifacts; missing evidence runs the complete shared source gate."
[[patch.decision]]
id = "upstream-release-publication-expansion"
date = "2026-09-16"
decided = "narrow"
rationale = "Keep the fork's leased tag-stamped-child publication model and intentional macOS-arm64 plus Linux-headless matrix instead of upstream npm, AUR, hosted-web, Discord, preview, and six-platform publication. Preserve upstream preview-tag parsing and unrelated Knip entry points alongside fork-nightly ordering and fork release-note tooling."
[[patch.decision]]
id = "release-test-git-fixture"
date = "2026-09-16"
decided = "relocate"
rationale = "Move the shared Git fixture from the later maintenance patch into release publication because release-tag, lease, CI-reuse, and release-note tests import it and must execute independently at this layer."

[[patch]]
name = "fork-maintenance-automation"
subject = "chore(fork): automate StGit stack maintenance and upstream replay"
class = "product"
purpose = "Route maintainers and agents through the StGit policy, validate and publish the stack with immutable leases and atomic metadata, replay the series onto upstream automatically, and hand conflicts to the owning patch."
retire_when = "Upstream or maintained shared tooling provides equivalent maintained-fork automation, or the fork intentionally stops requiring this concern."
depends_on = ["fork-release-publication", "fork-build-ci-compat"]
roles = ["agent-docs-owner"]
note = "Requires authored release entries for user-visible changes and validates them before publication. CI and automatic repair share verify-source checks including Knip; verify-stgit-replay adds installation and immutable stack validation. Server verification stops scheduling tests after the first failure; passing candidates still run the full suite. Independent verification stages collect failures in one pass without weakening the publication gate. Nightly release-tag discovery uses a constant number of Git processes and aborts on lookup failure. Removed unused subject-based metadata reconstruction and obsolete maintenance plans; leased publication remains authoritative. Retiring persisted functionality requires an explicit data transition, immutable shipped migration IDs and frozen historical upgrade coverage. Review also checked snapshot plumbing, diagnostics and obsolete mobile controller removals: these did not remove persisted orchestration event types. Retry limits remain unchanged pending genuine unattended observations."
[[patch.decision]]
id = "queued-main-writer-start-binding"
date = "2026-07-30"
decided = "fail-stale-queued-checkouts"
issue = "brad/t3code-fork#2 comment 2757"
rationale = "A queued workflow may check out an older event SHA after another writer advances remote main. Bind every automatic writer's lease to its checked-out starting HEAD and fail before replay rather than adopting a newer remote lease."
standing_policy = "Never renew an automatic main writer's starting lease from the remote."
[[patch.decision]]
id = "nightly-net-source-change"
date = "2026-09-05"
decided = "narrow"
rationale = "Gate fork-only nightlies on the exact push-before and push-after packaged-source trees, not replayed commit history. Unknown history and manual dispatch retain the release path. Atomic main/tag publication removes the old 30-second visibility delay."

[[patch.decision]]
id = "mechanical-replay-and-reliability-measurement"
date = "2026-09-09"
decided = "narrow"
rationale = "Remove generated lockfile content from replay input and regenerate at the full tip; move fork task routes into an additive index. Measure per-target delivery, intervention and conflict exposure from retained evidence instead of inferring success from healthy polling."
[[patch.decision]]
id = "upstream-maintained-fork-automation"
date = "2026-09-16"
decided = "retain"
rationale = "Upstream does not provide the fork's concern-driven StGit replay, leased atomic publication, immutable snapshots, conflict handoff, fork reliability measurement, or agent maintenance policy. The shared Git fixture is omitted here after relocation to release publication."

[[patch.decision]]
id = "stgit-conflict-exit-status"
date = "2026-09-16"
decided = "adapt"
rationale = "Normalize replay failures that leave unmerged files to the driver's stable semantic-conflict status while preserving StGit's raw status for non-conflict failures; StGit 2.6.1 reports merge conflicts with exit 3 rather than the earlier exit 1."

[[patch]]
name = "fork-gitea-pr-browser"
subject = "feat(pull-requests): browse Gitea reviews and CI checks"
class = "upstream-bound"
purpose = "Browse configured Gitea pull requests, descriptions, changed code, conversations, reviews, commits and CI checks through the shared pull-request browser."
retire_when = "Upstream supports equivalent configured-instance Gitea browsing with truthful CI status and capability-gated actions."
depends_on = ["fork-gitea-connections", "fork-gitea-pr-actions"]
roles = []
note = "Read-only browser; create and checkout remain in the source-control concern. Reuses the configured HTTP transport without redirects or credential-bearing errors. No checks is unknown, never success. Test services are provided together to preserve their shared lifecycle."
[[patch.decision]]
id = "upstream-forgejo-pr-provider"
date = "2026-09-16"
decided = "retain"
rationale = "Upstream's native Forgejo provider is CLI-backed and does not replace browsing pull requests on configured Gitea instances through the fork's token-aware HTTP transport. Keep Gitea as a separate registry provider alongside Forgejo."

[[patch]]
name = "fork-auth-session-refresh"
subject = "feat(auth): refresh operator sessions"
class = "product"
purpose = "Rotate valid bearer operator sessions before expiry so unattended t3-thread commands and notification delivery do not require monthly re-pairing."
retire_when = "Upstream provides equivalent authenticated session rotation and t3-thread renewal behavior."
depends_on = ["fork-worker-operations"]
roles = []
note = "Refresh is limited to unexpired bearer access tokens. Older servers and transient failures warn once and continue with the existing token; expired credentials still require pairing."

[[patch.decision]]
id = "upstream-environment-capability-expansion"
date = "2026-09-16"
decided = "adapt"
rationale = "Preserve upstream's projectCloneTracking capability alongside the fork's independent sessionRefresh capability. Upstream still lacks authenticated bearer-session rotation and t3-thread renewal behavior."
