date = "2026-09-16"
decided = "relocate"
rationale = "Move the Gitea provider test harness setup and two truncated assertions from the later PR-actions patch into this provider-owning patch, so branch lookup and credential isolation are independently executable."
[[patch.decision]]
id = "gitea-get-request-construction"
date = "2026-09-16"
decided = "relocate"
rationale = "Move baseline authenticated GET request construction from the later PR-actions patch into this provider-owning patch. The connection and branch-badge path must execute independently; the later patch owns only POST bodies and pull-request actions."
[[patch.decision]]
id = "gitea-linked-pr-canonical-refresh"
date = "2026-09-19"
decided = "adapt"
rationale = "Generate configured Gitea links with /pulls/ and let the normal linked-PR sync persist the provider's canonical URL together with current state, repairing previously saved /pull/ links and stale open snapshots."
[[patch.decision]]
id = "upstream-source-control-provider-contract"
date = "2026-09-16"
decided = "adapt"
rationale = "Implement explicit unavailable stubs for Gitea operations this patch does not yet own, and provide environment settings to the title-evaluation registry layer, satisfying upstream's complete provider service contract without stealing later PR-action behavior."

[[patch]]
name = "fork-gitea-pr-actions"
subject = "feat(source-control): create and check out Gitea pull requests"
class = "upstream-bound"
purpose = "Create and resolve Gitea pull requests, check out retained PR heads, retrieve fork clone URLs and default branches, and recognize Gitea templates and pasted URLs."
retire_when = "Upstream supports equivalent configured-instance Gitea create and checkout flows."
depends_on = ["fork-gitea-connections"]
roles = []
note = "Reorganized 2026-09-06 from fork-gitea-pr-actions. Numeric linked-PR targets require a known provider on the thread project host; cross-host or unknown-provider targets require a canonical URL instead of inventing a GitHub route."
[[patch.decision]]
id = "upstream-forgejo-reference-parser"
date = "2026-09-16"
decided = "retire"
rationale = "Retire the duplicate Gitea URL regex because upstream's generalized Forgejo pulls URL parser already accepts configured Gitea hosts and nested repository paths. Retain Gitea action tests against the shared parser."

[[patch]]
name = "fork-pr-project-exclusions"
subject = "feat(web): hide projects from the pull request list"
class = "product"
purpose = "Let operators keep whole projects out of the aggregated Pull Requests view, persistently and per environment, without giving up the single-project scope or any other filter."
retire_when = "Upstream ships equivalent multi-project exclusion in the Pull Requests view, with per-environment project identity and query-level narrowing."
depends_on = ["fork-pr-dismissal"]
roles = []
note = "Reorganized 2026-09-06 from fork-pr-project-exclusions. [fork-pr-project-exclusions] Hidden projects are keyed by pullRequestProjectKey (environment plus project id) and stored under t3.pullRequests.excludedProjects:<environmentId>, so one server's id can never hide another server's project. The exclusion is applied AFTER assignProjectsToEnvironments has settled which server lists each repository: dropping a hidden project before that decision would hand the repository to another server holding a copy and the rows would come straight back. Rows are also filtered locally, because an answer already in flight, or a hiding made before the workspace reported its projects, still arrives. A single-project scope wins over hiding, so a project asked for by name is answered whole."
[[patch.decision]]
id = "upstream-pr-dismissal-toolbar"
date = "2026-09-16"
decided = "adapt"
rationale = "Share upstream-adapted local-storage decoding with project exclusions, apply both row filters in one memo, and extend the existing dismissal toolbar with hidden-project restoration without changing its selection behavior."

[[patch]]
name = "fork-headless-delivery"
subject = "feat(server): deliver and update the headless Linux server"
class = "product"
purpose = "Build the Linux headless artifact and provide service-managed update discovery, installation, health checks, restart, and rollback with an authenticated immediate update check."
retire_when = "Upstream or maintained shared tooling provides an equivalent headless artifact and update workflow."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "The fork adapter delegates SEA and native dependency staging to upstream build-cli-archive, preserving the published asset name and bin/t3 service path. New archives need no host Node; the updater checks a transitional Node-based current release before promotion so rollback remains executable. Automatic upgrades check active and queued work before download and before promotion, defer with a retry marker, and require explicit manual --force to bypass activity checks or escalate SIGKILL. Health checks verify the selected release version and rollback verifies the previous version. Release smoke runs the unpacked launcher without PATH and verifies frozen historical migration, replay and restart. 2026-09-20: the adapter derives the node_modules it requires from upstream's runtime-external dependency list instead of a fixed set, after upstream 2005 dropped msgpackr-extract."
[[patch.decision]]
id = "upstream-headless-delivery"
date = "2026-09-16"
decided = "retain"
rationale = "Upstream does not provide the fork's service-managed headless Linux artifact, authenticated update check, idle-aware promotion and rollback workflow, or historical-database release smoke coverage."

[[patch]]
name = "fork-desktop-delivery"
subject = "feat(desktop): deliver the fork desktop app with its own identity and updates"
class = "product"
purpose = "Ship fork desktop identity, flavors, code signing, isolated app data, updater channels, packaging, and desktop lifecycle integrations such as deep links."
retire_when = "Upstream or maintained shared tooling provides equivalent fork identity, signing, and update-channel handling."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "Reorganized 2026-09-06 from fork-desktop-distribution. The packaged Linux portal identity fixture retains the fork desktop-entry name when upstream changes its own identity."
[[patch.decision]]
id = "upstream-update-disabled-reason-arg-shape"
date = "2026-09-26"
decided = "narrow"
rationale = "This patch had rewritten every field of getAutoUpdateDisabledReason's argument literal as readonly, which added no fork behavior and turned upstream's one-line isDebPackage addition into a whole-block conflict. Keep upstream's field lines verbatim and add only the fork's devFlavor field."

[[patch.decision]]
id = "upstream-desktop-delivery"
date = "2026-09-16"
decided = "adapt"
rationale = "Preserve upstream preview-channel isolation, remote-only startup, OTLP defaults, macOS passkey signing, and WSL runtime packaging while retaining fork identity, fork-nightly channel recognition, updater publication, deep links, and release packaging."
[[patch.decision]]
id = "upstream-effect-cli-literals"
date = "2026-09-20"
decided = "adapt"
rationale = "Use upstream's Effect CLI Literals constructor for both upstream build selectors and the fork desktop flavor selector."
[[patch.decision]]
id = "desktop-entry-name-unexport"
date = "2026-09-24"
decided = "adapt"
rationale = "This patch removes DesktopEnvironment's import of resolveLinuxDesktopEntryName, leaving DesktopEarlyElectronStartup as its only user, so the patch also un-exports it to keep Knip clean. Relocated here from fork-build-ci-compat."

[[patch]]
name = "fork-mobile-delivery"
subject = "feat(mobile): add EAS delivery lanes"
class = "product"
purpose = "Maintain fork mobile identity, EAS routing, widget identifiers, runtime policy, and delivery documentation."
retire_when = "Upstream or maintained shared tooling provides equivalent capabilities, or the fork intentionally stops requiring this concern."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "Removed the retired mobile-track controller, resolver and service template after caller checks (including no installed controller or container on the dev VM). Mobile project grouping/sorting is owned by project selection."
[[patch.decision]]
id = "upstream-mobile-production-delivery"
date = "2026-09-16"
decided = "retire"
rationale = "Retire this patch's older production EAS workflow because upstream now preserves version overrides and preview profiles, auto-submits store builds, reconciles per-platform builds on push, and fingerprint-gates OTA publication. Retain the fork-specific identity, development lanes, runtime policy, tests, and deployment documentation."

[[patch]]
name = "fork-release-publication"
subject = "ci: publish fork releases with version stamping and notes"
class = "product"
purpose = "Build and publish the fork's desktop, headless, updater, and mobile release lanes with tag-only version stamping, bounded CI evidence reuse, and rendered release notes."
retire_when = "Upstream or maintained shared tooling provides equivalent release publication for the fork."
depends_on = [
  "fork-desktop-delivery",
  "fork-mobile-delivery",
  "fork-headless-delivery",
  "fork-build-ci-compat",
]
roles = ["release-workflow-owner"]
note = "Release notes compare stable authored change IDs between actual released tags, list fork features/fixes/removals before upstream changes, and preserve popup order. Published entries remain history; later fixes get new IDs. Bun and strict entry validation are configured in publication; Knip recognizes the shell-launched renderer entry point. Both macOS and Linux release jobs require packaged historical-data startup before publication. macOS uses the built zip backend in Electron Node mode; source-only or empty-data checks cannot substitute."

[[patch.decision]]
id = "upstream2237-relay-tunnel-cleanup-runbook"
date = "2026-09-25"
decided = "retire"
rationale = "Upstream expanded its release runbook with managed-tunnel cleanup rollout and a disposable-host canary for the T3 Connect relay. The fork's runbook is a rewrite that carries no relay deployment section, and the fork does not deploy the relay, so the new procedure has nothing to attach to here."

[[patch.decision]]
id = "upstream-release-test-job-split"
date = "2026-09-24"
decided = "narrow"
rationale = "Upstream split its release test step into standalone test/test_server jobs gating its release job. The fork's preflight already runs the whole suite through scripts/ci/verify-source with bounded CI-evidence reuse, and it has no relay_public_config or per-platform desktop jobs, so those jobs and their gates do not apply; keep the fork's single preflight test step."

[[patch.decision]]
id = "release-draft-recovery"
date = "2026-09-19"
decided = "adapt"
rationale = "Upload assets before publishing both new and retried release drafts, then require public release metadata and all expected assets; an upload success alone left a green workflow with an unpublished draft."
[[patch.decision]]
id = "release-version-stamps"
date = "2026-07-28"
decided = "narrow"
rationale = "Committed package versions are redundant because release automation derives them from the tag. Always take upstream versions during replay and keep generated stamps out of main."
[[patch.decision]]
id = "stamp-free-release-tags"
date = "2026-07-30"
decided = "tag-stamped-child-main-unstamped-parent"
rationale = "Both automatic release writers call prepare-release-tag, tag its prepared child, and keep main at the exact unstamped stack tip. Release consumes that bound tag and never finalizes versions onto main."
standing_policy = "Generated version stamps are tag-only. Tag preparation preserves the verified source lockfile with frozen installs; dependency resolution belongs before source verification."
[[patch.decision]]
id = "reuse-exact-source-ci-tests"
date = "2026-09-05"
decided = "narrow"
rationale = "Reuse successful main-push CI tests only for the exact release commit or its verified version-only direct parent. Require all test shards, check and release smoke jobs from that attempt; bound waiting and fall back to full release tests without trustworthy evidence. Reuse formatting, lint, Knip, types and tests only under that same exact-source evidence. Always verify packaged artifacts; missing evidence runs the complete shared source gate."
[[patch.decision]]
id = "upstream-release-publication-expansion"
date = "2026-09-16"
decided = "narrow"
rationale = "Keep the fork's leased tag-stamped-child publication model and intentional macOS-arm64 plus Linux-headless matrix instead of upstream npm, AUR, hosted-web, Discord, preview, and six-platform publication. Preserve upstream preview-tag parsing and unrelated Knip entry points alongside fork-nightly ordering and fork release-note tooling."
[[patch.decision]]
id = "upstream-release-relay-state-read"
date = "2026-09-20"
decided = "retire"
rationale = "Do not transplant upstream's production relay-state read into the fork's intentionally narrow release workflow; the fork release builds do not consume that removed relay-public-config job."
[[patch.decision]]
id = "release-test-git-fixture"
date = "2026-09-16"
decided = "relocate"
rationale = "Move the shared Git fixture from the later maintenance patch into release publication because release-tag, lease, CI-reuse, and release-note tests import it and must execute independently at this layer."

[[patch.decision]]
id = "desktop-update-full-changelog"
date = "2026-09-24"
decided = "adapt"
rationale = "Show the full changelog in the desktop update popup: the release body lists every upstream subject instead of the newest 20, and the popup parser keeps every item and every release group (the popup already scrolls). The parser also stops at GitHub's rendered footer, where the compare URL has become 'Full Changelog: v1...v2' text and previously leaked in as a fake change."

[[patch]]
name = "fork-maintenance-automation"
subject = "chore(fork): automate StGit stack maintenance and upstream replay"
class = "product"
purpose = "Route maintainers and agents through the StGit policy, validate and publish the stack with immutable leases and atomic metadata, replay during upstream synchronization, and publish fork-feature pushes on the already integrated upstream base."
retire_when = "Upstream or maintained shared tooling provides equivalent maintained-fork automation, or the fork intentionally stops requiring this concern."
depends_on = ["fork-release-publication", "fork-build-ci-compat"]
roles = ["agent-docs-owner"]
note = "Requires authored release entries for user-visible changes and validates them before publication. CI owns the shared verify-source checks including Knip; verify-stgit-replay stages immutable source/metadata inputs and waits for exact candidate CI. Main and release dereference that evidence instead of rerunning source verification, retaining published-stack policy, transfer-report baselines and artifact checks. Server verification stops scheduling tests after the first failure; passing candidates still run the full suite. Independent verification stages collect failures in one pass without weakening the publication gate. Nightly release-tag discovery uses a constant number of Git processes and aborts on lookup failure. Removed unused subject-based metadata reconstruction and obsolete maintenance plans; leased publication remains authoritative. Retiring persisted functionality requires an explicit data transition, immutable shipped migration IDs and frozen historical upgrade coverage. Product-bug instructions require evidence for each reported symptom, including cross-project PR routing and existing saved links/snapshots. Review also checked snapshot plumbing, diagnostics and obsolete mobile controller removals: these did not remove persisted orchestration event types. Retry limits remain unchanged pending genuine unattended observations."

[[patch.decision]]
id = "upstream14025-verification-job-split"
date = "2026-10-01"
decided = "relocate"
rationale = "Upstream 6f8e2534f split CI's Check job into Lint, Typecheck and Build, moved the web suite into its own Test Web job, resharded the server tests to six, and added an aggregate job named Check for branch protection. Split verify-source to one phase per job, keeping check and test as the aggregates the complete-tip gate and the release fallback use, and move the candidate gate, the shared verification call and the source-identity step onto each new job. The aggregate Check job also accepts skipped jobs when candidate_ci reused evidence, since a promoted candidate deliberately skips them. Candidate evidence now reads its job list and per-job step from one exported table that the fixtures share, with a test that checks the list against the workflow, so the next rename or reshard fails locally instead of blocking publication after a CI round."

[[patch.decision]]
id = "upstream-restyle-ceiling-retired"
date = "2026-09-24"
decided = "retire"
rationale = "Upstream 361b047f5 dropped the secondary className props the ceiling policed and deleted both the lint:restyle-ceiling script and its CI step. Drop the mirrored call from verify-source; keeping it would fail every check phase on a missing script. Supersedes upstream-restyle-ceiling-check."
[[patch.decision]]
id = "upstream-restyle-ceiling-check"
date = "2026-09-22"
decided = "adapt"
rationale = "Upstream added a lint:restyle-ceiling step to the CI check block this patch replaces with one verify-source call. Fold the new check into the shared check phase so verify-source keeps mirroring upstream instead of silently dropping a gate; the fork tip sits at upstream's ceiling of 1207 findings."

[[patch.decision]]
id = "nightly-delivery-candidate-enforcement"
date = "2026-09-20"
decided = "adapt"
rationale = "Enforce existing exact candidate CI at the leased publisher for every changed source, including manual packaging repairs. Pin controller syncs to a public upstream tag and commit, and follow-up releases to the verified main and integrated base. Preserve a single stamped artifact build and existing protected publication."
[[patch.decision]]
id = "feature-push-integrated-base"
date = "2026-09-19"
decided = "separate-feature-release-from-upstream-migration"
rationale = "Feature publication releases reviewed integrated source; selecting the newest upstream nightly caused redundant migrations and repair dispatches. The exact-base tag selector and successful main-push CI evidence preserve ancestry without another replay."
standing_policy = "Only upstream synchronization selects a new upstream source. Feature pushes use the unique nightly tag at the current stack base, or fail/skip explicitly; immutable leases and atomic publication remain required."
[[patch.decision]]
id = "queued-main-writer-start-binding"
date = "2026-07-30"
decided = "fail-stale-queued-checkouts"
issue = "brad/t3code-fork#2 comment 2757"
rationale = "A queued workflow may check out an older event SHA after another writer advances remote main. Bind every automatic writer's lease to its checked-out starting HEAD and fail before replay rather than adopting a newer remote lease."
standing_policy = "Never renew an automatic main writer's starting lease from the remote."
[[patch.decision]]
id = "nightly-net-source-change"
date = "2026-09-05"
decided = "narrow"
rationale = "Gate fork-only nightlies on the exact push-before and push-after packaged-source trees, not replayed commit history. Unknown history and manual dispatch retain the release path. Atomic main/tag publication removes the old 30-second visibility delay."

[[patch.decision]]
id = "mechanical-replay-and-reliability-measurement"
date = "2026-09-09"
decided = "narrow"
rationale = "Remove generated lockfile content from replay input and regenerate at the full tip; move fork task routes into an additive index. Measure per-target delivery, intervention and conflict exposure from retained evidence instead of inferring success from healthy polling."
[[patch.decision]]
id = "upstream-maintained-fork-automation"
date = "2026-09-16"
decided = "retain"
rationale = "Upstream does not provide the fork's concern-driven StGit replay, leased atomic publication, immutable snapshots, conflict handoff, fork reliability measurement, or agent maintenance policy. The shared Git fixture is omitted here after relocation to release publication."

[[patch.decision]]
id = "stgit-conflict-exit-status"
date = "2026-09-16"
decided = "adapt"
rationale = "Normalize replay failures that leave unmerged files to the driver's stable semantic-conflict status while preserving StGit's raw status for non-conflict failures; StGit 2.6.1 reports merge conflicts with exit 3 rather than the earlier exit 1."

[[patch.decision]]
id = "candidate-evidence-publication-remote"
date = "2026-09-21"
decided = "adapt"
rationale = "Outside Actions the gate resolved GITHUB_REPOSITORY from a bare `gh repo view`, which prefers the `upstream` remote the replay driver adds, so host-side verification looked for the candidate in upstream's repository and reported no candidate CI run. Resolve it from the staging remote instead, matching the documented rule that evidence lookup uses the publication remote."

[[patch]]
name = "fork-gitea-pr-browser"
subject = "feat(pull-requests): browse Gitea reviews and CI checks"
class = "upstream-bound"
purpose = "Browse configured Gitea pull requests, descriptions, changed code, conversations, reviews, commits and CI checks through the shared pull-request browser."
retire_when = "Upstream supports equivalent configured-instance Gitea browsing with truthful CI status and capability-gated actions."
depends_on = ["fork-gitea-connections", "fork-gitea-pr-actions"]
roles = []
note = "Read-only browser; create and checkout remain in the source-control concern. Reuses the configured HTTP transport without redirects or credential-bearing errors. No checks is unknown, never success. Test services are provided together to preserve their shared lifecycle."
[[patch.decision]]
id = "upstream-forgejo-pr-provider"
date = "2026-09-16"
decided = "retain"
rationale = "Upstream's native Forgejo provider is CLI-backed and does not replace browsing pull requests on configured Gitea instances through the fork's token-aware HTTP transport. Keep Gitea as a separate registry provider alongside Forgejo."

[[patch]]
name = "fork-auth-session-refresh"
subject = "feat(auth): refresh operator sessions"
class = "product"
purpose = "Rotate valid bearer operator sessions before expiry so unattended t3-thread commands and notification delivery do not require monthly re-pairing."
retire_when = "Upstream provides equivalent authenticated session rotation and t3-thread renewal behavior."
depends_on = ["fork-worker-operations"]
roles = []
note = "Refresh is limited to unexpired bearer access tokens. Older servers and transient failures warn once and continue with the existing token; expired credentials still require pairing."

[[patch.decision]]
id = "upstream-environment-capability-expansion"
date = "2026-09-16"
decided = "adapt"
rationale = "Preserve upstream's projectCloneTracking capability alongside the fork's independent sessionRefresh capability. Upstream still lacks authenticated bearer-session rotation and t3-thread renewal behavior."

[[patch]]
name = "fork-codex-goal-visibility"
subject = "feat(codex): surface active goals in thread status"
class = "upstream-bound"
purpose = "Project Codex app-server native goal notifications into thread activity, reconnect-hydrated status, sidebar liveness, and a compact composer line without taking ownership of the goal lifecycle."
retire_when = "Upstream surfaces equivalent read-only native Codex goal status and liveness without the retired fork-owned goal compatibility schema."
depends_on = ["fork-provider-turn-safety"]
roles = []
note = "Read-only integration. Codex remains the sole owner of goal creation, editing, pausing, resuming, clearing, and continuation. Uses codexNativeGoal and thread.codex-native-goal.* identifiers to remain distinct from retired goal_json and thread.goal-set compatibility."
[[patch.decision]]
id = "upstream-background-banner-view-agents"
date = "2026-09-26"
decided = "adapt"
rationale = "Upstream added a View-agents shortcut beside the banner's Stop button. Keep it inside this patch's activeBackgroundLiveness-gated actions spread so a goal-only banner still renders no actions, and keep the fork's non-animated status dot."

[[patch.decision]]
id = "upstream-provider-event-type-removal"
date = "2026-09-20"
decided = "narrow"
rationale = "Keep upstream's removal of the redundant ProviderRuntimeEventType literal list; model Codex goal events only in their concrete schemas and the canonical ProviderRuntimeEventV2 union."

[[patch]]
name = "fork-inline-3d-objects"
subject = "feat(web): preview GLB and STL models inline"
class = "divergence"
purpose = "Preview bounded, validated GLB and STL files inline across web chat, attachment, workspace-file, and standalone assistant-link surfaces while native clients retain their download/open fallback."
retire_when = "Upstream provides equivalent secure, demand-rendered inline GLB and STL previews across the same attachment and workspace surfaces."
depends_on = ["fork-attachment-compatibility", "fork-remote-file-downloads"]
roles = []
note = "Shared model asset wrappers keep signed-URL, refresh, and download handling out of the markdown, timeline, and file-panel integration points. Reuses modern durable attachments and exact signed workspace-file assets. Model previews are limited to 50 MiB, 2 million triangles, 64 megapixels of embedded PNG/JPEG textures, two visible WebGL contexts, and no external resources, compression decoders, scripts, HTML, or animation playback. The lockfile delta is intentionally left for lockfile-owner to absorb."

[[patch.decision]]
id = "upstream12449-workspace-root-preview-path"
date = "2026-09-30"
decided = "adapt"
rationale = "Upstream commit 55ec55b1f resolves a workspace-root link to a null relativePath and gates the project-file read on relativePath !== null. That guard and this patch's !isModel guard suppress the read for different reasons, so both belong in the same condition; isModel already requires a non-null path, so reading the resolved path keeps model previews working for workspace links."

[[patch]]
name = "fork-orcaslicer-handoff"
subject = "feat(desktop): open model previews in OrcaSlicer"
class = "product"
purpose = "Hand validated STL preview bytes from local or remote environments to OrcaSlicer on the macOS client without exposing signed asset URLs or initiating slicing or printing."
retire_when = "Upstream provides an equivalent secure, client-local, user-initiated OrcaSlicer handoff for STL previews."
depends_on = ["fork-inline-3d-objects"]
roles = []
note = "The desktop stages private temporary STL files and invokes the named macOS application with fixed argument boundaries. GLB and non-desktop surfaces retain their existing download or local-open behavior."

[[patch]]
name = "fork-3mf-preview"
subject = "feat(models): preview 3MF files inline"
class = "product"
purpose = "Preview bounded 3MF packages inline across the existing model surfaces, preserve core materials and colors, apply declared units, and hand validated 3MF bytes to OrcaSlicer on macOS."
retire_when = "Upstream provides equivalent secure, demand-rendered 3MF previews and client-local OrcaSlicer handoff across the same surfaces."
depends_on = ["fork-inline-3d-objects", "fork-orcaslicer-handoff"]
roles = []
note = "Performs a central-directory-only ZIP preflight before inflation: at most 256 entries, 64 MiB per entry, 128 MiB total uncompressed, model/relationship/texture parts only, no nested archives or external relationships. Uses ThreeMFLoader lazily, retains the existing 50 MiB source, 2 million rendered-triangle, 64 megapixel texture, two-context, and demand-render limits, and normalizes the declared 3MF unit to millimeters before framing."

[[patch]]
name = "fork-step-preview"
subject = "feat(models): preview STEP files inline"
class = "product"
purpose = "Preview STEP and STP files across the existing model surfaces by tessellating locally in a lazy OpenCascade browser worker, and hand validated source bytes to OrcaSlicer on macOS."
retire_when = "Upstream provides equivalent bounded, demand-rendered STEP previews and client-local OrcaSlicer handoff across the same surfaces."
depends_on = ["fork-inline-3d-objects", "fork-orcaslicer-handoff", "fork-3mf-preview"]
roles = []
note = "Selected occt-import-js 0.0.23 after the production build measured its WASM at 3,091,498 bytes gzip -9 and its worker at 21,109 bytes gzip, with tessellation at 1,828 ms for a 442 KiB assembly and 2,048 ms for a 2 MiB transfer form. It loads only in a disposable browser worker with a 20-second timeout, fixed millimeter output and deflection, finite/index validation, and the shared 50 MiB source and 2-million-triangle limits. No server conversion, cache, or broader asset grant is introduced."

[[patch]]
name = "fork-enter-sends-queued"
subject = "feat(web): send the next queued message with Enter"
class = "product"
purpose = "Let Enter on an empty composer send the oldest queued message now through the existing Send now path, so Enter once queues and Enter again sends."
retire_when = "Upstream sends the next queued message from an empty-composer Enter, or the fork stops wanting that shortcut."
depends_on = []
roles = []
note = "Send now delivers the message into the running turn (steer); it does not stop the turn. A hard stop-then-send was deferred because Stop deliberately returns the queue to the composer. The decision lives in the additive apps/web/src/queuedMessageEnter.ts; ChatView keeps only the call in onSend's empty-draft branch."

[[patch.decision]]
id = "upstream13764-empty-enter-drops-the-queued-send-guard"
date = "2026-09-27"
decided = "narrow"
rationale = "Upstream moved queued sending into QueuedMessageSender/sendQueuedMessage, so the composer submit handler no longer receives a queuedMessage and can never itself be a queued send. Drop the helper's sendingQueuedMessage input and its case rather than feeding it a constant false; the remaining guards are the composer's own content and expired terminal contexts."

[[patch]]
name = "fork-restart-when-idle"
subject = "feat(desktop): restart for updates when local agents finish"
class = "product"
purpose = "Let the desktop restart button wait until agents hosted by this desktop app finish, then restart into the downloaded update without interrupting their work."
retire_when = "Upstream offers a deferred restart that waits for local agent work, or the fork stops wanting it."
depends_on = []
roles = []
note = "Idle means no desktop-hosted thread (primary or desktop-local secondary) is running, starting, background-working, monitoring, or holding non-held queued messages, for 15 seconds. Pending approvals and questions deliberately do not block by owner decision: they can wait indefinitely, and the thread survives while the stale prompt is released. Remote environments are ignored because a desktop restart does not stop them. The schedule is in-memory and the watcher is mounted at AppRoot; the rules live in apps/web/src/components/sidebar/desktopIdleRestart.logic.ts."

[[patch]]
name = "fork-nested-threads"
subject = "feat(threads): nest threads under an orchestrating thread"
class = "product"
purpose = "Let a thread nest under an orchestrating thread so it appears in the parent's Agents panel, with cross-project workers also indented in the sidebar, move threads in and out of nesting, default t3-thread workers to nest under their caller, and let parents answer their workers' questions and approvals from the CLI."
retire_when = "Upstream provides persistent parent/child thread placement with an equivalent Agents-panel view and CLI escalation, or the fork stops wanting orchestrator nesting."
depends_on = ["fork-worker-operations"]
roles = []
note = "parentThreadId is an optional thread field (fork migration 6, projection_threads.parent_thread_id) set at creation or by thread.parent.set, which emits thread.meta-updated so older clients ignore it; existing flat rows stay valid as NULL and need no new migration. Servers advertise threadNesting on the environment descriptor, which is where t3-thread reads it (serverGetConfig does not carry it). The original one-level cap was lifted because delegated callers can themselves orchestrate workers; ancestor-chain validation preserves the actual invariant, an acyclic tree, without flattening ownership or routing notifications past the direct caller. Nesting supports arbitrary acyclic depth within one environment; children retain their own execution project; the decider rejects self, descendants, cyclic, missing, and archived parents. Cross-project children show their own project label. Children of an archived, missing, hidden, or filtered parent show at top level in their own project. Parent lifecycle changes never cascade to children. The parent's sidebar row rolls up all descendants' approvals, questions, and working or monitoring state. Nested attention remains visually surfaced but never plays completion or attention sounds; only top-level work makes notification sounds. Desktop and web only; mobile lists every thread until a follow-up. t3-thread nests workers directly under the caller at every depth, and pending/answer/approve/deny let the parent escalate instead of the user."

[[patch.decision]]
id = "agents-panel-settled-shelf"
date = "2026-09-29"
decided = "extract-to-additive"
rationale = "Nested threads leave the sidebar, so the parent's Agents panel is their only shelf and must honor the server lifecycle, including automatic settlement. Threads, workflow runs and direct spawns share one start-ordered list and one collapsed Settled shelf (settled threads; terminal spawns and workflows; idle spawns stay active because they can resume), so this concern owns the whole list instead of a second patch stacking edits on the same AgentsPanel.tsx render block. AgentsPanelEntries.tsx and agentsPanelShelf.logic.ts are additive; AgentsPanel.tsx only hands over upstream's WorkflowSection and AgentRow renderers and drops the footer's settled count, which the shelf header now carries. Rows seen active stay in place until the panel remounts, matching upstream's rule that completion never moves rows under the reader."

[[patch.decision]]
id = "upstream2237-design-token-scale"
date = "2026-09-25"
decided = "adapt"
rationale = "The nested-thread rows used text-[.7rem] and text-[.65rem], now errors under shadcn(no-arbitrary-values). Take the nearest new tokens: text-2xs (11px) for the row metadata and text-3xs (10px) for the section label."

[[patch]]
name = "fork-resume-background-work"
subject = "feat(server): resume monitors and background agents after restarts"
class = "product"
purpose = "When Continue threads after restarts is on, tell each agent which monitors and background agents a server restart stopped so it can relaunch what it still needs, and stop monitoring-only threads from delaying the desktop's restart when agents finish."
retire_when = "Upstream restores or re-arms provider background work across server restarts, or the fork stops wanting it."
depends_on = ["fork-restart-when-idle"]
roles = []
note = "Runtime ingestion mirrors each thread's live background tasks (ThreadBackgroundLiveness agents and monitors, with descriptions) into fork_thread_background_work (fork migration 7) whenever the set changes, and deletes the row when the work ends or the session exits. Shutdown closes the reactor scope before ProviderService.stopAll, so a graceful restart keeps the rows and a crash keeps the last written state. reconcileProviderSessions takes every row once: mid-turn continuations get the notice appended to their prompt (and use it instead of promptless continuation), and idle threads with a resume cursor get the notice as a new turn, gated by the per-project continueThreadsAfterServerUpdate setting. Servers advertise backgroundWorkResume; the desktop idle restart lets monitoring-only threads through only where that capability and setting apply."

[[patch]]
name = "fork-overnight-updates"
subject = "feat(desktop): install updates overnight and roll back failed ones"
class = "product"
purpose = "Download and install desktop updates overnight or after configurable daytime system idle once local agents and the user are idle, and restore the previous macOS app when an installed update never reports healthy."
retire_when = "Upstream installs desktop updates unattended with automatic rollback, or the fork stops wanting it."
depends_on = ["fork-desktop-delivery", "fork-restart-when-idle"]
roles = []
note = "The renderer watcher (desktopOvernightUpdate.tsx, mounted at AppRoot) downloads an available update at night and installs a downloaded one after five quiet minutes plus the idle-restart grace, using the idle-restart agent count; overnight steps retain once-per-version-per-night retries. Install updates when idle defaults on with a 15-minute threshold in the updates settings; the same watcher polls system idle seconds through getUpdateState, requires the existing agent-idle count and quiet window, and passes the version and threshold through installUpdate for a fresh Electron powerMonitor check before admission. Daytime installs are attempted once per version, and turning the setting off preserves overnight-only behavior. On a packaged macOS .app, DesktopUpdates arms DesktopUpdateRollback before every quitAndInstall, manual or automatic: ditto --clone copies the bundle to userdata/update-rollback/previous-app and a detached sh watchdog starts. Each launch writes healthy-version once the primary backend is ready (at once without a local environment). After 120 five-second waits without the expected version, the watchdog stops processes running from the bundle, restores the copy, reopens it, and writes rolled-back.json; that version is then ignored as an update and reported once by notification. A failed quitAndInstall disarms. Rollback restores the app only, not state the new version migrated. Linux servers already get the same behavior from scripts/headless-auto-upgrade.sh."

[[patch.decision]]
id = "health-marker-wait-reads-content"
date = "2026-09-30"
decided = "adapt"
rationale = "The rollback coverage waited for the healthy-version marker with existsSync, but writeText is a plain writeFile that creates the file before its bytes land, so a loaded runner read an empty marker and the case failed with expected '' to equal '1.2.3' in candidate CI while passing locally. Wait for the written version instead. Production keeps the plain write: the watchdog already re-reads the marker with cat on every five-second attempt."

[[patch]]
name = "fork-spawn-budget"
subject = "fix(server): prevent background process launch storms"
class = "upstream-bound"
purpose = "Suppress repeated missing executable launches, share provider refinement across repository PR links, pace background process attempts, and expose direct launch counts without sampling subprocesses."
retire_when = "Upstream caches missing executables and explicit provider discovery, bounds background launch attempts, and exposes equivalent launch diagnostics."
depends_on = ["fork-gitea-connections", "fork-unsupported-pr-hosts"]
roles = []
note = "The shared runner caches ENOENT only when executable resolution confirms absence, keyed by executable environment and provider settings generation. Successful PATH resolutions are reused. Explicit provider contexts include cwd, remote, requested authority, and settings/environment in a single-flight cache; each PR sweep retains refinements until all its repository groups complete. PR sweeps and periodic VCS refreshes opt into a shared five-attempts/second limit; interactive work keeps its own deadlines. Last-minute executable counters cover ProcessRunner's direct spawn calls, not vendor descendants or all host processes. The existing root resolver already caches null roots for one minute. Internal VcsProcess Git calls resolve once per executable environment to a path outside agent safety wrapper directories, preferring system Git on macOS and rejecting wrapper symlink aliases; agent shells retain their PATH."

[[patch.decision]]
id = "upstream14673-sweep-scope"
date = "2026-10-02"
decided = "adapt"
rationale = "Upstream 10ac2f2ba replaced the sweep's per-key argument with a scope plus the shared requested map so a burst of links shares one batched summary read. Gate the fork's repository grouping on that scope instead, and keep the two-repository/four-group pacing: batched GraphQL cuts host calls but still leaves the sweep free to spawn 25 processes at once, which is the launch storm this concern bounds."

[[patch]]
name = "fork-t3-thread-prebuilt"
subject = "perf(t3-thread): run prebuilt commands and back off idle watchers"
class = "divergence"
purpose = "Reduce operator CLI launches through explicit prebuilt JavaScript, restart managed watchers on verified snapshot promotion, preview dependency commands from the exact deployment ref, optionally retain predecessor and failed snapshots for rollback, protect runtimes still used by leased watchers during pruning, and reduce watcher reads through shared polling, parked stale sources, and idle backoff."
retire_when = "The worker operator CLI supplies equivalent prebuilt launch and adaptive polling behavior."
depends_on = ["fork-worker-operations"]
roles = []

[[patch]]
name = "fork-cross-project-thread-nesting"
subject = "feat(threads): nest workers across projects"
class = "product"
purpose = "Place workers from different repositories under a supervisor while retaining each child's own project and execution workspace."
retire_when = "Upstream supports cross-project nesting with independent execution workspaces and reachable fallback placement, or cross-project supervision is no longer wanted."
depends_on = ["fork-nested-threads"]
roles = []
note = "Parentage only controls placement and attention rollup in the same environment. The child's project controls execution, defaults, search, and project filters. Cross-project children remain visible with their project label; an unreachable parent returns them to top level. Parent archive, settlement, and project deletion do not cascade across projects. Mobile retains its existing flat project-owned listing."

[[patch]]
name = "fork-launch-health"
subject = "feat(diagnostics): warn before macOS process launches stall"
class = "product"
purpose = "Sample macOS syspolicyd through the existing native helper, record bounded runner attempt/failure rates and expose configurable early warnings in web, desktop and mobile Diagnostics."
retire_when = "Upstream provides equivalent native daemon and launch-rate health warnings."
depends_on = ["fork-resource-recovery", "fork-spawn-budget"]
roles = []
note = "No sampling subprocesses or automatic daemon recovery. Counts cover the shared process runner, excluding vendor descendants and direct SDK spawns."

[[patch]]
name = "fork-notification-preferences"
subject = "feat(t3-thread): control worker notification preferences"
class = "product"
purpose = "Choose per-route notification levels, suppress quiet or directly reported completions, and collapse repeated identical worker errors."
retire_when = "Upstream or shared worker tooling offers equivalent notification preference and deduplication behavior."
depends_on = ["fork-worker-operations"]
roles = []

[[patch]]
name = "fork-sidebar-agent-visibility"
subject = "feat(web): show active sub-agents in the sidebar"
class = "product"
purpose = "Show active nested workers on their parent's thread-list row and expand or collapse reachable child threads with remembered device-local state."
retire_when = "Upstream provides active nested-worker counts and remembered expandable sidebar placement, or the fork stops showing nested workers."
depends_on = ["fork-nested-threads"]
roles = []
note = "Expanded rows recursively render direct children at a compact 12px indent per level. Active counts include all reachable descendants, pinned siblings sort first, and branches containing activity sort before other quiet branches while preserving creation order within each group. A collapsed ancestor retains the path to the open descendant and to any pinned descendant, so a nested pin remains hierarchical instead of being duplicated in the top-level Pinned shelf. Child rows reuse ordinary sidebar status labels; a running turn is only a fallback when session state is absent, because a stopped session is authoritative over a stale running turn. An idle, unsettled parent with active descendants reads Supervising across client thread lists; settled parents keep their settled presentation while existing descendant counts and attention remain visible. The web row reserves a stable trailing status/action slot so hover controls and live labels cannot move the active-count control. The active-count control remains expand/collapse rather than introducing a separate filter mode."

[[patch]]
name = "fork-child-input-attention"
subject = "feat(threads): separate child input attention from parent status"
class = "product"
purpose = "Keep parent status independent, expose waiting child input, and remind subscribed parents while questions remain pending."
retire_when = "Upstream provides independent parent status, child attention navigation and configurable unanswered-question reminders."
depends_on = ["fork-notification-preferences", "fork-sidebar-agent-visibility"]
roles = []
note = "Replaces sidebar child-state rollup with separate child input markers. Input counts recurse through every reachable descendant, so both roots and collapsed nested parents state how many sub-agents need input. Reminders use existing direct-caller subscriptions and confirmed-delivery history, with no new polling process."

[[patch]]
name = "fork-agent-panel-thread-details"
subject = "feat(web): show detailed nested thread activity in Agents panel"
class = "product"
purpose = "Give nested worker rows output, state, model, provider, metrics, duration, activity and workspace context without full-history subscriptions."
retire_when = "Upstream shows equivalent nested-worker details through bounded shell data."
depends_on = ["fork-nested-threads", "fork-child-input-attention"]
roles = []
note = "Optional derived metadata preserves old-server compatibility. Ordinary top-level shells omit summaries, and nested output is bounded to its first 320 characters."

[[patch]]
name = "fork-sidebar-drag-to-nest"
subject = "feat(web): drag threads to nest them"
class = "product"
purpose = "Let web and desktop users nest threads directly through the existing sidebar drag interaction."
retire_when = "Upstream supports drag-to-nest with cycle-safe parent assignment and an equivalent accessible menu action."
depends_on = ["fork-cross-project-thread-nesting", "fork-sidebar-agent-visibility"]
roles = []
note = "Dragging defaults to reorder. An eligible row becomes a nesting target only after the pointer moves right by one existing 12px child indent; returning within half an indent restores reorder without boundary flicker. Reorder shows a full-width insertion line, while nesting highlights the parent and shows an indented child-depth marker. Parent assignment uses the same thread.parent.set action and candidate rules as the context menu. Nesting preserves the dragged thread's own pin, while a section drop moves it to the top level and lets Pinned or Active set that state. Nested rows are drag sources, reorder only inside their matching pinned or unpinned sibling bucket, and never duplicate into the top-level Pinned shelf."

[[patch]]
name = "fork-worker-inactivity"
subject = "feat(t3-thread): alert supervisors when active workers go quiet"
class = "product"
purpose = "Offer opt-in per-subscription attention alerts after an active worker stops producing observable provider, tool, or reasoning progress."
retire_when = "Upstream or the operator CLI provides equivalent activity-based inactivity monitoring with episode deduplication and state-safe delivery."
depends_on = ["fork-notification-preferences"]
roles = []
note = "Monitoring is disabled on existing routes until explicitly enabled. A successful observation window, persisted per route, excludes network failures and sleep gaps; current-turn activity identifies one episode across watcher restart. Completed, settled, archived, input-waiting, plan-waiting, stopped and quota-held workers are excluded. Silent tools or hidden reasoning can still be working, so notices report missing evidence and never assert provider failure or perform recovery. Idle missing-result alerts are excluded because assignments do not prove an outstanding result obligation."

[[patch]]
name = "fork-thread-titles"
subject = "feat(t3-thread): rename threads and preserve explicit titles"
class = "product"
purpose = "Let operators and agents edit thread titles and project scope while preserving explicitly chosen creation titles."
retire_when = "Upstream operator tooling provides equivalent rename and explicit title preservation."
depends_on = ["fork-worker-operations"]
roles = []
note = "Native bootstrap persists manual thread.meta.update intent before the first turn when lockTitle is set; saved aliases and raw UUIDs share title and scope readback. Scope is optional server-owned thread metadata, and an empty value clears it."

[[patch]]
name = "fork-embedded-pages"
subject = "feat(web): pin web pages as sidebar footer icons"
class = "product"
purpose = "Let users configure named web pages that open from sidebar footer icons in the main area, hosted per surface with an honest Open in browser fallback."
retire_when = "Upstream offers configurable embedded or pinned web pages in the sidebar, or the fork stops showing them."
depends_on = []
roles = []
note = "Stored as the shared server setting embeddedPages so one edit reaches every connected environment and mobile can read it. Desktop hosts pages in an Electron webview on the Browser panel's default-profile partition (no mixed-content block, first-party cookies). Web uses an iframe; http pages from an https app are shown as blocked with Open in browser, and SameSite=Lax login cookies cannot persist in a cross-site frame, so the header always offers Open in browser. Mobile lists pages under Settings > App and opens them in the in-app browser. Footer change is one mounted component so other footer icons rebase cleanly."

[[patch]]
name = "fork-subthread-lifecycle"
subject = "feat(threads): settle completed workers and archive settled subthreads"
class = "product"
purpose = "Settle agent-created workers at completed turn boundaries and archive eligible settled subthreads after a configurable recovery period."
retire_when = "Upstream supplies per-worker completion settlement and guarded deadline-based subthread archiving across server, settings, and operator CLI."
depends_on = ["fork-nested-threads", "fork-worker-operations"]
roles = []
note = "Completion settlement reuses thread.auto-settle, ThreadSettlementPolicy, and autoSettleDisabledAt; the opt-out always wins. UI top-level threads default off, nested threads inherit the project default, and CLI workers capture the project default with explicit override flags. Archiving uses normal archive events and a nearest-deadline timer, never a periodic sweep, and revalidates pinning, opt-out, and all descendants at dispatch. Automatic settlement preserves pins; manual settlement clears them. Unarchive starts a fresh retention window. Mobile gets the same project/environment controls; desktop shares web settings."

[[patch]]
name = "fork-orchestrator-focus"
subject = "feat(threads): fold worker traffic in orchestrator threads"
class = "product"
purpose = "Stamp t3-thread notices and sends with their origin, and fold an orchestrator's worker-started turns behind one row per run on web and mobile, keeping the user's conversation and anything that asks for them visible, with an All traffic switch."
retire_when = "Upstream provides message provenance and an equivalent orchestrator view that hides worker traffic while surfacing questions, approvals and flagged results."
depends_on = ["fork-worker-operations", "fork-nested-threads"]
roles = []
note = "Ordinary watcher notices end with subscription controls; mandatory child-input notices omit them. Nested child input and approval notices derive their route from the current local or remote parent (stable descriptor ID, mapped to saved pairings), wake settled parents and remind once after 20 minutes per pending request. Origin rides as one unreferenced t3-origin context record (packages/shared/src/messageOrigin.ts), so it never reaches the provider or renders as a chip, and older clients keep it as an unknown record; messages from older CLIs fall back to the notification text prefix. Queued real sends wake settled workers; only notification-origin sends (or legacy notification prefixes without origin) are held by settlement. Only notices and sends from the thread's own descendants fold, so a worker's instructions from its parent stay visible. Live, streaming and unanswered turns never fold, and the classifier is derived from current state, so a folded turn that later raises a request or ends with T3_NOTIFY: attention surfaces without any stored flag. Traffic results are stabilized so streaming replies keep the timeline on its fast path. Mobile folds by default with per-run expansion; the All traffic switch and needs-you count are web and desktop only."

[[patch]]
name = "fork-page-agent-tray"
subject = "feat(web): agent tray beside sidebar pages"
class = "product"
purpose = "Give each sidebar page a right-hand tray with its own agent that operates the visible page on desktop and reaches T3 threads through the t3-thread CLI."
retire_when = "Upstream offers a per-page or per-site agent beside embedded pages, or the fork stops showing sidebar pages."
depends_on = ["fork-embedded-pages"]
roles = []
note = "A tray conversation is an ordinary thread in the server-owned chat project whose id starts with page-agent-; the server drops that namespace from client-facing shell feeds, thread search, and relay activity instead of persisting a hidden flag, while server reactors still see the threads (an idle one may auto-settle; the next send unsettles it). Desktop hosts the page as that thread's only Browser preview tab on the default profile, so its preview tools drive exactly the page; the tab closes with the page view. Page-agent threads always get the preview MCP capability. Web keeps the iframe and offers chat only. Conversations are per device in localStorage: current and previous, a fresh one after 30 idle minutes, discarded ones deleted only once no turn runs. t3-thread resolves page-agent ids by thread detail because shell lists never contain them."

[[patch]]
name = "fork-sidebar-nested-tidiness"
subject = "feat(sidebar): fold quiet nested threads"
class = "product"
purpose = "Keep expanded orchestrators scannable by folding quiet children, grouping untouched creation bursts, and labeling only cross-project children."
retire_when = "Upstream offers equivalent nested-thread folding and burst grouping without repeating project headers."
depends_on = ["fork-sidebar-agent-visibility"]
roles = []
note = "Pinned, active, input-blocked, currently viewed, and ancestor-of-active rows remain individually visible. Other quiet siblings fold into one reversible done row, except untouched siblings created within the same two-minute window, which form their own reversible burst row. Grouping is derived from shell timestamps and status only, so activity immediately removes a child. Nested rows suppress repeated project headers and show a compact badge only when their direct parent belongs to another project."


[[patch]]
name = "fork-antigravity-errors"
subject = "fix(antigravity): show native transport failure details"
class = "upstream-bound"
purpose = "Preserve explanatory Antigravity transport errors so startup and cancellation failures are actionable in every client."
retire_when = "Upstream preserves native transport details in Antigravity adapter errors."
depends_on = []
roles = []

[[patch]]
name = "fork-interrupted-turn-rewind"
subject = "fix(web): allow editing interrupted turns without checkpoints"
class = "upstream-bound"
purpose = "Offer Edit from here for the latest interrupted user message even when no assistant checkpoint exists, using the last ready checkpoint or conversation-only baseline."
retire_when = "Upstream offers rewind for interrupted turns without assistant checkpoints."
depends_on = []
roles = []

[[patch]]
name = "fork-sandbox-session-recovery"
subject = "fix(server): keep copied sandbox sessions stopped on startup"
class = "divergence"
purpose = "Disable automatic provider session and background-work recovery in dev and test launchers while preserving installed-server recovery at every live home."
retire_when = "Upstream guards automatic startup continuation in copied sandbox state."
depends_on = ["fork-provider-turn-safety", "fork-resume-background-work"]
roles = []

[[patch]]
name = "fork-agent-thread-ordering"
subject = "feat(threads): let agents control sidebar order"
class = "product"
purpose = "Share persisted pinned and active sibling order between agents and every client, with row-menu movement and an explicit return to automatic placement."
retire_when = "Upstream exposes server-owned thread order to automation and offers equivalent move and reset controls on every client."
depends_on = ["fork-worker-operations"]
roles = []
note = "The existing pinOrderKey and activeOrderKey remain the only stored order state. thread.order.reset clears the current section's key through a backward-compatible thread.meta-updated event; no migration is needed. Pinned rows sort manually first and new pins land at the top. Active rows remain recency-first until explicitly moved, then join the manual run. Nested rows use the same rule within their direct sibling bucket."

[[patch]]
name = "fork-named-agents"
subject = "feat(threads): named agents with one live thread each"
class = "product"
purpose = "Give a resource exactly one owner: a project marked as a named agent holds at most one live top-level thread, enforced in the decider on every root-creating path, with atomic handover, auto-start on send by name from the folder's AGENT.md and BRIEFING.md, and t3-thread agents/send routing."
retire_when = "Upstream provides singleton agents with a durable charter and briefing, name routing and an equivalent one-live-thread guarantee."
depends_on = ["fork-nested-threads", "fork-worker-operations", "fork-subthread-lifecycle"]
roles = []
note = "permanentAgent is an optional project field, persisted as projection_projects.permanent_agent_json by fork migration 9 and set through project.meta.update; snapshot rows include it only when set, so upstream shapes are unchanged. Live root = not archived, not deleted, no parent; nested threads are sub-agents and never count. Guarded paths: thread.create, thread.import, thread.unarchive and thread.parent.set to null. thread.create may carry handoverFromThreadId, which archives the idle live root in the same command and is refused while it is starting, running or awaiting input. An agent root is created with autoSettleDisabledAt and refuses re-enabling, so completion settlement never parks it. NamedAgents reads AGENT.md and BRIEFING.md from the project folder on the server host; a dormant agent's first turn is built from both plus the request, and a lost start race resolves to the winner. t3-thread send consults named agents only for names that are neither saved aliases nor UUIDs. Not in scope: resolver of whose request wins, scope enforcement, context-full reincarnation, a roster UI."
[[patch]]
name = "fork-project-automations"
subject = "feat(projects): run timed project automations"
class = "product"
purpose = "Persist project-owned timed prompts, recover scheduled runs after downtime, queue busy thread targets, and expose automation management and run results to clients."
retire_when = "Upstream provides equivalent project-scoped timed automations with persisted runs and busy-target delivery."
depends_on = ["fork-subthread-lifecycle", "fork-named-agents"]
roles = []

[[patch]]
name = "fork-gitea-issue-links"
subject = "feat(threads): link Gitea issues"
class = "product"
purpose = "Persist Gitea issue links on threads, expose them to agents, and show cached issue state beside thread work across web and desktop."
retire_when = "Upstream provides equivalent server-owned issue links with agent commands and client badges, or the fork stops using Gitea issues to track work."
depends_on = ["fork-gitea-connections", "fork-worker-operations", "fork-embedded-pages"]
roles = []
note = "A link stores normalized host/repository/number plus a cached title and open/closed state after resolving the URL through the same configured-instance and repository-identity route used by Gitea pull requests; public links fetch metadata through that instance's apiOrigin, while the client-facing URL remains the one the user linked. Public and internal aliases therefore resolve to one issue key without requiring the Gitea API to be online. A canonical issue URL on a host no instance or project names (a public HTTPS alias of an internal instance) is linked only when exactly one configured instance confirms that issue and it is not a pull request; unlinking such a URL matches the stored link and needs no API. The /issues/ URL path and a non-null API pull_request value distinguish issues from pull requests; Forgejo's pull_request:null issue payload remains valid. Cached metadata is synchronizable after the link is created so later Gitea reads can repair fallback titles and state. Other hosts that no configured instance confirms, and pull-request URLs, are rejected. Multiple issues may be linked per thread and unlink is the reverse state. Web and desktop badges deep-link the configured Agent Status Board by repo and issue, with the canonical Gitea URL as the fallback. Mobile receives the shared issue data but has no badge in this patch because its thread list has no pull-request badge analogue."

[[patch]]
name = "fork-orchestrators-view"
subject = "feat(web): add orchestrators view"
class = "product"
purpose = "Collect orchestrated projects and actionable standalone roots into a shared sidebar view and derive a focused needs-you, working, blocked, completed, request, link and automation page from live state."
retire_when = "Upstream provides an equivalent cross-project overview derived from nested thread state."
depends_on = ["fork-sidebar-agent-visibility", "fork-gitea-issue-links"]
roles = []
note = "A project is a non-archived top-level thread with at least one non-archived child. Counts and sections traverse descendants cycle-safely at every depth without a persisted summary. Blocked includes session or turn errors and output beginning with Blocked, but excludes interrupted turns because interruption is normal orchestrator steering. Projects mode also keeps an expanded, project-grouped list of standalone roots with actionable status, because most direct work starts outside orchestrator trees. Project and standalone rows sort by stable status buckets, debouncing promotion so live activity timestamps cannot make rows dance. When Projects is enabled, the Threads tab excludes whole project trees, including their pins; disabling Projects restores the unchanged full thread list. Web and desktop provide the full page, including compact provider-instance and model identity on active rows, the normal attachment-capable composer, a remembered live orchestrator chat panel without the full-width timeline marker rail, editable title and optional scope, and the root project's automations. Threads, full-width pull-request details and embedded issue pages opened from a project carry device history state for a project-only Back control. Mobile provides a read-only project list with the same project icon and opens the root thread. Done-since-last-visit timestamps and panel visibility stay per device in local storage."

[[patch]]
name = "fork-project-issues-board"
subject = "feat(web): show project issues as a board"
class = "product"
purpose = "Read a project tree's Gitea issues on the server and show them on the project page in the Agent Status Board's lanes."
retire_when = "Upstream provides project issue boards, or the Agent Status Board's issue view moves into T3 under another concern."
depends_on = ["fork-orchestrators-view", "fork-gitea-issue-links", "fork-gitea-pr-browser"]
roles = []
note = "A project's repositories are each tree thread's project remote on a configured Gitea host (resolved with the same resolveGiteaRemote rule as Gitea PR links), otherwise the same-named repository under the token's account (the Agent Status Board's tracker rule, which covers the GitHub-hosted fork's tracking-only repo), plus every repository a tree thread links an issue from. Lanes and labels match the board exactly (needs-review, in-progress, backlog, closed and archived) so the two views can merge. Issue titles deep-link the configured embedded Agent Status Board and preserve the project return location; without that page they keep the canonical external URL fallback. The server caches issue lists for 30 seconds and repository lookups for 10 minutes; the page refreshes every minute while open."

[[patch]]
name = "fork-request-ledger"
subject = "feat(projects): track requests as Gitea issues"
class = "product"
purpose = "Split each message Brad types into the requests it makes, file them as Gitea issues labeled ask in the project's tracker repository, and show them on the project page grouped by what he does next until he settles them."
retire_when = "Upstream or another fork concern tracks user requests across threads with the same capture, split and settle lifecycle."
depends_on = ["fork-project-issues-board", "fork-gitea-issue-links"]
roles = []
note = "Capture runs at the websocket dispatch boundary for thread.turn.start from a web, desktop or mobile surface, role user, without a t3-origin record, outside page agents and not a worker brief; the t3-thread CLI never reports a UI surface. The configured text-generation model splits the message (optional generateRequestItems on Codex and Claude); without it the message is filed whole. Each request is labeled ask plus ask:<kind> (question, deliverable, plan, change, test), carries a hidden t3-request provenance marker, and links to its thread and orchestrator. Status uses the Agent Status Board labels; a thread reply after the request also puts it in Brad's group. Only Brad settles (closes) a request, from the project page. Agents use t3-thread request list|add|start|ready|reopen (projectRequests.* RPCs) to file a request Brad made of them and to move it, with ready posting a summary comment that the page shows as the answer. Capture is durable: the message goes to <stateDir>/request-ledger-outbox.json before any Gitea call, one process-wide drain splits it once (the split is saved), files each request whose message id and item index are not already in a marker in the tracker (no duplicates after a lost response or restart), and retries with backoff (30 s to 10 min) while Gitea is unreachable; an entry is dropped only when its thread is gone or Gitea answers that there is no tracker. Repository lookups cache answers, never outages. The project page lists queued requests as Pending filing. Request stages live on labels: in-progress, needs-review, awaiting-release (handed over for the release batch) and needs-test (shipped; the release is the issue milestone and the test step a comment); deriveRequestStage maps them, and the board puts needs-test in Needs your review and awaiting-release in In progress. request start links the agent thread to the request. request add files directly or queues in the outbox when Gitea is unreachable. requestLedgerEnabled (default on) turns capture off per server."

[[patch]]
name = "fork-cross-environment-nesting"
subject = "feat(threads): nest workers across environments"
class = "product"
purpose = "Store remote parent links on child environments and merge connected thread trees in clients and the operator CLI."
retire_when = "Upstream supports environment-scoped thread parent links, client tree merging, and remote nesting through its operator interface."
depends_on = [
  "fork-cross-project-thread-nesting",
  "fork-worker-operations",
  "fork-orchestrators-view",
]
roles = []
note = "Remote parents are optional metadata, persisted only by the child server. Disconnected, archived, missing, or cyclic parents do not hide the child. Servers do not traverse or mutate remote descendants; client presentation combines connected environments. Fork migration 12 reserves the nullable JSON column independently of the V1 core replacement."

[[patch]]
name = "fork-project-dashboard-widgets"
subject = "feat(projects): configurable dashboard widgets"
class = "product"
purpose = "Turn the project page into an ordered, per-project list of widgets with a Requests widget that shows each ask's stage and owner, a Release widget derived from request stages, worker rows that name the request they serve, and an explicit Gitea tracker repository per project."
retire_when = "Upstream provides configurable project dashboards with request tracking, or the project page is retired."
depends_on = ["fork-request-ledger", "fork-orchestrators-view"]
roles = []
note = "Widget order (per orchestrator root thread) and tracker repositories (per T3 project) live in <stateDir>/project-dashboards.json, written atomically under a process-wide lock and read on demand, behind projectDashboard.get/setWidgets/setTracker and t3-thread dashboard set and project tracker set. Widget ids are open strings so later concerns (roadmap, canvas) add widgets without a schema change; clients drop unknown ids and default to requests, needs-you, release, roadmap, working, blocked, done, new-request, issues, prs, canvas, automations. A configured tracker (owner/repo on the first Gitea instance, or a repository URL) wins over the git remote in ProjectIssuesService.repositoryForProject, so the ledger, board and capture all use it. The Release widget has no store: next release is stage awaiting-release, shipped is stage needs-test grouped by milestone with the posted test step. Mobile shows read-only request and release lines under each project."

[[patch]]
name = "fork-project-roadmap"
subject = "feat(projects): roadmap of versions as Gitea milestones"
class = "product"
purpose = "Plan a project's versions on its project page: Later plus one column per open Gitea milestone on the tracker repository, with drag or a Move to menu, add and rename versions, and Save for later for ideas that should not wake the orchestrator."
retire_when = "Upstream or another fork concern provides milestone planning for projects."
depends_on = ["fork-project-dashboard-widgets", "fork-request-ledger"]
roles = []
note = "No new store: versions are open milestones on the tracker resolved by the ledger, items are the tracker's open issues and requests, and an item whose milestone is closed (a shipped release) is off the roadmap. Roadmap order is due date then creation; the first version is the next release and its items join the Release widget's Next release list. request shipped closes its release milestone. Save for later files a request through projectRequests.create without messaging the orchestrator. CLI: t3-thread roadmap list|move|version."

[[patch]]
name = "fork-project-page-workflow"
subject = "feat(projects): project page tabs, inline requests, PR status and progress notes"
class = "product"
purpose = "Make the project page say what needs Brad: Dashboard, Roadmap and Issues tabs with one-line summaries, an inline request box that sends to the orchestrator or saves for later, pull requests grouped by what they need, and the latest progress line on each request."
retire_when = "Upstream or another fork concern provides an equivalent project page."
depends_on = ["fork-project-roadmap", "fork-project-dashboard-widgets", "fork-orchestrators-view"]
roles = []
note = "The tab lives in the URL (?tab=dashboard|roadmap|issues, each change a history entry) and is remembered per project per device in local storage. The Dashboard shows the Roadmap and Issues widgets as one-line summaries linking to their tabs; Customize still orders the Dashboard. The request box sends verbatim through the queued composer path (images by paste or drop, Cmd/Ctrl+Enter) so the ledger captures it, then opens the right-panel chat on the message; Save for later uses projectRequests.create with park, which adds the parked label so the idea stays off the active Requests list (shown as a count) until it is moved into a version or started. The thread-replied hint marks only requested questions or asks owned by a worker thread, not every ask the orchestrator has answered in passing. The embedded orchestrator composer widget stays available but hidden by default. Pull request rows come from the tree's synced links (state, draft, checksState, reviewDecision, mergeability): Needs you is open, not draft or superseded, checks not failing or pending, no changes requested and no conflicts; merged or closed for 7 days shows collapsed and older is hidden. Superseded means a later pull request on the same branch, or a later one from the same worker thread after this one closed unmerged. request note (projectRequests.update without a status) posts a Progress line and links the thread; stage changes post one when no text is given; the ledger fetches the latest comment of every open request, cached per issue by updated_at."

[[patch]]
name = "fork-project-canvas"
subject = "feat(projects): orchestrator canvas widget"
class = "product"
purpose = "Let an orchestrator show a static page it maintains (charts, counts, screenshots) as a Canvas widget on its project page, safely sandboxed."
retire_when = "Upstream provides orchestrator-authored dashboards, or the project page is retired."
depends_on = ["fork-project-page-workflow", "fork-project-dashboard-widgets"]
roles = []
note = "projectCanvas.read resolves the thread's orchestrator project and reads <workspace>/.t3/dashboard/widgets.json ({widgets:[{id,title,path,size}]}, at most 8, ids 1-30 [a-z0-9-], .html paths inside the folder) or, without it, index.html as the single canvas. Each page inlines only relative src/href files inside its own folder (no scheme, absolute, or .. paths; known static types; 4 MB per canvas) as data URLs, with the newest mtime. Canvas widgets are canvas:<id> in the dashboard order; the canvas slot expands to those not placed on their own, and Customize lists them one by one. The client renders each with iframe srcdoc and sandbox=allow-scripts without allow-same-origin (opaque origin, no T3 session, cookies or storage, no network path into T3). The action bridge accepts postMessage only from the canvas's own frame with origin null, whitelists send (confirm chip with the exact text, then the normal queued send path), open-thread (tree threads), open-issue and open-url (http(s) on github.com, configured Gitea web origins and the tree's issue and PR hosts), rate-limits 5 per 10 s per frame, logs every outcome via projectCanvas.action, and replies t3-canvas-result. The request box's send moved to sendToOrchestrator for reuse. Template, style kit, manifest and funnel example live in docs/user/project-canvas."

[[patch]]
name = "fork-project-task-types"
subject = "feat(projects): typed tasks and release-grouped dashboard"
class = "product"
purpose = "Type every request and tracker issue (bug, feature, question, deliverable, plan, change, test, maintenance) and order the project Dashboard as Brad asked: tasks needing him, completed tasks by the release that shipped them, then maintenance."
retire_when = "Upstream provides typed project tasks, or the project page is retired."
depends_on = ["fork-request-ledger", "fork-project-dashboard-widgets", "fork-project-page-workflow"]
roles = []
note = "The type is the existing ask:<kind> label, so the five original kinds keep working; capture classifies the three new ones. projectRequests.update takes kind (CLI request type) and swaps the issue's ask:<kind> label; a type-only update works on any tracker issue, open or closed, and links no thread. The Release widget lists completed tasks by milestone, newest first (shipped requests to test with Settle, then settled or closed tasks of the tree or of a release milestone within the 14-day closed window, then work completed outside a release), then Next release. Open maintenance tasks not needing Brad move from Requests to a new Maintenance widget after Release; saved custom widget orders keep it hidden until added under Customize. Issue cards show the type."

[[patch]]
name = "fork-project-request-box-pinned"
subject = "feat(projects): pinned request box that sends in the background"
class = "product"
purpose = "Make the project request box a support box where the work actually gets done: pinned first on the Dashboard, sending in the background and saying which request tracks it."
retire_when = "Upstream or another fork concern provides an equivalent project request box."
depends_on = ["fork-project-page-workflow", "fork-project-canvas"]
roles = []
note = "The box renders above the widget list on the Dashboard tab only, outside the widget order and Customize, and the Requests widget no longer hosts it. Send goes through sendToOrchestrator without opening the chat, clears the box and shows Sent (or Queued) to the orchestrator; the line becomes 'tracked as request #N' (linked) once the ledger files an issue whose t3-request marker carries the message id, or 'pending filing' while the outbox holds it. The issues query is re-read 3, 10, 30 and 60 s after a send and the line clears after 2 minutes. Open chat is an explicit button; Save for later and image paste or drop are unchanged."

[[patch]]
name = "fork-scripts-automations"
subject = "feat(projects): scripts and automation rules"
class = "product"
purpose = "Keep named prompt scripts (per project or global) and automation rules (schedule triggers including weekdays and cron, agent actions from a prompt or script) in plain server tables, fire each slot once, keep a run log with dry runs, and expose them through automations.* and automationScripts.* RPCs, the t3-thread script and automation commands, and the existing project automation panels."
retire_when = "Upstream provides project and global prompt scripts with trigger-condition-action automations, per-slot dedupe and a run log, and the fork's records have been migrated to it."
depends_on = ["fork-project-automations", "fork-named-agents", "fork-cross-environment-nesting"]
roles = []
note = "The engine lives in apps/server/src/automations, outside orchestration: rows in fork migration 13 tables automation_scripts, automations (soft-deleted tombstones) and automation_runs (UNIQUE automation_id + dedupe_key, schedule key = slot instant). All V1 coupling is AgentGateway.ts (turn dispatch, thread outcome reads, domain-event wakeups, legacy reads); porting to orchestration V2 rewrites that file only. It replaces fork-project-automations' scheduler: on every pass and on project.meta-updated carrying automations, legacy project.automations records are copied once with the same ids, nextRunAt, owner, target and live runs (same run, thread and message ids, so tracking continues). The originals are left untouched on the project so a rollback to a release with the old scheduler still has its automations; the copied row, or its deleted tombstone, is the migration marker, and nothing in this release fires the originals. The V1 decider, events and contract fields stay for history replay and for old clients that still create the V1 way. Once a release has shipped with this patch, a later change may delete the originals. Executor rules are ported verbatim (automation:<runId> thread/message ids, locked dated title, owner nesting, busy targets wait, >24 h late slot skipped, backlog collapses to the latest slot, 20 unfinished-run cap, model fallback). Actions in a run go in order and a failure skips the rest. Scripts resolve when a run is built, project before global; removing a script an automation uses is refused. Ad hoc script runs are recorded under automation id script:<scriptId>. A script step carries a result mode (review default, file-only, file-and-settle; overridable per action or run) that is appended to its prompt; inline prompts get none, so imported timed automations send their prompts unchanged. Fork migration 14 seeds eight global starter quality scripts once (ids starter:<name>, conflicts ignored), so later edits and deletions stick. A paused legacy automation is also copied to a project script (id legacy:<automation id>, name slugged) when first imported. Event triggers: the gateway turns thread.pull-request-linked/-synced, thread.activity-appended (approval or user-input requests) and thread.session-set into neutral observations, read only for kinds an enabled automation listens to; issue labels (ProjectIssuesService for the owner thread) and GitHub releases (ReleaseFeed, unauthenticated) are polled every five minutes only while listened to. events.ts compares each observation with its last value in automation_source_state (fork migration 15) so CI and session errors fire on transitions, labels on additions, releases on a new tag, and polled first sightings are baselines; runs are keyed event:<kind>:<state>. Later stages add conditions and notify actions to the same patch. A fourth result mode, `act`, appends only a `Result mode: act` marker with no filing or settling instructions, for a run whose job is to act directly; `t3-thread automation add --thread <id>` defaults new existing-thread automations to it, and `t3-thread automation edit <id> --result-mode <mode>` changes an existing automation's mode on every action (the project panel's own mode picker only reaches single-schedule, inline-prompt rules it can already edit)."

[[patch]]
name = "fork-queue-coalesced-notes"
subject = "feat(threads): let workers replace their own queued status notes"
class = "product"
purpose = "Keep a coordinator's send queue from flooding with its workers' progress notes: a sender can mark a recurring note with a coalesce key so a newer note replaces its still-waiting predecessor, and the queue can be summarized by target and sender."
retire_when = "Upstream or maintained shared tooling provides equivalent supersession for queued thread messages, or workers stop reporting to parents through queued sends."
depends_on = ["fork-worker-operations"]
roles = []
note = "Opt-in only: a send without a key is never dropped or merged, and the replacement is scoped to the same sender, target thread, environment and key. A send a watcher has already claimed is not replaced. The replaced record stays in state as cancelled with the superseding id, so the queue listing explains what happened. --progress is shorthand for the key progress."

[[patch]]
name = "fork-request-followups"
subject = "feat(projects): fold chat follow-ups into tracked issues instead of filing each message"
class = "product"
purpose = "Stop request tracking from filing every chat message as its own Gitea issue (brad/t3code-fork#120): follow-ups attach to the thread's tracked or linked issue, questions and acknowledgements never become issues, and new requests come from the New request box or genuinely new work."
retire_when = "The request ledger is retired, or upstream tracks requests with equivalent grouping."
depends_on = ["fork-request-ledger", "fork-project-task-types", "fork-project-request-box-pinned"]
roles = []
note = "Before splitting, the drain re-reads the tracker and offers the model up to 40 open issues (the thread's linked ones first, marked as this conversation, then the project's open requests); each split item names the one it continues (existing) or null. planRequestItem: an explicit entry (projectRequests.submit, sent by the New request box just before its message is dispatched) files every item; a chat question is skipped; an item naming an offered issue becomes a 'Follow-up from Brad' comment with a hidden t3-request-followup marker on that issue and links the thread; without a model the unsplit item follows the thread's newest linked issue; anything else is filed. An explicit submit upgrades a not-yet-split capture of the same message. projectRequests.update now accepts any open tracker issue (start, note, ready, shipped), and projectRequests.settle closes or (reopen) reopens any of the project's issues from its row."

[[patch]]
name = "fork-roadmap-next-later"
subject = "feat(projects): automatic next version and a Later bucket on the roadmap"
class = "product"
purpose = "Make the Roadmap tab plan by default (brad/t3code-fork#119): a next version that exists and fills itself with current work, an add-version action, and a Later bucket kept off the Dashboard; never an empty pane while it loads."
retire_when = "Upstream provides equivalent milestone planning, or the project page is retired."
depends_on = ["fork-project-roadmap", "fork-project-page-workflow", "fork-request-followups"]
roles = []
note = "Columns: the next version (the first open milestone, or a virtual Next version when none exists) holds that milestone's items plus every open unversioned item that is not parked; then each later milestone; then Later, unversioned parked items. ProjectRoadmapItem gains parked; projectRoadmap.move takes later (clear the milestone and add the parked label) and version null now means the automatic next version (clear the milestone and unpark). CLI roadmap move accepts next and later; roadmap list reports next, versions and later. ProjectQueryState shows Loading, or the error with Retry, wherever a project view waits on a query, so a failed Gitea call no longer leaves a blank Roadmap or a Loading line forever."

[[patch]]
name = "fork-project-page-usability"
subject = "feat(projects): project page usability pass"
class = "product"
purpose = "Act on Brad's requests and the fork.24 usability review of the project page: one Needs you source, a New request box on every tab (brad/t3code-fork#118), the selected project in the sidebar (#117), Shipped, test it apart from Done, settle or reopen from any row, and tighter, consistent rows."
retire_when = "Upstream or another fork concern provides an equivalent project page."
depends_on = [
  "fork-orchestrators-view",
  "fork-project-issues-board",
  "fork-project-page-workflow",
  "fork-project-request-box-pinned",
  "fork-request-followups",
  "fork-roadmap-next-later",
]
roles = []
note = "deriveNeedsYou (requests in Brad's groups plus open non-request issues marked needs-review or needs-test, parked excluded) feeds the Dashboard's Needs you widget (threads needing approval, input or a plan review first), the status-line count, and the Issues board, whose lanes are Needs you, Shipped, test it, Working, Pending (folded after 10) and Done; cards wrap two-line titles and show repo#N, type, comments, age and thread in that order, with Settle or Reopen. The Requests widget keeps work with the agents and waiting for release, groups requests of settled threads and threads with several open requests behind Settle all, and drops the saved-for-later count (Later stays off the Dashboard). The New request box sits above the tabs as one line that opens on focus, submits the explicit request before its message, and folds after sending or on Escape. Customize moved to the tab row; Chat is the one chat control (the panel links to the full thread); a release line shows the running version and the next release; Working, Blocked, Done and Needs you rows open their thread anywhere on the row; times are relative; empty sections hide; one word per status (working, waiting for release, shipped, test it) on web and mobile. The Projects sidebar marks the project whose page or thread is open and shows one open-issue count instead of issue chips."

[[patch]]
name = "fork-request-answers"
subject = "fix(projects): each question keeps its own answer; requests stop flickering"
class = "product"
purpose = "Fix two fork.26 defects of the project page: requests flickered between Needs you and the Requests list, and every Answers ready question showed the same reply. Answers are now per question and stored, shown answer first."
retire_when = "The request ledger is retired, or upstream tracks per-message answers."
depends_on = ["fork-request-followups", "fork-project-page-usability"]
roles = []
note = "The flicker came from the 'thread replied' rule reading live thread state: a request counted as answered only while its thread was idle and its latest turn had completed after the request, so a busy orchestrator moved its questions between groups on every turn, and every question showed the thread's newest reply. The ledger now adds answer {text, askedAt, answeredAt} to each open request: the last finished assistant message of the turn the request's own message started (or, without a turn id, before the next user message), found via the message repository only after hasAssistantMessageForTurn says the turn replied, and cached for the process once found. replied is issue.answer !== undefined, so a request changes group only when its data does. Real Gitea after fork.26 showed the no-model fallback piling unrelated messages onto the orchestrator's most recently updated issue, so without a model a chat message now follows its thread's issue only when the thread has exactly one, and otherwise files nothing. Needs you rows follow docs/dashboard guidelines: the question, then its answer in up to three whole sentences (the agent's ready comment when it marked the request ready), Asked and As of times, Settle; no meta line; clicking opens the thread."

[[patch]]
name = "fork-project-task-status"
subject = "feat(projects): one task status everywhere, roadmap progress, Issues renamed Tasks"
class = "product"
purpose = "Show where every task stands with one status vocabulary (Pending, Active, For review, Complete) on the Tasks board, the Roadmap and Needs you, give each roadmap version an at-a-glance progress line, and call issues Tasks wherever Brad reads them."
retire_when = "Upstream or another fork concern provides an equivalent project page."
depends_on = ["fork-project-page-usability", "fork-roadmap-next-later", "fork-request-answers"]
roles = []
note = "taskStatuses (projectRequests.logic) is the one source: Complete when closed, For review when deriveNeedsYou lists it (shipped work to test included), Active when marked in progress or a linked non-orchestrator thread is working, Pending otherwise. The Tasks board lanes are For review, Active, Pending (backlog folded, 10 shown) and Complete; shipped cards say Shipped in fork.N, test it. Request and release rows use the same words through STAGE_STATUS. Roadmap rows show the status instead of #N and request; each version column shows 'N · x complete · y active · z for review · w pending' and a thin static bar, counting the milestone's closed_issues as complete (ProjectRoadmapVersion.closedIssues); the Dashboard roadmap line reads 'fork.25: x of N complete'. User-facing Issues became Tasks (tab, Dashboard line, Open tasks, sidebar 'N tasks'); Gitea, API, CLI and internal names stay issues."

[[patch]]
name = "fork-project-layout"
subject = "feat(projects): orchestrator-configurable project layout"
class = "product"
purpose = "Make the project page a layout of tabs and widgets that Brad drags and drops and the project's orchestrator changes on request through MCP tools, applied live in every client without a restart (brad/t3code-fork#121)."
retire_when = "Upstream provides configurable project pages, or the project page is retired."
depends_on = [
  "fork-project-dashboard-widgets",
  "fork-project-canvas",
  "fork-project-task-status",
  "fork-project-page-usability",
]
roles = []
note = "One ProjectLayout per orchestrator (root) thread, kept with its last 50 revisions in project-dashboards.json (layouts) next to the tracker setting; a project without one gets defaultProjectLayoutTabs from its old widget order (Dashboard, Roadmap, Tasks). The widget registry, ops and applyLayoutOps live in contracts so clients apply edits optimistically with the server's rules. ProjectLayoutService (one instance for WebSocket and MCP, re-provided per connection) applies ops by id on the newest revision under the settings file lock, rejects a replaceLayout made against an older revision, reverts by restoring a revision's tabs as a new one, and publishes every revision on a PubSub; projectLayout.subscribe streams the current layout and then each revision (one-slot sliding mailbox), gated by the projectLayout capability so older servers show the default. MCP toolkit project_layout_get/update/history/revert: writes only from the project's root orchestrator thread (Brad's decision), each with a reason shown in the clients' Undo chip. projectDashboard get/setWidgets map the old widget ids onto the first tab for the CLI. Web: tabs come from the layout (any tab id in ?tab=), widgets render by type in a 6-column grid by size; Edit layout replaces Customize (drag tabs and widgets, rename, add and remove tabs, add widgets from the registry, size, settings, tracker repository). Includes the cheap content widgets markdown (note) and links; embed, threads and mobile read-only wait for stage c."

[[patch]]
name = "fork-request-intake"
subject = "feat(projects): New request box triages through a short-lived intake thread"
class = "product"
purpose = "Stop the New request box from waking the project's orchestrator with every request: a short-lived intake thread nested under it triages the request, catalogs it or starts it, and hands it to the orchestrator only when it needs starting now or needs a decision (Brad, 2026-10-05)."
retire_when = "Requests are triaged by an equivalent built-in intake, or the project page is retired."
depends_on = [
  "fork-request-followups",
  "fork-request-answers",
  "fork-project-request-box-pinned",
  "fork-roadmap-next-later",
]
roles = []
note = "projectRequests.startIntake creates the intake thread (thread.create nested under the orchestrator, settleOnComplete, no CLI subscriber so nothing is notified) on claude-sonnet-5-5 when an enabled provider offers it, else another Claude Sonnet, else the orchestrator's model, and returns the fixed brief (buildIntakeBrief). The box then submits the request as explicit on the intake thread and sends brief plus Brad's words and images through the normal queued send path, so the ledger files the task from his words, linked to the intake and the orchestrator; a server without the RPC falls back to sending to the orchestrator. The brief: find the task, request type and request title, roadmap move next or later, then answer a question with request ready, or start one worker (--parent and --notify the orchestrator at attention level), or send the orchestrator one message, or catalog; note what was done; settle itself. projectRequests.update takes title (CLI request title)."

[[patch]]
name = "fork-textgen-tempfile-cause"
subject = "fix(server): say why a text-generation temp file could not be written"
class = "product"
purpose = "Make the Codex text-generation temp-file failure diagnosable: the dev VM logged 'request ledger could not split a message' with only 'Failed to write temp file', six times on 2026-10-05, hiding why request splitting fell back."
retire_when = "Upstream reports the underlying file-system error in its text-generation temp-file failures."
depends_on = []
roles = []
note = "The prefix t3code-<prefix>-<pid>- is a plain basename, so the failure is not the prefix. The detail now reads 'Failed to write temp file in <os.tmpdir()>: <reason>' (for example 'NotFound: FileSystem.makeTempFileScoped (<path>)'); the request ledger's split warning logs the detail, so the next occurrence names its cause. A test points TMPDIR at a missing folder."

[[patch]]
name = "fork-projects-pinned"
subject = "feat(projects): pinned top-level threads are projects, listed first"
class = "product"
purpose = "Show the chief of staff at the top of the Projects and Threads sidebars with its own project page, like the T3 Orchestrator, without nesting the other orchestrators under it (Brad, 2026-10-05)."
retire_when = "Upstream or another fork concern provides explicit project ordering."
depends_on = ["fork-orchestrators-view"]
roles = []
note = "buildOrchestratorSummaries and threadsVisibleInThreadsMode treat a pinned top-level thread as a project root even without workers; sortOrchestratorSummariesForSidebar puts pinned projects first in pin order, then the rest by bucket. threadsVisibleInThreadsMode keeps a pinned project root's own row (not its descendants) in the Threads sidebar, so one pin order (pinOrderKey) tops both lists; Brad asked for the chief of staff at the top of both (2026-10-05). No new setting: the chief of staff (ff38df95, already pinned on dev-vm) appears first; t3-thread move --top orders pins. On dev-vm only T3 Orchestrator, Deployment Orchestrator and Chief of Staff are pinned top-level threads."

[[patch]]
name = "fork-project-health"
subject = "feat(projects): orchestrator-written health line on the project page"
class = "product"
purpose = "Answer 'are we OK, where are we going' on the first screen: a status chip, one sentence and an as-of time written by the orchestrator (dashboard redesign, synthesis.md section 1, approved 2026-10-05)."
retire_when = "Upstream ships a project status line the orchestrator can write."
depends_on = ["fork-project-dashboard-widgets", "fork-project-layout"]
roles = []
note = "Stored per root thread in the dashboard settings file (health record next to widgets and tracker). projectDashboard.setHealth (operate scope) and t3-thread project health set/show write and read it. The page shows it as stale when it is older than a day or older than the newest descendant thread update or task link; the curator checks freshness, nothing auto-clears it."

[[patch]]
name = "fork-standing-agent-autosettle"
subject = "fix(threads): pinned and parent threads never auto-settle; t3-thread auto-settle toggle"
class = "product"
purpose = "Stop standing agents (pinned threads and threads with live workers) from settling on their own after a completed turn, and give operators a per-thread toggle (worker standing-agent-autosettle, 2026-10-05)."
retire_when = "Upstream supplies completion settlement that exempts pinned and parent threads."
depends_on = [
  "fork-subthread-lifecycle",
  "fork-worker-operations",
  "fork-cross-environment-nesting",
  "fork-worker-inactivity",
]
roles = []
note = "The decider rejects thread.auto-settle for a pinned thread or one with live children even when a sweep used a stale snapshot; manual settlement still clears pins. Unnesting clears the worker-only settle-on-complete setting. t3-thread auto-settle <thread> --off|--on sets the opt-out; the server refuses --on for a named agent's live top-level thread. t3-thread status no longer reports a running session as errored from an older failed turn. An unpinned childless top-level thread that already has settle-on-complete set still settles; run auto-settle --off on it. watch.ts still delivers a settled worker's final completion to its supervisor, so an orchestrator no longer misses a worker that settled on finishing."

[[patch]]
name = "fork-task-view"
subject = "feat(projects): open a task in the app"
class = "product"
purpose = "Clicking a task title on the project page opens the task in a panel over the page (status, type, the answer, the latest progress, the parts of an epic, its threads, Settle or Reopen) instead of leaving for Gitea or the embedded Status Board."
retire_when = "Upstream or another fork concern provides an equivalent task view, or the project page is retired."
depends_on = ["fork-project-task-status", "fork-project-layout"]
roles = []
note = "projectIssues.get {rootThreadId, host, repository, number} (read scope, ProjectIssuesService.get) returns the ProjectIssue with its body, its last 10 comments (4000 characters each), and childNumbers: the project's cached issues whose body starts with 'Part of #N' (isPartOf, the horizon slice's convention); ws.ts decorates the issue with the thread answer through RequestLedger.withAnswers. The web keeps the open task in the page URL as ?task=host/owner/repo#N (parseTaskRef/encodeTaskRef in taskView.logic), so Back closes the panel and a link opens it. deriveTaskView picks the status from the shared task statuses, the answer (the last non-progress comment once For review or Complete, otherwise the thread's answer), the latest Progress line (only while Pending or Active), the children resolved against the issue list, and the working threads. TaskTitle (TaskLink) is the one click site on the Tasks board, Roadmap, Needs you, Requests, Release and Maintenance rows; outside a project page it stays a Gitea link. The panel keeps Open in Gitea and a Status Board link (when the embedded page exists), so the old routes stay reachable. The t3-thread CLI group is unchanged (projectIssues.list is not in it either)."

[[patch]]
name = "fork-release-horizon"
subject = "feat(projects): next-release horizon with epic progress"
class = "product"
purpose = "Show where the project is going: the next release first (its outcome, N of M done, the task to deliver next), epics as '1 of 4' with a phase word, and everything later as one count, so the Dashboard answers 'are we on track' without charts or dates."
retire_when = "Upstream or another fork concern provides an equivalent project page."
depends_on = ["fork-project-task-status", "fork-project-layout"]
roles = []
note = "ProjectIssue.epic {done, total, remaining} is computed server-side in ProjectIssuesService.list by epicProgress.logic: an issue labeled ask:epic (or an older ask:plan unless ask:task or ask:question is also present) has children from its body checklist ('- [ ] #12 title') plus issues whose body starts 'Part of #N'; a child is done when closed or ticked, so a child closed before the 14-day closed window counts only through its tick. ProjectRoadmapItem.epic carries it to the roadmap and ProjectRoadmapVersion.description carries the milestone description. The web phase word (projectHorizon.logic epicPhase) is Planning when no child is done or started, Building when any is, Review when every remaining child is For review, Complete when none remains; no percent bars, dates or charts. The roadmap-summary widget now renders 'Where we're going': next version, the first line of its description as the outcome, 'N of M done' (the Roadmap tab's version count, epics included), the Active (else For review) task as next, the next release's epics, and 'Later (N)' for every later version and the parked items; the Roadmap tab shows an epic's second line as '1 of 4 · Building'. The Release widget and its release line are unchanged. No new RPC."

[[patch]]
name = "fork-board-blocked-working"
subject = "feat(projects): derived Blocked and outcome rows for Working now"
class = "product"
purpose = "Make the project page's Blocked and Working now widgets answer 'is anything stuck' and 'what is being worked on' from derived outcomes instead of worker narration (fork.28 board redesign)."
retire_when = "Upstream provides an equivalent project board, or the project page is retired."
depends_on = ["fork-project-task-status", "fork-project-layout"]
roles = []
note = "Blocked is derived, never hand-set (deriveBlocked in projectWork.logic): a worker the thread state flags blocked (summary.blocked: session or turn error, or a latest line starting 'Blocked'), an Active task whose body or newest comment says 'Blocked by #N' while #N is still open, and an Active task with no change for 3+ days ('Stuck 4d'; a linked worker's activity counts as change). ProjectIssue gained optional blockedBy (same-repository numbers): ProjectIssuesService parses the issue body with parseBlockedBy, and RequestLedger adds the newest comment's references for the requests it already fetches comments for. Rows show what, cause, owner thread and next step, with an 'Open #N' button only for a blocked-by row; the row opens the owner's thread; the widget hides when empty and the status-line 'N blocked' uses the same rows. Working now rows read '<task or thread title> · Active · next: <Progress note or the thread's first sentence> · <worker>' with no model badge and no clipped prose (a line over 120 characters is dropped), still opening the thread and keeping 'for: <request>' when it names another request. The layout widget types working and blocked are unchanged, so saved layouts keep working."

[[patch]]
name = "fork-needs-you-decisions"
subject = "feat(projects): decide from Needs you and a Decisions widget, with Undo"
class = "product"
purpose = "Let Brad decide an item that asks him to approve or choose straight from its Needs you row (Approve, Not yet, or one button per option), and answer needs-brad decision issues from a reusable Decisions widget and the mobile app, with a few seconds of Undo, telling the thread that waits."
retire_when = "Upstream or another fork concern provides decisions on the project page, or the project page is retired."
depends_on = ["fork-request-ledger", "fork-request-answers", "fork-project-task-status"]
roles = []
note = "A decision row is a Needs you item in the approve group (a plan), an epic marked ready, or any ready item whose latest comment lists two or more lines starting 'Option A:', 'A)' or '(A)' (parseDecisionComment and needsYouDecision in projectRequests.logic); answer rows and shipped-to-test rows keep their Settle and test step. The row shows two sentences of the comment, its Recommendation line and the options. Clicks are held client-side for 5 s with an Undo line (Settle on answer rows too) and sent on expiry or when the page closes; a failed send brings the row back. projectRequests.decide {threadId, reference, decision, option?, reason?} (operate scope) runs RequestLedger.decide, which plans with planDecision: approve comments 'Approved by Brad', an option comments 'Brad chose: <option>', both move the item to in-progress through update() and send one short thread.turn.start through the orchestration engine to the first live linked non-orchestrator thread, else the orchestrator (decisionThreadId), using that thread's own runtime and interaction mode; Not yet comments the reason, returns the item to Pending (update status pending drops needs-review and in-progress) and sends nothing. A failed message is logged and does not undo the label change. Decisions widget (registry type decisions) and mobile: a needs-brad issue in the fixed format (docs in AGENT_OPERATIONS.md) is parsed server-side by parseDecisionIssue (decisions.logic.ts) into ProjectIssue.decision {context, waiting, options[{text, recommended}]}, so web and mobile share one reading. Answering calls the same decide RPC with decision option or answer: RequestLedger.answerDecision comments 'Brad chose: <option>' or 'Brad answered: <text>' plus the optional note, removes needs-brad (the issue stays open for the asker to close) and tells the waiting thread through the engine. waiting is resolved on the server by resolveWaitingThread: thread id, permanent agent name, or thread title in slug form, because saved agent names live in the CLI state file; an unresolved name still answers on the issue and reports no thread notified. Mobile lists decisions under each project with selectable options, an optional note and Send, with no Undo. No t3-thread verb: agents ask, Brad decides. Answering a decision issue (answerDecision) runs comment, then needs-brad label removal, then the message to the waiting thread, and any failed step fails the RPC with what already landed (brad/t3code-fork#166). A retry is safe: the comment is skipped when it is already the newest comment, the label step is skipped when the label is gone, and an option on an issue that still carries a decision block is routed back to answerDecision rather than planDecision, so it finishes the answer instead of approving. Only the Needs you approve path still logs and swallows a failed thread message, because its status change has already landed."

[[patch]]
name = "fork-project-workstreams"
subject = "feat(projects): workstreams block on the project Dashboard"
class = "product"
purpose = "Show at a glance where each parallel effort stands: one Dashboard line per active epic, derived from epics, their children and linked worker threads (fork.28 board redesign)."
retire_when = "Upstream provides an equivalent project board, or the project page is retired."
depends_on = [
  "fork-release-horizon",
  "fork-task-view",
  "fork-board-blocked-working",
  "fork-project-health",
]
roles = []
note = "ProjectWorkstreams in OrchestratorBoard.tsx renders directly under the health line on the dashboard tab (built in, not a layout widget, so PROJECT_WIDGET_TYPES is unchanged); deriveWorkstreams in projectWorkstreams.logic lists every open, unparked epic with children remaining. A row reads: the epic title, the earliest milestone with open children as 'M1 of M1-M4' (only the open children are known, so a finished milestone drops out of the range), 'N of M · Phase' from formatEpicProgress, the distinct linked worker threads of the epic and its open children that are working now (the orchestrator excluded) as 'N agents', 'next: <title>' (the first Active open child, else the first Pending one, by issue number), and a Blocked marker when an open child's blockedBy names an open issue, a deriveBlocked blocked-by or stuck row names a member, or a blocked worker is linked to one. A row is a TaskTitle, so it opens the epic's task view. Nothing renders while no epic has work left. No new RPC, contract or setting."

[[patch]]
name = "fork-item-types"
subject = "feat(projects): question, task and epic item types with a bug tag"
class = "product"
purpose = "Replace the eight request kinds with three item types (question, task, epic) and an optional bug tag on a task, everywhere Brad files, retypes and reads a request."
retire_when = "The request ledger is retired, or upstream tracks typed project requests."
depends_on = ["fork-project-layout"]
roles = []
note = "Labels on Gitea are ask:question, ask:task, ask:epic and a plain bug label; new requests carry only these. Older ask:* labels (feature, change, maintenance, test, deliverable, bug, plan) stay on issues as history and are never stripped. Reading (taskKind, isBug in projectRequests.logic): a new label wins; otherwise question stays question, ask:plan reads as epic, ask:bug reads as task plus bug, and every other ask:* reads as task. groupForKind maps question to answers, epic to approve, task to review. ProjectRequestKind still decodes the old values from older clients and outbox entries and maps them to question, task or epic (normalizeRequestKind; parseOutbox also turns an old bug kind into bug: true), so nothing in flight breaks. The request-items model now classifies into question, task or epic plus a bug boolean. planKindLabelChange (requestLedger.logic) decides label edits: kind swaps only among the three ask: labels, history labels stay, bug adds or removes the bug label, and retyping an old ask:bug issue keeps its bug tag unless bug is false. ProjectRequestUpdateInput and the create input gain bug. CLI: request add --kind question|task|epic [--bug]; request type <thread> <request> question|task|epic [--bug|--no-bug]. Every place that shows the kind (Tasks cards, Needs you, Requests, Release rows, completed tasks) uses RequestKindTag, which shows the kind and a small bug tag. The Maintenance widget keeps working from the old ask:maintenance history label (a task that carries it still counts as maintenance; ask:bug issues stay out), so existing maintenance items do not disappear; new items never get ask:maintenance."

[[patch]]
name = "fork-board-declutter"
subject = "feat(projects): remove meta lines, ids, duplicate rows and narration from the project page"
class = "product"
purpose = "Cut visual clutter from the project page so each row says what it is, its status and one progress line: no meta lines, internal ids, agent prose or second copy of the next release (fork.28 board redesign)."
retire_when = "Upstream provides an equivalent project board, or the project page is retired."
depends_on = [
  "fork-release-horizon",
  "fork-board-blocked-working",
  "fork-item-types",
  "fork-needs-you-decisions",
]
roles = []
note = "Deletions and one logic change in apps/web/src/components/orchestrators; no RPC, contract shape, setting or layout id changes, so saved layouts keep working (only two widget description strings in projectLayout.ts changed). Tasks cards (IssueRow) lose the 'repo#N · request|issue · comment count · thread' meta line and keep title, the kind and bug tag, age and Settle or Reopen; the lane is the status, and the thread opens from the task view's Open thread. Request rows (CompactRow) lose the '-> worker' line and the 'latest:' prefix, keeping the status word, title and one Progress line. deriveWorkingNow now takes the next step only from the task's 'Progress:' comment and no longer falls back to the worker's own first sentence (this supersedes the fallback fork-board-blocked-working describes), so Working now never shows agent prose. The pull request link reads '#N' with the title beside it instead of 'owner/repo #N' (the full reference stays as its accessible name); the pull requests widget already lists each pull request once and no other project-page row renders one, so there is no second copy to fold. The Release widget drops its 'Next release' list, which repeated the roadmap's next-version items, and keeps completed tasks by release with their test steps and one 'Awaiting release' group; the next release's outcome, N of M, next deliverable and epics stay in 'Where we're going'. Decisions keep their short '#N' issue link and Blocked keeps 'Blocked by #N' with its Open button, since those are the links to act on."

[[patch]]
name = "fork-dev-vm-heavy-check-gate"
subject = "build(fork): serialize heavyweight checks on the dev VM"
class = "divergence"
purpose = "Make the dev VM's shared heavy-check slot the default path of every package typecheck and vitest script, so concurrent agent compiles queue instead of exhausting memory (brad/t3code-fork#65)."
retire_when = "The dev VM no longer shares one host between the T3 server and agent compiles, or a resource governor outside the repo admits every compile and test run."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "scripts/ci/heavy-gate.ts prefixes each package's typecheck and test script. It runs the command through ~/.local/bin/heavy-check and runs it directly (same argv, same exit status) when CI is set, the host is not Linux, the gate executable is absent, T3_HEAVY_GATE_DISABLE=1, a T3_HEAVY_GATE_HELD token is set, or an ancestor process holds an fd on heavy-check.lock (Deployment's heavy-check sets no marker, so a caller that used it directly is found by ancestry, which also survives vp not passing fd 9 on). heavy-check releases when the process it execs exits, but vp spawns tsc and vitest without fd 9 and they can outlive it, so the gated command runs under a supervisor inside the slot: its own session, every descendant tagged with a per-run T3_HEAVY_GATE_HELD token in its environment (found by scanning /proc/*/environ, so a child that calls setsid is still held), and the slot released only when none remain. After T3_HEAVY_GATE_LINGER_MS (30 minutes) the slot is released with a warning; stragglers are not killed unless the gate itself was signalled, in which case the signal goes to every tagged descendant and survivors get SIGKILL after T3_HEAVY_GATE_KILL_GRACE_MS (10s), with the command's status propagated. A descendant started with a scrubbed environment (env -i) escapes the token; tsc-governor and Deployment's containment are the backstop. It is a Node script, not bash, because the manual Windows lane runs the same package scripts. Raw tsc, vp check, vp build and vp test run bypass package scripts and stay with the out-of-band tsc-governor."
