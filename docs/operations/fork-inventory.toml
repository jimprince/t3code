[[patch.decision]]
id = "release-version-stamps"
date = "2026-07-28"
decided = "narrow"
rationale = "Committed package versions are redundant because release automation derives them from the tag. Always take upstream versions during replay and keep generated stamps out of main."
[[patch.decision]]
id = "stamp-free-release-tags"
date = "2026-07-30"
decided = "tag-stamped-child-main-unstamped-parent"
rationale = "Both automatic release writers call prepare-release-tag, tag its prepared child, and keep main at the exact unstamped stack tip. Release consumes that bound tag and never finalizes versions onto main."
standing_policy = "Generated version stamps and release lockfile changes are tag-only."
[[patch.decision]]
id = "reuse-exact-source-ci-tests"
date = "2026-09-05"
decided = "narrow"
rationale = "Reuse successful main-push CI tests only for the exact release commit or its verified version-only direct parent. Require all test shards, check and release smoke jobs from that attempt; bound waiting and fall back to full release tests without trustworthy evidence. Always check the resolved release source, formatting, types and packaged artifacts."
