[[patch]]
name = "fork-release-publication"
subject = "ci: publish fork releases with version stamping and notes"
class = "product"
purpose = "Build and publish the fork's desktop, headless, updater, and mobile release lanes with tag-only version stamping, bounded CI evidence reuse, and rendered release notes."
retire_when = "Upstream or maintained shared tooling provides equivalent release publication for the fork."
depends_on = [
  "fork-desktop-delivery",
  "fork-mobile-delivery",
  "fork-headless-delivery",
  "fork-build-ci-compat",
]
roles = ["release-workflow-owner"]
note = "Release notes compare stable authored change IDs between actual released tags, list fork features/fixes/removals before upstream changes, and preserve popup order. Published entries remain history; later fixes get new IDs. Bun and strict entry validation are configured in publication; Knip recognizes the shell-launched renderer entry point. Both macOS and Linux release jobs require packaged historical-data startup before publication. macOS uses the built zip backend in Electron Node mode; source-only or empty-data checks cannot substitute."

[[patch.decision]]
id = "upstream2237-relay-tunnel-cleanup-runbook"
date = "2026-09-25"
decided = "retire"
rationale = "Upstream expanded its release runbook with managed-tunnel cleanup rollout and a disposable-host canary for the T3 Connect relay. The fork's runbook is a rewrite that carries no relay deployment section, and the fork does not deploy the relay, so the new procedure has nothing to attach to here."

[[patch.decision]]
id = "upstream-release-test-job-split"
date = "2026-09-24"
decided = "narrow"
rationale = "Upstream split its release test step into standalone test/test_server jobs gating its release job. The fork's preflight already runs the whole suite through scripts/ci/verify-source with bounded CI-evidence reuse, and it has no relay_public_config or per-platform desktop jobs, so those jobs and their gates do not apply; keep the fork's single preflight test step."

[[patch.decision]]
id = "release-draft-recovery"
date = "2026-09-19"
decided = "adapt"
rationale = "Upload assets before publishing both new and retried release drafts, then require public release metadata and all expected assets; an upload success alone left a green workflow with an unpublished draft."
[[patch.decision]]
id = "release-version-stamps"
date = "2026-07-28"
decided = "narrow"
rationale = "Committed package versions are redundant because release automation derives them from the tag. Always take upstream versions during replay and keep generated stamps out of main."
[[patch.decision]]
id = "stamp-free-release-tags"
date = "2026-07-30"
decided = "tag-stamped-child-main-unstamped-parent"
rationale = "Both automatic release writers call prepare-release-tag, tag its prepared child, and keep main at the exact unstamped stack tip. Release consumes that bound tag and never finalizes versions onto main."
standing_policy = "Generated version stamps are tag-only. Tag preparation preserves the verified source lockfile with frozen installs; dependency resolution belongs before source verification."
[[patch.decision]]
id = "reuse-exact-source-ci-tests"
date = "2026-09-05"
decided = "narrow"
rationale = "Reuse successful main-push CI tests only for the exact release commit or its verified version-only direct parent. Require all test shards, check and release smoke jobs from that attempt; bound waiting and fall back to full release tests without trustworthy evidence. Reuse formatting, lint, Knip, types and tests only under that same exact-source evidence. Always verify packaged artifacts; missing evidence runs the complete shared source gate."
[[patch.decision]]
id = "upstream-release-publication-expansion"
date = "2026-09-16"
decided = "narrow"
rationale = "Keep the fork's leased tag-stamped-child publication model and intentional macOS-arm64 plus Linux-headless matrix instead of upstream npm, AUR, hosted-web, Discord, preview, and six-platform publication. Preserve upstream preview-tag parsing and unrelated Knip entry points alongside fork-nightly ordering and fork release-note tooling."
[[patch.decision]]
id = "upstream-release-relay-state-read"
date = "2026-09-20"
decided = "retire"
rationale = "Do not transplant upstream's production relay-state read into the fork's intentionally narrow release workflow; the fork release builds do not consume that removed relay-public-config job."
[[patch.decision]]
id = "release-test-git-fixture"
date = "2026-09-16"
decided = "relocate"
rationale = "Move the shared Git fixture from the later maintenance patch into release publication because release-tag, lease, CI-reuse, and release-note tests import it and must execute independently at this layer."

[[patch.decision]]
id = "desktop-update-full-changelog"
date = "2026-09-24"
decided = "adapt"
rationale = "Show the full changelog in the desktop update popup: the release body lists every upstream subject instead of the newest 20, and the popup parser keeps every item and every release group (the popup already scrolls). The parser also stops at GitHub's rendered footer, where the compare URL has become 'Full Changelog: v1...v2' text and previously leaked in as a fake change."

[[patch]]
name = "fork-maintenance-automation"
subject = "chore(fork): automate StGit stack maintenance and upstream replay"
class = "product"
purpose = "Route maintainers and agents through the StGit policy, validate and publish the stack with immutable leases and atomic metadata, replay during upstream synchronization, and publish fork-feature pushes on the already integrated upstream base."
retire_when = "Upstream or maintained shared tooling provides equivalent maintained-fork automation, or the fork intentionally stops requiring this concern."
depends_on = ["fork-release-publication", "fork-build-ci-compat"]
roles = ["agent-docs-owner"]
note = "Requires authored release entries for user-visible changes and validates them before publication. CI owns the shared verify-source checks including Knip; verify-stgit-replay stages immutable source/metadata inputs and waits for exact candidate CI. Main and release dereference that evidence instead of rerunning source verification, retaining published-stack policy, transfer-report baselines and artifact checks. Server verification stops scheduling tests after the first failure; passing candidates still run the full suite. Independent verification stages collect failures in one pass without weakening the publication gate. Nightly release-tag discovery uses a constant number of Git processes and aborts on lookup failure. Removed unused subject-based metadata reconstruction and obsolete maintenance plans; leased publication remains authoritative. Retiring persisted functionality requires an explicit data transition, immutable shipped migration IDs and frozen historical upgrade coverage. Product-bug instructions require evidence for each reported symptom, including cross-project PR routing and existing saved links/snapshots. Review also checked snapshot plumbing, diagnostics and obsolete mobile controller removals: these did not remove persisted orchestration event types. Retry limits remain unchanged pending genuine unattended observations."

[[patch.decision]]
id = "upstream-restyle-ceiling-retired"
date = "2026-09-24"
decided = "retire"
rationale = "Upstream 361b047f5 dropped the secondary className props the ceiling policed and deleted both the lint:restyle-ceiling script and its CI step. Drop the mirrored call from verify-source; keeping it would fail every check phase on a missing script. Supersedes upstream-restyle-ceiling-check."
[[patch.decision]]
id = "upstream-restyle-ceiling-check"
date = "2026-09-22"
decided = "adapt"
rationale = "Upstream added a lint:restyle-ceiling step to the CI check block this patch replaces with one verify-source call. Fold the new check into the shared check phase so verify-source keeps mirroring upstream instead of silently dropping a gate; the fork tip sits at upstream's ceiling of 1207 findings."

[[patch.decision]]
id = "nightly-delivery-candidate-enforcement"
date = "2026-09-20"
decided = "adapt"
rationale = "Enforce existing exact candidate CI at the leased publisher for every changed source, including manual packaging repairs. Pin controller syncs to a public upstream tag and commit, and follow-up releases to the verified main and integrated base. Preserve a single stamped artifact build and existing protected publication."
[[patch.decision]]
id = "feature-push-integrated-base"
date = "2026-09-19"
decided = "separate-feature-release-from-upstream-migration"
rationale = "Feature publication releases reviewed integrated source; selecting the newest upstream nightly caused redundant migrations and repair dispatches. The exact-base tag selector and successful main-push CI evidence preserve ancestry without another replay."
standing_policy = "Only upstream synchronization selects a new upstream source. Feature pushes use the unique nightly tag at the current stack base, or fail/skip explicitly; immutable leases and atomic publication remain required."
[[patch.decision]]
id = "queued-main-writer-start-binding"
date = "2026-07-30"
decided = "fail-stale-queued-checkouts"
issue = "brad/t3code-fork#2 comment 2757"
rationale = "A queued workflow may check out an older event SHA after another writer advances remote main. Bind every automatic writer's lease to its checked-out starting HEAD and fail before replay rather than adopting a newer remote lease."
standing_policy = "Never renew an automatic main writer's starting lease from the remote."
[[patch.decision]]
id = "nightly-net-source-change"
date = "2026-09-05"
decided = "narrow"
rationale = "Gate fork-only nightlies on the exact push-before and push-after packaged-source trees, not replayed commit history. Unknown history and manual dispatch retain the release path. Atomic main/tag publication removes the old 30-second visibility delay."

[[patch.decision]]
id = "mechanical-replay-and-reliability-measurement"
date = "2026-09-09"
decided = "narrow"
rationale = "Remove generated lockfile content from replay input and regenerate at the full tip; move fork task routes into an additive index. Measure per-target delivery, intervention and conflict exposure from retained evidence instead of inferring success from healthy polling."
[[patch.decision]]
id = "upstream-maintained-fork-automation"
date = "2026-09-16"
decided = "retain"
rationale = "Upstream does not provide the fork's concern-driven StGit replay, leased atomic publication, immutable snapshots, conflict handoff, fork reliability measurement, or agent maintenance policy. The shared Git fixture is omitted here after relocation to release publication."

[[patch.decision]]
id = "stgit-conflict-exit-status"
date = "2026-09-16"
decided = "adapt"
rationale = "Normalize replay failures that leave unmerged files to the driver's stable semantic-conflict status while preserving StGit's raw status for non-conflict failures; StGit 2.6.1 reports merge conflicts with exit 3 rather than the earlier exit 1."

[[patch.decision]]
id = "candidate-evidence-publication-remote"
date = "2026-09-21"
decided = "adapt"
rationale = "Outside Actions the gate resolved GITHUB_REPOSITORY from a bare `gh repo view`, which prefers the `upstream` remote the replay driver adds, so host-side verification looked for the candidate in upstream's repository and reported no candidate CI run. Resolve it from the staging remote instead, matching the documented rule that evidence lookup uses the publication remote."
