[[patch]]
name = "fork-unsupported-pr-hosts"
subject = "fix(server): skip PR status lookups for unsupported hosts"
class = "upstream-bound"
purpose = "Stop pull request status polling from repeatedly asking, and repeatedly warning about, a remote whose host has no implemented provider."
retire_when = "Upstream skips change request lookups for remotes with no registered provider instead of retrying the guaranteed failure."
depends_on = []
roles = []
note = "Unsupported provider results share the ordinary PR cache with a ten-minute TTL. Explicit status refresh and configured-provider routing changes invalidate the result; missing-PR refreshes do not repeat unsupported probes. Provider resolution occurs once per lookup. Reorganized 2026-09-06 from fork-pr-status-unsupported-hosts."
[[patch.decision]]
id = "upstream-no-open-pr-cache-ttl"
date = "2026-09-23"
decided = "adapt"
rationale = "Upstream now caches a settled lookup for PR_LOOKUP_NO_OPEN_PR_CACHE_TTL and keeps the short TTL only while a PR is open. Check the unsupported host first so its ten-minute skip still wins, then fall through to upstream's open/settled split. Also drop upstream's local sourceControlProvider rebinding in findLatestPrForHeadContext and keep upstream's probeableHeadSelectors on the provider this concern already passes in, so resolution stays once per lookup."

[[patch.decision]]
id = "upstream-provider-link-resolution"
date = "2026-09-16"
decided = "adapt"
rationale = "Keep the unsupported-host registry seam while preserving upstream's resolveLink delegation in the default test registry."
[[patch.decision]]
id = "future-gitea-routing-key"
date = "2026-09-16"
decided = "relocate"
rationale = "Keep the unsupported-host cache self-contained with cwd and epoch keys. The later Gitea connections patch owns routing-key invalidation and can adapt the shared PR cache coherently."

[[patch]]
name = "fork-worktree-cleanup"
