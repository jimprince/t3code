rationale = "Moving upstream's validateBundledClientAssets into scripts/lib/client-assets.ts gave the fork no behavior; build-desktop-artifact.ts was its only consumer, and the in-place extraction conflicted in six sync attempts. Take upstream's build-desktop-artifact.ts verbatim and delete the fork module."

[[patch.decision]]
id = "desktop-entry-name-unexport"
date = "2026-09-24"
decided = "relocate"
rationale = "resolveLinuxDesktopEntryName loses its only importer in fork-desktop-delivery, so its Knip-driven un-export belongs to that patch rather than to build tooling. This patch no longer edits upstream desktop source."

[[patch.decision]]
id = "knip-upstream-comment-verbatim"
date = "2026-09-24"
decided = "narrow"
rationale = "Keep upstream's scripts-workspace Knip comment verbatim so the fork changes only the entry array; upstream rewrote that comment alongside its own entry additions in previous conflicts."

[[patch.decision]]
id = "upstream12414-test-skill-browser-panel"
date = "2026-09-20"
decided = "relocate"
rationale = "Upstream replaced the broad web-testing skill with Browser-panel guidance and moved direct SQLite instructions into a focused reference. Keep the fork's fresh-worktree dependency-linking recovery, but relocate it into that SQLite reference instead of restoring the obsolete troubleshooting section."

[[patch.decision]]
id = "upstream-device-stream-knip-entries"
date = "2026-09-20"
decided = "narrow+adapt"
rationale = "Keep upstream's new PR-measurement and mobile device-stream Knip entries, retain only the fork's CI helper, Expo fingerprint, and oxlint-plugin declarations, and combine them in the upstream workspace stanzas."

[[patch.decision]]
id = "stashimagecompression-timeout"
date = "2026-07-29"
decided = "adapt"
rationale = "The too-large boundary test repeatedly exceeded the default timeout under parallel hosted CI while passing in isolation. Accept the one-line upstream-file edit until the test becomes reliably faster."

[[patch.decision]]
id = "editor-worker-test-animation-cleanup"
date = "2026-09-09"
decided = "adapt"
rationale = "Upstream1439 language-readiness tests can leave a worker state broadcast queued after animation globals are removed. Track and cancel remaining callbacks after worker/highlighter teardown; retire this edit when upstream owns equivalent cleanup."

[[patch.decision]]
id = "upstream11349-worker-broadcast-drain"
date = "2026-09-16"
decided = "retire"
rationale = "Upstream commit 8a2d5f545 drains the pool's final state broadcast before removing animation globals, satisfying this patch's cleanup requirement. Retire the fork's callback tracking and keep upstream's smaller teardown."

[[patch.decision]]
id = "upstream-windows-probe-env-inheritance"
date = "2026-09-16"
decided = "narrow"
rationale = "Upstream's cross-architecture Windows probe test inspected every child environment, so a T3 worker's ambient ELECTRON_RUN_AS_NODE value made the unrelated Node self-containment probe look like the skipped packaged-app probe. Scope the assertion to the packaged Windows executable while retaining the independent self-containment assertion."

[[patch.decision]]
id = "macos-worktree-realpath-exclusion"
date = "2026-09-16"
decided = "adapt"
rationale = "Canonicalize the configured data and worktree roots before comparing them with transcript cwd realpaths, and canonicalize auto-generated ServerConfig test roots before deriving guarded cleanup paths. macOS can spell the same temporary directory through /var and /private/var, which otherwise lets a symlinked managed worktree appear as an importable project or makes cleanup fixtures stop at the production symlink guard under the Node 24 CI runtime; symlink-boundary tests likewise compare canonical workspace paths."

[[patch.decision]]
id = "git-racy-clean-large-diff-fixture"
date = "2026-09-17"
decided = "adapt"
rationale = "Make upstream's large-diff fixture rewrite change byte length so Git must report the tracked edit even when the commit and rewrite share one filesystem timestamp; keep the complete branch and working-tree statistics assertions unchanged."

[[patch.decision]]
id = "upstream4029-highlighter-test-time-limit"
date = "2026-09-17"
decided = "adapt"
rationale = "Disable Shiki's wall-clock tokenization cutoff only in the native review and source/snippet highlighter test wrappers so grammar-isolation and cold-initialization assertions cannot return partial tokens when parallel repository verification saturates the host; production tokenization keeps its safety cutoff."

[[patch.decision]]
id = "upstream9902-file-highlight-test-budget"
date = "2026-09-17"
decided = "adapt"
rationale = "Keep upstream's 7,000-line real-worker stale-highlight regression intact, but give its two CPU-bound edit cases 30 seconds so they do not fail at the 15-second default while the complete repository gate saturates the host."

[[patch]]
name = "fork-worker-operations"
subject = "feat(fork): operate worker threads from the t3-thread CLI"
class = "product"
purpose = "Provide the additive t3-thread operator CLI with pairing, persistent worker identity injected into provider processes, creation, continuation, results, and monitoring."
retire_when = "Upstream or maintained shared tooling provides an equivalent scriptable worker interface, or the fork intentionally stops requiring this concern."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "env forget removes local pairings offline, requiring --force to discard dependent routing and queued sends. Worker sends queue durably while a turn is running and drain FIFO at the next boundary. Routed notifications retain bounded retries, terminal outcomes, and watcher handoff/recovery (Gitea38/39); subscribe baselines and supersession keep routing to one event per new transition (Gitea49). The CLI queue can migrate to server after-current delivery when upstream7240 ships; adapter steering remains separate."

[[patch]]
name = "fork-provider-turn-safety"
subject = "fix(server): protect provider turns across recovery and restarts"
class = "divergence"
purpose = "Reserve pending sends against reaper recovery, keep live turn markers and steering, reconcile boot generations, recover provider runtimes and lifecycle events, and keep the fork migration ledger with historical migration compatibility."
retire_when = "Upstream adds equivalent pending-turn reservation, boot-generation reconciliation, and provider runtime recovery."
depends_on = []
roles = []
note = "Removed unused OpenCode server-pool scaffolding. Active upstream OpenCode server ownership, live steering, reservations and runtime recovery remain."

[[patch.decision]]
id = "upstream2237-request-user-input-is-blocking"
date = "2026-09-25"
decided = "adapt"
rationale = "Codex made requestUserInput carry a required isBlocking flag and deprecated autoResolutionMs. This concern's fork lifecycle harness emits that request itself, so the payload never conflicted; it decoded to nothing and the test hung waiting for events that were never mapped. Send isBlocking the way upstream's own adapter test now does."

[[patch.decision]]
id = "upstream2237-codex-turn-additional-context"
date = "2026-09-25"
decided = "adapt"
rationale = "Upstream split Codex turn instructions: buildCodexDeveloperInstructions now takes only the collaboration mode and the runtime/tool blocks moved to buildCodexAdditionalContext on turn/start. This concern's fork harness duplicates that wiring and no merge touches it, so mirror upstream's split here instead of keeping the old three-argument call."

[[patch.decision]]
id = "upstream2237-reset-credit-coordinator-rename"
date = "2026-09-25"
decided = "relocate"
rationale = "Upstream generalized codexResetCredit.ts to resetCreditCoordinator.ts for every provider that banks resets. The fork registry harness only needs the moved layerTest, so follow the module to its new name."

[[patch.decision]]
id = "upstream2237-migration-ledger-extension"
date = "2026-09-25"
decided = "adapt"
rationale = "The fork has already shipped migration IDs 33-37, so preserve the established offset and map upstream migration 54 to fork ID 59. Upstream's own 054 migration test drives runMigrations by slot, so it is adapted to the fork slots 58 and 59 the way 050's test already is."

[[patch.decision]]
id = "upstream13328-registry-compatibility-advisory"
date = "2026-09-24"
decided = "adapt"
rationale = "Upstream d4cd7d5c3 makes ProviderRegistryLive stamp a compatibility advisory onto every enabled, installed snapshot it exposes or caches, and adapted its own registry harness with a withBundledCompatibility helper. This patch keeps a fork copy of that harness, which no merge touches, so the drift only appeared as five failing assertions in candidate CI. Mirror upstream's helper here rather than loosening the assertions."

[[patch.decision]]
id = "upstream-provider-registry-model-manifest"
date = "2026-09-23"
decided = "adapt"
rationale = "ProviderRegistryLive now requires the ModelManifest service, so this concern's fork tests build it with Layer.provideMerge(ModelManifest.layerTest) the way upstream's own ProviderRegistry tests do. The replay stays textually clean, so only the server typecheck catches this drift."

[[patch.decision]]
id = "upstream-sqlite-layer-configuration"
date = "2026-09-20"
decided = "adapt"
rationale = "Use upstream's explicit in-memory SQLite layer configuration in migration tests while preserving the fork's shipped migration-ID offset and its historical-ledger assertions."

[[patch.decision]]
id = "upstream-codex-stop-settlement-order"
date = "2026-09-20"
decided = "adapt"
rationale = "Settle upstream's blocking approval and user-input requests before the fork pauses an active Codex goal, then interrupt child and parent turns. This preserves Stop's deadlock avoidance and prevents goal continuation from restarting work."

[[patch.decision]]
id = "release-writer-before-instance-handoff"
date = "2026-09-09"
decided = "adapt"
rationale = "Compatible Codex instances share conversation storage. Stop the old instance before resuming on the replacement and propagate stop failures; preserve upstream binding and resume-cursor structures without adding schemas or migrations."

[[patch.decision]]
id = "providerservice-mcp-touch"
date = "2026-07-28"
decided = "adapt"
rationale = "Upstream added McpSessionRegistry.touchActiveMcpThread before sendTurn; the fork wraps sendTurn in a reservation gate. Independent concerns. The touch belongs inside the gate immediately before the real sendTurn, because touching earlier would change upstream semantics when reservation fails and no turn is sent."
[[patch.decision]]
id = "allow-live-turn-steering"
date = "2026-09-05"
decided = "narrow"
rationale = "Upstream adapters accept follow-ups during a running turn. Permit sends when the adapter reports the same real turn id, without replacing its marker; inspect live state before the stale-marker age gate. Keep pending-send exclusion and conservative reconciliation for unmatched markers so recovery cannot claim an in-flight send."
[[patch.decision]]
id = "upstream1286-restart-import"
date = "2026-09-05"
decided = "adapt"
rationale = "Preserve upstream shell-only metadata commands, transcript import writes and restart-continuation marker consumption inside the reservation-protected send. Keep archived-session stop lookup and live-turn steering."
[[patch.decision]]
id = "upstream-opencode-probe-pool"
date = "2026-08-29"
decided = "adapt"
rationale = "Retain upstream's explicit probe pool and CLI inventory path while keeping the fork's per-instance server owner for runtime recovery and text generation. Configured external servers continue through the fork's password-aware, version-validating connection path."

[[patch.decision]]
id = "upstream11338-claude-native-rewind"
date = "2026-09-16"
decided = "retire"
rationale = "Upstream commits fd5553f1a and eed974c12 now persist native Claude turn-start message IDs and fork exact provider history during rewind, including remapping retained boundaries when fork history lengths change. Retire the fork's older assistant-boundary map while preserving its independent imported-session controls and provider recovery safeguards."

[[patch.decision]]
id = "upstream1825-migration-ledger-extension"
date = "2026-09-16"
decided = "adapt"
rationale = "The fork has already shipped migration IDs 33-37, so upstream migrations 33-50 remain mapped to 38-55. Extend that compatibility ledger by mapping new upstream migrations 51 and 52 to fork IDs 56 and 57."

[[patch.decision]]
id = "upstream1895-migration-ledger-extension"
date = "2026-09-18"
