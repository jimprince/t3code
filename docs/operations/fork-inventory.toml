rationale = "Keep upstream's 7,000-line real-worker stale-highlight regression intact, but give its two CPU-bound edit cases 30 seconds so they do not fail at the 15-second default while the complete repository gate saturates the host."

[[patch]]
name = "fork-worker-operations"
subject = "feat(fork): operate worker threads from the t3-thread CLI"
class = "product"
purpose = "Provide the additive t3-thread operator CLI with pairing, persistent worker identity injected into provider processes, creation, continuation, results, monitoring, persisted sidebar ordering, and project automation commands."
retire_when = "Upstream or maintained shared tooling provides an equivalent scriptable worker interface, or the fork intentionally stops requiring this concern."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "#221: Read-only JSON host snapshots share one connection with bounded, cancellable queue reads and per-thread errors; no session refresh or watcher revival. #218: MCP reads and queued send results expose queueHeld; t3_queue_resume uses the authorized native queue.resume service action. Existing old-item consent remains; new queued sends inherit it visibly. #220: A raw Node descriptor avoids FileHandle GC release while a mutator is pending. Routing state uses an inherited persistent sidecar FD and /usr/bin/perl flock on Linux and macOS, with the existing ten-second bound, last-recorded holder diagnostics, automatic crash release and unchanged state JSON. No native dependency or PID sentinel fallback. The prebuilt CLI guard allows only the exact exported Perl flock script with an inherited numeric FD and still rejects loader/build and other subprocesses. The standalone CLI bundles shared contract subpaths and keeps only a narrow adapter for legacy model selections and sparse provider config. Opaque activity, context, metadata and provider-option payloads pass through unchanged. env forget removes local pairings offline, requiring --force to discard dependent routing and queued sends. Worker sends queue durably while a turn is running and drain FIFO at the next boundary. Routed notifications retain bounded retries, terminal outcomes, and watcher handoff/recovery (Gitea38/39); subscribe baselines and supersession keep routing to one event per new transition (Gitea49). Worker bootstrap and inter-thread messages include identity and reply headers. Notifications to an explicitly settled subscriber are held (not keeping the watcher awake, since each pass snapshots every saved agent), superseded down to the newest per route, re-checked each minute while a watcher runs, and released immediately by t3-thread unsettle; settle lists the subscriber's routes and unsubscribe accepts --subscriber and raw routed thread ids. order/move write the server's shared pinned or active sibling order, and order --reset restores automatic placement. The CLI queue can migrate to server after-current delivery when upstream7240 ships; adapter steering remains separate."

[[patch.decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Use protocol 2 native launch, message dispatch, runtime requests and scoped projections. Keep operator routing state; isolate subscription handlers from upstream hotspots. Notification and nesting parity remain M2; automations remain M3. V2 has no order-reset operation and Cursor local SDK cannot isolate process identity per concurrent session."

[[patch.decision]]
id = "v2-port-2689-m2"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Resolve shared-runtime worker identity through the per-session MCP caller, with explicit CLI identity-unavailable fallback. Preserve native held-queue outcomes and actionable plan state for parent notifications. Organizational metadata reads and nest/unnest use the M2 fork sidecar independently of execution lineage. Remote parents and order reset require their advertised capability; project automation remains M3."

[[patch.decision]]
id = "socket-open-209-worker-operations"
date = "2026-10-08"
decided = "adapt"
rationale = "Retry only socket opening before RPC delivery with fresh tickets and scopes, a bounded deadline, and no mutation replay."

