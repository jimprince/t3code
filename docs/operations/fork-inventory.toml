# Fork Patch Inventory — schema version 2
#
# This ordered registry is part of the stack interface. Every applied StGit
# patch has exactly one entry, in stack.json.applied order. A patch owns its
# implementation, tests, applicable documentation, and this stanza. Paths may
# overlap; coherent purpose, not exclusive files, determines ownership.
#
# STANZA POSITION MATTERS: [[patch]] blocks must appear in exactly the same
# order as stack.json.applied, so a NEW patch created at the top of the stack
# adds its stanza at the END of this file — not next to thematically related
# entries. scripts/ci/check-stgit-stack fails the stack otherwise.
#
# class: product | divergence | upstream-bound

schema = 2
fork = "jimprince/t3code"
upstream = "pingdotgg/t3code"

[[patch]]
name = "fork-stgit-stack-policy"
subject = "docs(fork): define StGit stack policy"
class = "product"
purpose = "Route maintainers and agents through the executable StGit maintenance, validation, and publication policy."
retire_when = "Upstream or maintained shared tooling provides equivalent capabilities, or the fork intentionally stops requiring this concern."
depends_on = []
roles = ["agent-docs-owner"]

[[patch]]
name = "fork-build-workspace-tooling"
subject = "build(fork): configure workspace tooling"
class = "product"
purpose = "Configure the fork workspace, dependency graph, and reusable build tooling required by its additive applications."
retire_when = "Upstream or maintained shared tooling provides equivalent capabilities, or the fork intentionally stops requiring this concern."
depends_on = ["fork-stgit-stack-policy"]
roles = ["lockfile-owner"]
note = "pnpm-lock.yaml is generated: take upstream's lockfile during a conflict, then regenerate it AT THE STACK TIP and copy it back into this patch. Regenerating while only the early patches are applied omits workspaces that later patches add (apps/t3-thread), which then fails --frozen-lockfile in CI."

[[patch]]
name = "fork-t3-thread-operator-cli"
subject = "feat(fork): add t3-thread operator CLI"
class = "product"
purpose = "Provide the additive t3-thread operator CLI, which has no upstream equivalent."
retire_when = "Upstream or maintained shared tooling provides equivalent capabilities, or the fork intentionally stops requiring this concern."
depends_on = ["fork-build-workspace-tooling"]
roles = []
note = "CLI sends still require an explicit allowWhileRunning path; this is distinct from server adapter steering. Focused send-while-running tests document the rejection and the separate durable queue gap (Gitea PR25/issue27)."

[[patch]]
name = "fork-provider-turn-reservation"
subject = "fix(server): reserve active provider turns"
class = "divergence"
purpose = "Reserve pending sends against reaper recovery while preserving live turn markers and provider steering."
retire_when = "Upstream adds equivalent pending-turn reservation semantics."
depends_on = ["fork-stgit-stack-policy"]
roles = []
[[patch.decision]]
id = "providerservice-mcp-touch"
date = "2026-07-28"
decided = "adapt"
rationale = "Upstream added McpSessionRegistry.touchActiveMcpThread before sendTurn; the fork wraps sendTurn in a reservation gate. Independent concerns. The touch belongs inside the gate immediately before the real sendTurn, because touching earlier would change upstream semantics when reservation fails and no turn is sent."
[[patch.decision]]
id = "allow-live-turn-steering"
date = "2026-09-05"
decided = "narrow"
rationale = "Upstream adapters accept follow-ups during a running turn. Permit sends when the adapter reports the same real turn id, without replacing its marker; inspect live state before the stale-marker age gate. Keep pending-send exclusion and conservative reconciliation for unmatched markers so recovery cannot claim an in-flight send."

[[patch]]
name = "fork-provider-runtime-recovery"
subject = "fix(server): recover provider runtimes"
class = "divergence"
purpose = "Recover provider sessions and lifecycle state predictably after crashes, restarts, and partial startup."
retire_when = "Upstream provides equivalent provider runtime recovery and lifecycle guarantees."
depends_on = ["fork-provider-turn-reservation"]
roles = []
[[patch.decision]]
id = "upstream-opencode-probe-pool"
date = "2026-08-29"
decided = "adapt"
rationale = "Retain upstream's explicit probe pool and CLI inventory path while keeping the fork's per-instance server owner for runtime recovery and text generation. Configured external servers continue through the fork's password-aware, version-validating connection path."

# Cache-removal tests await refresh completion and persisted update events, avoiding fixed clock-poll loops.

[[patch]]
name = "fork-provider-observability"
subject = "fix(server): bound provider observability"
class = "divergence"
purpose = "Retain bounded fork diagnostics, provider-log eviction, trace throttling, and Spotlight markers."
retire_when = "Upstream covers the retained logging, eviction, and diagnostic capabilities."
depends_on = ["fork-provider-runtime-recovery"]
roles = []
[[patch.decision]]
id = "logger-supersession-951"
date = "2026-07-29"
decided = "retire+narrow+adapt (per capability)"
analysis = "docs/analysis/logger-supersession.md"
rationale = "Upstream v0.0.31 rework (49c0d96ed) superseded per-thread writer splitting, shutdown flush, and native/canonical file separation, so those pieces retired. Keep releaseThread eviction adapted to upstream's store, trace-span rate limiting, and the Spotlight marker. Layer the fork's 2GiB/30d logsDir sweep over upstream's 512MiB/14d provider policy."

[[patch]]
name = "fork-thread-lifecycle-recovery"
subject = "fix(server): recover thread lifecycle"
class = "divergence"
purpose = "Preserve thread state and snapshot handoff correctness across server reconnects and lifecycle recovery."
retire_when = "Upstream supplies equivalent lifecycle recovery and atomic snapshot handoff."
depends_on = ["fork-provider-runtime-recovery"]
roles = []
[[patch.decision]]
id = "ws-snapshot-projection"
date = "2026-07-28"
decided = "retire"
rationale = "Upstream's projectThreadDetailSnapshot spreads the complete snapshot and prunes activity payloads, a strict superset of the old hand-rolled projection. Retain upstream's call while binding it to the fork's threadDetailSnapshot name; do not restore the retired projection."
[[patch.decision]]
id = "thread-detail-snapshot-api"
date = "2026-08-07"
decided = "retire+narrow"
rationale = "Upstream v0.0.33 shipped getThreadDetailSnapshot(threadId, window?) returning OrchestrationThreadDetailSnapshot with snapshotSequence read in one transaction — the fork's atomic-handoff guarantee verbatim, plus opt-in turn pagination the fork never had. That is this patch's recorded retire_when for the snapshot capability, so the fork's getThreadDetailSnapshotById is retired and every caller (http.ts, ws.ts, tests) moved to upstream's name. Lifecycle recovery itself is NOT retired and stays in this patch. Narrowed rather than fully retired because one fork behavior survives: upstream's pagination is opt-in, so the unwindowed activity read is still unbounded, and the fork keeps capping it at THREAD_DETAIL_ACTIVITY_LIMIT — an unbounded activity list is what stalls snapshot handoff on reconnect."
[[patch.decision]]
id = "provider-session-reconciliation"
date = "2026-08-21"
decided = "retire+narrow"
rationale = "Upstream #7719 now reconciles orphaned provider sessions and running turns while also preserving live sessions, repairing provider-directory bindings, covering archived and stale-active-turn cases, and bounding per-thread failures. Retire the fork's earlier startup reconciler and its duplicate tests so it cannot settle sessions before upstream's stronger reconciliation runs; keep the remaining lifecycle and bounded snapshot behavior in this patch."

