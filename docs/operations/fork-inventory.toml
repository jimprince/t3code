# Fork Patch Inventory — schema version 2
#
# This ordered registry is part of the stack interface. Every applied StGit
# patch has exactly one entry, in stack.json.applied order. A patch owns its
# implementation, tests, applicable documentation, and this stanza. Paths may
# overlap; coherent purpose, not exclusive files, determines ownership.
#
# STANZA POSITION MATTERS: [[patch]] blocks must appear in exactly the same
# order as stack.json.applied, so a NEW patch created at the top of the stack
# adds its stanza at the END of this file — not next to thematically related
# entries. scripts/ci/check-stgit-stack fails the stack otherwise.
#
# class: product | divergence | upstream-bound

schema = 2
fork = "jimprince/t3code"
upstream = "pingdotgg/t3code"

[[patch]]
# Upstream1286 Knip: declare shell/Expo entries and complete vendored CLI contracts.
# Remove the obsolete Electron installer and redundant plugin-local Effect TSGo dependency.
name = "fork-build-ci-compat"
subject = "build(fork): support fork workspace, runners, and CI budgets"
class = "product"
purpose = "Configure the fork workspace, dependency graph, lockfile, available CI runners, and the targeted test budgets its additive applications need."
retire_when = "Upstream or maintained shared tooling provides equivalent workspace, runner, and test-budget support, or the fork intentionally stops requiring this concern."
depends_on = []
roles = ["lockfile-owner"]
note = "Keep upstream and fork script entry points in one Knip workspace stanza. Removed the unrelated wall-clock assertion from activity-reuse coverage; the observable identity-reuse test and justified compression-test headroom remain. Regenerate pnpm-lock.yaml only at the complete stack tip, then copy it into this owning patch; mid-stack generation omits later workspaces."
[[patch.decision]]
id = "stashimagecompression-timeout"
date = "2026-07-29"
decided = "adapt"
rationale = "The too-large boundary test repeatedly exceeded the default timeout under parallel hosted CI while passing in isolation. Accept the one-line upstream-file edit until the test becomes reliably faster."

[[patch]]
name = "fork-worker-operations"
subject = "feat(fork): operate worker threads from the t3-thread CLI"
class = "product"
purpose = "Provide the additive t3-thread operator CLI with pairing, persistent worker identity injected into provider processes, creation, continuation, results, and monitoring."
retire_when = "Upstream or maintained shared tooling provides an equivalent scriptable worker interface, or the fork intentionally stops requiring this concern."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "Reorganized 2026-09-06 from fork-t3-thread-operator-cli. [fork-t3-thread-operator-cli] CLI sends still require an explicit allowWhileRunning path; this is distinct from server adapter steering. Focused send-while-running tests document the rejection and the separate durable queue gap (Gitea PR25/issue27)."

[[patch]]
name = "fork-provider-turn-safety"
subject = "fix(server): protect provider turns across recovery and restarts"
class = "divergence"
purpose = "Reserve pending sends against reaper recovery, keep live turn markers and steering, reconcile boot generations, recover provider runtimes and lifecycle events, and keep the fork migration ledger with historical migration compatibility."
retire_when = "Upstream adds equivalent pending-turn reservation, boot-generation reconciliation, and provider runtime recovery."
depends_on = []
roles = []
note = "Removed unused OpenCode server-pool scaffolding. Active upstream OpenCode server ownership, live steering, reservations and runtime recovery remain."
[[patch.decision]]
id = "providerservice-mcp-touch"
date = "2026-07-28"
decided = "adapt"
rationale = "Upstream added McpSessionRegistry.touchActiveMcpThread before sendTurn; the fork wraps sendTurn in a reservation gate. Independent concerns. The touch belongs inside the gate immediately before the real sendTurn, because touching earlier would change upstream semantics when reservation fails and no turn is sent."
[[patch.decision]]
id = "allow-live-turn-steering"
date = "2026-09-05"
decided = "narrow"
rationale = "Upstream adapters accept follow-ups during a running turn. Permit sends when the adapter reports the same real turn id, without replacing its marker; inspect live state before the stale-marker age gate. Keep pending-send exclusion and conservative reconciliation for unmatched markers so recovery cannot claim an in-flight send."
[[patch.decision]]
id = "upstream1286-restart-import"
date = "2026-09-05"
decided = "adapt"
rationale = "Preserve upstream shell-only metadata commands, transcript import writes and restart-continuation marker consumption inside the reservation-protected send. Keep archived-session stop lookup and live-turn steering."
[[patch.decision]]
id = "upstream-opencode-probe-pool"
date = "2026-08-29"
decided = "adapt"
rationale = "Retain upstream's explicit probe pool and CLI inventory path while keeping the fork's per-instance server owner for runtime recovery and text generation. Configured external servers continue through the fork's password-aware, version-validating connection path."

# Cache-removal tests await refresh completion and persisted update events, avoiding fixed clock-poll loops.

[[patch]]
name = "fork-bounded-diagnostics"
subject = "fix(server): bound diagnostics, log retention, and trace volume"
class = "divergence"
purpose = "Retain bounded fork diagnostics: log-directory retention budget, stopped-thread sink eviction, trace throttling, and Spotlight exclusion markers."
retire_when = "Upstream covers the retained logging, eviction, and diagnostic capabilities."
depends_on = ["fork-provider-turn-safety"]
roles = []
note = "Removed the stale logger-supersession assessment; bounded logs, traces and retention behavior remain."
[[patch.decision]]
id = "logger-supersession-951"
date = "2026-07-29"
decided = "retire+narrow+adapt (per capability)"
analysis = "docs/analysis/logger-supersession.md"
rationale = "Upstream v0.0.31 rework (49c0d96ed) superseded per-thread writer splitting, shutdown flush, and native/canonical file separation, so those pieces retired. Keep releaseThread eviction adapted to upstream's store, trace-span rate limiting, and the Spotlight marker. Layer the fork's 2GiB/30d logsDir sweep over upstream's 512MiB/14d provider policy."

[[patch]]
name = "fork-thread-client-recovery"
subject = "fix(threads): recover thread and client state after disruptions"
class = "divergence"
purpose = "Keep thread lifecycle, reconnect snapshots, pending-input, session-status, and loading state coherent across server restarts and client disruptions on web and mobile."
retire_when = "Upstream supplies equivalent lifecycle recovery, bounded snapshot handoff, and client recovery semantics."
depends_on = ["fork-provider-turn-safety"]
roles = []
note = "Reorganized 2026-09-06 from fork-thread-lifecycle-recovery, fork-web-client-resilience. [fork-thread-lifecycle-recovery] Upstream1286 checkpoint validation is asynchronous; use it for the resolved revert workspace. Keep upstream shell-only stop-session tests; do not restore tests for its removed startup heartbeat helper."
[[patch.decision]]
id = "ws-snapshot-projection"
date = "2026-07-28"
decided = "retire"
rationale = "Upstream's projectThreadDetailSnapshot spreads the complete snapshot and prunes activity payloads, a strict superset of the old hand-rolled projection. Retain upstream's call while binding it to the fork's threadDetailSnapshot name; do not restore the retired projection."
[[patch.decision]]
id = "thread-detail-snapshot-api"
date = "2026-08-07"
decided = "retire+narrow"
rationale = "Upstream v0.0.33 shipped getThreadDetailSnapshot(threadId, window?) returning OrchestrationThreadDetailSnapshot with snapshotSequence read in one transaction — the fork's atomic-handoff guarantee verbatim, plus opt-in turn pagination the fork never had. That is this patch's recorded retire_when for the snapshot capability, so the fork's getThreadDetailSnapshotById is retired and every caller (http.ts, ws.ts, tests) moved to upstream's name. Lifecycle recovery itself is NOT retired and stays in this patch. Narrowed rather than fully retired because one fork behavior survives: upstream's pagination is opt-in, so the unwindowed activity read is still unbounded, and the fork keeps capping it at THREAD_DETAIL_ACTIVITY_LIMIT — an unbounded activity list is what stalls snapshot handoff on reconnect."
[[patch.decision]]
id = "provider-session-reconciliation"
date = "2026-08-21"
decided = "retire+narrow"
rationale = "Upstream #7719 now reconciles orphaned provider sessions and running turns while also preserving live sessions, repairing provider-directory bindings, covering archived and stale-active-turn cases, and bounding per-thread failures. Retire the fork's earlier startup reconciler and its duplicate tests so it cannot settle sessions before upstream's stronger reconciliation runs; keep the remaining lifecycle and bounded snapshot behavior in this patch."

[[patch]]
name = "fork-general-chat"
subject = "feat(projects): add repository-independent General Chat projects"
class = "product"
purpose = "Provide server-owned General Chat projects: the project kind contract and migrations, startup creation, decider guards, projection handling, sidebar grouping, and default compose behavior."
retire_when = "Upstream ships an equivalent repository-independent chat project kind."
depends_on = ["fork-thread-client-recovery"]
roles = []
note = "Reorganized 2026-09-06 from fork-general-chat-projects."
[[patch.decision]]
id = "chat-enrichment-guard-951"
date = "2026-07-29"
decided = "retire"
rationale = "Upstream adopted isChatProjectRow filtering in ProjectionSnapshotQuery enrichment, covering the fork guard. Retire the duplicate ws.ts enrichment and the related obsolete IPC, local API, and server stubs."
[[patch.decision]]
id = "sidebar-project-header-styling"
date = "2026-07-28"
decided = "adapt"
rationale = "The fork owns the General Chat structure (hideProjectHeader wrapper and chat affordance); upstream owns the design system. Preserve the structural additions while taking upstream styling."

[[patch]]
name = "fork-conversation-fork"
subject = "feat(threads): fork a conversation from a selected message"
class = "product"
purpose = "Branch a conversation from a selected message with retained checkpoints: the boundary logic, orchestration command and RPC, provider-native fork support, and the web message menu."
retire_when = "Upstream ships equivalent end-to-end conversation forking."
depends_on = ["fork-provider-turn-safety", "fork-thread-client-recovery"]
roles = []
note = "Reorganized 2026-09-06 from fork-thread-fork."

[[patch]]
name = "fork-thread-transfer"
subject = "feat(threads): transfer threads between environments"
class = "product"
purpose = "Move a thread and its workspace context between environments: export/import bundles, provider context handoff, RPC registration, and coordinated web and desktop flows."
retire_when = "Upstream ships equivalent cross-environment thread moves."
depends_on = ["fork-thread-client-recovery", "fork-conversation-fork", "fork-general-chat"]
roles = []
note = "Reorganized 2026-09-06 from fork-thread-transfer."

[[patch]]
name = "fork-thread-history-compatibility"
subject = "fix(threads): preserve historical goal data without goal automation"
class = "divergence"
purpose = "Keep existing thread snapshots, event replay and transferred history readable after removing the fork goal feature. No goal creation, evaluation or automatic continuation remains."
retire_when = "Support for databases and transferred histories containing legacy goal records has explicitly ended or those records have been losslessly migrated."
depends_on = ["fork-thread-client-recovery", "fork-thread-transfer"]
roles = []
note = "Brad approved removing goals on 2026-09-05. Retain only historical schema, projection and import compatibility; numbered migrations remain in the migration ledger."
[[patch.decision]]
id = "gitmanager-faketextgeneration"
date = "2026-07-28"
decided = "retire"
rationale = "Upstream replaced the duplicate hand-written interface with TextGeneration['Service']; keep the upstream type alias and do not restore the redundant interface."

[[patch]]
name = "fork-project-selection"
subject = "feat(web): select multiple projects in the sidebar"
class = "product"
purpose = "Provide multi-select, partial-state, and isolation controls for sidebar project scope."
retire_when = "Upstream ships equivalent multi-project selection and isolation."
depends_on = ["fork-general-chat"]
roles = []
note = "Owns multi-project selection and mobile project activity grouping; obsolete implementation plans removed."
[[patch.decision]]
id = "sidebarv2-project-scope"
date = "2026-07-28"
decided = "keep-multiselect"
decided_by = "brad"
issue = "http://git.home/brad/fork-decisions/issues/1"
rationale = "Upstream ships single-select projectScope while the fork provides checkbox partial states and isolation. Preserve the fork's multi-select behavior and port it onto upstream's current menu structure."
note = "Upstream1286 persists single-project scope in the UI store; retain that persistence while layering fork hidden-project selection."
standing_policy = "Do not retire multi-select to upstream's single-select model. Re-escalate only if upstream removes projectScope entirely."
resolution_kind = "relocate"
status = "ported-and-uat-verified-2026-07-29"

[[patch]]
name = "fork-manual-thread-order"
subject = "feat(sidebar): arrange inbox threads by hand"
class = "upstream-bound"
purpose = "Let operators arrange the unpinned inbox list by drag, menu, and mobile move controls, persisting a separate sidebarOrderKey per server with a reset to default order."
retire_when = "Upstream ships manual ordering for the unpinned thread list, at which point the sidebarOrderKey field, thread.sidebar.reorder command, and threadSidebarReorder capability retire in favor of upstream."
depends_on = ["fork-provider-turn-safety"]
roles = []
note = "Reorganized 2026-09-06 from fork-sidebar-thread-order. [fork-sidebar-thread-order] sidebarOrderKey is a SEPARATE column from upstream's pin_order_key on purpose: thread.unpinned clears pin_order_key, so sharing the field would silently destroy an inbox placement on every pin/unpin cycle. The fork schema change lands in ForkMigrations, not upstream's Migrations sequence. dnd-kit alone owns sidebar card movement; do not attach outer list auto-animation or toggle card content-visibility at drop, which combines competing transforms with paint-containment changes."
