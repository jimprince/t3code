# Fork Patch Inventory — schema version 2
#
# This ordered registry is part of the stack interface. Every applied StGit
# patch has exactly one entry, in stack.json.applied order. A patch owns its
# implementation, tests, applicable documentation, and this stanza. Paths may
# overlap; coherent purpose, not exclusive files, determines ownership.
#
# STANZA POSITION MATTERS: [[patch]] blocks must appear in exactly the same
# order as stack.json.applied, so a NEW patch created at the top of the stack
# adds its stanza at the END of this file — not next to thematically related
# entries. scripts/ci/check-stgit-stack fails the stack otherwise.
#
# class: product | divergence | upstream-bound

schema = 2
fork = "jimprince/t3code"
upstream = "pingdotgg/t3code"

[[patch]]
# Upstream1286 Knip: declare shell/Expo entries and CLI workspace dependencies.
# Remove the obsolete Electron installer and redundant plugin-local Effect TSGo dependency.
name = "fork-build-ci-compat"
subject = "build(fork): support fork workspace, runners, and CI budgets"
class = "product"
purpose = "Configure the fork workspace, dependency graph, lockfile, available CI runners, and the targeted test budgets its additive applications need."
retire_when = "Upstream or maintained shared tooling provides equivalent workspace, runner, and test-budget support, or the fork intentionally stops requiring this concern."
depends_on = []
roles = ["lockfile-owner"]
note = "Keep upstream and fork script entry points in one Knip workspace stanza. Removed the unrelated wall-clock assertion from activity-reuse coverage; the observable identity-reuse test and justified compression-test headroom remain. The replay driver removes the old generated lockfile delta before rebase and regenerates at the complete tip, then refreshes this owner. Published main retains a consistent frozen-install lockfile; mid-stack generation omits later workspaces. Pin dependencies with exact-version patches to that version; expo-audio 57.0.5 satisfies ~57.0.4 but still lacks the recorder failure-state fix in the 57.0.4 patch."

[[patch.decision]]
id = "web-typecheck-annotation-workarounds"
date = "2026-09-24"
decided = "retire"
rationale = "The explicit LegendList render-item annotations in ModelPickerContent and the AtomRegistry cast in PreviewAutomationHosts were typecheck workarounds this patch carried in two upstream files that change often. Upstream's current types infer both, so verify-source check passes without them; drop the edits and take upstream's files verbatim."

[[patch.decision]]
id = "desktop-artifact-client-asset-extraction"
date = "2026-09-24"
decided = "retire"
rationale = "Moving upstream's validateBundledClientAssets into scripts/lib/client-assets.ts gave the fork no behavior; build-desktop-artifact.ts was its only consumer, and the in-place extraction conflicted in six sync attempts. Take upstream's build-desktop-artifact.ts verbatim and delete the fork module."

[[patch.decision]]
id = "desktop-entry-name-unexport"
date = "2026-09-24"
decided = "relocate"
rationale = "resolveLinuxDesktopEntryName loses its only importer in fork-desktop-delivery, so its Knip-driven un-export belongs to that patch rather than to build tooling. This patch no longer edits upstream desktop source."

[[patch.decision]]
id = "knip-upstream-comment-verbatim"
date = "2026-09-24"
decided = "narrow"
rationale = "Keep upstream's scripts-workspace Knip comment verbatim so the fork changes only the entry array; upstream rewrote that comment alongside its own entry additions in previous conflicts."

[[patch.decision]]
id = "upstream12414-test-skill-browser-panel"
date = "2026-09-20"
decided = "relocate"
rationale = "Upstream replaced the broad web-testing skill with Browser-panel guidance and moved direct SQLite instructions into a focused reference. Keep the fork's fresh-worktree dependency-linking recovery, but relocate it into that SQLite reference instead of restoring the obsolete troubleshooting section."

[[patch.decision]]
id = "upstream-device-stream-knip-entries"
date = "2026-09-20"
decided = "narrow+adapt"
rationale = "Keep upstream's new PR-measurement and mobile device-stream Knip entries, retain only the fork's CI helper, Expo fingerprint, and oxlint-plugin declarations, and combine them in the upstream workspace stanzas."

[[patch.decision]]
id = "stashimagecompression-timeout"
date = "2026-07-29"
decided = "adapt"
rationale = "The too-large boundary test repeatedly exceeded the default timeout under parallel hosted CI while passing in isolation. Accept the one-line upstream-file edit until the test becomes reliably faster."

[[patch.decision]]
id = "editor-worker-test-animation-cleanup"
date = "2026-09-09"
decided = "adapt"
rationale = "Upstream1439 language-readiness tests can leave a worker state broadcast queued after animation globals are removed. Track and cancel remaining callbacks after worker/highlighter teardown; retire this edit when upstream owns equivalent cleanup."

[[patch.decision]]
id = "upstream11349-worker-broadcast-drain"
date = "2026-09-16"
decided = "retire"
rationale = "Upstream commit 8a2d5f545 drains the pool's final state broadcast before removing animation globals, satisfying this patch's cleanup requirement. Retire the fork's callback tracking and keep upstream's smaller teardown."

[[patch.decision]]
id = "upstream-windows-probe-env-inheritance"
date = "2026-09-16"
decided = "narrow"
rationale = "Upstream's cross-architecture Windows probe test inspected every child environment, so a T3 worker's ambient ELECTRON_RUN_AS_NODE value made the unrelated Node self-containment probe look like the skipped packaged-app probe. Scope the assertion to the packaged Windows executable while retaining the independent self-containment assertion."

[[patch.decision]]
id = "macos-worktree-realpath-exclusion"
date = "2026-09-16"
decided = "adapt"
rationale = "Canonicalize the configured data and worktree roots before comparing them with transcript cwd realpaths, and canonicalize auto-generated ServerConfig test roots before deriving guarded cleanup paths. macOS can spell the same temporary directory through /var and /private/var, which otherwise lets a symlinked managed worktree appear as an importable project or makes cleanup fixtures stop at the production symlink guard under the Node 24 CI runtime; symlink-boundary tests likewise compare canonical workspace paths."

[[patch.decision]]
id = "git-racy-clean-large-diff-fixture"
date = "2026-09-17"
decided = "adapt"
rationale = "Make upstream's large-diff fixture rewrite change byte length so Git must report the tracked edit even when the commit and rewrite share one filesystem timestamp; keep the complete branch and working-tree statistics assertions unchanged."

[[patch.decision]]
id = "upstream4029-highlighter-test-time-limit"
date = "2026-09-17"
decided = "adapt"
rationale = "Disable Shiki's wall-clock tokenization cutoff only in the native review and source/snippet highlighter test wrappers so grammar-isolation and cold-initialization assertions cannot return partial tokens when parallel repository verification saturates the host; production tokenization keeps its safety cutoff."

[[patch.decision]]
id = "upstream9902-file-highlight-test-budget"
date = "2026-09-17"
decided = "adapt"
rationale = "Keep upstream's 7,000-line real-worker stale-highlight regression intact, but give its two CPU-bound edit cases 30 seconds so they do not fail at the 15-second default while the complete repository gate saturates the host."

[[patch]]
name = "fork-worker-operations"
subject = "feat(fork): operate worker threads from the t3-thread CLI"
class = "product"
purpose = "Provide the additive t3-thread operator CLI with pairing, persistent worker identity injected into provider processes, creation, continuation, results, and monitoring."
retire_when = "Upstream or maintained shared tooling provides an equivalent scriptable worker interface, or the fork intentionally stops requiring this concern."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "The standalone CLI bundles shared contract subpaths and keeps only a narrow adapter for legacy model selections and sparse provider config. Opaque activity, context, metadata and provider-option payloads pass through unchanged. env forget removes local pairings offline, requiring --force to discard dependent routing and queued sends. Worker sends queue durably while a turn is running and drain FIFO at the next boundary. Routed notifications retain bounded retries, terminal outcomes, and watcher handoff/recovery (Gitea38/39); subscribe baselines and supersession keep routing to one event per new transition (Gitea49). The CLI queue can migrate to server after-current delivery when upstream7240 ships; adapter steering remains separate."
