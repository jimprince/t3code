[[patch]]
name = "fork-queue-coalesced-notes"
subject = "feat(threads): let workers replace their own queued status notes"
class = "product"
purpose = "Keep a coordinator's send queue from flooding with its workers' progress notes: a sender can mark a recurring note with a coalesce key so a newer note replaces its still-waiting predecessor, and the queue can be summarized by target and sender."
retire_when = "Upstream or maintained shared tooling provides equivalent supersession for queued thread messages, or workers stop reporting to parents through queued sends."
depends_on = ["fork-worker-operations"]
roles = []
note = "Opt-in only: a send without a key is never dropped or merged, and the replacement is scoped to the same sender, target thread, environment and key. A send a watcher has already claimed is not replaced. The replaced record stays in state as cancelled with the superseding id, so the queue listing explains what happened. --progress is shorthand for the key progress."

[[patch.decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Retain keyed waiting-note replacement under the local state lock with sender/environment isolation, dispatch through V2 native receipts and preserve unkeyed commands."

[[patch]]
name = "fork-standing-agent-autosettle"
subject = "fix(threads): pinned and parent threads never auto-settle; t3-thread auto-settle toggle"
class = "product"
purpose = "Stop standing agents (pinned threads and threads with live workers) from settling on their own after a completed turn, and give operators a per-thread toggle (worker standing-agent-autosettle, 2026-10-05)."
retire_when = "Upstream supplies completion settlement that exempts pinned and parent threads."
depends_on = [
  "fork-subthread-lifecycle",
  "fork-worker-operations",
  "fork-cross-environment-nesting",
  "fork-worker-inactivity",
]
roles = []
note = "The decider rejects thread.auto-settle for a pinned thread or one with live children even when a sweep used a stale snapshot; manual settlement still clears pins. Unnesting clears the worker-only settle-on-complete setting. t3-thread auto-settle <thread> --off|--on sets the opt-out; the server refuses --on for a named agent's live top-level thread. t3-thread status no longer reports a running session as errored from an older failed turn. An unpinned childless top-level thread that already has settle-on-complete set still settles; run auto-settle --off on it. watch.ts still delivers a settled worker's final completion to its supervisor, so an orchestrator no longer misses a worker that settled on finishing."

[[patch.decision]]
id = "v2-standing-auto-settle"
date = "2026-10-06"
decided = "relocate"
rationale = "Native V2 already rejects pinned sweep candidates and clears completion settlement on unnest. Recheck sidecar organizational children against native active rows in serialized automatic dispatch, and suppress completion-sweep candidates through the same query."

[[patch]]
name = "fork-queue-idle-dispatch"
subject = "fix(threads): deliver queued sends to idle targets promptly"
class = "product"
purpose = "Keep queued sends from waiting on an idle target: the watcher drains the queue on its own short loop instead of behind the minutes-long attention scan, reads targets in parallel with timeouts, leaves a send queued (without spending attempts) while a server restarts, and any t3-thread command revives a watcher that died with the server."
retire_when = "Upstream or maintained shared tooling provides server-side after-current delivery for queued thread messages, or the fork stops queueing worker sends."
depends_on = ["fork-worker-operations", "fork-queue-coalesced-notes"]
roles = []
note = "Fixes brad/t3code-fork#150. Dispatch eligibility is unchanged (running and starting hold; completed, interrupted, stopped dispatch); only when and how often the drain runs changed. An unreachable server never marks a send undeliverable; only failed dispatches count against the attempt cap. The revival runs as a postAction hook, after a successful command, because its liveness check rewrites the state file and a refused command (env forget without --force) must leave that file unchanged."

[[patch]]
name = "fork-textgen-tempfile-cause"
subject = "fix(server): say why a text-generation temp file could not be written"
class = "product"
purpose = "Make the Codex text-generation temp-file failure diagnosable: the dev VM logged 'request ledger could not split a message' with only 'Failed to write temp file', six times on 2026-10-05, hiding why request splitting fell back."
retire_when = "Upstream reports the underlying file-system error in its text-generation temp-file failures."
depends_on = []
roles = []
note = "The prefix t3code-<prefix>-<pid>- is a plain basename, so the failure is not the prefix. The detail now reads 'Failed to write temp file in <os.tmpdir()>: <reason>' (for example 'NotFound: FileSystem.makeTempFile (<path>)'); the request ledger's split warning logs the detail, so the next occurrence names its cause. A test points TMPDIR at a missing folder."

[[patch]]
name = "fork-textgen-own-scope"
subject = "fix(server): give each Codex text generation its own scope"
class = "product"
purpose = "Fix the request ledger split that failed on the dev VM with 'Failed to write temp file in /tmp: NotFound: FileSystem.writeFile (...t3code-codex-schema-...)' and filed every message whole (brad/t3code-fork#144)."
retire_when = "Upstream scopes its Codex text-generation temp files per call."
depends_on = ["fork-textgen-tempfile-cause"]
roles = []
note = "runCodexJson registered its temp files in whatever Scope the caller's fiber carried. The request ledger captures in a forkDetach fiber that inherits the RPC's request scope, which closes once the RPC replies; acquireRelease on a closed scope runs the release at once, so the temp folder was removed right after mkdtemp. runCodexJson now runs under Effect.scoped (Effect.fn pipe), so each call owns its scope. V2 already allocates unscoped temp files with explicit failure and success cleanup; retain that cleanup and isolate the invocation scope as well. Regression test: generateThreadTitle with an already closed Scope provided."


[[patch]]
name = "fork-dev-vm-heavy-check-gate"
subject = "build(fork): serialize heavyweight checks on the dev VM"
class = "divergence"
purpose = "Make the dev VM's shared heavy-check slot the default path of every package typecheck and vitest script, so concurrent agent compiles queue instead of exhausting memory (brad/t3code-fork#65)."
retire_when = "The dev VM no longer shares one host between the T3 server and agent compiles, or a resource governor outside the repo admits every compile and test run."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "scripts/ci/heavy-gate.ts prefixes each package's typecheck and test script. It runs the command through ~/.local/bin/heavy-check and runs it directly (same argv, same exit status) when CI is set, the host is not Linux, the gate executable is absent, T3_HEAVY_GATE_DISABLE=1, a T3_HEAVY_GATE_HELD token is set, or an ancestor process holds an fd on heavy-check.lock (Deployment's heavy-check sets no marker, so a caller that used it directly is found by ancestry, which also survives vp not passing fd 9 on). heavy-check releases when the process it execs exits, but vp spawns tsc and vitest without fd 9 and they can outlive it, so the gated command runs under a supervisor inside the slot: its own session, every descendant tagged with a per-run T3_HEAVY_GATE_HELD token in its environment (found by scanning /proc/*/environ, so a child that calls setsid is still held), and the slot released only when none remain. After T3_HEAVY_GATE_LINGER_MS (30 minutes) the slot is released with a warning; stragglers are not killed unless the gate itself was signalled, in which case the signal goes to every tagged descendant and survivors get SIGKILL after T3_HEAVY_GATE_KILL_GRACE_MS (10s), with the command's status propagated. A descendant started with a scrubbed environment (env -i) escapes the token; tsc-governor and Deployment's containment are the backstop. It is a Node script, not bash, because the manual Windows lane runs the same package scripts. Raw tsc, vp check, vp build and vp test run bypass package scripts and stay with the out-of-band tsc-governor."

[[patch]]
name = "fork-gitea-issue-links"
subject = "feat(threads): link Gitea issues"
class = "product"
purpose = "Persist Gitea issue links on threads, expose them to agents, and show cached issue state beside thread work across web and desktop."
retire_when = "Upstream provides equivalent server-owned issue links with agent commands and client badges, or the fork stops using Gitea issues to track work."
depends_on = ["fork-gitea-connections", "fork-worker-operations", "fork-embedded-pages"]
roles = []
note = "A link stores normalized host/repository/number plus a cached title and open/closed state after resolving the URL through the same configured-instance and repository-identity route used by Gitea pull requests; public links fetch metadata through that instance's apiOrigin, while the client-facing URL remains the one the user linked. Public and internal aliases therefore resolve to one issue key without requiring the Gitea API to be online. A canonical issue URL on a host no instance or project names (a public HTTPS alias of an internal instance) is linked only when exactly one configured instance confirms that issue and it is not a pull request; unlinking such a URL matches the stored link and needs no API. The /issues/ URL path and a non-null API pull_request value distinguish issues from pull requests; Forgejo's pull_request:null issue payload remains valid. Cached metadata is synchronizable after the link is created so later Gitea reads can repair fallback titles and state. Other hosts that no configured instance confirms, and pull-request URLs, are rejected. Multiple issues may be linked per thread and unlink is the reverse state. Web and desktop badges deep-link the configured Agent Status Board by repo and issue, with the canonical Gitea URL as the fallback. Mobile receives the shared issue data but has no badge in this patch because its thread list has no pull-request badge analogue."

[[patch.decision]]
id = "v2-port-m3-issues"
date = "2026-10-06"
decided = "rebuild-on-v2"
rationale = "Issue links use native V2 thread metadata events, commands and projections, retaining link/unlink/sync RPCs and CLI. Historical main-ledger ID60 remains immutable in ForkV2Ledger; V1 issue rows are read only by the legacy importer, once per missing issues field. An explicit empty V2 array always wins on restart."

[[patch]]
name = "fork-orchestrators-view"
subject = "feat(web): add orchestrators view"
class = "product"
purpose = "Collect orchestrated projects and actionable standalone roots into a shared sidebar view and derive a focused needs-you, working, blocked, completed, request, link and automation page from live state."
retire_when = "Upstream provides an equivalent cross-project overview derived from nested thread state."
depends_on = ["fork-sidebar-agent-visibility", "fork-gitea-issue-links"]
roles = []
note = "A project is a non-archived top-level thread with at least one non-archived child. Counts and sections traverse descendants cycle-safely at every depth without a persisted summary. Blocked includes session or turn errors and output beginning with Blocked, but excludes interrupted turns because interruption is normal orchestrator steering. Projects mode also keeps an expanded, project-grouped list of standalone roots with actionable status, because most direct work starts outside orchestrator trees. Project and standalone rows sort by stable status buckets, debouncing promotion so live activity timestamps cannot make rows dance. When Projects is enabled, the Threads tab excludes whole project trees, including their pins; disabling Projects restores the unchanged full thread list. Web and desktop provide the full page, including compact provider-instance and model identity on active rows, the normal attachment-capable composer, a remembered live orchestrator chat panel without the full-width timeline marker rail, editable title and optional scope, and the root project's automations. Threads, full-width pull-request details and embedded issue pages opened from a project carry device history state for a project-only Back control. Mobile provides a read-only project list with the same project icon and opens the root thread. Done-since-last-visit timestamps and panel visibility stay per device in local storage. A thread's Back to project button uses the project page recorded in navigation state, else the orchestrator tree that contains the thread (ProjectReturnButton), so a thread loaded directly has one too (brad/t3code-fork#193)."

[[patch.decision]]
id = "v2-port-m3-orchestrators"
date = "2026-10-06"
decided = "rebuild-on-v2"
rationale = "Orchestrator summaries join organizational parents and scope from the nesting sidecar, never native execution lineage. Shipped fork-ledger ID11 stays registered as historical schema only; fresh V2 scope writes use the existing metadata service. Web/mobile rendering is carried by the Claude UI lane."

[[patch]]
name = "fork-codex-goal-visibility"
subject = "feat(codex): surface active goals in thread status"
class = "upstream-bound"
purpose = "Project Codex app-server native goal notifications into thread activity, reconnect-hydrated status, sidebar liveness, and a compact composer line without taking ownership of the goal lifecycle."
retire_when = "Upstream surfaces equivalent read-only native Codex goal status and liveness without the retired fork-owned goal compatibility schema."
depends_on = ["fork-provider-turn-safety"]
roles = []
note = "Read-only integration. Codex remains the sole owner of goal creation, editing, pausing, resuming, clearing, and continuation. Uses codexNativeGoal and thread.codex-native-goal.* identifiers to remain distinct from retired goal_json and thread.goal-set compatibility."
[[patch.decision]]
id = "upstream-background-banner-view-agents"
date = "2026-09-26"
decided = "adapt"
rationale = "Upstream added a View-agents shortcut beside the banner's Stop button. Keep it inside this patch's activeBackgroundLiveness-gated actions spread so a goal-only banner still renders no actions, and keep the fork's non-animated status dot."

[[patch.decision]]
id = "upstream-provider-event-type-removal"
date = "2026-09-20"
decided = "narrow"
rationale = "Keep upstream's removal of the redundant ProviderRuntimeEventType literal list; model Codex goal events only in their concrete schemas and the canonical ProviderRuntimeEventV2 union."

[[patch.decision]]
id = "v2-native-goal-projection"
date = "2026-10-06"
decided = "adapt"
rationale = "Native root provider threads carry the read-only goal through V2 provider-thread events and shell projection. Child goal events stay scoped to their native thread; reconnect hydrates from app-server."

[[patch]]
name = "fork-named-agents"
subject = "feat(threads): named agents with one live thread each"
class = "product"
purpose = "Give a resource exactly one owner: a project marked as a named agent holds at most one live top-level thread, enforced in the decider on every root-creating path, with atomic handover, auto-start on send by name from the folder's AGENT.md and BRIEFING.md, and t3-thread agents/send routing."
retire_when = "Upstream provides singleton agents with a durable charter and briefing, name routing and an equivalent one-live-thread guarantee."
depends_on = ["fork-nested-threads", "fork-worker-operations", "fork-subthread-lifecycle"]
roles = []
note = "permanentAgent is an optional project field, persisted as projection_projects.permanent_agent_json by fork migration 9 and set through project.meta.update; snapshot rows include it only when set, so upstream shapes are unchanged. Live root = not archived, not deleted, no parent; nested threads are sub-agents and never count. Guarded paths: thread.create, thread.import, thread.unarchive and thread.parent.set to null. thread.create may carry handoverFromThreadId, which archives the idle live root in the same command and is refused while it is starting, running or awaiting input. An agent root is created with autoSettleDisabledAt and refuses re-enabling, so completion settlement never parks it. NamedAgents reads AGENT.md and BRIEFING.md from the project folder on the server host; a dormant agent's first turn is built from both plus the request, and a lost start race resolves to the winner. t3-thread send consults named agents only for names that are neither saved aliases nor UUIDs. Not in scope: resolver of whose request wins, scope enforcement, context-full reincarnation, a roster UI."

[[patch.decision]]
id = "v2-native-named-agent-ownership"
date = "2026-10-06"
decided = "adapt"
rationale = "Native first-message admission and restore receipts share a database ownership lock with naming and organizational unnesting. Empty claims occupy no root slot. The M2 creation path remains empty claim, one sidecar metadata write, then provider-starting reuse launch; admission reads that sidecar parenting. Handover archives the idle predecessor in the same native event batch."

[[patch]]
name = "fork-project-automations"
subject = "feat(projects): run timed project automations"
class = "product"
purpose = "Persist project-owned timed prompts, recover scheduled runs after downtime, queue busy thread targets, and expose automation management and run results to clients."
retire_when = "Upstream provides equivalent project-scoped timed automations with persisted runs and busy-target delivery."
depends_on = ["fork-subthread-lifecycle", "fork-named-agents"]
roles = []
note = "Project import tests discover T3_LIFECYCLE_FIXTURES, explicitly skip when absent, and retain the full packaged VM case alongside all three small copied fixtures."

[[patch.decision]]
id = "v2-project-automation-cutover"
date = "2026-10-06"
decided = "adapt"
rationale = "Keep original project automation records and migration 10 on the native project store. The later scripts concern imports them once into AutomationStore and owns the sole scheduler, preserving the final V1 stack behavior without a second scheduler."

[[patch]]
name = "fork-project-issues-board"
subject = "feat(web): show project issues as a board"
class = "product"
purpose = "Read a project tree's Gitea issues on the server and show them on the project page in the Agent Status Board's lanes."
retire_when = "Upstream provides project issue boards, or the Agent Status Board's issue view moves into T3 under another concern."
depends_on = ["fork-orchestrators-view", "fork-gitea-issue-links", "fork-gitea-pr-browser"]
roles = []
note = "A project's repositories are each tree thread's project remote on a configured Gitea host (resolved with the same resolveGiteaRemote rule as Gitea PR links), otherwise the same-named repository under the token's account (the Agent Status Board's tracker rule, which covers the GitHub-hosted fork's tracking-only repo), plus every repository a tree thread links an issue from. Lanes and labels match the board exactly (needs-review, in-progress, backlog, closed and archived) so the two views can merge. Issue titles deep-link the configured embedded Agent Status Board and preserve the project return location; without that page they keep the canonical external URL fallback. The server caches issue lists for 30 seconds and repository lookups for 10 minutes; the page refreshes every minute while open."

[[patch]]
name = "fork-request-ledger"
subject = "feat(projects): track requests as Gitea issues"
class = "product"
purpose = "Split each message Brad types into the requests it makes, file them as Gitea issues labeled ask in the project's tracker repository, and show them on the project page grouped by what he does next until he settles them."
retire_when = "Upstream or another fork concern tracks user requests across threads with the same capture, split and settle lifecycle."
depends_on = ["fork-project-issues-board", "fork-gitea-issue-links"]
roles = []
note = "Capture runs at the websocket dispatch boundary for message.dispatch from a web, desktop or mobile surface, not sent on a thread's behalf (senderThreadId, notification) or by a schedule, without a t3-origin record, outside page agents and not a worker brief; the t3-thread CLI never reports a UI surface. The configured text-generation model splits the message (optional generateRequestItems on Codex and Claude); without it the message is filed whole. Each request is labeled ask plus ask:<kind> (question, deliverable, plan, change, test), carries a hidden t3-request provenance marker, and links to its thread and orchestrator. Status uses the Agent Status Board labels; a thread reply after the request also puts it in Brad's group. Only Brad settles (closes) a request, from the project page. Agents use t3-thread request list|add|start|ready|reopen (projectRequests.* RPCs) to file a request Brad made of them and to move it, with ready posting a summary comment that the page shows as the answer. Capture is durable: the message goes to <stateDir>/request-ledger-outbox.json before any Gitea call, one process-wide drain splits it once (the split is saved), files each request whose message id and item index are not already in a marker in the tracker (no duplicates after a lost response or restart), and retries with backoff (30 s to 10 min) while Gitea is unreachable; an entry is dropped only when its thread is gone or Gitea answers that there is no tracker. Repository lookups cache answers, never outages. The project page lists queued requests as Pending filing. Request stages live on labels: in-progress, needs-review, awaiting-release (handed over for the release batch) and needs-test (shipped; the release is the issue milestone and the test step a comment); deriveRequestStage maps them, and the board puts needs-test in Needs your review and awaiting-release in In progress. request start links the agent thread to the request. request add files directly or queues in the outbox when Gitea is unreachable. requestLedgerEnabled (default on) turns capture off per server."

[[patch]]
name = "fork-project-dashboard-widgets"
subject = "feat(projects): configurable dashboard widgets"
class = "product"
purpose = "Turn the project page into an ordered, per-project list of widgets with a Requests widget that shows each ask's stage and owner, a Release widget derived from request stages, worker rows that name the request they serve, and an explicit Gitea tracker repository per project."
retire_when = "Upstream provides configurable project dashboards with request tracking, or the project page is retired."
depends_on = ["fork-request-ledger", "fork-orchestrators-view"]
roles = []
note = "Widget order (per orchestrator root thread) and tracker repositories (per T3 project) live in <stateDir>/project-dashboards.json, written atomically under a process-wide lock and read on demand, behind projectDashboard.get/setWidgets/setTracker and t3-thread dashboard set and project tracker set. Widget ids are open strings so later concerns (roadmap, canvas) add widgets without a schema change; clients drop unknown ids and default to requests, needs-you, release, roadmap, working, blocked, done, new-request, issues, prs, canvas, automations. A configured tracker (owner/repo on the first Gitea instance, or a repository URL) wins over the git remote in ProjectIssuesService.repositoryForProject, so the ledger, board and capture all use it. The Release widget has no store: next release is stage awaiting-release, shipped is stage needs-test grouped by milestone with the posted test step. Mobile shows read-only request and release lines under each project."

[[patch]]
name = "fork-project-roadmap"
subject = "feat(projects): roadmap of versions as Gitea milestones"
class = "product"
purpose = "Plan a project's versions on its project page: Later plus one column per open Gitea milestone on the tracker repository, with drag or a Move to menu, add and rename versions, and Save for later for ideas that should not wake the orchestrator."
retire_when = "Upstream or another fork concern provides milestone planning for projects."
depends_on = ["fork-project-dashboard-widgets", "fork-request-ledger"]
roles = []
note = "No new store: versions are open milestones on the tracker resolved by the ledger, items are the tracker's open issues and requests, and an item whose milestone is closed (a shipped release) is off the roadmap. Roadmap order is due date then creation; the first version is the next release and its items join the Release widget's Next release list. request shipped closes its release milestone. Save for later files a request through projectRequests.create without messaging the orchestrator. CLI: t3-thread roadmap list|move|version."

[[patch]]
name = "fork-project-page-workflow"
subject = "feat(projects): project page tabs, inline requests, PR status and progress notes"
class = "product"
purpose = "Make the project page say what needs Brad: Dashboard, Roadmap and Issues tabs with one-line summaries, an inline request box that sends to the orchestrator or saves for later, pull requests grouped by what they need, and the latest progress line on each request."
retire_when = "Upstream or another fork concern provides an equivalent project page."
depends_on = ["fork-project-roadmap", "fork-project-dashboard-widgets", "fork-orchestrators-view"]
roles = []
note = "The tab lives in the URL (?tab=dashboard|roadmap|issues, each change a history entry) and is remembered per project per device in local storage. The Dashboard shows the Roadmap and Issues widgets as one-line summaries linking to their tabs; Customize still orders the Dashboard. The request box sends verbatim through the queued composer path (images by paste or drop, Cmd/Ctrl+Enter) so the ledger captures it, then opens the right-panel chat on the message; Save for later uses projectRequests.create with park, which adds the parked label so the idea stays off the active Requests list (shown as a count) until it is moved into a version or started. The thread-replied hint marks only requested questions or asks owned by a worker thread, not every ask the orchestrator has answered in passing. The embedded orchestrator composer widget stays available but hidden by default. Pull request rows come from the tree's synced links (state, draft, checksState, reviewDecision, mergeability): Needs you is open, not draft or superseded, checks not failing or pending, no changes requested and no conflicts; merged or closed for 7 days shows collapsed and older is hidden. Superseded means a later pull request on the same branch, or a later one from the same worker thread after this one closed unmerged. request note (projectRequests.update without a status) posts a Progress line and links the thread; stage changes post one when no text is given; the ledger fetches the latest comment of every open request, cached per issue by updated_at."

[[patch]]
name = "fork-project-canvas"
subject = "feat(projects): orchestrator canvas widget"
class = "product"
purpose = "Let an orchestrator show a static page it maintains (charts, counts, screenshots) as a Canvas widget on its project page, safely sandboxed."
retire_when = "Upstream provides orchestrator-authored dashboards, or the project page is retired."
depends_on = ["fork-project-page-workflow", "fork-project-dashboard-widgets"]
roles = []
note = "projectCanvas.read resolves the thread's orchestrator project and reads <workspace>/.t3/dashboard/widgets.json ({widgets:[{id,title,path,size}]}, at most 8, ids 1-30 [a-z0-9-], .html paths inside the folder) or, without it, index.html as the single canvas. Each page inlines only relative src/href files inside its own folder (no scheme, absolute, or .. paths; known static types; 4 MB per canvas) as data URLs, with the newest mtime. Canvas widgets are canvas:<id> in the dashboard order; the canvas slot expands to those not placed on their own, and Customize lists them one by one. The client renders each with iframe srcdoc and sandbox=allow-scripts without allow-same-origin (opaque origin, no T3 session, cookies or storage, no network path into T3). The action bridge accepts postMessage only from the canvas's own frame with origin null, whitelists send (confirm chip with the exact text, then the normal queued send path), open-thread (tree threads), open-issue and open-url (http(s) on github.com, configured Gitea web origins and the tree's issue and PR hosts), rate-limits 5 per 10 s per frame, logs every outcome via projectCanvas.action, and replies t3-canvas-result. The request box's send moved to sendToOrchestrator for reuse. Template, style kit, manifest and funnel example live in docs/user/project-canvas."

[[patch]]
name = "fork-project-task-types"
subject = "feat(projects): typed tasks and release-grouped dashboard"
class = "product"
purpose = "Type every request and tracker issue (bug, feature, question, deliverable, plan, change, test, maintenance) and order the project Dashboard as Brad asked: tasks needing him, completed tasks by the release that shipped them, then maintenance."
retire_when = "Upstream provides typed project tasks, or the project page is retired."
depends_on = ["fork-request-ledger", "fork-project-dashboard-widgets", "fork-project-page-workflow"]
roles = []
note = "The type is the existing ask:<kind> label, so the five original kinds keep working; capture classifies the three new ones. projectRequests.update takes kind (CLI request type) and swaps the issue's ask:<kind> label; a type-only update works on any tracker issue, open or closed, and links no thread. The Release widget lists completed tasks by milestone, newest first (shipped requests to test with Settle, then settled or closed tasks of the tree or of a release milestone within the 14-day closed window, then work completed outside a release), then Next release. Open maintenance tasks not needing Brad move from Requests to a new Maintenance widget after Release; saved custom widget orders keep it hidden until added under Customize. Issue cards show the type."

[[patch]]
name = "fork-project-request-box-pinned"
subject = "feat(projects): pinned request box that sends in the background"
class = "product"
purpose = "Make the project request box a support box where the work actually gets done: pinned first on the Dashboard, sending in the background and saying which request tracks it."
retire_when = "Upstream or another fork concern provides an equivalent project request box."
depends_on = ["fork-project-page-workflow", "fork-project-canvas"]
roles = []
note = "The box renders above the widget list on the Dashboard tab only, outside the widget order and Customize, and the Requests widget no longer hosts it. Send goes through sendToOrchestrator without opening the chat, clears the box and shows Sent (or Queued) to the orchestrator; the line becomes 'tracked as request #N' (linked) once the ledger files an issue whose t3-request marker carries the message id, or 'pending filing' while the outbox holds it. The issues query is re-read 3, 10, 30 and 60 s after a send and the line clears after 2 minutes. Open chat is an explicit button; Save for later and image paste or drop are unchanged."
[[patch]]
name = "fork-scripts-automations"
subject = "feat(projects): scripts and automation rules"
class = "product"
purpose = "Keep named prompt scripts (per project or global) and automation rules (schedule triggers including weekdays and cron, agent actions from a prompt or script) in plain server tables, fire each slot once, keep a run log with dry runs, and expose them through automations.* and automationScripts.* RPCs, the t3-thread script and automation commands, and the existing project automation panels."
retire_when = "Upstream provides project and global prompt scripts with trigger-condition-action automations, per-slot dedupe and a run log, and the fork's records have been migrated to it."
depends_on = ["fork-project-automations", "fork-named-agents", "fork-cross-environment-nesting"]
roles = []
note = "The engine lives in apps/server/src/automations, outside orchestration: rows in fork migration 13 tables automation_scripts, automations (soft-deleted tombstones) and automation_runs (UNIQUE automation_id + dedupe_key, schedule key = slot instant). Native integration lives in AgentGateway.ts (input dispatch, exact root outcomes and event wakeups); historical turn reads live behind LegacyV1ThreadImporter in legacy/ForkAutomationRead.ts. It replaces fork-project-automations' scheduler: on every pass and on project.meta-updated carrying automations, legacy project.automations records are copied once with the same ids, nextRunAt, owner, target and live runs (same run, thread and message ids; terminal historical outcomes survive, and unresolved V1 work is failed under the recorded upgrade decision). The originals are left untouched on the project so a rollback to a release with the old scheduler still has its automations; the copied row, or its deleted tombstone, is the migration marker, and nothing in this release fires the originals. Original project contract fields and migration IDs remain; V1 state is read only through the existing legacy import boundary. Once a release has shipped with this patch, a later change may delete the originals. Executor rules are ported verbatim (automation:<runId> thread/message ids, locked dated title, owner nesting, busy targets wait, >24 h late slot skipped, backlog collapses to the latest slot, 20 unfinished-run cap, model fallback). Actions in a run go in order and a failure skips the rest. Scripts resolve when a run is built, project before global; removing a script an automation uses is refused. Ad hoc script runs are recorded under automation id script:<scriptId>. A script step carries a result mode (review default, file-only, file-and-settle; overridable per action or run) that is appended to its prompt; inline prompts get none, so imported timed automations send their prompts unchanged. Fork migration 14 seeds eight global starter quality scripts once (ids starter:<name>, conflicts ignored), so later edits and deletions stick. A paused legacy automation is also copied to a project script (id legacy:<automation id>, name slugged) when first imported. Event triggers: the gateway turns native thread.pull-request-synced, runtime-request.updated (approval or user-input requests) and provider-session.updated into neutral observations, read only for kinds an enabled automation listens to; issue labels (ProjectIssuesService for the owner thread) and GitHub releases (ReleaseFeed, unauthenticated) are polled every five minutes only while listened to. events.ts compares each observation with its last value in automation_source_state (fork migration 15) so CI and session errors fire on transitions, labels on additions, releases on a new tag, and polled first sightings are baselines; runs are keyed event:<kind>:<state>. Later stages add conditions and notify actions to the same patch. Cutover fixture tests use T3_LIFECYCLE_FIXTURES with explicit missing-variable skips; each of the three packaged states is copied before migration and run-deduplication assertions."

[[patch.decision]]
id = "v2-automation-native-gateway"
date = "2026-10-06"
decided = "adapt"
rationale = "Keep AutomationEngine, tables, receipts and CLI/UI affordances. AgentGateway uses native project shells, exact user input/root run records, the M2 empty-claim, sidecar parenting and provider-starting reuse launch sequence, and native PR/runtime/session events. Retain legacy project records read-only and import them once through the same engine. The pages lane supplies the frozen ProjectIssuesService interface."

[[patch.decision]]
id = "v2-automation-interrupted-upgrade"
date = "2026-10-06"
decided = "adapt"
rationale = "A running V1 automation input with no terminal legacy outcome finishes failed with Interrupted by the upgrade. Run it again if needed. The one-way upgrade occurs in an idle window; leftovers never redispatch, and users can Run now. The historical reader remains read-only inside the legacy import boundary."

[[patch.decision]]
id = "v2-m5-automation-result-modes"
decision = "adapt"
note = "Preserve act result mode, existing-thread CLI defaults and automation edit. Exact V2 root run identity replaces V1 null-turn matching; a live root run cannot fail from an older stopped session. The result mode UI delta is delivered separately to the UI lane."
