name = "fork-sidebar-dark-surface"
subject = "fix(web): the dark sidebar uses the standard dark surface, not pure black"
class = "divergence"
purpose = "Keep the dark sidebar on the same near-black surface as the rest of the app instead of pure #000 (Brad 2026-10-08)."
retire_when = "Upstream stops painting the dark sidebar pure black."
depends_on = []
roles = []
note = "Only the [data-app-sidebar] dark block in apps/web/src/index.css changes: --background is the default dark --background (neutral-950, #0a0a0a) and --card the default dark card mix, which --sidebar, the sidebar stage fade and cards inside the sidebar follow. Themed sidebars (html[data-theme-id]) are untouched. The built-in T3 Code Dark palette (packages/shared themePalettes sidebar) is the same near-black #0a0a0a instead of #000000, which is what the mobile drawer and themed web read; apps/mobile generated-uniwind-themes.css and generated-uniwind-default-theme-variables.json were regenerated with apps/mobile/scripts/generate-uniwind-themes.mts, and the mobile and web theme tests that pinned the black sidebar now pin the standard surface (the dark sidebar matches the thread canvas and is separated by its border, no longer darker). Left alone, not backgrounds or panels: the shadow and backdrop alphas (mobile shadows, video and dialog scrims, QR and icon artwork)."
