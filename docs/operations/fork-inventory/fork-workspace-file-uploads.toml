name = "fork-workspace-file-uploads"
subject = "feat(web): upload files into workspace via drag-and-drop"
class = "product"
purpose = "Let operators drop files onto the files pane to upload them (binary-safe, collision auto-rename) into the workspace root of the paired server."
retire_when = "Upstream ships a binary-capable workspace upload RPC with drag-and-drop in the files pane."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "Reorganized 2026-09-06 from fork-web-files-upload."
[[decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Retain binary uploads on native V2 project commands and scope middleware; isolate upload RPC and drop controller in fork-owned modules, preserving directory and path-search refresh."

[[decision]]
id = "upstream-directory-entry-refresh"
date = "2026-09-16"
decided = "adapt"
rationale = "Keep the upload RPC and drop overlay alongside upstream's incremental FileTree rendering, and refresh the new directory-entry and path-search data sources after a successful upload instead of the retired project entries query."

[[decision]]
id = "catchup-2908-upload-authorization"
date = "2026-10-10"
decided = "adapt"
rationale = "Carry project/worktree-scoped binary uploads through upstream granular filesystem scopes (#9786–#9791, #10298). Binary upload requires filesystem:write like other workspace writes; preserve filesystem read/write separation and the new layer conventions. Client upload behavior stays scoped to its selected workspace. Static conflict/whitespace review passed; composed authorization and upload tests remain required."
