name = "fork-project-selection"
subject = "feat(web): select multiple projects in the sidebar"
class = "product"
purpose = "Provide multi-select, partial-state, and isolation controls for sidebar project scope."
retire_when = "Upstream ships equivalent multi-project selection and isolation."
depends_on = ["fork-general-chat"]
roles = []
note = "Owns multi-project selection and mobile project activity grouping; obsolete implementation plans removed."

[[decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Keep persisted hidden sets and General Chat membership on native V2 project shells and visible-thread filtering; isolate the filter UI in a fork-owned component and preserve user-only mobile project recency."


[[decision]]
id = "single-filter-state"
date = "2026-09-25"
decided = "adapt"
rationale = "Upstream's single-project scope overrode the hidden set, so checkboxes did nothing while a project was isolated, and General chat bypassed both. The hidden set is now the only filter state: a row click isolates its project, General chat is an ordinary entry, and a stored upstream scope migrates into the hidden set once. This supersedes layering the fork selection over upstream's persisted scope."

[[decision]]
id = "upstream2237-design-token-scale"
date = "2026-09-25"
decided = "adapt"
rationale = "Upstream added --text-2xs (11px) and --text-3xs (10px) to the theme and the shadcn(no-arbitrary-values) lint now errors on off-scale Tailwind values. The sidebar's empty-selection action used text-[11px], which has an exact token, so take it."
[[decision]]
id = "upstream13203-mobile-home-thread-groups"
date = "2026-09-23"
decided = "narrow"
rationale = "Upstream #13203 deleted the mobile legacy home thread list (buildHomeThreadGroups and its group sort) with no remaining callers. The fork only swapped that group sort to getProjectThreadSortTimestamp, so accept the deletion and narrow this concern to the surviving sortHomeProjectScopes binding, which still keeps agent-only streaming activity from reordering project scopes."

[[decision]]
id = "sidebarv2-project-scope"
date = "2026-07-28"
decided = "keep-multiselect"
decided_by = "brad"
issue = "http://git.home/brad/fork-decisions/issues/1"
rationale = "Upstream ships single-select projectScope while the fork provides checkbox partial states and isolation. Preserve the fork's multi-select behavior and port it onto upstream's current menu structure."
note = "Upstream1286 persists single-project scope in the UI store; retain that persistence while layering fork hidden-project selection."
standing_policy = "Do not retire multi-select to upstream's single-select model. Re-escalate only if upstream removes projectScope entirely."
resolution_kind = "relocate"
status = "ported-and-uat-verified-2026-07-29"

[[decision]]
id = "catchup-2908-local-project-filter"
date = "2026-10-10"
decided = "relocate+adapt"
rationale = "Carry upstream filter icon (#12113) and projectless-machine badges (#17022) into the fork-owned multiselect. Preserve General Chat membership, persisted hidden sets, isolation and Select all. Local read-only filtering remains available beside upstream orchestration mutation guards. Static entry-point review passed and focused permission cases were added; execution awaits composed CI."
