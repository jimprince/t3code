name = "fork-subprojects-ui"
subject = "feat(projects): show nested orchestrators as subprojects in the sidebar and project page"
class = "product"
purpose = "Show a subproject as its own project: a compact one-line row inside its parent's sidebar card, a Subprojects section and breadcrumb on the project pages, and rollup counts on the parent."
retire_when = "Upstream provides nested project pages, or the fork stops wanting nested orchestrators to have their own pages."
depends_on = [
  "fork-subprojects-server",
  "fork-orchestrators-view",
  "fork-project-page-workflow",
  "fork-cross-environment-nesting",
]
roles = []
note = "Client only; the server half is fork-subprojects-server. Approved layout (#156): B compact rows plus A's rollup line. buildOrchestratorSummaries returns one summary per project, top-level and subproject alike. A summary's descendants, issues, needsYou, working and blocked cover its own tree only, matching the server's collectThreadTree; only mode `on` on a nested thread makes a subproject, like the server's findProjectRootThreadId. A subproject nests under the first enclosing top-level or mode-on thread, so plain workers in between are skipped; one with workers whose parent is missing or archived is a top-level project. `subprojects` and `rollup` (needsYou, working, blocked, latestActivityAt) fold subproject work into the parent for the sidebar bucket, card counts and page header; `status` counts subproject activity as the root's workers. The sidebar lists top-level projects only, with each project's subprojects as rows beneath it, ordered by the same deferred buckets. Mobile still lists every summary flat, so a subproject appears as its own project there. Subprojects come from an explicit mark (`t3-thread orchestrator mark`, `create --subproject`, Show as subproject) because automatic promotion stays off until the mobile app can reach a subproject's decisions. Reverse state: the project page Edit dialog and the thread menu offer `Show as worker` (mode off, which also blocks automatic promotion) and `Show as subproject` (mode on) through fork.threads.metadata.update, gated on the threadSubprojects capability. Mock B (Brad confirmed 2026-10-08): the Projects sidebar card of a project with subprojects has a chevron that folds its compact subproject rows away; the folded project keys are one list in this device's localStorage (COLLAPSED_SUBPROJECTS_KEY, expanded by default, toggleProjectKey) and deeper levels follow their parent. A card whose subprojects have working agents adds a line, '2 of 6 working in subprojects' (subprojectWorkingLabel: rollup.working minus the project's own activeWorkerCount; '6 working in subprojects' when all of them are inside), which stays visible while folded. Web and desktop only; mobile nesting and the automatic-promotion flip stay with fork.7."
[[decision]]
id = "delegated-worker-summary-226"
date = "2026-10-09"
decided = "repair-existing-concern"
rationale = "Projects summary coverage verifies that a delegator with five organizationally nested worker delegates produces only its root summary, even for a pinned worker. Only an explicit subproject on mark adds a separate summary; server creation supplies the organizational relationship."

[[decision]]
id = "catchup-2908-subproject-mutation-guards"
date = "2026-10-10"
decided = "adapt"
rationale = "Use upstream orchestration guards (#9786–#9791, #10298) for subproject/worker forward and reverse mutations. Preserve compact rows, rollup counts, breadcrumbs and explicit marking alongside nested creation/drop and reset entry points. Static sidebar/header/palette consumer review passed; composed CI remains required."
