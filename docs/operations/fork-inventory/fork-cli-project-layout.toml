name = "fork-cli-project-layout"
subject = "fix(t3-thread): layout commands that know every widget type"
class = "product"
purpose = "Make the CLI's dashboard commands see and set every widget type, and give agents the layout ops the MCP tools have, so a widget added from the command line (decisions) cannot vanish silently."
retire_when = "The CLI no longer edits the project layout, or upstream tracks an equivalent project page layout."
depends_on = ["fork-project-layout", "fork-project-dashboard-widgets"]
roles = []
note = "widgetOrderOps (packages/contracts projectLayout.ts) replaces legacyWidgetOrderOps: each --widgets id resolves as an older id, canvas:<id> or any registered PROJECT_WIDGET_TYPES type, and an id that is none returns an error naming every unknown id (the old version skipped them, which hid decisions, markdown, links, canvas-slot and every type added since). ProjectDashboardService.setWidgets now fails with that error as well, so older callers of projectDashboard.setWidgets stop dropping silently. In the CLI, `dashboard set --widgets` reads the layout (projectLayout.get) and applies the ops with projectLayout.apply (reason 'dashboard set'); --reset still uses projectDashboard.setWidgets null. `dashboard show` keeps the dashboard object and its compact older-id widgets array, and adds revision and tabs: every tab with each widget's id, type, title, size and config. New `project layout get|apply|add` pass ProjectLayoutOp through the existing projectLayout.get and projectLayout.apply RPCs (registered in apps/t3-thread contracts.ts, rpc.ts and client.ts projectLayout); apply takes --ops JSON, --base-revision (default current) and --reason, add builds one addWidget op for a registered type (--tab, default dashboard). Pure helpers live in apps/t3-thread/src/projectLayout.ts. These layout RPCs need a server that has fork-project-layout. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
