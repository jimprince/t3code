name = "fork-harness-check-pins"
subject = "feat(harness): persist environment check pins"
class = "product"
purpose = "Let a person or an agent pin and unpin any Harness check, kept per environment on the server, so a check that matters leads the checks list on every client."
retire_when = "Upstream provides equivalent pinned Harness checks or Harness is retired."
depends_on = ["fork-harness-read-service"]
roles = []
note = "One service method, HarnessPinService.setPinned, behind the harness.checkPin.set RPC (client helpers setHarnessCheckPinned, createHarnessPinCommand, isCheckPinned) and the harness_check_pin MCP tool. Pins are the harnessPinnedCheckKeys list in server settings (no migration, no table), deduped in order and capped at 200 keys of 512 characters; an unknown or removed key is inert and can still be unpinned. harness_snapshot and harness.snapshot report pinnedCheckKeys; the optional harnessPin capability tells clients to show pin controls. Client sort, feed grouping and the pin controls live with the Harness tab UI (fork-harness-tab-ui). Files: apps/server/src/device/DeviceService.test.ts, apps/server/src/environment/ServerEnvironment.test.ts, apps/server/src/environment/ServerEnvironment.ts, apps/server/src/harness/HarnessPinService.test.ts, apps/server/src/harness/HarnessPinService.ts, apps/server/src/harness/HarnessReadService.test.ts, apps/server/src/harness/HarnessReadService.ts, apps/server/src/harness/rpcHandlers.test.ts, apps/server/src/harness/rpcHandlers.ts, apps/server/src/mcp/McpHttpServer.ts, apps/server/src/mcp/toolkits/environment/handlers.test.ts, apps/server/src/mcp/toolkits/environment/handlers.ts, apps/server/src/mcp/toolkits/environment/tools.ts, apps/server/src/observability/RpcInstrumentation.ts, apps/server/src/orchestration-v2/ThreadSettlementService.test.ts, apps/server/src/provider/ProviderRegistry.test.ts, apps/server/src/server.ts, apps/server/src/serverSettings.test.ts, apps/server/src/serverSettings.ts, apps/server/src/ws.ts, packages/client-runtime/src/rpc/harness.ts, packages/client-runtime/src/rpc/index.ts, packages/client-runtime/src/state/commandPermissions.test.ts, packages/client-runtime/src/state/harnessQuery.test.ts, packages/client-runtime/src/state/harnessQuery.ts, packages/contracts/src/clientRpcPermissions.ts, packages/shared/src/t3McpToolPresentation.ts, packages/contracts/src/environment.ts, packages/contracts/src/harness.test.ts, packages/contracts/src/harness.ts, packages/contracts/src/rpc.ts, packages/contracts/src/settings.ts, docs/release-notes/entries/harness-check-pins.toml, docs/user/thread-sidebar.md"

[[decision]]
id = "harness-pins-in-server-settings"
date = "2026-10-13"
decided = "Pins are a small list in server settings, changed only through HarnessPinService."
rationale = "Environment preferences already persist per server with change notifications and no migration; a dedicated method keeps the read-modify-write atomic for clients and agents alike, and the snapshot carries the keys so no client reads settings."
