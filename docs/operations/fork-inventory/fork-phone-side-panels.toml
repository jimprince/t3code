name = "fork-phone-side-panels"
subject = "fix(web): side panels fit a phone screen"
class = "product"
purpose = "Keep the project task panel and the orchestrator chat panel inside a phone screen: both take the full width below the sm breakpoint, covering the board, so their text and close button stay on screen."
retire_when = "The task panel and the orchestrator chat panel are retired, or upstream provides an equivalent responsive project side panel."
depends_on = ["fork-task-view", "fork-orchestrators-view"]
roles = []
note = "Layout classes only, from the fork.31 phone shot: ProjectTaskPanel.tsx and the chat aside in OrchestratorBoard.tsx change a fixed w-[420px]/w-[400px] to w-full sm:w-[420px]/sm:w-[400px]. The panels stay shrink-0 siblings of the flex-1 min-w-0 board, so below sm the panel takes the whole row and squeezes the board to zero width; from sm up nothing changes. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
