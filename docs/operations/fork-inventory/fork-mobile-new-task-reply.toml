name = "fork-mobile-new-task-reply"
subject = "fix(mobile): a new task shows its reply without reopening the thread"
class = "upstream-bound"
purpose = "Keep the mobile thread screen from reading a queued new task's detail before the server has created the thread, so its stream is not parked as deleted and the reply streams in (brad/t3code-fork#224)."
retire_when = "Upstream holds every mobile detail reader back while a queued creation is undelivered, or stops parking the thread detail stream on one not-found answer."
depends_on = []
roles = []
note = "A new task opens its thread screen on a stand-in shell before the creation is delivered. use-thread-selection already withholds its own detail subscription then (selectedThreadDetailRef), but the screen's reported-model, queued-count and subagent readers and the composer's queue workflow read the stand-in's reserved id directly, and one not-found answer parks that shared stream as deleted for the life of the screen. ThreadDetailScreen and the composer now read through selectedThreadDetailRef, and the rule is the pure resolveThreadDetailRef in pending-thread-creation.ts. Found by static reading; not reproduced in a running client."
