name = "fork-dashboard-polish"
subject = "fix(web): calmer, consistent project page"
class = "product"
purpose = "Make the project page and its mobile counterparts consistent and readable, from the fork.29 UI review (~/maintenance-work/ui-review/review.md): one status vocabulary, nothing Brad needs truncated, no internal ids or agent notes in rows, Settle only where he acts, no duplicated rows, and a layout that holds at phone width."
retire_when = "Upstream provides an equivalent project board, or the project page is retired."
depends_on = [
  "fork-board-declutter",
  "fork-project-skew-gate",
  "fork-pr-widget-refresh",
  "fork-decisions-other",
  "fork-project-layout",
]
roles = []
note = "Presentation and client logic only: no RPC, contract shape, setting or layout id changes. Shared pieces live in orchestrators/ProjectSection.tsx (SectionHeading, ProjectSection, GroupTitle, StatusCell, RowMenu) and ProjectRequestsSection.tsx TaskRow; widgets are no longer ruled off, the layout grid spaces them. latestProgressLine shows only an agent's Progress:/Test:/Answer: line, minus paths, hashes and bracketed issue refs, and never a curator note, Brad's follow-up or a bare 'started'; isNotAnswer keeps those out of Needs you answers and the task panel's pickAnswer. Needs you groups are Answers, Decisions and For review (review and shipped-to-test together, one line per test item). Release drops items that are For review in Needs you; Requests drops awaiting-release items, which Release owns. Settle is a button only in Needs you, on For review Tasks cards and for a For review task in the panel; other open rows keep Settle, and complete rows Reopen, in a row menu; an Active epic offers no Settle (approved by the T3 Orchestrator for Brad). groupProjectIssues folds parked (Later) issues with Backlog under Pending's 'Later N', so the Dashboard's Pending count matches the board. This supersedes fork-board-declutter's decision to keep '#N' on Decisions and 'Blocked by #N': both now name the thread or task (waitingLabel in client-runtime decision-answer), and the Blocked action reads 'Open blocker'. The Decisions widget keeps fork-decisions-other's Other..., send-on-click and Sent/Undo strip, restyled as full-width outline option rows with a 'Recommended' label; it and the Pull requests widget hide when empty. The tracker repository setting moves from the layout editor to Edit project; tab rename is double-click; layout dropdowns use ui/select with canvas titles. The Needs you and Requests order is unchanged pending Brad's decision. A Needs you decision row's title is the same task link as every other row (brad/t3code-fork#192). Every widget header has a collapse chevron (ProjectSection and the canvas header read WidgetCollapseContext, which ProjectLayoutTabView provides per widget; canvases the slot lists unplaced get their own id); the collapsed ids are kept in this device's localStorage per project page (collapsedWidgetsKey), not in the shared layout, and a collapsed canvas unmounts its frame (brad/t3code-fork#184). The editor and mobile have no collapse. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: retain UI theme injection with later resize/dashboard implementation (apps/web/src/components/orchestrators/ProjectCanvasWidget.tsx). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
