name = "fork-subprojects-server"
subject = "feat(projects): nested threads can be subprojects with their own page data"
class = "product"
purpose = "Let a nested thread be a subproject that owns its own project page data (health, layout, canvas, tracker, request ledger, Decisions, issue scope) instead of writing its root project's: a per-thread subproject mode (auto, on, off), the server's automatic promotion, and the project-root boundary the project services key on."
retire_when = "Upstream provides nested project pages, or the fork stops wanting nested orchestrators to have their own pages."
depends_on = [
  "fork-nested-threads",
  "fork-project-issues-board",
  "fork-request-ledger",
  "fork-project-dashboard-widgets",
  "fork-project-canvas",
  "fork-project-layout",
  "fork-cli-project-layout",
]
roles = []
note = "Server, contracts and CLI only; the client summaries, sidebar and page UI are separate patches. `subproject` (auto|on|off) is an optional thread and shell field stored like pinnedAt: thread.subproject.set -> thread.subproject-set (payload mode plus source user|auto), projection_threads.subproject (fork migration 16; NULL means auto, no backfill), and a threadReducer case. The fork ledger is used, not the upstream-offset one, so the id cannot collide with the orchestration port's reserved offset ids. Servers advertise threadSubprojects. Older clients ignore the unknown event type (same exposure as thread.issue-linked) and show the thread as a worker, as today. Auto-promotion lives in the decider and only on thread.create: when the new thread's parent is itself nested and its mode is auto or absent, the same decision also emits the parent's subproject-set with mode on and source auto. It is sticky, off blocks it, on is left alone, and a top-level thread is never promoted; thread.parent.set does not promote. A top-level thread stores a mode but it changes nothing. Known side effect: under auto, any worker that gets one helper becomes a subproject; `t3-thread orchestrator unmark` (off) opts it out. findProjectRootThreadId (projectIssues.logic.ts) walks up to the first top-level or mode-on thread and replaces findRootThreadId for project-scoped data: dashboard settings, layout and history (ProjectLayoutService.rootOf, so a subproject orchestrator can write its own layout), canvas, the request ledger and intake (and so Decisions and the roadmap, which resolve through RequestLedger.resolveThread), and the issue scope. collectThreadTree now leaves out descendants that are subprojects, so a subproject's issues belong to its own tree and not its parent's. Tracker: a top-level thread keeps its tracker under the T3 project id as before; a subproject stores its own under its thread id, and resolveProjectTracker inherits through the enclosing projects when it has none. Settings files are keyed by thread id, so existing keys do not move. Left on findRootThreadId: none outside the logic tests; every remaining caller was project-scoped. CLI: `t3-thread orchestrator mark|unmark|auto <thread>` and `create --subproject` (a follow-up thread.subproject.set after creation). Automatic promotion stays gated off (AUTO_PROMOTE_SUBPROJECTS = false in NestingService.ts) after the subprojects UI shipped, because the mobile app cannot yet reach a subproject's decisions; only an explicit orchestrator mark, `create --subproject` or the UI's Show as subproject creates one. In V2 every parent change (create under, reparent, drag, intake) passes through NestingService.persist, so the same gate covers reparenting; makeNestingService takes an `autoPromoteSubprojects` option that the promotion tests set to prove the logic without shipping it on. Enabling it is the separate subprojects-auto-promotion item, with the mobile client. Packaged history smoke explicitly expects fork migration 16 (ProjectionThreadsSubproject), preserves all historical/main/two-boot assertions, and optionally retains created roots with T3_HISTORY_SMOKE_RETAIN_ROOTS=1 for diagnosis; default release cleanup is unchanged."

[[decision]]
id = "v2-subproject-metadata"
date = "2026-10-06"
decided = "adapt"
rationale = "Subproject mode is canonical fork organizational metadata with receipt-backed updates and native shell refresh, independent of execution lineage. Migration 16 retains its published name and imports V1 modes read-only; startup also imports a pre-recorded V1 ledger 16 without rerunning it. CLI uses fork.threads.metadata.update. AUTO_PROMOTE_SUBPROJECTS remains false."

[[decision]]
id = "socket-open-209-subprojects-server"
date = "2026-10-08"
decided = "adapt"
rationale = "Preserve migration 16 ledger identity while persistence startup owns the idempotent metadata and legacy import."
