name = "fork-desktop-delivery"
subject = "feat(desktop): deliver the fork desktop app with its own identity and updates"
class = "product"
purpose = "Ship fork desktop identity, flavors, code signing, isolated app data, updater channels, packaging, and desktop lifecycle integrations such as deep links."
retire_when = "Upstream or maintained shared tooling provides equivalent fork identity, signing, and update-channel handling."
depends_on = ["fork-build-ci-compat"]
roles = []
note = "#214: Existing update-state IPC adds optional phase and byte counters; startUpdate runs the entire confirmed flow with existing retry errors. Reorganized 2026-09-06 from fork-desktop-distribution. The packaged Linux portal identity fixture retains the fork desktop-entry name when upstream changes its own identity."
[[decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Retain V2 backend/readiness and native validated navigation; isolate fork profiles and V1 import sources, preserve updater suffix/signing, and move flavor metadata into fork modules."

[[decision]]
id = "upstream-update-disabled-reason-arg-shape"
date = "2026-09-26"
decided = "narrow"
rationale = "This patch had rewritten every field of getAutoUpdateDisabledReason's argument literal as readonly, which added no fork behavior and turned upstream's one-line isDebPackage addition into a whole-block conflict. Keep upstream's field lines verbatim and add only the fork's devFlavor field."

[[decision]]
id = "upstream-desktop-delivery"
date = "2026-09-16"
decided = "adapt"
rationale = "Preserve upstream preview-channel isolation, remote-only startup, OTLP defaults, macOS passkey signing, and WSL runtime packaging while retaining fork identity, fork-nightly channel recognition, updater publication, deep links, and release packaging."
[[decision]]
id = "upstream-effect-cli-literals"
date = "2026-09-20"
decided = "adapt"
rationale = "Use upstream's Effect CLI Literals constructor for both upstream build selectors and the fork desktop flavor selector."
[[decision]]
id = "desktop-entry-name-unexport"
date = "2026-09-24"
decided = "adapt"
rationale = "This patch removes DesktopEnvironment's import of resolveLinuxDesktopEntryName, leaving DesktopEarlyElectronStartup as its only user, so the patch also un-exports it to keep Knip clean. Relocated here from fork-build-ci-compat."

[[decision]]
id = "catchup-2908-desktop-passkeys"
date = "2026-10-10"
decided = "adapt"
rationale = "Preserve upstream profile-gated webauthn metadata and Touch ID/browser entitlements (#16950, #16952, #16956) alongside fork app flavor and optional-profile signing. Keep upstream CLI-command/web-link services and the fork DesktopDeepLink, including packaged T3 Code (Fork) identity (#16939, #17587). No passkey or deep-link capability is removed; source/static review passed and composed desktop/signing gates remain required."
