name = "fork-dash-173"
subject = "feat(web): show tasks under their workstream, as a table or by status"
class = "product"
purpose = "One place for tasks, grouped by workstream: each open epic is a band of its tasks (For review, Active, Pending, Complete folded) with the agents on them and what they last said, plus what changed since Brad's previous visit. The Tasks tab switches between this and the four status columns; the Dashboard's Workstreams block is the same component without Complete."
retire_when = "Upstream provides an equivalent workstream and task board, or the project page is retired."
depends_on = [
  "fork-dash-173-part-of",
  "fork-dash-187",
  "fork-dash-172",
  "fork-project-workstreams",
  "fork-task-view",
]
roles = []
note = "Issues #173 (A2 with last-said as Latest) and #175 (board and status view combined). Replaces the epic-only Workstreams line; its deriveWorkstreams logic is deleted and its phase, milestone, progress and Blocked reading (an open blockedBy, a stuck Active task) carry over into workstreamBands.logic. The old block's 'blocked worker' signal is not carried over here: it moves with the Blocked widget into the threads view (#178). An epic's tasks are its 'Part of' children plus its checklist's open ones; a parked or closed epic lists as a row of the last band. Latest is the newest linked thread's worker summary, else the issue's newest comment; shells carry no message bodies. The Tasks view choice and each band's explicit open or closed choice are remembered per project and device in localStorage; a band with no choice follows its default (open when it waits on Brad, has agents working, or is the only band), so the default changing never reverses a choice. 'Since you looked' uses the page's previous-visit mark, so only the Dashboard block shows it."
