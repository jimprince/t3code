name = "fork-board-declutter"
subject = "feat(projects): remove meta lines, ids, duplicate rows and narration from the project page"
class = "product"
purpose = "Cut visual clutter from the project page so each row says what it is, its status and one progress line: no meta lines, internal ids, agent prose or second copy of the next release (fork.28 board redesign)."
retire_when = "Upstream provides an equivalent project board, or the project page is retired."
depends_on = [
  "fork-release-horizon",
  "fork-board-blocked-working",
  "fork-item-types",
  "fork-needs-you-decisions",
]
roles = []
note = "Deletions and one logic change in apps/web/src/components/orchestrators; no RPC, contract shape, setting or layout id changes, so saved layouts keep working (only two widget description strings in projectLayout.ts changed). Tasks cards (IssueRow) lose the 'repo#N \u00b7 request|issue \u00b7 comment count \u00b7 thread' meta line and keep title, the kind and bug tag, age and Settle or Reopen; the lane is the status, and the thread opens from the task view's Open thread. Request rows (CompactRow) lose the '-> worker' line and the 'latest:' prefix, keeping the status word, title and one Progress line. deriveWorkingNow now takes the next step only from the task's 'Progress:' comment and no longer falls back to the worker's own first sentence (this supersedes the fallback fork-board-blocked-working describes), so Working now never shows agent prose. The pull request link reads '#N' with the title beside it instead of 'owner/repo #N' (the full reference stays as its accessible name); the pull requests widget already lists each pull request once and no other project-page row renders one, so there is no second copy to fold. The Release widget drops its 'Next release' list, which repeated the roadmap's next-version items, and keeps completed tasks by release with their test steps and one 'Awaiting release' group; the next release's outcome, N of M, next deliverable and epics stay in 'Where we're going'. Decisions keep their short '#N' issue link and Blocked keeps 'Blocked by #N' with its Open button, since those are the links to act on. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
