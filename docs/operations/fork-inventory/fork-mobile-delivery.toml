[[decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Keep native V2 checkpoint types and Expo entrypoint; overlay only fork identity and development fingerprint policy. Compose pnpm normalization with native major-version fingerprint isolation so production OTAs cannot reach old-major binaries."

[[decision]]
id = "upstream-mobile-production-delivery"
date = "2026-09-16"
decided = "retire"
rationale = "Retire this patch's older production EAS workflow because upstream now preserves version overrides and preview profiles, auto-submits store builds, reconciles per-platform builds on push, and fingerprint-gates OTA publication. Retain the fork-specific identity, development lanes, runtime policy, tests, and deployment documentation."

[[decision]]
id = "catchup-2908-native-navigation"
date = "2026-10-10"
decided = "narrow+adapt"
rationale = "Compose Screens v5 source fingerprinting/native columns (#16733) and iOS Duo (#12648) with fork major-version isolation and pnpm autolinking normalization. Preserve com.brad.t3code, t3code-brad and EAS routing. iOS and Android both require a rebuilt native client, not an OTA-only update; orientation policy stays upstream. Accept removal of the unused diff-path unquote helper after upstream parser decoding (#16644), while keeping real-Expo-loader/native-import tests. Static fingerprint assertions passed; composed loader tests and native delivery remain required."
