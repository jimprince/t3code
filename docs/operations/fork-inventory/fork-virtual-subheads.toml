name = "fork-virtual-subheads"
subject = "feat(server): versioned virtual helpers with durable sender results"
class = "product"
purpose = "Add app-owned virtual entries beside standing named agents, using frozen template revisions and AutomationRun history for fresh bounded jobs."
retire_when = "Upstream provides named virtual helper templates, restart-safe single-run admission and durable single sender results through CLI and MCP."
depends_on = ["fork-named-agents", "fork-nested-threads", "fork-scripts-automations"]
roles = []
note = "Slice 1; the operator UI is the separate fork-virtual-subheads-ui stanza. Slice 2 adds one read-only operation, runs, to the same fork.subheads RPC (SubheadRuns.list, SubheadApi, subheadRpc.ts): open runs, the newest finished runs per subhead, and up to 20 finished runs per subhead whose delivery is undelivered, held or retrying, with no result text. Edit and state changes are open to the creating principal or a session holding the access:write administrative scope (mayChangeSubhead in SubheadRegistry; ws.ts passes the scope), and responses carry callerMayChange so clients can disable the buttons. Owns packages/contracts/src/{subheads,subheadRpc,namedAgents,automations,forkThreadMetadata,index,rpc}.ts; packages/shared/src/providerRuntimeMode.ts and its package subpath export; apps/server/src/forkThreads/Subhead*.ts, NamedAgents.ts, NamedAgentPolicy.ts, WorkerLifecyclePolicy.ts, HandoffService.ts; persistence/ForkMigrations/018_VirtualSubheads.ts and ForkMigrations.ts; auth/RpcAuthorization.ts; observability/RpcInstrumentation.ts; ws.ts; server.ts; automations/{AgentGateway,AutomationEngine,AutomationStore,runOutcome}.ts and associated tests; orchestration-v2/Orchestrator.ts; orchestration-v2/legacy/ForkAutomationUpgrade.integration.test.ts; relay/AgentAwarenessRelay.ts and test; mcp/{SubheadMcpService,SubheadMcpToolkit.integration.test,McpHttpServer,OrchestratorMcpService}.ts and mcp/toolkits/subheads/*.ts plus mcp/toolkits/worktree/registration.test.ts; apps/t3-thread/src/{subheads,namedAgents,cli,client,contracts,notifications,rpc,types}.ts and v2/nesting.ts; CLI tests/subheads.test.ts, named-agents.test.ts and notifications.test.ts; CLI README and AGENT_OPERATIONS.md; this inventory and docs/release-notes/entries/virtual-subheads.toml."
