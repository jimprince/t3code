name = "fork-decision-links"
subject = "feat(projects): links in decisions open"
class = "product"
purpose = "Make web addresses in decision cards clickable (context, options, Needs you summary and recommendation) on web, desktop and mobile, opening in a new tab or the system browser (first slice of brad/t3code-fork#169)."
retire_when = "Upstream renders links in project page decisions, or the Decisions widget and Needs you decisions are retired."
depends_on = ["fork-needs-you-decisions", "fork-decisions-other", "fork-dashboard-polish"]
roles = []
note = "linkifyText (packages/client-runtime/src/linkify.ts, export './linkify') splits text into text and link runs: only http and https, trailing sentence punctuation and a closing bracket the URL did not open stay text. Web LinkifiedText renders links with target=_blank; the desktop window's setWindowOpenHandler already hands those to shell.openExternal instead of navigating the app. A decision option is a send button, so its links render as a small OptionLinks row under the button (an anchor inside a button cannot be clicked on its own). Mobile MobileLinkifiedText nests link Text runs (tryOpenExternalUrl, markdown-link target) inside the context and option Text, so a link press opens the browser and the rest of an option still selects it. Kept as its own patch rather than a refresh of fork-decisions-other because fork-dashboard-polish rewrote the decision card above that patch. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
