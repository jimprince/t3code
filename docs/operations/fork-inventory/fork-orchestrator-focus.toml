name = "fork-orchestrator-focus"
subject = "feat(threads): fold worker traffic in orchestrator threads"
class = "product"
purpose = "Stamp t3-thread notices and sends with their origin, and fold an orchestrator's worker-started turns behind one row per run on web and mobile, keeping the user's conversation and anything that asks for them visible, with an All traffic switch."
retire_when = "Upstream provides message provenance and an equivalent orchestrator view that hides worker traffic while surfacing questions, approvals and flagged results."
depends_on = ["fork-worker-operations", "fork-nested-threads"]
roles = []
note = "Origin rides as one unreferenced t3-origin context record, so it never reaches the provider or renders as a chip. Older CLI messages fall back to the notification prefix. Durable queued sends preserve origin. Only notices and sends from the orchestrator’s organizational descendants fold; parent instructions and the user conversation remain visible. Live, streaming, unanswered, pending-input and attention turns stay visible, with reversible per-run expansion and All traffic controls on web and mobile. Reminder policy belongs to fork-child-input-attention; notification routing/wake and held/superseded policy belong to fork-worker-operations. Organizational parentage comes from the nesting sidecar."

[[decision]]
id = "m3-ui-review-s8-attention"
date = "2026-10-06"
decided = "narrow+adapt"
rationale = "The needs-you count is strict V1 parity: pending approval and user-input requests only (an earlier port also counted proposed plans, which V1 never did). The V2 port also counted every in-progress tool item and every failed or interrupted run, so each live worker-triggered command turn showed \"1 for you\" and a crash-orphaned item kept it. Failed or interrupted runs staying out of the count is a product call kept as in V1; revisit only if Brad wants them surfaced."

[[decision]]
id = "v2-port-2689-m2"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Port supervision UI to V2 shells behind fork-owned components; preserve native lineage and run state."

[[decision]]
id = "catchup-2908-focus-renderer-context"
date = "2026-10-10"
decided = "adapt"
rationale = "Compose the existing focus control and Brad-view flex wrapper with upstream thread-find context (#10439) and current timeline fullscreen/follow gates. Keep findActive scroll behavior and handleListLoad alongside fork controls. Static JSX/follow review passed; composed CI remains required. No new visual choice."
