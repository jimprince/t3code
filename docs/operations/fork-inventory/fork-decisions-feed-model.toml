name = "fork-decisions-feed-model"
subject = "feat(decisions): one feed model for web and mobile"
class = "product"
purpose = "The pure model of the one Decisions feed (brad/t3code-fork#174, #180, #181), shared by web and mobile: which cards exist, their order, Later, project chips, owners, the pull request a Review card is about, and Markdown block clamping."
retire_when = "The Decisions feed is retired, or the web and mobile clients stop sharing one feed model."
depends_on = ["fork-decisions-feed-server"]
roles = []
note = "decisionFeed.ts (export './decision-feed'): buildDecisionFeed merges thread questions and approvals (projectRequests.pendingAsks), plans waiting on Brad, needs-brad decisions and the answers / approve / review / test issues of the old Needs you. An issue that is both a decision and an item shows once, as the decision. Stalled threads lead; the rest sort oldest first by decisionSortTime (Move to end is later). Deferred cards go to `later` until decisionVisibility says they return (a day before a deadline at the latest). Chips count every visible card per project before the filter. reviewPullRequest picks the newest open pull request of the threads linked to the issue, with its mergeability and watched head sha for the merge pin. splitMarkdownBlocks / clampMarkdownBlocks clamp context by whole blocks (a lead paragraph, a list or table never cut), decisionContextMarkdown turns Gitea's <img> tags into Markdown. Hermes-safe: no toSorted. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
