name = "fork-board-blocked-working"
subject = "feat(projects): derived Blocked and outcome rows for Working now"
class = "product"
purpose = "Make the project page's Blocked and Working now widgets answer 'is anything stuck' and 'what is being worked on' from derived outcomes instead of worker narration (fork.28 board redesign)."
retire_when = "Upstream provides an equivalent project board, or the project page is retired."
depends_on = ["fork-project-task-status", "fork-project-layout"]
roles = []
note = "Blocked is derived, never hand-set (deriveBlocked in projectWork.logic): a worker the thread state flags blocked (summary.blocked: session or turn error, or a latest line starting 'Blocked'), an Active task whose body or newest comment says 'Blocked by #N' while #N is still open, and an Active task with no change for 3+ days ('Stuck 4d'; a linked worker's activity counts as change). ProjectIssue gained optional blockedBy (same-repository numbers): ProjectIssuesService parses the issue body with parseBlockedBy, and RequestLedger adds the newest comment's references for the requests it already fetches comments for. Rows show what, cause, owner thread and next step, with an 'Open #N' button only for a blocked-by row; the row opens the owner's thread; the widget hides when empty and the status-line 'N blocked' uses the same rows. Working now rows read '<task or thread title> \u00b7 Active \u00b7 next: <Progress note or the thread's first sentence> \u00b7 <worker>' with no model badge and no clipped prose (a line over 120 characters is dropped), still opening the thread and keeping 'for: <request>' when it names another request. The layout widget types working and blocked are unchanged, so saved layouts keep working. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
