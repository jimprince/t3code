name = "fork-item-types"
subject = "feat(projects): question, task and epic item types with a bug tag"
class = "product"
purpose = "Replace the eight request kinds with three item types (question, task, epic) and an optional bug tag on a task, everywhere Brad files, retypes and reads a request."
retire_when = "The request ledger is retired, or upstream tracks typed project requests."
depends_on = ["fork-project-layout"]
roles = []
note = "Labels on Gitea are ask:question, ask:task, ask:epic and a plain bug label; new requests carry only these. Older ask:* labels (feature, change, maintenance, test, deliverable, bug, plan) stay on issues as history and are never stripped. Reading (taskKind, isBug in projectRequests.logic): a new label wins; otherwise question stays question, ask:plan reads as epic, ask:bug reads as task plus bug, and every other ask:* reads as task. groupForKind maps question to answers, epic to approve, task to review. ProjectRequestKind still decodes the old values from older clients and outbox entries and maps them to question, task or epic (normalizeRequestKind; parseOutbox also turns an old bug kind into bug: true), so nothing in flight breaks. The request-items model now classifies into question, task or epic plus a bug boolean. planKindLabelChange (requestLedger.logic) decides label edits: kind swaps only among the three ask: labels, history labels stay, bug adds or removes the bug label, and retyping an old ask:bug issue keeps its bug tag unless bug is false. ProjectRequestUpdateInput and the create input gain bug. CLI: request add --kind question|task|epic [--bug]; request type <thread> <request> question|task|epic [--bug|--no-bug]. Every place that shows the kind (Tasks cards, Needs you, Requests, Release rows, completed tasks) uses RequestKindTag, which shows the kind and a small bug tag. The Maintenance widget keeps working from the old ask:maintenance history label (a task that carries it still counts as maintenance; ask:bug issues stay out), so existing maintenance items do not disappear; new items never get ask:maintenance. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
