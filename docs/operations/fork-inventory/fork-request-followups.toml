name = "fork-request-followups"
subject = "feat(projects): fold chat follow-ups into tracked issues instead of filing each message"
class = "product"
purpose = "Stop request tracking from filing every chat message as its own Gitea issue (brad/t3code-fork#120): follow-ups attach to the thread's tracked or linked issue, questions and acknowledgements never become issues, and new requests come from the New request box or genuinely new work."
retire_when = "The request ledger is retired, or upstream tracks requests with equivalent grouping."
depends_on = ["fork-request-ledger", "fork-project-task-types", "fork-project-request-box-pinned"]
roles = []
note = "Before splitting, the drain re-reads the tracker and offers the model up to 40 open issues (the thread's linked ones first, marked as this conversation, then the project's open requests); each split item names the one it continues (existing) or null. planRequestItem: an explicit entry (projectRequests.submit, sent by the New request box just before its message is dispatched) files every item; a chat question is skipped; an item naming an offered issue becomes a 'Follow-up from Brad' comment with a hidden t3-request-followup marker on that issue and links the thread; without a model the unsplit item follows the thread's newest linked issue; anything else is filed. An explicit submit upgrades a not-yet-split capture of the same message. projectRequests.update now accepts any open tracker issue (start, note, ready, shipped), and projectRequests.settle closes or (reopen) reopens any of the project's issues from its row. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
