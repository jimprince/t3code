name = "fork-project-canvas"
subject = "feat(projects): orchestrator canvas widget"
class = "product"
purpose = "Let an orchestrator show a static page it maintains (charts, counts, screenshots) as a Canvas widget on its project page, safely sandboxed."
retire_when = "Upstream provides orchestrator-authored dashboards, or the project page is retired."
depends_on = ["fork-project-page-workflow", "fork-project-dashboard-widgets"]
roles = []
note = "projectCanvas.read resolves the thread's orchestrator project and reads <workspace>/.t3/dashboard/widgets.json ({widgets:[{id,title,path,size}]}, at most 8, ids 1-30 [a-z0-9-], .html paths inside the folder) or, without it, index.html as the single canvas. Each page inlines only relative src/href files inside its own folder (no scheme, absolute, or .. paths; known static types; 4 MB per canvas) as data URLs, with the newest mtime. Canvas widgets are canvas:<id> in the dashboard order; the canvas slot expands to those not placed on their own, and Customize lists them one by one. The client renders each with iframe srcdoc and sandbox=allow-scripts without allow-same-origin (opaque origin, no T3 session, cookies or storage, no network path into T3). The action bridge accepts postMessage only from the canvas's own frame with origin null, whitelists send (confirm chip with the exact text, then the normal queued send path), open-thread (tree threads), open-issue and open-url (http(s) on github.com, configured Gitea web origins and the tree's issue and PR hosts), rate-limits 5 per 10 s per frame, logs every outcome via projectCanvas.action, and replies t3-canvas-result. The request box's send moved to sendToOrchestrator for reuse. Template, style kit, manifest and funnel example live in docs/user/project-canvas. The host puts the app's theme variables (projectCanvasTheme.logic CANVAS_THEME_VARIABLES, read from the live root and refreshed when the theme changes) into a style at the top of the canvas document's head, with color-scheme, so a page follows the app theme; the frame has no background of its own and the style kit and funnel example use those variables with #0a0a0a fallbacks (Brad 2026-10-08: no pure-black backgrounds). Changing the theme reloads the frame."
