name = "fork-request-answers"
subject = "fix(projects): each question keeps its own answer; requests stop flickering"
class = "product"
purpose = "Fix two fork.26 defects of the project page: requests flickered between Needs you and the Requests list, and every Answers ready question showed the same reply. Answers are now per question and stored, shown answer first."
retire_when = "The request ledger is retired, or upstream tracks per-message answers."
depends_on = ["fork-request-followups", "fork-project-page-usability"]
roles = []
note = "The flicker came from the 'thread replied' rule reading live thread state: a request counted as answered only while its thread was idle and its latest turn had completed after the request, so a busy orchestrator moved its questions between groups on every turn, and every question showed the thread's newest reply. The ledger now adds answer {text, askedAt, answeredAt} to each open request: the last finished assistant message of the turn the request's own message started (or, without a turn id, before the next user message), found via the message repository only after hasAssistantMessageForTurn says the turn replied, and cached for the process once found. replied is issue.answer !== undefined, so a request changes group only when its data does. Real Gitea after fork.26 showed the no-model fallback piling unrelated messages onto the orchestrator's most recently updated issue, so without a model a chat message now follows its thread's issue only when the thread has exactly one, and otherwise files nothing. Needs you rows follow docs/dashboard guidelines: the question, then its answer in up to three whole sentences (the agent's ready comment when it marked the request ready), Asked and As of times, Settle; no meta line; clicking opens the thread. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
