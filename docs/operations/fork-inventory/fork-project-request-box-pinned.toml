name = "fork-project-request-box-pinned"
subject = "feat(projects): pinned request box that sends in the background"
class = "product"
purpose = "Make the project request box a support box where the work actually gets done: pinned first on the Dashboard, sending in the background and saying which request tracks it."
retire_when = "Upstream or another fork concern provides an equivalent project request box."
depends_on = ["fork-project-page-workflow", "fork-project-canvas"]
roles = []
note = "The box renders above the widget list on the Dashboard tab only, outside the widget order and Customize, and the Requests widget no longer hosts it. Send goes through sendToOrchestrator without opening the chat, clears the box and shows Sent (or Queued) to the orchestrator; the line becomes 'tracked as request #N' (linked) once the ledger files an issue whose t3-request marker carries the message id, or 'pending filing' while the outbox holds it. The issues query is re-read 3, 10, 30 and 60 s after a send and the line clears after 2 minutes. Open chat is an explicit button; Save for later and image paste or drop are unchanged. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
