name = "fork-release-horizon"
subject = "feat(projects): next-release horizon with epic progress"
class = "product"
purpose = "Show where the project is going: the next release first (its outcome, N of M done, the task to deliver next), epics as '1 of 4' with a phase word, and everything later as one count, so the Dashboard answers 'are we on track' without charts or dates."
retire_when = "Upstream or another fork concern provides an equivalent project page."
depends_on = ["fork-project-task-status", "fork-project-layout"]
roles = []
note = "ProjectIssue.epic {done, total, remaining} is computed server-side in ProjectIssuesService.list by epicProgress.logic: an issue labeled ask:epic (or an older ask:plan unless ask:task or ask:question is also present) has children from its body checklist ('- [ ] #12 title') plus issues whose body starts 'Part of #N'; a child is done when closed or ticked, so a child closed before the 14-day closed window counts only through its tick. ProjectRoadmapItem.epic carries it to the roadmap and ProjectRoadmapVersion.description carries the milestone description. The web phase word (projectHorizon.logic epicPhase) is Planning when no child is done or started, Building when any is, Review when every remaining child is For review, Complete when none remains; no percent bars, dates or charts. The roadmap-summary widget now renders 'Where we're going': next version, the first line of its description as the outcome, 'N of M done' (the Roadmap tab's version count, epics included), the Active (else For review) task as next, the next release's epics, and 'Later (N)' for every later version and the parked items; the Roadmap tab shows an epic's second line as '1 of 4 \u00b7 Building'. The Release widget and its release line are unchanged. No new RPC. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
