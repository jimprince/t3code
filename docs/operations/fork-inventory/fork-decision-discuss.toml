name = "fork-decision-discuss"
subject = "feat(projects): discuss a decision in its own thread"
class = "product"
purpose = "Let Brad talk a decision through before answering it: Discuss on a decision (Decisions widget, Needs you decision rows, mobile) opens a briefed thread under the thread waiting on it, and agents record his answer through the same decide path the widget uses (brad/t3code-fork#145 follow-up)."
retire_when = "Upstream provides an equivalent decision discussion surface, or the Decisions widget and Needs you decisions are retired."
depends_on = ["fork-needs-you-decisions", "fork-decisions-other"]
roles = []
note = "One service method, RequestLedger.discuss, exposed as projectRequests.discuss (operate scope), the decision_discuss MCP tool and t3-thread decision discuss. Owner: for a needs-brad issue the resolveWaitingThread result, else (a Needs you item) decisionThreadId over the issue's linked threads, the same thread Decide tells; the orchestrator root when that is missing or archived. It dispatches thread.create nested under the owner, in the owner's project with its modelSelection and runtimeMode, titled 'Discuss #N: <question>', then one thread.turn.start with the brief from decisionDiscussion.logic.ts (question, context, options with (recommended), or the item's latest comment; the answer command naming the project root thread; settle when done). Dedupe is that title prefix on a live child of the owner, under a process-wide semaphore so a double click opens one thread; an archived discussion lets Discuss start a new one. The discussion thread is deliberately not linked to the issue: Decide tells the first live linked non-root thread, so a link could route Brad's widget answer to the discussion instead of the worker. Clients open the returned thread right away (web useDiscuss through useOpenThread, mobile through the Home thread selection). This supersedes fork-needs-you-decisions' 'No t3-thread verb': agents record the answer Brad settled on with t3-thread decision answer (--option, --answer, --approve, --not-yet, --note as the reason) or the decision_answer MCP tool, both calling the existing RequestLedger.decide, so the comment, label change and waiting-thread message are the widget's own. The MCP toolkit builds its own RequestLedger the way ws.ts builds one per connection. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."

[[decision]]
id = "v2-discussion-native-thread"
date = "2026-10-06"
decided = "adapt"
rationale = "Create through native V2 thread management, persist organizational parent through the existing fork nesting service, then message.dispatch. A failed seed remains best effort after creation and nesting. Real web/mobile render hunks are handed to the UI lane."
