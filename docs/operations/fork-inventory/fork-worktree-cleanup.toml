name = "fork-worktree-cleanup"
subject = "feat(t3-thread): retire archived worker worktrees"
class = "product"
purpose = "Plan and execute retirement of the per-worker git worktrees T3 creates, removing only checkouts whose threads are all archived past a recovery window and whose git state is clean."
retire_when = "Upstream or the t3-thread CLI host binding provides equivalent guarded worktree reclamation, or the fork intentionally stops requiring this concern."
depends_on = ["fork-worker-operations"]
roles = []
note = "Requires an explicit local state directory whose environment ID matches the selected server before local inspection. Execution rereads lifecycle and Git state before each non-forced removal; the dry run remains non-mutating."
[[decision]]
id = "upstream-t3-thread-rpc-surface"
date = "2026-09-16"
decided = "adapt"
rationale = "Retain guarded local worktree retirement; the CLI adapter uses the archived-snapshot request from shared orchestration contracts."

[[decision]]
id = "v2-port-2689-m2"
decision = "keep-on-top"
note = "GC reads archived V2 shells and all live execution resources, preserving non-forced Git removal and environment identity validation."
