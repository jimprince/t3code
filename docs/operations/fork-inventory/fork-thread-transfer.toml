name = "fork-thread-transfer"
subject = "feat(threads): transfer threads between environments"
class = "product"
purpose = "Move a thread and its workspace context between environments: export/import bundles, provider context handoff, RPC registration, and coordinated web and desktop flows."
retire_when = "Upstream ships equivalent cross-environment thread moves."
depends_on = ["fork-thread-client-recovery", "fork-conversation-fork", "fork-general-chat"]
roles = []
note = "Version-2 move bundles carry bounded native and legacy attachment bytes, preserve metadata identity, rewrite target storage paths, and clean only newly created objects on failure. Version-1 metadata-only bundles remain readable; old importers reject version 2. Reorganized 2026-09-06 from fork-thread-transfer. Turn starts inspect the import marker without hydrating ordinary thread history; transferred threads retain context handoff."

[[decision]]
id = "v2-portable-import"
date = "2026-10-06"
decided = "adapt"
rationale = "Bundle version 3 retains source projection and released bundles as read-only evidence; imported messages use fresh native bounded handoff. Durable import receipts precede guarded source archival. UI is handed to the Claude lane."

[[decision]]
id = "upstream9917-environment-api-removal"
date = "2026-09-20"
decided = "relocate"
rationale = "Upstream removed the obsolete EnvironmentApi facade from ipc.ts. Retire the transfer methods and type imports from that deleted surface; keep transfer export/import on the client-runtime environment RPC commands and server orchestration contracts."

[[decision]]
id = "upstream1895-thread-menu-project-group"
date = "2026-09-18"
decided = "adapt"
rationale = "Reuse upstream's project-group lookup and project-filter action when deriving cross-environment move targets, so filtering, project settings, and transfer all address the same grouped project."

[[decision]]
id = "upstream-composer-context-records"
date = "2026-09-16"
decided = "adapt"
rationale = "Project the current request's structured composer context before wrapping it with transferred visible history, preserve context records on imported messages, then append file-attachment prompt lines once. This keeps upstream context without duplicating the imported request or UI history."
[[decision]]
id = "upstream-pr-asset-github-cli-runtime"
date = "2026-09-17"
decided = "adapt"
rationale = "Retain upstream's shared GitHub CLI layer for pull-request asset downloads alongside the fork's independent thread-transfer runtime. Upstream still has no cross-environment thread transfer, and both services use the same unchanged runtime integration seam."
