name = "fork-private-connection-defaults"
subject = "fix(remote): default bare private hosts to plain HTTP pairing"
class = "divergence"
purpose = "Default bare LAN and Tailscale hosts to http://host:3773 while preserving explicit schemes and ports, and keep the historical auth migration repairs and relay deployment guards."
retire_when = "Upstream ships equivalent private-host connection defaults and the historical repairs are no longer needed by existing databases."
depends_on = []
roles = []
note = "Only bare private hostnames without an explicit protocol/default port receive HTTP:3773 defaults. Explicit HTTPS and ports are preserved. Historical auth-repair migrations and relay deployment routing remain."

[[decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "keep-on-top"
rationale = "Keep private host defaults, historical auth repairs and complete/empty relay guard behind fork-owned modules; preserve V2 relay implementation and tests."


[[decision]]
id = "upstream-relay-deploy-script-removal"
date = "2026-09-20"
decided = "narrow+adapt"
rationale = "Upstream removed the relay deploy helper and its unit test and switched the workflow to Alchemy's non-interactive deployment. Retire the fork's edits to the deleted test; keep the fork's optional-config guard and isolated client-config environment around upstream's --no-input command."

[[decision]]
id = "rpc-scope-map-relocation-951"
date = "2026-07-29"
decided = "relocate"
rationale = "Upstream moved the RPC scope map into auth/RpcAuthorization.ts and type-coupled it to WsRpcGroup. Keep the fork's transfer, recovery, and headless scopes at that new location so missing scope coverage remains a compile-time error."
