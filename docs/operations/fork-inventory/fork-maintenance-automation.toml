name = "fork-maintenance-automation"
subject = "chore(fork): automate StGit stack maintenance and upstream replay"
class = "product"
purpose = "Route maintainers and agents through the StGit policy, validate and publish the stack with immutable leases and atomic metadata, replay during upstream synchronization, and publish fork-feature pushes on the already integrated upstream base."
retire_when = "Upstream or maintained shared tooling provides equivalent maintained-fork automation, or the fork intentionally stops requiring this concern."
depends_on = ["fork-release-publication", "fork-build-ci-compat"]
roles = ["agent-docs-owner"]
note = "Inactive by default: verified successful pushes can make one fixed-argv, bounded, non-fatal host-local post-release disk observation with notification and durable receipts; activation remains separately Deployment-gated. Requires authored release entries for user-visible changes and validates them before publication. CI owns the shared verify-source checks including Knip; verify-stgit-replay stages immutable source/metadata inputs and waits for exact candidate CI. Main and release dereference that evidence instead of rerunning source verification, retaining published-stack policy, transfer-report baselines and artifact checks. Server verification stops scheduling tests after the first failure; passing candidates still run the full suite. Independent verification stages collect failures in one pass without weakening the publication gate. Nightly release-tag discovery uses a constant number of Git processes and aborts on lookup failure. Removed unused subject-based metadata reconstruction and obsolete maintenance plans; leased publication remains authoritative. Retiring persisted functionality requires an explicit data transition, immutable shipped migration IDs and frozen historical upgrade coverage. Product-bug instructions require evidence for each reported symptom, including cross-project PR routing and existing saved links/snapshots. Review also checked snapshot plumbing, diagnostics and obsolete mobile controller removals: these did not remove persisted orchestration event types. Retry limits remain unchanged pending genuine unattended observations."

[[decision]]
id = "v2-candidate-packaged-smokes"
decision = "adapt"
note = "#200: Extend the existing Linux Build job with server-bundle history smoke, SEA/Rust packaging and full headless smoke. Reuse its web/server output and release build commands; use unchanged source versions and runner-temp artifacts. Require successful packaged history, executable build, archive build and headless smoke steps in candidate evidence; missing, skipped or failed evidence falls back to normal verification. Candidate-CI evidence and reuse belong to fork-maintenance-automation, which follows release publication and headless delivery; no prerequisite relocation or reorder. T3 Orchestrator owns live CI rollout."


[[decision]]
id = "focused-worker-verification"
date = "2026-10-07"
decided = "adapt"
rationale = "Workers verify changed packages and affected dependents with focused tests and touched-file checks. The integrated exact-SHA candidate runs the complete CI gates once before publication; retained evidence reuse and integrated UAT remain required. Broad local checks are diagnostic and never waive CI."

[[decision]]
id = "v2-source-verification-gates"
date = "2026-10-06"
decided = "adapt"
rationale = "Keep V2 server protocol/import-boundary suites and transfer measurements. Exact candidate/release evidence requires the transfer artifact, Rust and aggregate Check jobs; Build evidence also requires preload output verification. Shared verify-source retains preview/nightly script checks and supplies build and release-smoke phases."

[[decision]]
id = "upstream14025-verification-job-split"
date = "2026-10-01"
decided = "relocate"
rationale = "Upstream 6f8e2534f split CI's Check job into Lint, Typecheck and Build, moved the web suite into its own Test Web job, resharded the server tests to six, and added an aggregate job named Check for branch protection. Split verify-source to one phase per job, keeping check and test as the aggregates the complete-tip gate and the release fallback use, and move the candidate gate, the shared verification call and the source-identity step onto each new job. The aggregate Check job also accepts skipped jobs when candidate_ci reused evidence, since a promoted candidate deliberately skips them. Candidate evidence now reads its job list and per-job step from one exported table that the fixtures share, with a test that checks the list against the workflow, so the next rename or reshard fails locally instead of blocking publication after a CI round."

[[decision]]
id = "upstream-restyle-ceiling-retired"
date = "2026-09-24"
decided = "retire"
rationale = "Upstream 361b047f5 dropped the secondary className props the ceiling policed and deleted both the lint:restyle-ceiling script and its CI step. Drop the mirrored call from verify-source; keeping it would fail every check phase on a missing script. Supersedes upstream-restyle-ceiling-check."
[[decision]]
id = "upstream-restyle-ceiling-check"
date = "2026-09-22"
decided = "adapt"
rationale = "Upstream added a lint:restyle-ceiling step to the CI check block this patch replaces with one verify-source call. Fold the new check into the shared check phase so verify-source keeps mirroring upstream instead of silently dropping a gate; the fork tip sits at upstream's ceiling of 1207 findings."

[[decision]]
id = "nightly-delivery-candidate-enforcement"
date = "2026-09-20"
decided = "adapt"
rationale = "Enforce existing exact candidate CI at the leased publisher for every changed source, including manual packaging repairs. Pin controller syncs to a public upstream tag and commit, and follow-up releases to the verified main and integrated base. Preserve a single stamped artifact build and existing protected publication."
[[decision]]
id = "feature-push-integrated-base"
date = "2026-09-19"
decided = "separate-feature-release-from-upstream-migration"
rationale = "Feature publication releases reviewed integrated source; selecting the newest upstream nightly caused redundant migrations and repair dispatches. The exact-base tag selector and successful main-push CI evidence preserve ancestry without another replay."
standing_policy = "Only upstream synchronization selects a new upstream source. Feature pushes use the unique nightly tag at the current stack base, or fail/skip explicitly; immutable leases and atomic publication remain required."
[[decision]]
id = "queued-main-writer-start-binding"
date = "2026-07-30"
decided = "fail-stale-queued-checkouts"
issue = "brad/t3code-fork#2 comment 2757"
rationale = "A queued workflow may check out an older event SHA after another writer advances remote main. Bind every automatic writer's lease to its checked-out starting HEAD and fail before replay rather than adopting a newer remote lease."
standing_policy = "Never renew an automatic main writer's starting lease from the remote."
[[decision]]
id = "nightly-net-source-change"
date = "2026-09-05"
decided = "narrow"
rationale = "Gate fork-only nightlies on the exact push-before and push-after packaged-source trees, not replayed commit history. Unknown history and manual dispatch retain the release path. Atomic main/tag publication removes the old 30-second visibility delay."

[[decision]]
id = "mechanical-replay-and-reliability-measurement"
date = "2026-09-09"
decided = "narrow"
rationale = "Remove generated lockfile content from replay input and regenerate at the full tip; move fork task routes into an additive index. Measure per-target delivery, intervention and conflict exposure from retained evidence instead of inferring success from healthy polling."
[[decision]]
id = "upstream-maintained-fork-automation"
date = "2026-09-16"
decided = "retain"
rationale = "Upstream does not provide the fork's concern-driven StGit replay, leased atomic publication, immutable snapshots, conflict handoff, fork reliability measurement, or agent maintenance policy. The shared Git fixture is omitted here after relocation to release publication."

[[decision]]
id = "stgit-conflict-exit-status"
date = "2026-09-16"
decided = "adapt"
rationale = "Normalize replay failures that leave unmerged files to the driver's stable semantic-conflict status while preserving StGit's raw status for non-conflict failures; StGit 2.6.1 reports merge conflicts with exit 3 rather than the earlier exit 1."

[[decision]]
id = "candidate-evidence-publication-remote"
date = "2026-09-21"
decided = "adapt"
rationale = "Outside Actions the gate resolved GITHUB_REPOSITORY from a bare `gh repo view`, which prefers the `upstream` remote the replay driver adds, so host-side verification looked for the candidate in upstream's repository and reported no candidate CI run. Resolve it from the staging remote instead, matching the documented rule that evidence lookup uses the publication remote."

[[decision]]
id = "catchup-2908-inventory-and-source-gates"
date = "2026-10-10"
decided = "narrow+adapt"
rationale = "Split the inventory to schema 3: fork-inventory.toml is header-only, each applied concern alone creates/edits fork-inventory/<name>.toml, and stack.json.applied defines order. Preserve every original key, value, comment and historical decision. Readers/writers and fixtures enforce exact files, names, subjects, backward dependencies and exclusive ownership; remove aggregate-stanza union code. Retain hosted Ubuntu fork evidence policy after upstream #16178, including the transfer-report five-minute timeout. Move upstream Chromium prerequisite (#16515) into verify-source test-server so candidate CI and release fallback share it. All 143 history positions and a production checker fixture were statically verified; composed exact-source CI remains required."
