name = "fork-project-task-status"
subject = "feat(projects): one task status everywhere, roadmap progress, Issues renamed Tasks"
class = "product"
purpose = "Show where every task stands with one status vocabulary (Pending, Active, For review, Complete) on the Tasks board, the Roadmap and Needs you, give each roadmap version an at-a-glance progress line, and call issues Tasks wherever Brad reads them."
retire_when = "Upstream or another fork concern provides an equivalent project page."
depends_on = ["fork-project-page-usability", "fork-roadmap-next-later", "fork-request-answers"]
roles = []
note = "taskStatuses (projectRequests.logic) is the one source: Complete when closed, For review when deriveNeedsYou lists it (shipped work to test included), Active when marked in progress or a linked non-orchestrator thread is working, Pending otherwise. The Tasks board lanes are For review, Active, Pending (backlog folded, 10 shown) and Complete; shipped cards say Shipped in fork.N, test it. Request and release rows use the same words through STAGE_STATUS. Roadmap rows show the status instead of #N and request; each version column shows 'N \u00b7 x complete \u00b7 y active \u00b7 z for review \u00b7 w pending' and a thin static bar, counting the milestone's closed_issues as complete (ProjectRoadmapVersion.closedIssues); the Dashboard roadmap line reads 'fork.25: x of N complete'. User-facing Issues became Tasks (tab, Dashboard line, Open tasks, sidebar 'N tasks'); Gitea, API, CLI and internal names stay issues. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
