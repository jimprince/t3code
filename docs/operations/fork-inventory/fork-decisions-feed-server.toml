name = "fork-decisions-feed-server"
subject = "feat(decisions): server pieces for one Decisions feed"
class = "product"
purpose = "Give the one Decisions feed (brad/t3code-fork#174, #180) the server side it needs: pending thread question and approval text, Approve and merge that refuses on conflict, Send back, and Later with owner names and deadlines."
retire_when = "The Decisions feed is retired, or upstream provides equivalent pending-request text, pull request merge from a card and deferral."
depends_on = ["fork-needs-you-decisions", "fork-decision-discuss", "fork-reliable-handoffs"]
roles = []
note = "DecisionFeed.ts, wired in ws.ts beside RequestLedger. projectRequests.pendingAsks reads the question or approval text of the project tree's live threads whose shell has a pending request, because shell rows deliberately carry no message bodies. The read (pendingAsks.query.ts) never hydrates a thread: one capped query on the (thread_id, status) index for its pending requests, then the newest 200 turn items of each request's node by the (node_id, ordinal) index, shaped for client-runtime derivePendingThreadRequests; its test pins the plans and shows a 3000-item history reads the same rows. approveMerge (one at a time per process) finds the open pull request that Closes/Fixes/Resolves the issue in its own repository (or takes pullRequest) and refuses anything but an open, non-draft pull request Gitea says is mergeable (its false covers a conflict and 'still checking'), then merges pinned to head_commit_id, re-reading the pull request when Gitea refuses in case the merge landed. It comments and closes the issue and tells the linked live worker. A retry is idempotent: a merged pull request that closes the issue (and was merged after any 'Brad sent this back' comment) skips the merge, posts the note only if it is not the last comment, closes only an open issue, and writes nothing once all is done (alreadyMerged). sendBack comments the note, reopens a closed issue, moves it to in progress through RequestLedger.update and tells the linked live worker, else the orchestrator (viaOrchestrator). Owners come from the tree's thread links (resolveProject), with no tracker listing. defer stores Later as one hidden comment line in the issue body (t3-deferral JSON: until, movedToEndAt) because list already reads bodies and a label per time would clutter the tracker; it comments and messages nobody. toProjectIssue exposes deferral and the decision's deadline (the context's 'deadline:' line); the projectIssues.list handler runs enrich after decorate to add each open card for Brad's owner (the waiting thread, else the live linked worker, else the orchestrator with previousTitle naming an archived worker) and its project title. decisionDeferral.ts in client-runtime decides, for web and mobile alike, whether a card is hidden and when it returns (the day before a deadline at the latest)."

[[decision]]
id = "decisions-feed-later-in-body"
date = "2026-10-08"
decided = "adapt"
rationale = "Brad asked for Later to live on the issue so it holds across devices. A hidden body line costs no extra requests and no tracker labels; a comment would need a fetch per card and would update the newest comment."
