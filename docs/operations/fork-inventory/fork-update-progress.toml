name = "fork-update-progress"
subject = "feat(web): one-click desktop update with progress, a server restart banner, and sends held while the server is down"
class = "product"
purpose = "Make updating calm: one confirmed click runs every desktop update phase and shows them, a banner follows a server update through installing, restarting and reconnecting, and plain messages typed while the server is down wait and send when it returns (brad/t3code-fork#214)."
retire_when = "Upstream shows update progress and server restarts itself, or the fork stops shipping its own desktop and headless updates."
depends_on = ["fork-desktop-delivery", "fork-headless-delivery"]
roles = []
note = "Brad's answers: ONE click runs every phase after an 'agents will be interrupted' confirm; while the server is down the composer queues messages and says 'will send when back'; the server banner shows installing, restarting, reconnecting, then 'Server updated to fork.N' and clears itself after about 4 s, and after 90 s turns to 'Server did not come back' with Retry and the manual command. Desktop: confirmAndStartDesktopUpdate (sidebar/desktopUpdateFlow.ts) is behind the sidebar pill, the legacy sidebar button and Settings > Updates; it calls DesktopBridge.startUpdate when the shell has it and otherwise the old two-step download then install flow stays. The flow store (idle, running, failed) outlives the call so SidebarUpdateCard (sidebar footer) can keep showing the failed step with Retry (which asks the same 'agents will be interrupted' confirm as the first click) and Dismiss (flow back to idle); resolveDesktopUpdateProgress maps updatePhase to step N of 5 and hides background checks, and a shell without updatePhase shows only the download. Server: useServerRestartTracking subscribes every environment's lifecycle with includeUpdates and feeds @t3tools/client-runtime/fork/server-restart; connection loss arms its 90 s deadline and the environment connecting again while still updating drops it (a blip during the install is not a failure; expire is a no-op while connected), banner timers are discrete (4 s clear, deadline expiry), restart state is kept per environment across transport loss, and the strip floats over the top edge of the window while a restart is shown, with a Dismiss on the failed state, because the fixed sidebar and per-route headers leave no in-flow slot above them. Composer: ChatView.holdSendWhileDisconnected builds the native startTurn input once, with its commandId, messageId and mode, and keeps it in a per-environment @t3tools/client-runtime/fork/disconnected-composer queue; DisconnectedSendFlusher (mounted in the shell) sends them in order when the environment connects and delivers a message held while connected at once, keeps whatever the server does not acknowledge. A server refusal (the typed OrchestrationV2DispatchCommandError, not a transport failure) is terminal for that message: the queue records the server's reason (refusal, remove and replace on the client-runtime queue), delivery goes on, the id is never replayed (the server would answer OrchestratorCommandPreviouslyRejectedError), and the composer banner shows 'Not sent: <text>' with Resend (the same text under a new commandId and messageId, in its old place) and Discard. Order is kept per thread (the queue's orderKey is the threadId): later messages of the refused message's thread wait behind it ('N messages waiting for the message not sent') and other threads still send. A failure in transit leaves everything held under the same ids, and the banner reads 'N messages not sent' with a Retry that replays them (same commandId and messageId, so the server dedupes). Nothing retries on its own, and while a thread has held messages a new send is held behind them so it cannot overtake them. Only plain text on an existing thread is held (canHoldSendWhileDisconnected): uploads, new threads and worktrees, contexts, slash commands and prompt answers keep the 'Not connected: message not sent' toast, steer and restart become queue, and the held messages live in memory, with an unload warning and automatic chunk reload blocked until delivery or discard. The composer of an existing thread is no longer disabled while its environment is unavailable. Colours are theme tokens only (error-surface, update-surface, sidebar tokens), with no animation. Mobile has no update card, banner or held sends."

[[decision]]
id = "update-recovery-followups-223"
date = "2026-10-09"
decided = "adapt"
rationale = "Preserve launcher failure outcomes and dismissal across reconnect replay, distinguish reconnect retry from update retry, reserve route-header space, guard reloads while composer commands are held, bound acknowledgements with identity-preserving retry and publish per-message drain counts. Pending sends take precedence over reconnect notices."

