name = "fork-scripts-automations"
subject = "feat(projects): scripts and automation rules"
class = "product"
purpose = "Keep named prompt scripts (per project or global) and automation rules (schedule triggers including weekdays and cron, agent actions from a prompt or script) in plain server tables, fire each slot once, keep a run log with dry runs, and expose them through automations.* and automationScripts.* RPCs, the t3-thread script and automation commands, and the existing project automation panels."
retire_when = "Upstream provides project and global prompt scripts with trigger-condition-action automations, per-slot dedupe and a run log, and the fork's records have been migrated to it."
depends_on = ["fork-project-automations", "fork-named-agents", "fork-cross-environment-nesting"]
roles = []
note = "The engine lives in apps/server/src/automations, outside orchestration: rows in fork migration 13 tables automation_scripts, automations (soft-deleted tombstones) and automation_runs (UNIQUE automation_id + dedupe_key, schedule key = slot instant). Native integration lives in AgentGateway.ts (input dispatch, exact root outcomes and event wakeups); historical turn reads live behind LegacyV1ThreadImporter in legacy/ForkAutomationRead.ts. It replaces fork-project-automations' scheduler: on every pass and on project.meta-updated carrying automations, legacy project.automations records are copied once with the same ids, nextRunAt, owner, target and live runs (same run, thread and message ids; terminal historical outcomes survive, and unresolved V1 work is failed under the recorded upgrade decision). The originals are left untouched on the project so a rollback to a release with the old scheduler still has its automations; the copied row, or its deleted tombstone, is the migration marker, and nothing in this release fires the originals. Original project contract fields and migration IDs remain; V1 state is read only through the existing legacy import boundary. Once a release has shipped with this patch, a later change may delete the originals. Executor rules are ported verbatim (automation:<runId> thread/message ids, locked dated title, owner nesting, busy targets wait, >24 h late slot skipped, backlog collapses to the latest slot, 20 unfinished-run cap, model fallback). Actions in a run go in order and a failure skips the rest. Scripts resolve when a run is built, project before global; removing a script an automation uses is refused. Ad hoc script runs are recorded under automation id script:<scriptId>. A script step carries a result mode (review default, file-only, file-and-settle; overridable per action or run) that is appended to its prompt; inline prompts get none, so imported timed automations send their prompts unchanged. Fork migration 14 seeds eight global starter quality scripts once (ids starter:<name>, conflicts ignored), so later edits and deletions stick. A paused legacy automation is also copied to a project script (id legacy:<automation id>, name slugged) when first imported. Event triggers: the gateway turns native thread.pull-request-synced, runtime-request.updated (approval or user-input requests) and provider-session.updated into neutral observations, read only for kinds an enabled automation listens to; issue labels (ProjectIssuesService for the owner thread) and GitHub releases (ReleaseFeed, unauthenticated) are polled every five minutes only while listened to. events.ts compares each observation with its last value in automation_source_state (fork migration 15) so CI and session errors fire on transitions, labels on additions, releases on a new tag, and polled first sightings are baselines; runs are keyed event:<kind>:<state>. Later stages add conditions and notify actions to the same patch. Cutover fixture tests use T3_LIFECYCLE_FIXTURES with explicit missing-variable skips; each of the three packaged states is copied before migration and run-deduplication assertions. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."

[[decision]]
id = "v2-automation-native-gateway"
date = "2026-10-06"
decided = "adapt"
rationale = "Keep AutomationEngine, tables, receipts and CLI/UI affordances. AgentGateway uses native project shells, exact user input/root run records, the M2 empty-claim, sidecar parenting and provider-starting reuse launch sequence, and native PR/runtime/session events. Retain legacy project records read-only and import them once through the same engine. The pages lane supplies the frozen ProjectIssuesService interface."

[[decision]]
id = "v2-automation-interrupted-upgrade"
date = "2026-10-06"
decided = "adapt"
rationale = "A running V1 automation input with no terminal legacy outcome finishes failed with Interrupted by the upgrade. Run it again if needed. The one-way upgrade occurs in an idle window; leftovers never redispatch, and users can Run now. The historical reader remains read-only inside the legacy import boundary."

[[decision]]
id = "v2-m5-automation-result-modes"
decision = "adapt"
note = "Preserve act result mode, existing-thread CLI defaults and automation edit. Exact V2 root run identity replaces V1 null-turn matching; a live root run cannot fail from an older stopped session. The result mode UI delta is delivered separately to the UI lane. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
