name = "fork-needs-you-decisions"
subject = "feat(projects): decide from Needs you and a Decisions widget, with Undo"
class = "product"
purpose = "Let Brad decide an item that asks him to approve or choose straight from its Needs you row (Approve, Not yet, or one button per option), and answer needs-brad decision issues from a reusable Decisions widget and the mobile app, with a few seconds of Undo, telling the thread that waits."
retire_when = "Upstream or another fork concern provides decisions on the project page, or the project page is retired."
depends_on = ["fork-request-ledger", "fork-request-answers", "fork-project-task-status"]
roles = []
note = "A decision row is a Needs you item in the approve group (a plan), an epic marked ready, or any ready item whose latest comment lists two or more lines starting 'Option A:', 'A)' or '(A)' (parseDecisionComment and needsYouDecision in projectRequests.logic); answer rows and shipped-to-test rows keep their Settle and test step. The row shows two sentences of the comment, its Recommendation line and the options. Clicks are held client-side for 5 s with an Undo line (Settle on answer rows too) and sent on expiry or when the page closes; a failed send brings the row back. projectRequests.decide {threadId, reference, decision, option?, reason?} (operate scope) runs RequestLedger.decide, which plans with planDecision: approve comments 'Approved by Brad', an option comments 'Brad chose: <option>', both move the item to in-progress through update() and send one short thread.turn.start through the orchestration engine to the first live linked non-orchestrator thread, else the orchestrator (decisionThreadId), using that thread's own runtime and interaction mode; Not yet comments the reason, returns the item to Pending (update status pending drops needs-review and in-progress) and sends nothing. A failed message is logged and does not undo the label change. Decisions widget (registry type decisions) and mobile: a needs-brad issue in the fixed format (docs in AGENT_OPERATIONS.md) is parsed server-side by parseDecisionIssue (decisions.logic.ts) into ProjectIssue.decision {context, waiting, options[{text, recommended}]}, so web and mobile share one reading. Answering calls the same decide RPC with decision option or answer: RequestLedger.answerDecision comments 'Brad chose: <option>' or 'Brad answered: <text>' plus the optional note, removes needs-brad (the issue stays open for the asker to close) and tells the waiting thread through the engine. waiting is resolved on the server by resolveWaitingThread: thread id, permanent agent name, or thread title in slug form, because saved agent names live in the CLI state file; an unresolved name still answers on the issue and reports no thread notified. Mobile lists decisions under each project with selectable options, an optional note and Send, with no Undo. No t3-thread verb: agents ask, Brad decides. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."

[[decision]]
id = "v2-decision-retry"
date = "2026-10-06"
decided = "adapt"
rationale = "Use native message.dispatch and fork parent metadata. Decision issue replies propagate failed delivery and preserve landed Gitea updates for retry; ordinary approval still logs delivery failure."
