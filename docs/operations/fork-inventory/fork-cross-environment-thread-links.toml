name = "fork-cross-environment-thread-links"
subject = "fix(web,mobile): follow thread links across environments (#363)"
class = "product"
purpose = "Make a thread link open the thread on the machine it lives on, and say honestly why one cannot be opened, instead of looking only in the environment of the message or project page that holds it."
retire_when = "Upstream resolves environment-less t3-thread links across connected environments and project pages open descendants in their own environment."
depends_on = [
  "fork-nested-threads",
  "fork-project-workstreams",
  "fork-decision-discuss",
  "fork-project-canvas",
  "fork-agent-message-style",
]
roles = []
note = "A t3-thread://v1/<id> link names no environment. resolveThreadAcrossEnvironments (client-runtime state/threadLinkResolution.ts) looks in the message's own environment first, then in every enabled environment's thread list: the id as written before its percent-decoded form, opaque mcp:/thread: ids kept whole, the message's environment winning a duplicate id, two other holders reported as ambiguous. A thread is not-found only when every enabled environment answered from a live list; a disconnected environment's cached list can still find a thread but proves nothing by its silence (reason disconnected, naming the machines), and a machine that is connecting, or connected but still loading its thread list, stays quiet (loading; an idle environment never asked to connect counts as disconnected), and while the message's own machine is loading a link whose id only another machine holds waits (loading) instead of switching. createThreadLinkAtoms follows this per link from the environment summaries, thread index and shell status atoms and hands back the same object while the answer is unchanged; apps/web/src/state/threadLinks.ts and apps/mobile/src/state/threadLinks.ts wire it. MarkdownThreadLink navigates to the resolving environment, shows the project title (plus the machine name when elsewhere) and 'Not found on any connected machine (it may be archived)' or '<machines> is disconnected'; an ambiguous id is a focusable link that opens in the message's environment (opening either holder would be a guess) with the tooltip 'On several machines: ...', and an unavailable link still opens in the message's environment so archived threads work. The format an agent writes and the copy action are unchanged. The mobile ThreadFeed link follower uses the same target. Project pages: projectThreadOpen (orchestrators/projectNavigation.ts) opens a thread in the environment the caller passes, else the environment of the matching project thread (the project's own environment wins a reused id), else the project's; TeamMember keeps its environmentId, useOpenThread takes it, and the canvas open-thread intent uses canvasOpenThread so a remote descendant no longer opens in the root's environment. Out of scope and listed as follow-ups: the Dashboard task/decision links (components/dashboard-v3/DashboardView.tsx, decisions.tsx), the attached-thread chip tooltip, mobile title relabeling for foreign threads, and a scoped link format."
