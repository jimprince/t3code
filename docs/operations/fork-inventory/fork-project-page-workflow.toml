name = "fork-project-page-workflow"
subject = "feat(projects): project page tabs, inline requests, PR status and progress notes"
class = "product"
purpose = "Make the project page say what needs Brad: Dashboard, Roadmap and Issues tabs with one-line summaries, an inline request box that sends to the orchestrator or saves for later, pull requests grouped by what they need, and the latest progress line on each request."
retire_when = "Upstream or another fork concern provides an equivalent project page."
depends_on = ["fork-project-roadmap", "fork-project-dashboard-widgets", "fork-orchestrators-view"]
roles = []
note = "The tab lives in the URL (?tab=dashboard|roadmap|issues, each change a history entry) and is remembered per project per device in local storage. The Dashboard shows the Roadmap and Issues widgets as one-line summaries linking to their tabs; Customize still orders the Dashboard. The request box sends verbatim through the queued composer path (images by paste or drop, Cmd/Ctrl+Enter) so the ledger captures it, then opens the right-panel chat on the message; Save for later uses projectRequests.create with park, which adds the parked label so the idea stays off the active Requests list (shown as a count) until it is moved into a version or started. The thread-replied hint marks only requested questions or asks owned by a worker thread, not every ask the orchestrator has answered in passing. The embedded orchestrator composer widget stays available but hidden by default. Pull request rows come from the tree's synced links (state, draft, checksState, reviewDecision, mergeability): Needs you is open, not draft or superseded, checks not failing or pending, no changes requested and no conflicts; merged or closed for 7 days shows collapsed and older is hidden. Superseded means a later pull request on the same branch, or a later one from the same worker thread after this one closed unmerged. request note (projectRequests.update without a status) posts a Progress line and links the thread; stage changes post one when no text is given; the ledger fetches the latest comment of every open request, cached per issue by updated_at."
