name = "fork-task-view"
subject = "feat(projects): open a task in the app"
class = "product"
purpose = "Clicking a task title on the project page opens the task in a panel over the page (status, type, the answer, the latest progress, the parts of an epic, its threads, Settle or Reopen) instead of leaving for Gitea or the embedded Status Board."
retire_when = "Upstream or another fork concern provides an equivalent task view, or the project page is retired."
depends_on = ["fork-project-task-status", "fork-project-layout"]
roles = []
note = "projectIssues.get {rootThreadId, host, repository, number} (read scope, ProjectIssuesService.get) returns the ProjectIssue with its body, its last 10 comments (4000 characters each), and childNumbers: the project's cached issues whose body starts with 'Part of #N' (isPartOf, the horizon slice's convention); ws.ts decorates the issue with the thread answer through RequestLedger.withAnswers. The web keeps the open task in the page URL as ?task=host/owner/repo#N (parseTaskRef/encodeTaskRef in taskView.logic), so Back closes the panel and a link opens it. deriveTaskView picks the status from the shared task statuses, the answer (the last non-progress comment once For review or Complete, otherwise the thread's answer), the latest Progress line (only while Pending or Active), the children resolved against the issue list, and the working threads. TaskTitle (TaskLink) is the one click site on the Tasks board, Roadmap, Needs you, Requests, Release and Maintenance rows; outside a project page it stays a Gitea link. The panel keeps Open in Gitea and a Status Board link (when the embedded page exists), so the old routes stay reachable. The t3-thread CLI group is unchanged (projectIssues.list is not in it either). Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
