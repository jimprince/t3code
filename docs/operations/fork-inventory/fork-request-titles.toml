name = "fork-request-titles"
subject = "feat(projects): short deliverable titles for captured requests"
class = "product"
purpose = "Title captured requests for what they deliver instead of Brad's raw words, keeping his words in the issue body (brad/t3code-fork#149)."
retire_when = "The request ledger is retired, or upstream tracks captured chat requests with its own titles."
depends_on = [
  "fork-request-ledger",
  "fork-request-answers",
  "fork-request-intake",
  "fork-item-types",
]
roles = []
note = "requestTitle.logic.ts holds the pure title rules. cleanRequestTitle turns model output or a sentence into a board title: URLs become their host, emoji and markdown chrome go, leading greetings, filler, please and request frames (can/could/would you, I want to, let's, we should) are peeled off for work (a question keeps its wording), a task loses its trailing period or question mark, the first letter is capitalized, and the title is capped at 70 characters at a word boundary with no dangling connector. deriveRequestTitle is the no-model fallback (fallbackRequestItem, and the Pending filing row): the first sentence that says something, cleaned; 'Can you X?' is a task, 'X?' a question, a stored kind wins. The request-items prompt asks the model for the same short deliverable title and splitMessage cleans what comes back (falling back to the derivation when it is empty). New request issues open with a '## Brad's words' heading above the quote; the t3-request marker is unchanged and requestWords also reads the leading quote of older bodies. RequestLedger.update retitles a captured chat request when an agent starts or links it (request start, request note) and no explicit title is given: planRetitle replaces the title only when it is still Brad's raw first line or first sentence (whole or a '...' cut), so a title anyone set is kept, and skips agent-filed requests (message id agent:). The intake brief now asks for the short deliverable title. No new RPC, contract or setting; the request-items schema is unchanged because a length check would reject model output the cleaner can repair. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
