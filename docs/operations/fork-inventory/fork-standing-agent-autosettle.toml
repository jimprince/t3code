name = "fork-standing-agent-autosettle"
subject = "fix(threads): pinned and parent threads never auto-settle; t3-thread auto-settle toggle"
class = "product"
purpose = "Stop standing agents (pinned threads and threads with live workers) from settling on their own after a completed turn, and give operators a per-thread toggle (worker standing-agent-autosettle, 2026-10-05)."
retire_when = "Upstream supplies completion settlement that exempts pinned and parent threads."
depends_on = [
  "fork-subthread-lifecycle",
  "fork-worker-operations",
  "fork-cross-environment-nesting",
  "fork-worker-inactivity",
]
roles = []
note = "The decider rejects thread.auto-settle for a pinned thread or one with live children even when a sweep used a stale snapshot; manual settlement still clears pins. Unnesting preserves the existing settle-on-complete preference; auto-settle --off opts out explicitly. t3-thread auto-settle <thread> --off|--on sets the opt-out; the server refuses --on for a named agent's live top-level thread. t3-thread status no longer reports a running session as errored from an older failed turn. An unpinned childless top-level thread that already has settle-on-complete set still settles; run auto-settle --off on it. watch.ts still delivers a settled worker's final completion to its supervisor, so an orchestrator no longer misses a worker that settled on finishing."

[[decision]]
id = "v2-standing-auto-settle"
date = "2026-10-06"
decided = "relocate"
rationale = "Native V2 already rejects pinned sweep candidates and clears completion settlement on unnest. Recheck sidecar organizational children against native active rows in serialized automatic dispatch, and suppress completion-sweep candidates through the same query."

[[decision]]
id = "delegated-worker-bottom-up-226"
date = "2026-10-09"
decided = "repair-existing-concern"
rationale = "The existing completion sweep treats inactive settled descendants as completed, so successful workers settle bottom-up while active descendants still block. Pin and auto-settle opt-out guards remain authoritative. Unnesting preserves existing completion preferences through NestingService.update; auto-settle --off is the explicit opt-out."
