name = "fork-decisions-feed-mobile"
subject = "feat(mobile): the Decisions feed on the mobile Home"
class = "product"
purpose = "Show the same Decisions feed under each project on the mobile Home (brad/t3code-fork#174, #180, #181), so every question, approval, decision, review and test that needs Brad can be acted on from the phone."
retire_when = "Upstream provides a mobile attention inbox with actions and deferral, or the mobile Home stops listing projects' decisions."
depends_on = [
  "fork-decisions-feed-model",
  "fork-decisions-feed-server",
  "fork-decisions-feed-context",
]
roles = []
note = "MobileDecisionFeed.tsx replaces MobileDecisions.tsx under each project row. It builds the feed with the shared model (buildDecisionFeed, asksWithFallbacks) from the project issues list and, only while a thread's shell flags a pending approval or question, the pending asks. Mobile has no request tree, so feedItemsOf derives answers / approve / review / test items from the issues the server marked with an owner. Cards: thread question (select an option or Other, then Send) and approval (the provider's buttons), plan (Open thread), decisions (select, Other, note, Send, Discuss), Review (Approve and merge, Send back with a note, Settle), Test (Works, Broken), answers (Settle) and plans to approve (Approve, Not yet). Acting keeps the card showing what happened (keptOutcomes) until a later read no longer has it; Later (1 day) and Move to end hide or reorder issue cards, and a Later row lists them with Bring back. Context uses the Markdown block clamp, with markdownBlockText turning bullets and tables into text lines (mobile does not render Markdown elements in this card). No Undo hold on mobile, as before. Custom Later times and project chips are web only (mobile is already grouped by project). Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
