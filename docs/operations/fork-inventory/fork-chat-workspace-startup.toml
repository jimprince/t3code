note = "#202: New chat roots use T3 home/chat-workspaces. Existing chat roots remain authoritative and are recreated when absent; no project or provider-session paths are rewritten. Fold into fork-general-chat. Copied Mac/VM fixture tests cover startup, restart, singleton identity, thread/transcript preservation, and migration ledgers. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
