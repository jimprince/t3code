name = "fix-provider-mcp-credentials"
subject = "fix(server): preserve MCP credentials across provider switches"
class = "upstream-bound"
purpose = "Keep each provider's T3 MCP credential valid while switching providers in one thread, and revoke only the credential owned by a closing or replaced session."
retire_when = "Upstream keeps MCP configurations per thread and provider instance and independently rotates and revokes the credentials retained by live provider clients."
depends_on = []
roles = []
note = "Gitea brad/t3code-fork#378: starting Claude revoked the token baked into an existing Codex conversation because one thread-only config slot led to revokeThread on instance mismatch. A real manager/registry regression reproduces the failure without advancing time; coverage also verifies switching back, stale cleanup and independent close revocation. Store configs per thread plus provider instance, use scoped reads in every adapter, and preserve thread-wide revocation for archive/delete. No token lifetime or authentication bypass is introduced."
