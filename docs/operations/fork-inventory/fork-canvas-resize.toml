name = "fork-canvas-resize"
subject = "feat(projects): a canvas can set its own height"
class = "product"
purpose = "Let a canvas page size its own frame, so a collapsed section such as the meeting minutes stops leaving a 420 px empty box, and stay collapsed after a reload."
retire_when = "Upstream provides orchestrator-authored dashboards with their own sizing, or the canvas widget is retired."
depends_on = ["fork-project-canvas"]
roles = []
note = "New intent {type:'t3-canvas', intent:'resize', height} in projectCanvasBridge.logic: height must be a finite number (NaN, Infinity, strings and other types are refused), rounded to a whole number and clamped to 40-600 px (CANVAS_HEIGHT). The widget replaces the preset h-[220|320|420px] class with an inline height for that frame; the presets stay the default until a resize arrives, and the existing drag handle is unchanged. Resizes take their own sliding window (RESIZE_RATE_LIMIT, 10 per 10 s per frame, via takeRateSlot's new limit argument) and never touch the 5-per-10-s action history; over the limit, the newest height is held and applied when the window has passed, so the last resize always wins. They are not logged through projectCanvas.action and show no status line, and a malformed resize is answered on t3-canvas-result without using either budget. The height is remembered on the host in localStorage under t3code:canvas-height:<environmentId>:<rootThreadId>:<canvasId> (canvasHeightKey, readStoredCanvasHeight) and read in the first render, before the iframe mounts; storage errors are ignored and a stored value outside 40-600 is dropped. The sandbox is unchanged (no allow-same-origin, no storage in the page). ProjectCanvasIntent in contracts gains resize; no RPC or schema shape changes. Documented with a collapsible-section example in apps/t3-thread/docs/AGENT_OPERATIONS.md. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: retain UI theme injection with later resize/dashboard implementation (apps/web/src/components/orchestrators/ProjectCanvasWidget.tsx). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
