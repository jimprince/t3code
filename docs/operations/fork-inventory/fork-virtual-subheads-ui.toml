name = "fork-virtual-subheads-ui"
subject = "feat(web): subheads under each head in the Harness tab, with a detail page"
class = "product"
purpose = "Show virtual subheads beneath their owning head in the Harness list and give each a page to send a request, read run history with delivery state, edit the template and enable, disable or retire it, all through the existing fork.subheads RPC."
retire_when = "Upstream ships a UI for named virtual helper templates with send, history, edit and lifecycle controls."
depends_on = ["fork-virtual-subheads", "fork-harness-tab-ui"]
roles = []
note = "UI only: no server code beyond the read-only runs operation owned by fork-virtual-subheads. Owns packages/client-runtime/src/state/subheadsView.ts and its test plus the ./state/subheads-view export in packages/client-runtime/package.json; apps/web/src/state/subheads.ts; apps/web/src/components/harness/{SubheadRows,SubheadPage,SubheadSendDialog,SubheadEditForm,useSubheadCommand}.ts(x) and the SubheadRows and SubheadEditForm tests; apps/web/src/routes/_chat.harness.subheads.$environmentId.$name.tsx and its entries in routeTree.gen.ts; the Subheads group wiring in apps/web/src/components/harness/HarnessSidebarList.tsx; docs/release-notes/entries/virtual-subheads-ui.toml and this stanza. A subhead is a template, never a live session: rows read template, no live session. Sidebar rows show only open runs; settled history lives on the page. Name, project and owning head are fixed, a broader permission needs a confirming second click, and the server's refusals (creating principal only, version conflict, retired) are shown as written. Not in scope: creating a subhead from the UI, cancelling a run, retrying a delivery, the audit filter, a Projects-tab placement. Fixed server limits (queue 10, 20 runs/day, 3 requests per sender per 10 min, 30 min timeout) are mirrored as constants in subheadsView.ts and must follow SubheadRuns.ts."
