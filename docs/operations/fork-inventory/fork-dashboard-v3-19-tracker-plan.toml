[[decision]]
id = "root-scoped-explicit-cutover"
date = "2026-10-14"
decided = "The head sets source=tracker only after migration read-back; the root retains that source across restart and tracker failures."
rationale = "An undecomposed epic must not silently replace an existing briefing Plan. Shared repositories do not merge project heads."

[[decision]]
id = "distinct-progress-units"
date = "2026-10-14"
decided = "Task rows count personal steps; workstream headers count unique child issues. Open completed checklists do not settle asks."
rationale = "Nested workstreams must not inflate project task totals or imply delivery from question settlement."
