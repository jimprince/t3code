[[decision]]
id = "root-scoped-explicit-cutover"
date = "2026-10-14"
decided = "The head sets source=tracker only after migration read-back; the root retains that source across restart and tracker failures."
rationale = "An undecomposed epic must not silently replace an existing briefing Plan. Shared repositories do not merge project heads."

[[decision]]
id = "distinct-progress-units"
date = "2026-10-14"
decided = "Task rows count personal steps; workstream headers count unique child issues. Open completed checklists do not settle asks."
rationale = "Nested workstreams must not inflate project task totals or imply delivery from question settlement."

[[decision]]
id = "web-no-bar-without-checklist"
date = "2026-10-14"
decided = "A task without a checklist shows 'no checklist yet', no bar and no 0/1; it is counted as an open task, never as a step. A workstream header shows done/total child tasks; an empty epic is a heading. An ETA is a calendar date, never a time."
rationale = "The 0/1 is counting only (contract v1.2); drawing it would show a binary bar as measured progress, and a due date has day precision only."

[[decision]]
id = "tracker-head-handover"
date = "2026-10-16"
decided = "Revalidate tracker headers by content hash and resolve explicit predecessorRootThreadIds before ownership/exclusion; retain last selection on failures."
rationale = "A head handover must preserve the Plan after predecessor retirement without rewriting issue provenance or weakening administrative handover fences (#370)."
