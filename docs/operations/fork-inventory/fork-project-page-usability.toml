note = "deriveNeedsYou (requests in Brad's groups plus open non-request issues marked needs-review or needs-test, parked excluded) feeds the Dashboard's Needs you widget (threads needing approval, input or a plan review first), the status-line count, and the Issues board, whose lanes are Needs you, Shipped, test it, Working, Pending (folded after 10) and Done; cards wrap two-line titles and show repo#N, type, comments, age and thread in that order, with Settle or Reopen. The Requests widget keeps work with the agents and waiting for release, groups requests of settled threads and threads with several open requests behind Settle all, and drops the saved-for-later count (Later stays off the Dashboard). The New request box sits above the tabs as one line that opens on focus, submits the explicit request before its message, and folds after sending or on Escape. Customize moved to the tab row; Chat is the one chat control (the panel links to the full thread); a release line shows the running version and the next release; Working, Blocked, Done and Needs you rows open their thread anywhere on the row; times are relative; empty sections hide; one word per status (working, waiting for release, shipped, test it) on web and mobile. The Projects sidebar marks the project whose page or thread is open and shows one open-issue count instead of issue chips. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
