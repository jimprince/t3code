name = "fork-nested-threads"
subject = "feat(threads): nest threads under an orchestrating thread"
class = "product"
purpose = "Let a thread nest under an orchestrating thread so it leaves the sidebar and appears in the parent's Agents panel, move threads in and out of nesting, default t3-thread workers to nest under their caller, and let parents answer their workers' questions and approvals from the CLI."
retire_when = "Upstream provides persistent parent/child thread placement with an equivalent Agents-panel view and CLI escalation, or the fork stops wanting orchestrator nesting."
depends_on = ["fork-worker-operations"]
roles = []
note = "parentThreadId is an optional thread field (fork migration 6, projection_threads.parent_thread_id) set at creation or by thread.parent.set, which emits thread.meta-updated so older clients ignore it; existing flat rows stay valid as NULL and need no new migration. Servers advertise threadNesting on the environment descriptor, which is where t3-thread reads it (serverGetConfig does not carry it). The original one-level cap was lifted because delegated callers can themselves orchestrate workers; ancestor-chain validation preserves the actual invariant, an acyclic tree, without flattening ownership or routing notifications past the direct caller. Nesting supports arbitrary acyclic depth within one project; the decider rejects self, descendants, cross-project, cyclic, missing, and archived parents. Children of an archived or missing parent show in the sidebar. Parent lifecycle changes never cascade to children. The parent's sidebar row rolls up all descendants' approvals, questions, and working or monitoring state. Nested attention remains visually surfaced but never plays completion or attention sounds; only top-level work makes notification sounds. Desktop and web only; mobile lists every thread until a follow-up. t3-thread nests workers directly under the caller at every depth, and pending/answer/approve/deny let the parent escalate instead of the user."

[[decision]]
id = "installed-offline-worker-repair-226"
date = "2026-10-09"
decided = "adapt"
rationale = "Expose dry-run-first repair through the packaged headless/Desktop server bin. Reuse server home and V2 path derivation; apply requires the actual configured port and verifies listener absence and every main/WAL/SHM owner, failing closed on inspection permission gaps. Deployment must hold service and updater restarts throughout application."

[[decision]]
id = "agents-panel-settled-shelf"
date = "2026-09-29"
decided = "extract-to-additive"
rationale = "Nested threads leave the sidebar, so the parent's Agents panel is their only shelf and must honor the server lifecycle, including automatic settlement. Threads, workflow runs and direct spawns share one start-ordered list and one collapsed Settled shelf (settled threads; terminal spawns and workflows; idle spawns stay active because they can resume), so this concern owns the whole list instead of a second patch stacking edits on the same AgentsPanel.tsx render block. AgentsPanelEntries.tsx and agentsPanelShelf.logic.ts are additive; AgentsPanel.tsx only hands over upstream's WorkflowSection and AgentRow renderers and drops the footer's settled count, which the shelf header now carries. Rows seen active stay in place until the panel remounts, matching upstream's rule that completion never moves rows under the reader."

[[decision]]
id = "upstream2237-design-token-scale"
date = "2026-09-25"
decided = "adapt"
rationale = "The nested-thread rows used text-[.7rem] and text-[.65rem], now errors under shadcn(no-arbitrary-values). Take the nearest new tokens: text-2xs (11px) for the row metadata and text-3xs (10px) for the section label."

[[decision]]
id = "v2-port-2689-m2"
decision = "reconcile-smaller"
note = "V2 supervision metadata is separate from native execution lineage; retained behavior and import coverage are recorded in the nesting lane report."

[[decision]]
id = "socket-open-209-nested-threads"
date = "2026-10-08"
decided = "adapt"
rationale = "Initialize nesting metadata once per persistence environment; leave connection-scoped constructors inert and startup failures retryable."

[[decision]]
id = "delegated-worker-organization-226"
date = "2026-10-09"
decided = "repair-existing-concern"
rationale = "Seed app-owned child organizational metadata atomically with native creation, preserving later explicit reparent and unnest. The common child factory clears inherited pin/order/opt-out fields. MCP nest/unnest shares the CLI nesting service and exposes organizational metadata independently of execution lineage. Offline repair requires ownership and historical-event provenance; its default run repairs a private VACUUM INTO copy and never constructs repair layers on the source."

[[decision]]
id = "catchup-2908-nesting-access"
date = "2026-10-10"
decided = "relocate+adapt"
rationale = "Upstream MCP granular access declares child and parent targets for nest/unnest writes and keeps live-caller/mode protections (#9786–#9791, #10298). Preserve self-settlement receipts and required snoozed/snoozedUntil in list/detail enrichment (#16782). Move child pin/order/settlement projection to provider-core after #17299 extraction and register the sidecar in persistence/Sqlite.ts, retaining native cancellation/secret/webhook coverage. Static conflict review passed; composed lifecycle/access tests remain required."
