name = "fork-project-layout"
subject = "feat(projects): orchestrator-configurable project layout"
class = "product"
purpose = "Make the project page a layout of tabs and widgets that Brad drags and drops and the project's orchestrator changes on request through MCP tools, applied live in every client without a restart (brad/t3code-fork#121)."
retire_when = "Upstream provides configurable project pages, or the project page is retired."
depends_on = [
  "fork-project-dashboard-widgets",
  "fork-project-canvas",
  "fork-project-task-status",
  "fork-project-page-usability",
]
roles = []
note = "One ProjectLayout per orchestrator (root) thread, kept with its last 50 revisions in project-dashboards.json (layouts) next to the tracker setting; a project without one gets defaultProjectLayoutTabs from its old widget order (Dashboard, Roadmap, Tasks). The widget registry, ops and applyLayoutOps live in contracts so clients apply edits optimistically with the server's rules. ProjectLayoutService (one instance for WebSocket and MCP, re-provided per connection) applies ops by id on the newest revision under the settings file lock, rejects a replaceLayout made against an older revision, reverts by restoring a revision's tabs as a new one, and publishes every revision on a PubSub; projectLayout.subscribe streams the current layout and then each revision (one-slot sliding mailbox), gated by the projectLayout capability so older servers show the default. MCP toolkit project_layout_get/update/history/revert: writes only from the project's root orchestrator thread (Brad's decision), each with a reason kept in the revision history (no client shows a layout-change Undo chip; agents revert through project_layout_revert, brad/t3code-fork#183). projectDashboard get/setWidgets map the old widget ids onto the first tab for the CLI. Web: tabs come from the layout (any tab id in ?tab=), widgets render by type in a 6-column grid by size; Edit layout replaces Customize (drag tabs and widgets, rename, add and remove tabs, add widgets from the registry, size, settings, tracker repository). Includes the cheap content widgets markdown (note) and links; embed, threads and mobile read-only wait for stage c. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
