[[decision]]
id = "resume-existing-workspace"
date = "2026-10-13"
decided = "Fresh deterministic thread identity and durable ThreadLaunchService receipts; existing metadata stores resumedFrom."
rationale = "Preserves workspace identity and prevents duplicate recovery after retries or a process exit without copying conversation history."
