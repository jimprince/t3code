name = "fork-thread-plan-progress"
subject = "feat(threads): track plan progress and resume failed work"
class = "product"
purpose = "Expose host-local file plan progress with native todo fallback and deterministic explicit recovery of failed threads into fresh conversations in their source workspace."
retire_when = "Upstream ships equivalent step progress and explicit idempotent resume from unfinished plans across RPC, MCP and CLI."
depends_on = [
  "fork-dash-187-todo-progress",
  "fork-dashboard-v3-04-snapshot-service",
  "fork-harness-purpose",
]
roles = []
note = "Server/data concern only; UI integration is separately owned. Deterministic durable recovery reuses the workspace, settles the source and preserves supervision lineage. File seeds contain bounded owned rows, last Next, title/status and absolute PLAN/newest-five result paths in one adaptive fence; no file/action-log/result bodies. Result bodies are never read or cached. Small linear known-credential filtering replaces generic opaque-token/evidence heuristics. One required shared reader retains outcome eligibility, current-owner/unfinished/newest mapping and native fallback without changing the wire shape."


