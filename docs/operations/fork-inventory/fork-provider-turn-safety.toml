name = "fork-provider-turn-safety"
subject = "fix(server): protect provider turns across recovery and restarts"
class = "divergence"
purpose = "Reserve pending sends against reaper recovery, keep live turn markers and steering, reconcile boot generations, recover provider runtimes and lifecycle events, and keep the fork migration ledger with historical migration compatibility."
retire_when = "Upstream adds equivalent pending-turn reservation, boot-generation reconciliation, and provider runtime recovery."
depends_on = []
roles = []
note = "Removed unused OpenCode server-pool scaffolding. Active upstream OpenCode server ownership, live steering, reservations and runtime recovery remain."

[[decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "reconcile-smaller"
rationale = "Preserve shipped migration identities, append V2 at 61/62 and use native V2 turn services. Do not restore V1 runtime files."


[[decision]]
id = "upstream14540-subagent-model-refinement-test"
date = "2026-10-01"
decided = "retire"
rationale = "This concern's harness carried upstream's own \"task.started carries model/effort; subagent snapshots refine the model\" case verbatim, differing only in using real model ids instead of upstream's synthetic test constants, and asserting no fork behavior. Upstream 7ab800a43 now pushes a task.updated correction as soon as a subagent snapshot refines the model and adapted its own case, so the duplicate failed on the extra event. Delete it; upstream owns that path and its coverage."

[[decision]]
id = "upstream14290-codex-driver-test-services"
date = "2026-09-30"
decided = "adapt"
rationale = "Constructing a Codex driver now resolves CodexInstallation, ServerSecretStore, and ServerEnvironmentIdentity, which this concern's fork registry harness did not provide. The replay stays textually clean, so only the server typecheck catches it. Mirror upstream's own TestNodeServices layer in that harness rather than loosening the fork assertions."

[[decision]]
id = "upstream14290-subscription-sharing-analytics"
date = "2026-09-30"
decided = "adapt"
rationale = "Upstream added a subscriptionSharing dimension to sendTurn analytics: a mutable flag before acquireUseRelease, provider.turn.attempted and provider.turn.rejected around the adapter send, and the flag on provider.turn.sent. Like providerservice-mcp-touch, all of it belongs inside the reservation gate, so a rejected reservation records no attempt and the flag cannot outlive the turn it describes."

[[decision]]
id = "upstream2375-interrupt-grace-settles-live-tasks"
date = "2026-09-28"
decided = "retire"
rationale = "Upstream gave interruptTurn a settleInterruptedTurn step that calls the SDK query's optional interrupt() and awaits completeTurn's deferred under a 3-second grace. Upstream's own FakeClaudeQuery leaves interrupt undefined by default, while this concern's fork double always exposed it, so the fork's duplicate \"settles every acknowledged live task before closing\" test awaited a grace the test clock never advanced and timed out. The live-task settling it asserted is upstream's own stopSessionInternal loop, already covered by upstream's \"interruptTurn settles live tasks and closes the provider session\", and the only fork-specific assertions were interruptCalls === 0, which upstream deliberately reversed, and stopTaskCalls, a method neither ClaudeQueryRuntime nor the adapter has. Retire the duplicate test and the interrupt/stopTask doubles instead of adapting them."

[[decision]]
id = "upstream13774-boot-generation-in-upstream-added-tests"
date = "2026-09-27"
decided = "adapt"
rationale = "Upstream added a ProviderService shutdown test and a listBindings excludeStopped test that neither conflicted nor compiled: this concern makes ProviderSessionDirectoryLive require ServerBootGeneration and adds bootGenerationId to the runtime row. Provide makeServerBootGenerationLayer(\"test-boot-generation\") and set bootGenerationId the way this file's other fork-adapted cases do, rather than relaxing the fork contract."

[[decision]]
id = "upstream13774-reaper-excludes-stopped-in-sql"
date = "2026-09-27"
decided = "narrow"
rationale = "Upstream moved the reaper's stopped-binding skip out of the sweep loop into the query (listBindings({ excludeStopped: true })). The fork's copy of that skip ran before its dead-generation settlement, so query-level exclusion is equivalent; drop the fork lines and let upstream own the call site. Dead-generation settlement, live-session turn checks and archived-thread reaping remain fork behavior."

[[decision]]
id = "upstream2237-request-user-input-is-blocking"
date = "2026-09-25"
decided = "adapt"
rationale = "Codex made requestUserInput carry a required isBlocking flag and deprecated autoResolutionMs. This concern's fork lifecycle harness emits that request itself, so the payload never conflicted; it decoded to nothing and the test hung waiting for events that were never mapped. Send isBlocking the way upstream's own adapter test now does."

[[decision]]
id = "upstream2237-codex-turn-additional-context"
date = "2026-09-25"
decided = "adapt"
rationale = "Upstream split Codex turn instructions: buildCodexDeveloperInstructions now takes only the collaboration mode and the runtime/tool blocks moved to buildCodexAdditionalContext on turn/start. This concern's fork harness duplicates that wiring and no merge touches it, so mirror upstream's split here instead of keeping the old three-argument call."

[[decision]]
id = "upstream2237-reset-credit-coordinator-rename"
date = "2026-09-25"
decided = "relocate"
rationale = "Upstream generalized codexResetCredit.ts to resetCreditCoordinator.ts for every provider that banks resets. The fork registry harness only needs the moved layerTest, so follow the module to its new name."

[[decision]]
id = "upstream2237-migration-ledger-extension"
date = "2026-09-25"
decided = "adapt"
rationale = "The fork has already shipped migration IDs 33-37, so preserve the established offset and map upstream migration 54 to fork ID 59. Upstream's own 054 migration test drives runMigrations by slot, so it is adapted to the fork slots 58 and 59 the way 050's test already is."

[[decision]]
id = "upstream13328-registry-compatibility-advisory"
date = "2026-09-24"
decided = "adapt"
rationale = "Upstream d4cd7d5c3 makes ProviderRegistryLive stamp a compatibility advisory onto every enabled, installed snapshot it exposes or caches, and adapted its own registry harness with a withBundledCompatibility helper. This patch keeps a fork copy of that harness, which no merge touches, so the drift only appeared as five failing assertions in candidate CI. Mirror upstream's helper here rather than loosening the assertions."

[[decision]]
id = "upstream-provider-registry-model-manifest"
date = "2026-09-23"
decided = "adapt"
rationale = "ProviderRegistryLive now requires the ModelManifest service, so this concern's fork tests build it with Layer.provideMerge(ModelManifest.layerTest) the way upstream's own ProviderRegistry tests do. The replay stays textually clean, so only the server typecheck catches this drift."

[[decision]]
id = "upstream-sqlite-layer-configuration"
date = "2026-09-20"
decided = "adapt"
rationale = "Use upstream's explicit in-memory SQLite layer configuration in migration tests while preserving the fork's shipped migration-ID offset and its historical-ledger assertions."

[[decision]]
id = "upstream-codex-stop-settlement-order"
date = "2026-09-20"
decided = "adapt"
rationale = "Settle upstream's blocking approval and user-input requests before the fork pauses an active Codex goal, then interrupt child and parent turns. This preserves Stop's deadlock avoidance and prevents goal continuation from restarting work."

[[decision]]
id = "release-writer-before-instance-handoff"
date = "2026-09-09"
decided = "adapt"
rationale = "Compatible Codex instances share conversation storage. Stop the old instance before resuming on the replacement and propagate stop failures; preserve upstream binding and resume-cursor structures without adding schemas or migrations."

[[decision]]
id = "providerservice-mcp-touch"
date = "2026-07-28"
decided = "adapt"
rationale = "Upstream added McpSessionRegistry.touchActiveMcpThread before sendTurn; the fork wraps sendTurn in a reservation gate. Independent concerns. The touch belongs inside the gate immediately before the real sendTurn, because touching earlier would change upstream semantics when reservation fails and no turn is sent."
[[decision]]
id = "allow-live-turn-steering"
date = "2026-09-05"
decided = "narrow"
rationale = "Upstream adapters accept follow-ups during a running turn. Permit sends when the adapter reports the same real turn id, without replacing its marker; inspect live state before the stale-marker age gate. Keep pending-send exclusion and conservative reconciliation for unmatched markers so recovery cannot claim an in-flight send."
[[decision]]
id = "upstream1286-restart-import"
date = "2026-09-05"
decided = "adapt"
rationale = "Preserve upstream shell-only metadata commands, transcript import writes and restart-continuation marker consumption inside the reservation-protected send. Keep archived-session stop lookup and live-turn steering."
[[decision]]
id = "upstream-opencode-probe-pool"
date = "2026-08-29"
decided = "adapt"
rationale = "Retain upstream's explicit probe pool and CLI inventory path while keeping the fork's per-instance server owner for runtime recovery and text generation. Configured external servers continue through the fork's password-aware, version-validating connection path."

[[decision]]
id = "upstream11338-claude-native-rewind"
date = "2026-09-16"
decided = "retire"
rationale = "Upstream commits fd5553f1a and eed974c12 now persist native Claude turn-start message IDs and fork exact provider history during rewind, including remapping retained boundaries when fork history lengths change. Retire the fork's older assistant-boundary map while preserving its independent imported-session controls and provider recovery safeguards."

[[decision]]
id = "upstream1825-migration-ledger-extension"
date = "2026-09-16"
decided = "adapt"
rationale = "The fork has already shipped migration IDs 33-37, so upstream migrations 33-50 remain mapped to 38-55. Extend that compatibility ledger by mapping new upstream migrations 51 and 52 to fork IDs 56 and 57."

[[decision]]
id = "upstream1895-migration-ledger-extension"
date = "2026-09-18"
decided = "adapt"
rationale = "The fork has already shipped migration IDs 33-37, so preserve the established offset and map upstream migration 53 to fork ID 58."

[[decision]]
id = "upstream-codex-binary-diagnostic"
date = "2026-09-16"
decided = "adapt"
rationale = "Keep the fork's registry recovery coverage aligned with upstream's more actionable Codex spawn diagnostic: identify the configured server-side binary-path setting and explain that desktop app installation does not imply a CLI on PATH."

[[decision]]
id = "upstream1895-codex-local-image-input"
date = "2026-09-18"
decided = "adapt"
rationale = "Update the fork's turn-parameter diagnostic and collaboration-mode cases to upstream's path-based localImage input, preserving the fork assertions without restoring oversized data-URL requests."

[[decision]]
id = "upstream11970-nonblocking-vcs-probe"
date = "2026-09-17"
decided = "narrow"
rationale = "Retire the fork's generic synchronous turn-diff path in favor of upstream's ordered diff worker. Keep only the OpenCode missing-terminal fallback, relocate its repository probe to that non-blocking worker, settle the lifecycle first, and reject late placeholders once a newer turn becomes latest."

# Cache-removal tests await refresh completion and persisted update events, avoiding fixed clock-poll loops.
[[decision]]
id = "v2-preview-ledger-compatibility"
date = "2026-10-07"
decided = "adapt"
rationale = "Restore upstream published-preview upgrades behind the exact named V2 ledger marker at 53/54. Atomically translate upstream history into immutable fork ids, preserve V2/import progress at 61 and optional cleanup at 62, and add missing fork schema. Normal V1 fork ledger 60 has no preview marker and must execute 61/62."

[[decision]]
id = "catchup-2908-migration-ledger"
date = "2026-10-10"
decided = "relocate+adapt"
rationale = "Upstream adds webhook, relay delivery, MCP model-context and snapshot-window migrations (#15085, #15487, #16236, #17029). Preserve the existing >=55 +6 remap: main 61/62 keep V2/index cleanup and upstream 57–60 become immutable main 63–66. Keep the separate fork ledger and all shipped identities. Move startup registration to persistence/Sqlite.ts following upstream service conventions (#16295); historical upgrade and packaged startup CI must verify the new append-only ledger."
