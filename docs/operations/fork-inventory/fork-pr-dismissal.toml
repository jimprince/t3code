name = "fork-pr-dismissal"
subject = "feat(web): dismiss pull requests in bulk"
class = "product"
purpose = "Let operators select visible pull requests in bulk, persistently remove them from the local environment view without mutating provider state, and restore removed entries."
retire_when = "Upstream ships equivalent multi-select dismissal and restoration in the Pull Requests view."
depends_on = []
roles = []
note = "Reorganized 2026-09-06 from fork-web-pr-multiselect. Selection wraps upstream's shared page row instead of restyling it, so upstream row-layout changes replay cleanly."

[[decision]]
id = "v2-port-2689"
date = "2026-10-05"
decided = "keep-on-top"
rationale = "Keep environment-local dismissal in fork-owned visibility and selection components; filter after native pending overrides while preserving queued quick actions and batch dragging."

[[decision]]
id = "upstream-shown-count-empty-state"
date = "2026-09-22"
decided = "narrow"
rationale = "Upstream added shownCount, the rows actually on screen once pending row overrides are applied. Dismissed pull requests are already out of those groups, so shownCount answers the fork's question too: use it for the empty and carried-to-nothing states instead of the fork's visiblePullRequestKeys check, which would leave an empty list body when an override emptied the rows. The selection toolbar keeps visiblePullRequestKeys for its own counts."

[[decision]]
id = "upstream-pr-blocked-sort-and-glyph-offset"
date = "2026-09-20"
decided = "adapt"
rationale = "Keep upstream's Blocked on me sort control and adjusted lifecycle-glyph alignment while retaining the fork's bulk-selection checkbox wrapper, dismissal controls, and restore action."

[[decision]]
id = "upstream-pr-conflict-glyph"
date = "2026-09-16"
decided = "adapt"
rationale = "Keep bulk-selection checkboxes outside the clickable PR row while preserving upstream's separate lifecycle and conflict glyphs, responsive metadata, and row visibility containment."
