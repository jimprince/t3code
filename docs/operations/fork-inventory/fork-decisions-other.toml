name = "fork-decisions-other"
subject = "feat(projects): decisions get Other, an explicit Sent strip, and a note after picking"
class = "product"
purpose = "Make answering a decision obvious: every decision with options also offers Other..., a click shows where the answer went with Undo then Sent, and a note can be added after picking (brad/t3code-fork#145 follow-up)."
retire_when = "Upstream provides an equivalent decision answering surface, or the Decisions widget is retired."
depends_on = ["fork-needs-you-decisions"]
roles = []
note = "No server, RPC, contract or issue-format change: Other... and open questions both send decision answer, so planBradAnswer posts 'Brad answered: <text>' (plus the note) to the issue and the waiting thread exactly as before. The payload is derived in packages/client-runtime/src/decisionAnswer.ts (decisionAnswerInput: option vs Other vs open question, trimmed, optional note, an empty Other is refused; decisionSendStrip: the held, sending, sent and failed status line), shared by the web widget and mobile through the new './decision-answer' export. Web (ProjectDecisionsWidget): option buttons carry a send icon, Other... opens a text box with Send, the always-visible empty note field is replaced by an 'Add note' link, and a click keeps the row on screen with 'Answered: <choice>' and Undo for the existing 5 second hold, then 'Sending to', 'Sent to' or a failure until the row leaves. The note is read when the answer is sent, so it can be added during the hold. The row no longer uses UndoLines (still used by Needs you). Mobile (MobileDecisions): Other... joins the options, Send stays the explicit submit, Add note replaces the empty note field, and the card shows the answer with its status until it leaves; mobile still has no Undo. Answered state (brad/t3code-fork#166): web and mobile keep a DecisionAnswerRecord per card (sending, sent, failed) and keptDecisionAnswers lets a sent card leave only once a list read after the server confirmed it no longer has the issue, so a refetch still listing it shows 'Answered: <choice>', never the options. A failed answer stays on the card with the server's reason, Retry (same payload) and Choose again; useDecide now returns that reason instead of a bare boolean. Mobile's useEnvironmentQuery exposes dataUpdatedAt for this. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
