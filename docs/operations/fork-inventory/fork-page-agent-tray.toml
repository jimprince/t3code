name = "fork-page-agent-tray"
subject = "feat(web): agent tray beside sidebar pages"
class = "product"
purpose = "Give each sidebar page a right-hand tray with its own agent that operates the visible page on desktop and reaches T3 threads through the t3-thread CLI."
retire_when = "Upstream offers a per-page or per-site agent beside embedded pages, or the fork stops showing sidebar pages."
depends_on = ["fork-embedded-pages"]
roles = []
note = "A tray conversation is an ordinary V2 thread in the server-owned chat project whose id starts with page-agent- (packages/contracts/src/pageAgents.ts); the server drops that namespace from the public shell snapshot and live shell feed (ws.ts and the HTTP shell), the archived snapshot, thread search (RPC and the t3_thread_search tool) and relay activity (AgentAwarenessRelay.enqueueThreadPublish) through PageAgentVisibilityPolicy and withoutPageAgentThreads, instead of persisting a hidden flag. Stores, reactors, completion processing and thread detail by id are untouched, so the threads still run, stream and settle like any other. Page-agent threads always get the preview MCP capability (ProviderSessionManager). Desktop hosts the page as that thread's only Browser preview tab on the default profile, so its preview tools drive exactly the page; the tab closes with the page view. Web keeps the iframe and offers chat only. Conversations are per device in localStorage: current and previous, a fresh one after 30 idle minutes, discarded ones deleted only once no run is active. A tray thread is created by its first send (startTurn bootstrap, no titleSeed so the title stays), and its id is kept unchanged by the legacy importer, so imported conversations resume. t3-thread resolves page-agent ids by thread detail because shell lists never contain them. The request ledger's page-agent check imports isPageAgentThreadId instead of repeating the prefix. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."

[[decision]]
id = "v2-page-agent-visibility-at-presentation"
date = "2026-10-06"
decided = "adapt"
rationale = "V1 hid page-agent threads inside its own orchestration HTTP and snapshot code, which V2 deletes. V2 hides them at the four presentation reads (shell snapshot and feed, archive snapshot, search, relay enqueue) and leaves the event store, projections, reactors and thread detail unfiltered, so a hidden thread keeps running, settling and importing like any other and the V2 core carries no fork flag. V2 has no lockTitle, so a first send omits titleSeed, which keeps the title without generating one. The always-on preview capability folds into the existing browser-capability gate so the credential-reuse check stays consistent."
