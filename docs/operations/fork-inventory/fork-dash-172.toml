name = "fork-dash-172"
subject = "feat(web): collapse Release widget groups by default"
class = "product"
purpose = "Show each completed-release group in the Release widget as a title and count, collapsed until opened, so a long history does not push the dashboard down."
retire_when = "The Release widget is retired or upstream provides an equivalent release history."
depends_on = ["fork-project-dashboard-widgets"]
roles = []
note = "Issue #172. The groups the user opened are remembered per project and device in localStorage (t3code:projects:release-open:<environmentId>:<rootThreadId>); everything else starts closed. openGroups.logic holds the toggle and storage schema shared with the workstream bands."
