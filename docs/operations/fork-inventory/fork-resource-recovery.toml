name = "fork-resource-recovery"
subject = "feat(recovery): diagnose resource pressure and recover bounded resources"
class = "product"
purpose = "Expose resource pressure diagnosis, grouped recovery previews and execution, the desktop pressure monitor and its packaging, and pressure notification settings."
retire_when = "Upstream telemetry and signaling cover the retained recovery actions and notifications."
depends_on = ["fork-bounded-diagnostics"]
roles = []
note = "Normal process telemetry and signaling use upstream. Removed the unused duplicate diagnostics service; retain the bounded on-demand host-wide query for orphaned workers/captures and the distinct opt-out pressure notifications."

[[decision]]
id = "upstream2237-design-token-scale"
date = "2026-09-25"
decided = "adapt"
rationale = "Upstream's new --text-2xs/--text-3xs tokens made shadcn(no-arbitrary-values) and no-raw-colors error on this panel's nine off-scale classes. Exact tokens replace text-[11px] and text-[10px]; the 13px heading takes text-sm to stay above its text-xs body; tracking-[0.08em] takes the nearer tracking-widest; and the amber warning text takes text-warning-foreground, which already resolves to amber-700 light and amber-400 dark."
[[decision]]
id = "forkprocessrows-extraction-951"
date = "2026-07-29"
decided = "extract-to-additive"
rationale = "When upstream deleted process-row parsing from ProcessDiagnostics, move ProcessRow and readProcessRows into the additive forkProcessRows module. This keeps all fork behavior out of the upstream diagnostics file."

[[decision]]
id = "upstream-scoped-diagnostics-settings"
date = "2026-09-16"
decided = "adapt"
rationale = "Run diagnostics and recovery RPCs against the environment selected by the upstream Settings scope, while retaining the fork's primary desktop pressure-notification preference. Keep upstream's effect-based environment/process refs so asynchronous actions cannot target a selection after it unmounts."

[[decision]]
id = "upstream-server-owned-sidebar-settlement"
date = "2026-09-16"
decided = "adapt"
rationale = "Upstream now treats sidebar settlement preferences as environment- and project-scoped server settings. Preserve the fork's legacy client-schema fields for stored-setting compatibility, but give server keys precedence when a key exists in both schemas so scoped writes do not also persist a conflicting client value."

[[decision]]
id = "v2-port-2689-m2"
decision = "reconcile-smaller"
note = "Use V2 projections and atomic idle release; revalidate process start time and owner; recovery transport lives behind fork RPC registration."

[[decision]]
id = "catchup-2908-recovery-permission"
date = "2026-10-10"
decided = "adapt"
rationale = "Keep selected-environment recovery RPC targeting and desktop performance protection around the upstream HostProcess service and namespace layers. Recovery mutation uses the upstream environment-maintain permission (#9788, #10298); diagnostics reads retain their own scoped access. Preserve notification settings and revalidation of selected recovery candidates. Static conflict/action review passed; composed behavior tests remain required."
