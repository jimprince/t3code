name = "fork-project-skew-gate"
subject = "fix(projects): older servers get a task fallback instead of an unreadable error"
class = "product"
purpose = "Keep the project page usable when the app is newer than the server it talks to: the task panel stops asking a server without projectIssues.get and shows the task from the issue list with an update note, a load error wraps in full instead of clipping, and t3-thread request add files under an earlier kind on a server that rejects the new ones (brad/t3code-fork#147)."
retire_when = "Every supported server advertises the project page RPCs, or the task panel and the project page are retired."
depends_on = ["fork-task-view"]
roles = []
note = "Capability projectIssueDetail (environment descriptor, advertised in ServerEnvironment.ts) is the one gate: a fork.26 server has projectIssues but not projectIssues.get, so the older projectIssues flag cannot tell them apart. ProjectTaskPanel passes a null query atom without it, then renders OlderServerTask from the issue list the page already holds (findListedIssue in taskView.logic): title, status, Settle or Reopen, Open in Gitea, and olderServerTaskNote ('This server is older (fork.26); update it to see full task details.'). ProjectQueryState wraps its error instead of truncating, which covers the roadmap, tasks and task summaries too. Audit of the other fork.27-29 client calls against fork.26: projectLayout.* was already gated by the projectLayout capability; projectRequests.decide only has buttons where the server sent a decision, which fork.26 never does; projectRequests.startIntake already falls back to the orchestrator when the call fails; projectDashboard.health is optional on the wire. Capability projectItemTypes gates the CLI: request add asks the environment descriptor and, without it, sends the earlier kind (task as change, task --bug as bug, epic as plan, requestKindPayload) through a wire-form kind in the CLI's own RPC payload, since the typed contract only admits the current three. Not gated: the web Save for later sends the new task type, which a fork.26 server rejects, and it reports that through its own failure toast. Integration fork.6: adapted replay to preserve UI theme/owner notes alongside BE authoritative contract and helpers. Fork.6 integration: adapt: union inventory, retain earlier integrated owner notes and later stanza (docs/operations/fork-inventory.toml). Retire/narrow/relocate do not apply to these retained UI behaviors or inventory insertions."
