id = "task-panel-older-server"
category = "fix"
functionality = "projects"
text = "The project page's task panel no longer fails against a server that has not been updated: it shows the task from the task list with a link to Gitea and a note to update the server, and load errors on the project page now wrap in full instead of being cut off. `t3-thread agent request add` also works against a server that has not been updated, filing a task as a change, a bug as a bug and an epic as a plan."
